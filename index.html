  function paint() {
    for (const k of Object.keys(opts)) {
      $(`[data-k=${k}]`, panel).innerHTML = opts[k].map(([v, n]) => {
        let cnt = '';
        if (k === 'filter') cnt = `<i>${pool.filter(q => inMod(q) && FILTERS[v].fn(q.id)).length}</i>`;
        if (k === 'type' && v !== 'all') { const c = pool.filter(q => inMod(q) && q.type === v).length; if (!c) return ''; }
        return `<button class="${k === 'mod' ? 'chip' : 'seg-btn'} ${String(drillPrefs[k]) === String(v) ? 'on' : ''}" data-v="${v}">${esc(n)}${cnt}</button>`;
      }).join('');

    $('.drill-count', panel).innerHTML = n ? `<b>${n}</b> 道题符合条件` : `<span class="muted">${drillPrefs.filter === 'new' ? '这个范围的题都做过了，换成「全部」或「做错过」试试' : '这个范围没有题'}</span>`;

      return `<button class="prog-row ${drillPrefs.mod === mid ? 'on' : ''}" data-m="${mid}"><span class="pr-name">${esc(MOD[mid].short)}</span><span class="pr-num">${s.done}/${s.total}</span><div class="meter"><i style="width:${s.total ? s.done / s.total * 100 : 0}%"></i></div></button>`;

  panel.addEventListener('click', e => {

    paint();
  });

    let list = selected().map(q => q.id);

  };

  paint();
}

/* ============================================================
 * 模拟考
 * ============================================================ */
function drawMock() {
  const pool = drillPool();
  const used = new Set();
  const tier = id => { const s = qs(id); return !s.n ? 0 : (s.box || s.unsure || s.wrong) ? 1 : 2; };
  const pickFrom = cands => {
    cands = cands.filter(q => !used.has(q.id));
    if (!cands.length) return null;
    const best = Math.min(...cands.map(q => tier(q.id)));
    const c = shuffle(cands.filter(q => tier(q.id) === best))[0];
    used.add(c.id);
    return c;
  };
  return BLUEPRINT.map((slot, i) => {
    const q = pickFrom(pool.filter(q => q.m === slot.m && q.type === slot.type && (!slot.tag || q.tags.includes(slot.tag))))
      || pickFrom(pool.filter(q => q.m === slot.m && q.type === slot.type))
      || pickFrom(pool.filter(q => q.type === slot.type));
    return q ? { no: i + 1, qid: q.id } : null;
  }).filter(Boolean);
}
const isAnswered = (q, a) => a != null && (Array.isArray(a) ? a.length > 0 : String(a).trim() !== '' && a !== q.starter);

  if (ongoing) {
    const drop = h(`<button class="btn ghost">放弃这张</button>`);
    drop.onclick = async () => { if (await confirmBox('放弃这张卷子？已作答的内容不计入记录。', '放弃')) { S.mocks = S.mocks.filter(m => m !== ongoing); save(); route(); } };
    row.append(drop, h(`<a class="btn primary lg" href="#/mock/${ongoing.id}">继续答题${icon('arrowRight', 16)}</a>`));
  } else {
    const b = h(`<button class="btn primary lg">开始模拟考${icon('arrowRight', 16)}</button>`);
    b.onclick = () => {
      const mk = { id: 'm' + Date.now().toString(36), at: Date.now(), items: drawMock(), ans: {}, flags: {}, submitted: false };
      S.mocks.push(mk); save();
      go('#/mock/' + mk.id);
    };
    row.append(b);
  }
  main.append(card);
  const done = S.mocks.filter(m => m.submitted).slice().reverse();
  if (done.length) {
    main.append(h(`<section class="card"><div class="card-head"><h3>历史记录</h3><span class="muted">${done.length} 次</span></div><div class="hist">${done.map(m => {
      const total = m.items.length, right = Object.values(m.result || {}).filter(v => v === true).length;
      return `<a class="hist-row" href="#/mock/${m.id}"><span class="hist-ring">${ring(right / total, 36, 4)}</span><span class="hist-main"><b>答对 ${right} / ${total}</b><span>${new Date(m.at).toLocaleString('zh-CN')}</span></span><span class="chev">${icon('chevronRight', 16)}</span></a>`;
    }).join('')}</div></section>`));
  }
}

function viewMockPaper(main, id) {
  const mk = S.mocks.find(m => m.id === id);
  if (!mk) { go('#/mock'); return; }
  if (mk.submitted) { document.body.classList.remove('focus-mode'); return viewMockReport(main, mk); }
  main.className = 'exam';
  let cur = mk.cur || 0;
  const layout = h(`<div class="exam-layout">
    <section class="exam-main">
      <div class="focus-bar"><a class="icon-btn" href="#/mock" aria-label="暂时离开">${icon('x', 20)}</a><div class="focus-progress"><div class="meter lg"><i></i></div></div><span class="focus-count"></span></div>
      <div class="exam-q"></div>
    </section>
    <div class="answer-bar exam"><div class="ab-inner"><div class="ab-row"><div class="ab-flag"></div><div class="ab-actions"></div></div></div></div>
    <aside class="sheet-card">
      <div class="sheet-head"><b>答题卡</b><span class="muted sheet-prog"></span></div>
      <div class="sheet-grid"></div>
      <div class="sheet-legend"><span><i class="lg-ans"></i>已答</span><span><i class="lg-flag"></i>标记</span><span><i class="lg-cur"></i>当前</span></div>
      <button class="btn primary block submit-btn">交卷</button>
      <p class="muted small center">中途离开会自动保存</p>
    </aside></div>`);
  main.append(layout);
  const grid = $('.sheet-grid', layout), qbox = $('.exam-q', layout);

  function paintGrid() {
    let n = 0;
    grid.innerHTML = mk.items.map((it, i) => {
      const a = isAnswered(QS[it.qid], mk.ans[it.qid]);
      if (a) n++;
      return `${i === 0 ? '<div class="sheet-sec">单选</div>' : i === 20 ? '<div class="sheet-sec">多选</div>' : i === 28 ? '<div class="sheet-sec">简答</div>' : i === 30 ? '<div class="sheet-sec">代码</div>' : ''}<button class="${i === cur ? 'cur' : ''} ${a ? 'ans' : ''} ${mk.flags[it.qid] ? 'flag' : ''}" data-i="${i}">${it.no}</button>`;
    }).join('');
    $('.sheet-prog', layout).textContent = `${n} / ${mk.items.length}`;
    $('.focus-count', layout).textContent = `第 ${cur + 1} / ${mk.items.length} 题`;
    $('.meter i', layout).style.width = (n / mk.items.length * 100) + '%';
    return n;
  }
  grid.onclick = e => { const b = e.target.closest('button'); if (b) show(+b.dataset.i); };

  function show(i) {
    cur = i; mk.cur = i; save();
    const it = mk.items[i], q = QS[it.qid];
    const ctl = questionCard(q, {
      exam: true, label: `第 ${it.no} 题`, value: mk.ans[it.qid],
      onChange(v) { mk.ans[it.qid] = v; save(); paintGrid(); },
    });
    const flag = h(`<button class="btn ghost ${mk.flags[it.qid] ? 'flagged' : ''}">${icon('flag', 15)}${mk.flags[it.qid] ? '取消标记' : '标记待查'}</button>`);
    flag.onclick = () => { mk.flags[it.qid] = !mk.flags[it.qid]; save(); show(cur); };
    const prev = h(`<button class="btn secondary" ${i ? '' : 'disabled'}>${icon('arrowLeft', 16)}上一题</button>`);
    const next = h(`<button class="btn primary">${i + 1 < mk.items.length ? '下一题' : '去交卷'}${icon('arrowRight', 16)}</button>`);
    prev.onclick = () => show(i - 1);
    next.onclick = () => i + 1 < mk.items.length ? show(i + 1) : submit();
    $('.ab-flag', layout).innerHTML = ''; $('.ab-flag', layout).append(flag);
    const acts = $('.answer-bar .ab-actions', layout);
    acts.innerHTML = ''; acts.append(prev, next);
    qbox.innerHTML = ''; qbox.append(ctl.el);
    paintGrid();
    window.scrollTo({ top: 0 });
    viewKeys = e => {
      if (e.key === 'ArrowRight' || (e.key === 'Enter' && !(e.ctrlKey || e.metaKey))) { e.preventDefault(); next.click(); return; }
      if (e.key === 'ArrowLeft') { e.preventDefault(); if (i) prev.click(); return; }
      ctl.keys && ctl.keys(e);
    };
  }
  async function submit() {
    const n = paintGrid();
    const left = mk.items.length - n;
    if (!(await confirmBox(left ? `还有 <b>${left}</b> 题没答，确定交卷吗？<br>没答的题算错。` : '全部答完了，确定交卷吗？', '交卷', '再检查一下'))) return;
    const btn = $('.submit-btn', layout);
    btn.disabled = true; btn.textContent = '判卷中…';
    $('.answer-bar', layout).remove();
    qbox.innerHTML = `<div class="card grading"><div class="spinner lg"></div><h3>正在判卷</h3><p class="muted">${mk.items.some(it => QS[it.qid].type === 'code') ? '代码题需要跑一下测试，稍等几秒' : ''}</p></div>`;
    viewKeys = null;
    mk.result = {}; mk.testOut = {};
    for (const it of mk.items) {
      const q = QS[it.qid], a = mk.ans[it.qid];
      if (q.type === 'single' || q.type === 'multi') {
        const ans = new Set(q.answer), p = new Set(a || []);
        mk.result[it.qid] = p.size === ans.size && [...p].every(x => ans.has(x));
      } else if (q.type === 'code') {
        if (!isAnswered(q, a)) { mk.result[it.qid] = false; continue; }
        const r = await runTests(q, a, () => {});
        if (r.offline) mk.result[it.qid] = null;
        else { mk.testOut[it.qid] = r; mk.result[it.qid] = !!(r.ok && r.results.length && r.results.every(x => x.ok)); }
      } else {
        mk.result[it.qid] = isAnswered(q, a) ? null : false; // 简答待自评
      }
    }
    mk.submitted = true;
    for (const it of mk.items) if (mk.result[it.qid] !== null) record(it.qid, mk.result[it.qid]);
    save();
    route();
  }
  $('.submit-btn', layout).onclick = submit;
  show(cur);
}

function viewMockReport(main, mk) {
  main.className = 'wide';
  const pending = mk.items.filter(it => mk.result[it.qid] === null);
  const right = mk.items.filter(it => mk.result[it.qid] === true).length;
  const wrong = mk.items.filter(it => mk.result[it.qid] === false);
  const pct = right / mk.items.length;
  main.append(pageHead({ crumbs: [['模拟考', '#/mock'], [new Date(mk.at).toLocaleString('zh-CN')]], title: '模拟考结果' }));
  main.append(h(`<section class="card report-hero">
    <div class="result-ring">${ring(pct, 132, 10)}<div class="rr-text"><b>${right}<small>/${mk.items.length}</small></b><span>答对</span></div></div>
    <div class="rh-body">
      <h2>${pending.length ? `还有 ${pending.length} 题等你自评` : !wrong.length ? '全部答对，可以再来一张检验稳定性' : `错了 ${wrong.length} 题，已经放进错题本`}</h2>
      <p class="muted">${pending.length ? '简答题需要你对照得分点自己判断，在下面「逐题回看」里完成。' : '下面按模块列出了得分情况，红色的模块优先回去补。'}</p>
      <div class="btn-row"><a class="btn secondary" href="#/review">${icon('review', 15)}去错题本</a><a class="btn primary" href="#/mock">再来一张${icon('arrowRight', 16)}</a></div>
    </div></section>`));

  const byMod = {};
  mk.items.forEach(it => {
    const q = QS[it.qid];
    const r = byMod[q.m] || (byMod[q.m] = { ok: 0, n: 0 });
    r.n++; if (mk.result[it.qid] === true) r.ok++;
  });
  main.append(h(`<section class="card"><div class="card-head"><h3>各模块得分</h3></div><div class="prog-list static">${Object.entries(byMod).map(([mid, r]) =>
    `<div class="prog-row ${r.ok < r.n ? 'weak' : 'good'}"><span class="pr-name">${esc(MOD[mid].short)}</span><span class="pr-num">${r.ok}/${r.n}</span><div class="meter"><i style="width:${r.ok / r.n * 100}%"></i></div></div>`).join('')}</div></section>`));

  const list = h(`<section class="card"><div class="card-head"><h3>逐题回看</h3><div class="seg sm rp-filter"><button class="seg-btn" data-f="wrong">错题与待评</button><button class="seg-btn" data-f="all">全部</button></div></div><div class="rp-list"></div></section>`);
  main.append(list);
  let filter = pending.length || wrong.length ? 'wrong' : 'all';
  function paint() {
    $$('.rp-filter .seg-btn', list).forEach(c => c.classList.toggle('on', c.dataset.f === filter));
    const box = $('.rp-list', list);
    box.innerHTML = '';
    mk.items.filter(it => filter === 'all' || mk.result[it.qid] !== true).forEach(it => {
      const q = QS[it.qid], res = mk.result[it.qid];
      const st = res === true ? 'ok' : res === false ? 'no' : 'pend';
      const d = h(`<details class="rp-item ${st}" ${res === null ? 'open' : ''}><summary>
        <span class="rp-no">${it.no}</span><span class="pill type-${q.type}">${TYPE_NAME[q.type]}</span><span class="rp-mod">${esc(MOD[q.m].short)}</span>
        <span class="rp-res">${res === true ? icon('check', 15) + '正确' : res === false ? icon('x', 15) + '错误' : '待自评'}</span><span class="chev-d">${icon('chevronDown', 16)}</span></summary></details>`);
      let built = false;
      const build = () => {
        if (built) return; built = true;
        const ctl = questionCard(q, { exam: true, value: mk.ans[it.qid] });
        ctl.reveal(mk.ans[it.qid], mk.testOut && mk.testOut[it.qid]);
        if (res === null) {
          const self = h(`<div class="fb-actions"><button class="btn secondary" data-v="0">没答好，算错</button><button class="btn success" data-v="1">${icon('check', 16)}${q.type === 'code' ? '和答案一致' : '要点都答到了'}</button></div>`);
          $$('button', self).forEach(b => b.onclick = () => {
            const ok = b.dataset.v === '1';
            mk.result[it.qid] = ok; record(it.qid, ok); save(); route();
          });
          ctl.el.append(self);
        }
        d.append(ctl.el);
      };
      d.addEventListener('toggle', () => d.open && build());
      if (d.open) build();
      box.append(d);
    });
    if (!box.children.length) box.append(emptyState('trophy', '没有错题', '这张卷子全对。'));
  }
  $('.rp-filter', list).onclick = e => { const c = e.target.closest('.seg-btn'); if (c) { filter = c.dataset.f; paint(); } };
  paint();
}

/* ============================================================
 * 速查 & 设置
 * ============================================================ */
function viewSheet(main) {
  main.className = 'wide';
  main.append(pageHead({ eyebrow: '考前速查', title: '每个模块最容易错的点', desc: '考前 30 分钟过一遍。' }));
  const c = md(DATA.cheatsheet);
  c.classList.add('card', 'prose', 'sheet');
  main.append(c);
}

function viewSettings(main) {
  main.className = 'wide';
  main.append(pageHead({ eyebrow: '设置', title: '设置与数据' }));
  const sec = h(`<section class="card settings">
    <p class="muted">这个站全是选择题，没有需要设置的选项。</p>
  </section>`);
  main.append(sec);
  const data = h(`<section class="card settings">
    <div class="card-head"><h3>进度备份</h3></div>
    <p class="muted">进度保存在当前浏览器里。换浏览器、换电脑、移动这个文件，或者清理浏览器数据之前，先导出一份备份。</p>
    <div class="btn-row"><button class="btn primary" data-a="export">${icon('download', 15)}导出进度文件</button><label class="btn secondary">${icon('upload', 15)}导入进度文件<input type="file" accept=".json" hidden></label><span class="spacer"></span><button class="btn danger" data-a="reset">${icon('trash', 15)}清空所有进度</button></div>
  </section>`);
  $('[data-a=export]', data).onclick = () => {
    const blob = new Blob([JSON.stringify(S)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${DATA.brand}进度-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    toast('已导出进度文件');
  };
  $('input[type=file]', data).onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const obj = JSON.parse(await f.text());
      if (!obj || typeof obj.q !== 'object') throw new Error('文件格式不对');
      if (!(await confirmBox('导入会覆盖当前进度，确定吗？', '覆盖导入'))) return;
      S = Object.assign(DEFAULT_STATE(), obj); save(); toast('导入成功'); go('#/');
    } catch (err) { toast('导入失败：' + err.message); }
  };
  $('[data-a=reset]', data).onclick = async () => {
    if (!(await confirmBox('清空全部学习进度、错题和模拟考记录？<br><b>这个操作不能撤销</b>，建议先导出备份。', '清空'))) return;
    S = DEFAULT_STATE(); save(); toast('已清空'); go('#/');
  };
  main.append(data);
  main.append(h(`<section class="card"><div class="card-head"><h3>快捷键</h3></div><div class="keys">
    <div><span><kbd>1</kbd>–<kbd>4</kbd></span><span>选择选项（多选题再按一次取消）</span></div>
    <div><span><kbd>Enter</kbd></span><span>提交 / 下一题 / 讲解下一步</span></div>
    <div><span><kbd>←</kbd> <kbd>→</kbd></span><span>讲解翻页、模拟考切换题目</span></div>
    <div><span><kbd>U</kbd></span><span>标记 / 取消「不熟」</span></div>
    <div><span><kbd>Esc</kbd></span><span>退出当前讲解或练习</span></div>
  </div></section>`));
}

initShell();
route();
</script>
