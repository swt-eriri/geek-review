goroutine\n\nAgent 要读三个互不相关的文件，一个个顺序读会多花等待时间。课程让它们<strong>同时开始<\/strong>，全部返回后再一起交给模型。这种「<strong>分出去执行，再汇总<\/strong>」叫 <strong>Fork-Join<\/strong>。\n\n- <strong>goroutine<\/strong> = Go 语言的轻量并发任务；<strong>WaitGroup<\/strong> = 等所有任务完成的计数器。\n- 示例用 goroutine 同时跑任务，用 WaitGroup 等待完成。\n\n<strong>保证顺序的关键设计<\/strong>：\n- <strong>预先分配固定长度的切片（Slice）<\/strong>，第 1 个调用的结果放第 1 格，第 2 个放第 2 格……\n- 每个 goroutine 根据<strong>传入的索引<\/strong>，<strong>无锁并发写入<\/strong>自己那一格。\n- 即使实际完成顺序不同，交给模型的 ToolResult 顺序仍与请求顺序<strong>一致<\/strong>。", "### 对号入座与风险\n\n模型一个 Turn 里同时请求 3 个 bash，怎么保证 ToolResult 顺序和请求一致？\n\n| 选项说法 | 对不对 |\n|---|---|\n| <strong>预分配固定长度切片，按索引无锁写入<\/strong> | ✅ |\n| sync.Mutex 全局锁，谁先完成谁先 append | ❌ 顺序会乱 |\n| 取消并发，退回串行 | ❌ |\n| 让模型靠 JSON 里的 ID 重组顺序 | ❌ |\n\n<strong>并发要先判断任务是否独立<\/strong>：\n- 一个工具在创建文件，另一个立刻运行该文件 → 后者可能在文件创建前就开始。\n- 两个工具同时修改同一文件 → 可能互相覆盖。\n- 课程示例<strong>假设同一轮的调用互不依赖<\/strong>，实验选多个独立读取。\n- 正文讨论的思路：<strong>只读并发、写入串行<\/strong>、<strong>按文件加锁<\/strong>（加锁不能保证「先读、再判断、最后写」整个过程不被打断）。\n\n> 📌 必背陷阱：保证顺序靠<strong>索引<\/strong>，不是靠锁。"]}, {"title": "第 09 讲 · 飞书接入：怎样把运行状态发给用户", "cards": ["### Reporter：把进度报告出去\n\n在终端运行时，Agent 能直接打印「正在读文件」。若程序跑在服务器上、用户在<strong>飞书<\/strong>发消息，终端输出不会自动出现在飞书。\n\n- <strong>Reporter（报告接口）<\/strong>：引擎在关键时刻（开始运行、调用工具、返回结果）通知 Reporter。\n- <strong>TerminalReporter<\/strong> 把信息写到终端；<strong>FeishuReporter<\/strong> 把信息发到飞书。\n- 好处：<strong>核心引擎不用为每种界面各写一套主循环<\/strong>。", "### 飞书流程与已知问题\n\n流程：<strong>用户发消息 → 飞书通过 Webhook 把事件送到服务 → 服务启动 Agent → Reporter 把进度和最终结果发回。<\/strong>\n\n- <strong>Webhook<\/strong> = 第三方系统向你的服务<strong>发送事件<\/strong>的一种方式（你给一个地址，对方有事就往这个地址发）。\n- 课程还介绍了：配置机器人、<strong>事件地址<\/strong>和<strong>地址验证<\/strong>。\n- <strong>这一版的明显问题<\/strong>：每条消息都<strong>新启动一次运行<\/strong>，上一条对话的历史<strong>不会自动带过来<\/strong>。→ <strong>第 11 讲增加会话管理（Session）<\/strong>来解决。\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 引擎不用为终端 / 飞书各写一套主循环 | <strong>Reporter<\/strong> 接口 |\n| 每条飞书消息都像新对话、没有历史 | 第 09 讲版本的问题，第 11 讲 Session 解决 |"]}], "questions": [{"id": "aht-p1", "type": "single", "stem": "构成 Coding Agent 核心工具原语的四个基础工具是？", "options": ["read_file, write_file, edit_file, bash", "git, npm, grep, docker", "search_web, read_file, python_repl, bash", "MCP_server, read_file, edit_file, ask_human"], "answer": [0], "why": ["对", "这些是命令行程序", "不是这一组", "不是这一组"], "explain": "四工具：read_file / write_file / edit_file / bash。", "tags": [], "lesson": 0, "m": "ah_tools"}, {"id": "aht-p2", "type": "single", "stem": "edit 工具遇到多处匹配时，课程要求？", "options": ["拒绝替换，让模型提供更多上下文", "替换第一处", "全部替换", "随机选一处"], "answer": [0], "why": ["对", "不是", "不是", "不是"], "explain": "多处匹配 → 拒绝。", "tags": [], "lesson": 1, "m": "ah_tools"}, {"id": "aht-p3", "type": "single", "stem": "判断：并发执行工具时，课程用预分配固定长度的切片，按索引无锁写入来保证结果顺序", "options": ["正确", "错误"], "answer": [0], "why": ["对", "这正是课程做法"], "explain": "按索引写入，不靠锁。", "tags": [], "lesson": 2, "m": "ah_tools"}, {"id": "aht-p4", "type": "single", "stem": "让核心引擎不必为终端和飞书各写一套主循环的是？", "options": ["Reporter", "Provider", "Tool Registry", "Compactor"], "answer": [0], "why": ["对，TerminalReporter / FeishuReporter", "模型适配", "工具注册", "上下文压缩"], "explain": "Reporter 隔离输出界面。", "tags": [], "lesson": 3, "m": "ah_tools"}, {"id": "aht-1", "type": "single", "stem": "参考 OpenClaw 的极简设计哲学，哪一组构成系统级 Coding Agent 完备的核心工具原语？", "options": ["git, npm, grep, docker", "read_file, write_file, edit_file, bash", "search_web, read_file, python_repl, bash", "MCP_server, read_file, edit_file, ask_human"], "answer": [1], "why": ["都是命令行程序", "对", "不是", "不是"], "explain": "四个工具：读、写、改、bash。", "tags": ["basic"], "m": "ah_tools"}, {"id": "aht-2", "type": "multi", "stem": "关于第 06 讲，下列说法正确的有", "options": ["write_file 用于创建或覆盖文件", "edit_file 用于修改已有文件中的一部分", "bash 示例设置了执行超时，并对过长输出做截断", "bash 的错误结果会返回给模型，由它决定下一步", "少量基础工具的原因之一是：工具越多，请求里携带的工具说明越长"], "answer": [0, 1, 2, 3, 4], "why": ["对", "对", "对", "对", "对"], "explain": "四工具、超时、截断、错误回传、工具少而精。", "tags": ["basic", "core"], "m": "ah_tools"}, {"id": "aht-3", "type": "multi", "stem": "关于 edit 工具，正确的有", "options": ["需要文件路径、old_text、new_text 三个参数", "课程设计了四级匹配：精确 → 换行符 → 去首尾空行 → 逐行去首尾空白", "多处匹配时，拒绝替换，让模型提供更多上下文", "只做完全一致匹配就够了，因为模型从不弄错缩进", "多处匹配时默认替换第一处"], "answer": [0, 1, 2], "why": ["对", "对", "对", "错，缩进不一致就会找不到", "错，是拒绝"], "explain": "三个参数，四级匹配，多处拒绝。", "tags": ["basic", "core"], "m": "ah_tools"}, {"id": "aht-4", "type": "single", "stem": "edit 的四级匹配中，最后一级（容忍缩进差异）做的是？", "options": ["逐行去掉首尾空白再比较", "精确匹配", "处理不同系统换行符", "忽略文本块首尾多余空行"], "answer": [0], "why": ["对，第 4 级", "第 1 级", "第 2 级", "第 3 级"], "explain": "最后一级：逐行去首尾空白。", "tags": ["basic", "core"], "m": "ah_tools"}, {"id": "aht-5", "type": "single", "stem": "大模型一个 Turn 吐出 3 个 bash 请求，Harness 用 Goroutine 并发执行时，为保证 ToolResult 顺序与请求一致，采用的设计是？", "options": ["用 sync.Mutex 全局锁，谁先完成谁先 append", "取消并发，退回串行", "预先分配固定长度的切片，各 Goroutine 按传入的索引无锁并发写入", "让大模型通过 JSON 里的 ID 重组顺序"], "answer": [2], "why": ["顺序会乱", "放弃了并发", "对", "不是课程做法"], "explain": "预分配切片 + 索引写入。", "tags": ["basic"], "m": "ah_tools"}, {"id": "aht-6", "type": "multi", "stem": "关于第 08 讲的并发，下列说法正确的有", "options": ["「分出去执行，再汇总」叫 Fork-Join", "示例用 goroutine 同时运行任务，用 WaitGroup 等待完成", "创建文件和运行该文件的两个工具同时跑，可能出问题", "课程示例假设同一轮的工具调用互不依赖", "加了锁就能自动保证「先读、再判断、最后写」整个过程不被打断"], "answer": [0, 1, 2, 3], "why": ["对", "对", "对，后者可能在文件创建前就开始", "对", "错：只给单次读写加锁，不会自动保护「先读、再判断、最后写」的整个过程"], "explain": "Fork-Join，要判断是否独立。", "tags": ["basic", "core"], "m": "ah_tools"}, {"id": "aht-7", "type": "multi", "stem": "关于 Reporter，正确的有", "options": ["引擎在开始运行、调用工具、返回结果等关键时刻通知它", "TerminalReporter 把信息写到终端", "FeishuReporter 把信息发到飞书", "核心引擎要为每种界面各写一套主循环", "它负责和不同的大模型服务通信"], "answer": [0, 1, 2], "why": ["对", "对", "对", "错，Reporter 的好处正是不用各写主循环", "错，那是 Provider"], "explain": "Reporter 管把进度报告到不同界面。", "tags": ["basic", "core"], "m": "ah_tools"}, {"id": "aht-8", "type": "single", "stem": "飞书接入的大致流程里，飞书把用户消息事件送到服务靠的是？", "options": ["Webhook", "channel", "WaitGroup", "SetupScript"], "answer": [0], "why": ["对，第三方向你的服务发送事件的方式", "channel 是 Go 里用于等待审批结果的", "WaitGroup 用于并发等待", "SetupScript 用于 Benchmark 准备环境"], "explain": "飞书事件靠 Webhook 送达。", "tags": ["basic"], "m": "ah_tools"}]}, {"id": "ah_ctx", "title": "记得住、装得下：Prompt Composer、Session、上下文压缩、PLAN/TODO", "short": "上下文·记忆", "group": "Agent Harness · 第三章", "exam": "第 10—13 讲：Prompt Composer / AGENTS.md / Skills、Session 与 Working Memory、Compactor 两层处理、PLAN.md / TODO.md 状态外部化", "refs": [], "lessons": [{"title": "第 10 讲 · Prompt Composer、AGENTS.md 和 Skills", "cards": ["### 运行时组装提示词\n\n订单项目要求「用团队指定的日志库，改完运行测试」。写死在程序里，规则一变就得改代码。所以用 <strong>Prompt Composer（提示词组装器）<\/strong>，在<strong>运行时<\/strong>组合三类内容：\n\n| 内容 | 作用 |\n|---|---|\n| <strong>基础系统提示<\/strong> | 说明 Agent 的一般职责 |\n| <strong>AGENTS.md<\/strong>（工作区里） | 说明<strong>当前项目规则<\/strong> |\n| <strong>Skills（技能）<\/strong> | 保存<strong>针对某类任务的具体方法<\/strong>，如「怎样在这个团队提交代码」 |\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 运行时把系统提示、项目规则、技能拼起来 | <strong>Prompt Composer<\/strong> |\n| 当前项目的规则文件 | <strong>AGENTS.md<\/strong> |\n| 某类任务的具体做法 | <strong>Skill<\/strong> |", "### Skills 的存放与加载\n\n- 一个技能通常放在<strong>独立目录<\/strong>里，<strong>SKILL.md<\/strong> 开头有 <strong>name<\/strong> 和 <strong>description<\/strong>，后面是具体说明。\n- 程序扫描 <strong>.claw/skills<\/strong> 目录，读取这些文件，拼进系统提示。\n- <strong>渐进加载思路<\/strong>：先只看技能的名称和描述，需要时再读正文。\n- 但<strong>本讲的简化实现把技能正文一起加载<\/strong>；技能很多时，模型每次要读的内容也会变多。\n\n> 📌 必背陷阱：课程<strong>介绍<\/strong>了渐进加载，但<strong>本讲实现<\/strong>是把正文一起加载。"]}, {"title": "第 11 讲 · Session：为什么不同人的对话不能混在一起", "cards": ["### Session 与 SessionManager\n\n研发群让 Agent 改订单代码，运维群同时让它查服务器日志，若消息混进同一份历史，模型可能把一个群的文件内容当成另一个群的上下文。\n\n- <strong>Session<\/strong> = 一次会话对应的状态（它的历史）。\n- <strong>SessionManager<\/strong> = 根据<strong>会话标识<\/strong>找到各自的历史；引擎处理请求时读取、更新对应 Session。\n- 课程示例用<strong>锁<\/strong>保护会话数据的并发访问。\n- 它解决的是第 09 讲的问题：每条飞书消息都新开一次运行、没有历史。", "### Working Memory 与两种隔离\n\n- <strong>Working Memory（工作记忆）<\/strong>：对很长的对话，不必每次交所有历史，<strong>选取最近若干条消息<\/strong>交给模型。\n- 截取时注意<strong>工具调用与工具结果要成对<\/strong>：只留工具结果、裁掉触发它的调用，消息结构不完整。\n\n| 易混的一对 | 区别 |\n|---|---|\n| <strong>会话历史隔离<\/strong>（Session） | 不同会话各看各的<strong>消息历史<\/strong> |\n| <strong>文件工作区隔离<\/strong> | 示例中工具可能绑定<strong>同一个目录<\/strong>，历史分开后工具仍可能读到同一个工作区 |\n\n- 「只取最近几条」仍<strong>挡不住其中一条巨型日志<\/strong>，→ 第 12 讲处理。\n\n> 📌 必背陷阱：Session 隔离 ≠ 工作区隔离。"]}, {"title": "第 12 讲 · Context Compaction：上下文太长怎么办", "cards": ["### 为什么要压缩\n\n- <strong>上下文窗口<\/strong> = 模型一次能接收的内容上限。系统提示、对话、工具调用、文件内容都占空间。\n- 即便只保留最近三条消息，只要其中一条有两万行日志，仍可能超限。\n- <strong>Context Compactor（上下文压缩器）<\/strong>：在<strong>向模型发送前<\/strong>处理历史。\n\n<strong>两个层次<\/strong>：\n\n| 对象 | 做法 |\n|---|---|\n| <strong>比较久以前的工具结果<\/strong> | 用一段<strong>占位提示<\/strong>整条替换（<strong>全量掩码<\/strong>），同时<strong>保留工具调用记录<\/strong> |\n| <strong>近期（Working Memory 保护区内）仍很长的工具结果<\/strong> | 局部截断：保留<strong>开头和结尾各 500 字<\/strong>，截掉中间（真题选项叫「掐头去尾」，意思其实是留头留尾） |", "### 对号入座\n\n一份超过 1 万字的超长错误日志，<strong>正好在 Working Memory 保护区内<\/strong>，引擎怎么处理？\n\n| 选项 | 对不对 |\n|---|---|\n| <strong>保留首尾各 500 字，截去中间<\/strong> | ✅ |\n| 全量掩码替换为提示信息 | ❌ 那是处理<strong>旧的<\/strong>工具结果 |\n| 直接丢弃，防 OOM | ❌ |\n| 原样保留，Working Memory 绝对不可侵犯 | ❌ |\n\n- 缺点：若真正的报错藏在被截掉的<strong>中间<\/strong>，模型就看不到。\n- 课程也讨论：先<strong>保存完整输出再按需读取<\/strong>，或用<strong>摘要与检索<\/strong>补充记忆。\n- 示例用<strong>字符数<\/strong>估算压力（字符数 ≠ Token 数）；把<strong>原始 Session 历史<\/strong>和<strong>发给模型的压缩副本<\/strong>区分开，便于回看。\n\n> 📌 必背陷阱：旧结果 = <strong>全量掩码<\/strong>；保护区内的长结果 = <strong>留首尾各 500 字、截掉中间<\/strong>。"]}, {"title": "第 13 讲 · PLAN 和 TODO：长任务怎样接着做", "cards": ["### 状态外部化（Externalized State）\n\n上下文压缩能缩短输入，但持续数小时的任务，模型可能看不到最早的方案；程序重启后，只存在内存里的历史会丢。\n\n- 课程用<strong>文件<\/strong>记录：<strong>PLAN.md<\/strong> 保存整体方案和约束，<strong>TODO.md<\/strong> 保存具体事项和进度。\n- 开启 <strong>Plan Mode<\/strong> 后，<strong>Prompt Composer<\/strong> 在系统提示里加规则，引导 Agent 读写这两个文件。\n- 用户也可以打开文件<strong>修改计划<\/strong>，再让 Agent 读取并继续。\n- 课内演示：模拟运行到一半停止，<strong>再启动程序读取待办继续执行<\/strong>。", "### 三个好处（对号入座）\n\n| 说法 | 对不对 |\n|---|---|\n| <strong>透明<\/strong>：人在 IDE 里随时打开文件看进度 | ✅ |\n| <strong>人机协同<\/strong>：人直接编辑计划文件，Agent 重新读取后按新计划继续 | ✅ |\n| <strong>跨会话持久化<\/strong>：进程重启后重新读文件就能恢复进度 | ✅ |\n| 提升推理速度：读磁盘比访问内存更快 | ❌ 不是它的优势 |\n\n- 对「运行一次版本命令」这类简单任务，建计划文件反而多一步，所以课程提供<strong>开关<\/strong>。\n- <strong>Plan Mode ≠ Thinking<\/strong>：前者管<strong>跨步骤的计划与记录<\/strong>，后者是<strong>行动前的一次额外规划调用<\/strong>。\n\n> 📌 必背陷阱：「读磁盘比内存快」是<strong>错<\/strong>的。三个好处：透明、人能直接改、重启后可恢复。"]}], "questions": [{"id": "ahc-p1", "type": "single", "stem": "在运行时把基础系统提示、项目规则（AGENTS.md）和技能拼成系统提示的是？", "options": ["Prompt Composer", "Provider", "Reporter", "Compactor"], "answer": [0], "why": ["对", "管模型格式", "管进度报告", "管压缩历史"], "explain": "Prompt Composer = 提示词组装器。", "tags": [], "lesson": 0, "m": "ah_ctx"}, {"id": "ahc-p2", "type": "single", "stem": "根据会话标识找到各自历史的是？", "options": ["SessionManager", "Reporter", "Tool Registry", "Provider"], "answer": [0], "why": ["对", "不是", "不是", "不是"], "explain": "SessionManager 管各会话的历史。", "tags": [], "lesson": 1, "m": "ah_ctx"}, {"id": "ahc-p3", "type": "single", "stem": "旧的工具结果，上下文压缩器是怎么处理的？", "options": ["用占位提示整条替换（全量掩码）", "首尾各留 500 字", "原样保留", "直接删掉工具调用记录"], "answer": [0], "why": ["对", "那是保护区内的超长结果", "不是", "工具调用记录是保留的"], "explain": "旧结果全量掩码。", "tags": [], "lesson": 2, "m": "ah_ctx"}, {"id": "ahc-p4", "type": "single", "stem": "判断：PLAN.md / TODO.md 的好处之一是读磁盘文件比访问内存更快", "options": ["正确", "错误"], "answer": [1], "why": ["不对", "速度不是它的好处，好处是透明、可人改、可恢复"], "explain": "「读磁盘更快」是错的。", "tags": [], "lesson": 3, "m": "ah_ctx"}, {"id": "ahc-1", "type": "multi", "stem": "关于 Prompt Composer，正确的有", "options": ["它在运行时组合基础系统提示、AGENTS.md 和 Skills", "AGENTS.md 说明当前项目的规则", "Skills 保存针对某类任务的具体方法", "规则一变就必须改程序代码", "它负责把消息翻译成不同模型的格式"], "answer": [0, 1, 2], "why": ["对", "对", "对", "错，用它就是为了不改代码", "错，那是 Provider"], "explain": "三类内容运行时拼装。", "tags": ["basic", "core"], "m": "ah_ctx"}, {"id": "ahc-2", "type": "multi", "stem": "关于 Skills 的存放和加载，正确的有", "options": ["一个技能通常放在独立目录，SKILL.md 开头有 name 和 description", "程序扫描 .claw/skills 目录并读取这些文件", "课程介绍了先看名称和描述、需要时再读正文的渐进加载思路", "本讲的简化实现把技能正文一起加载", "本讲的实现已经完全做到渐进加载"], "answer": [0, 1, 2, 3], "why": ["对", "对", "对", "对", "错，简化实现是正文一起加载"], "explain": "介绍渐进加载，但实现是一起加载。", "tags": ["basic", "core"], "m": "ah_ctx"}, {"id": "ahc-3", "type": "multi", "stem": "关于 Session 和 SessionManager，正确的有", "options": ["Session 是一次会话对应的状态", "SessionManager 根据会话标识找到各自的历史", "示例使用锁保护会话数据的并发访问", "研发群和运维群的消息应该混在同一份历史里", "它解决第 09 讲每条消息都新开一次运行、没有历史的问题"], "answer": [0, 1, 2, 4], "why": ["对", "对", "对", "错，混在一起会串上下文", "对"], "explain": "Session 隔离各会话历史。", "tags": ["basic", "core"], "m": "ah_ctx"}, {"id": "ahc-4", "type": "multi", "stem": "关于 Working Memory 与隔离，正确的有", "options": ["Working Memory 选取最近若干条消息交给模型", "截取时工具调用与工具结果要保持对应", "会话历史隔离了，工作区就一定也隔离了", "会话历史隔离和文件工作区隔离是两个问题", "「只取最近几条」仍挡不住其中一条巨型日志"], "answer": [0, 1, 3, 4], "why": ["对", "对", "错，示例中工具可能绑定同一个目录", "对", "对，第 12 讲处理"], "explain": "Session 隔离 ≠ 工作区隔离。", "tags": ["basic", "core"], "m": "ah_ctx"}, {"id": "ahc-5", "type": "single", "stem": "在 go-tiny-claw 的上下文压缩中，大模型读了一个超过 1 万字的错误日志，且它正好在最近的 Working Memory 保护区内，引擎如何处理？", "options": ["直接丢弃，以防 OOM", "全量掩码，替换为提示信息", "局部截断：保留首尾各 500 字，截去中间", "保持原样，因为 Working Memory 绝对不可侵犯"], "answer": [2], "why": ["错", "那是处理较旧的工具结果", "对", "错，超长也要处理"], "explain": "保护区内超长 → 保留首尾各 500 字、截去中间。", "tags": ["basic"], "m": "ah_ctx"}, {"id": "ahc-6", "type": "multi", "stem": "关于 Context Compactor 的两个层次，正确的有", "options": ["较久以前的工具结果用占位说明整条替换，同时保留工具调用记录", "近期仍很长的工具结果保留开头和结尾，截去中间", "它在向模型发送前处理历史", "压缩会同时改写原始 Session 历史，无法回看", "真正的报错恰好在被截去的中间时，模型就看不到了"], "answer": [0, 1, 2, 4], "why": ["对", "对", "对", "错，课程把原始历史和发给模型的压缩副本区分开", "对，这是缺点"], "explain": "旧的掩码，近的截头尾。", "tags": ["basic", "core"], "m": "ah_ctx"}, {"id": "ahc-7", "type": "multi", "stem": "「状态外部化」让 Agent 使用 PLAN.md 和 TODO.md，带来的核心优势有", "options": ["透明：人可以随时在 IDE 里打开文件看进度", "人可以直接修改 Markdown 文件纠正 Agent 的方向", "提升推理速度：读磁盘比访问内存更快", "进程重启后，Agent 重新读文件就能恢复任务进度"], "answer": [0, 1, 3], "why": ["对", "对", "错，不是优势", "对"], "explain": "透明、可改、可恢复。", "tags": ["basic"], "m": "ah_ctx"}, {"id": "ahc-8", "type": "multi", "stem": "关于 PLAN.md、TODO.md 和 Plan Mode，正确的有", "options": ["PLAN.md 保存整体方案和约束", "TODO.md 保存具体事项和进度", "开启 Plan Mode 后，Prompt Composer 在系统提示里加入相应规则", "Plan Mode 和 Thinking 是同一个东西", "简单任务建计划文件可能多余，所以课程提供开关"], "answer": [0, 1, 2, 4], "why": ["对", "对", "对", "错，Thinking 是行动前的一次额外规划调用", "对"], "explain": "PLAN 方案，TODO 进度，开启 Plan Mode 后，Prompt Composer 加入规则，引导 Agent 读写这两个文件。", "tags": ["basic", "core"], "m": "ah_ctx"}]}, {"id": "ah_safe", "title": "出错处理与危险操作控制：纠错、提醒、审批、子智能体", "short": "纠错·审批", "group": "Agent Harness · 第四章", "exam": "第 14—17 讲：Error Recovery、System Reminders、Middleware 审批（channel 阻塞）、Subagent", "refs": [], "lessons": [{"title": "第 14 讲 · Error Recovery 错误恢复", "cards": ["### 一句话：工具出错后，给模型附一条「下一步建议」\n\n<strong>Error Recovery（错误恢复）<\/strong> = 工具报错后，系统根据<strong>工具和错误类型<\/strong>，在报错信息后面<strong>附加一条建议<\/strong>，交给模型。\n\n订单项目例子：\n1. Agent 想改 `order.go`，用 <strong>edit<\/strong> 工具，但传错了旧文本 → 返回「找不到要替换的内容」。\n2. 只把这句话还给模型，模型可能乱猜几次，<strong>始终不重新看文件<\/strong>。\n3. 有了 Error Recovery：附上建议——<strong>先重新读取文件<\/strong>，确认准确的旧文本和缩进，再决定是否重试。\n4. 模型收到的是「<strong>错误信息 + 建议<\/strong>」；<strong>系统不会替它改文件<\/strong>。\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 工具出错后附加建议，引导模型重新读文件 | <strong>Error Recovery<\/strong> |\n| 课内负责判断错误类别的组件 | <strong>RecoveryManager<\/strong>（用<strong>字符串匹配<\/strong>判断） |\n| 系统直接替模型修改文件 | ❌ 错，只给建议 |", "### 局限与易混\n\n- <strong>RecoveryManager 用字符串匹配<\/strong>：容易理解，但底层报错<strong>改几个字<\/strong>就可能识别不到。课程建议更稳妥的做法：用<strong>明确的错误类型或错误码<\/strong>。\n\n| 易混的一对 | Error Recovery（第 14 讲） | System Reminders（第 15 讲） |\n|---|---|---|\n| 针对什么 | <strong>一次<\/strong>工具错误 | <strong>连续重复<\/strong>且没进展的失败 |\n| 做什么 | 给出这次错误可能的下一步 | 提醒它停止重复、换思路 |\n\n> 📌 必背陷阱：Error Recovery 是「<strong>错误信息 + 建议<\/strong>」交给模型，不是系统自动修复；判断靠<strong>字符串匹配<\/strong>，不是错误码。"]}, {"title": "第 15 讲 · System Reminders 防死循环", "cards": ["### 一句话：发现原地打转，插一条提醒\n\n<strong>Doom Loop（死循环）<\/strong> = 模型<strong>连续重复<\/strong>同一个错误操作，没有进展。<strong>System Reminders<\/strong> 就是防它的机制，由 <strong>ReminderInjector<\/strong> 观察最近的工具调用。\n\n顺序走一遍（订单例子：连续三次读不存在的 `old-order.go`）：\n1. 每次工具调用，按<strong>工具名 + 参数<\/strong>生成一个<strong>指纹<\/strong>。\n2. 发现<strong>连续多次<\/strong>指纹相同且失败 → 判定死循环。\n3. 在<strong>下一次请求模型之前<\/strong>，把一条干预提醒追加到上下文<strong>最末尾<\/strong>。\n4. 提醒内容：停止重复、换思路，或报告无法完成（例如先列目录确认文件名）。\n\n> 📌 必背陷阱（真题）：干预提醒是以 <strong>RoleUser（用户角色）<\/strong> 消息追加到上下文<strong>最末尾<\/strong>的。<strong>不是<\/strong> RoleSystem、RoleAssistant、RoleTool。（⚠️ 笔记没写角色，这是按真题选项排除法推断的。）名字叫 System Reminders，角色却是 <strong>User<\/strong>。", "### 对号入座与局限\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 按<strong>工具名 + 参数<\/strong>生成指纹 | System Reminders / ReminderInjector |\n| 提醒作为什么角色追加到最末尾 | <strong>RoleUser<\/strong> |\n| 提醒是强制限制吗 | ❌ 不是，只是<strong>引导<\/strong>，模型可能不听 |\n\n- 指纹要<strong>参数完全一致<\/strong>才算重复；三次路径写法略有不同但指向同一处，就可能<strong>漏掉<\/strong>。\n- 需要<strong>强制<\/strong>限制时，要靠明确的程序控制，不能只靠提醒。\n\n| 易混的一对 | Error Recovery | System Reminders |\n|---|---|---|\n| 范围 | 一次错误 | 一段重复行为 |\n| 触发依据 | 错误类型（字符串匹配） | 工具名 + 参数指纹 |"]}, {"title": "第 16 讲 · Middleware 与人工审批", "cards": ["### 一句话：工具真正执行之前，先过一道检查\n\n<strong>Middleware（中间件）<\/strong> = 工具<strong>真正执行之前<\/strong>的检查层。Registry 收到 ToolCall 后，先交给 Middleware 检查。三种决策：\n\n| 决策 | 意思 |\n|---|---|\n| <strong>allow<\/strong> | 允许通过 |\n| <strong>ask<\/strong> | 询问（发起人工审批） |\n| <strong>deny<\/strong> | 直接拒绝 |\n\n人工审批的顺序（例：Agent 想删服务器日志）：\n1. Agent 提出一个被规则判为<strong>危险<\/strong>的命令。\n2. Middleware <strong>暂停<\/strong>这次工具执行，把操作信息发到<strong>飞书<\/strong>。\n3. 人在飞书回复<strong>同意或拒绝<\/strong>。\n4. 结果传回<strong>等待中的程序<\/strong>：<strong>同意才继续执行<\/strong>；拒绝则把结果告诉 Agent。", "### 等待的时候是什么状态\n\n- 等待靠 Go 的 <strong>channel<\/strong>（通道：goroutine 之间传递数据的管道）：<strong>Middleware 层通过 channel 阻塞等待<\/strong>人工审批结果，收到结果才往下走。\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 审批期间引擎处于什么状态 | <strong>Middleware 层通过 channel 阻塞等待<\/strong> |\n| 引擎直接报错结束会话 | ❌ |\n| 引擎不阻塞，先继续生成 | ❌ |\n| 启动子智能体绕过拦截 | ❌ |\n\n- 检查放在<strong>执行前<\/strong>，因为等执行失败后再提醒已经晚了。\n- 局限：用规则识别危险命令，<strong>简单关键字不能识别所有危险情况<\/strong>；课程提到<strong>沙箱<\/strong>是隔离思路，但<strong>本课示例没有实现完整沙箱<\/strong>。\n\n> 📌 必背陷阱：Middleware 管<strong>执行前<\/strong>，System Reminders 管<strong>事后<\/strong>反复失败；审批 = <strong>channel 阻塞等待<\/strong>，同意才执行。"]}, {"title": "第 17 讲 · Subagent 子智能体", "cards": ["### 一句话：把一部分探索交给另一个 Agent\n\n订单项目很大，主 Agent 要读几十个文件，每个结果都进它的上下文，很快就太长。解决：把「查找订单相关文件并概括职责」交给<strong>子 Agent（Subagent）<\/strong>。\n\n1. 子 Agent 有<strong>自己的任务和对话历史<\/strong>。\n2. 它读文件、处理结果，最后只把<strong>一份总结<\/strong>返回主 Agent。\n3. 主 Agent 用总结继续做用户的原任务；子任务的中间过程<strong>不必塞进主会话<\/strong>。\n4. 启动子 Agent 被设计成<strong>一个工具<\/strong>：<strong>spawn_subagent<\/strong>。主 Agent 调用后，示例<strong>等待子 Agent 结束<\/strong>并接收结果。\n5. 课程还讨论了同时派出多个子 Agent、共享任务列表等更复杂的协作。", "### 隔离的是什么\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 把启动子 Agent 做成工具 | <strong>spawn_subagent<\/strong> |\n| 子 Agent 解决什么问题 | 主会话上下文太长（<strong>上下文隔离<\/strong>） |\n| 主 Agent 最后拿到什么 | 子 Agent 的<strong>总结<\/strong> |\n\n- <strong>上下文隔离 = 历史内容分开<\/strong>；能不能改文件取决于<strong>它能调用哪些工具、运行环境给什么权限<\/strong>（有通用 bash 时，名字或「只读」描述不能证明它不能写）。\n\n> 📌 必背陷阱：「子 Agent 用独立上下文，所以不能修改文件」——<strong>错<\/strong>，隔离的是历史，不是权限。"]}], "questions": [{"id": "ahs-p1", "type": "single", "stem": "edit 工具找不到要替换的内容时，Error Recovery 的做法是？", "options": ["在错误信息后附一条建议，如先重新读取文件", "系统自动替模型改好文件", "直接结束会话", "把错误信息丢掉"], "answer": [0], "why": ["对", "系统不替模型改文件", "没有这个设计", "错误信息要保留并附加建议"], "explain": "错误信息 + 建议。", "tags": [], "lesson": 0, "m": "ah_safe"}, {"id": "ahs-p2", "type": "single", "stem": "System Reminders 的干预提醒追加到上下文最末尾时，用的是什么角色？", "options": ["RoleUser", "RoleSystem", "RoleAssistant", "RoleTool"], "answer": [0], "why": ["对", "名字叫 System 但角色不是", "不是模型说的话", "不是工具结果"], "explain": "提醒 = RoleUser（⚠️ 笔记没写，按真题推断）。", "tags": [], "lesson": 1, "m": "ah_safe"}, {"id": "ahs-p3", "type": "single", "stem": "Middleware 做人工审批时，等待审批结果靠的是？", "options": ["Go 的 channel 阻塞等待", "引擎报错退出", "继续生成内容", "启动子智能体"], "answer": [0], "why": ["对", "不是报错", "不是先继续", "不是绕过"], "explain": "审批 = channel 阻塞等待。", "tags": [], "lesson": 2, "m": "ah_safe"}, {"id": "ahs-p4", "type": "single", "stem": "判断：子 Agent 使用独立的对话历史，因此一定没有修改文件的能力", "options": ["正确", "错误"], "answer": [1], "why": ["不对：「一定没有」太绝对", "隔离的是历史；能否改文件看工具和权限"], "explain": "上下文隔离 ≠ 权限隔离。", "tags": [], "lesson": 3, "m": "ah_safe"}, {"id": "ahs-1", "type": "multi", "stem": "关于第 14 讲 Error Recovery，说法正确的有", "options": ["工具出错后，系统根据工具和错误类型附加一条建议", "edit 匹配失败时，建议先重新读取文件确认旧文本和缩进", "模型收到的是错误信息加建议", "系统会直接替模型修改文件", "RecoveryManager 课内用字符串匹配判断错误类别"], "answer": [0, 1, 2, 4], "why": ["对", "对", "对", "错，只给建议，不替它改", "对，缺点是报错改几个字就可能识别不到"], "explain": "Error Recovery = 错误信息 + 建议。", "tags": ["basic", "core"], "m": "ah_safe"}, {"id": "ahs-2", "type": "single", "stem": "RecoveryManager 判断错误类别的方式，及课程建议的更稳妥做法是？", "options": ["字符串匹配；建议改用明确的错误类型或错误码", "错误码；建议改用字符串匹配", "随机选择；建议人工判断", "调用 Benchmark；建议改用 Trace"], "answer": [0], "why": ["对", "反了", "没有这种设计", "那是评测与追踪，不是错误分类"], "explain": "字符串匹配 → 更稳的是错误类型/错误码。", "tags": ["basic", "core"], "m": "ah_safe"}, {"id": "ahs-3", "type": "single", "stem": "System Reminders 探测到死循环后，把干预指令作为什么角色的消息追加到上下文最末尾？", "options": ["RoleSystem", "RoleAssistant", "RoleUser", "RoleTool"], "answer": [2], "why": ["听起来像但不是", "不是模型自己说的话", "对，RoleUser", "不是工具结果"], "explain": "提醒追加到最末尾，角色判 RoleUser（⚠️ 笔记没写，按真题推断）。", "tags": ["basic"], "m": "ah_safe"}, {"id": "ahs-4", "type": "multi", "stem": "关于 System Reminders / ReminderInjector，说法正确的有", "options": ["按工具名和参数生成指纹来判断重复", "连续多次相同调用并失败，才认定为 Doom Loop", "提醒在下一次请求模型之前加入", "提醒是强制限制，模型一定会遵守", "参数写法略有不同但指向同一处时，精确指纹可能漏掉"], "answer": [0, 1, 2, 4], "why": ["对", "对", "对", "错，只是引导，强制要靠程序控制", "对，指纹要求参数完全一致"], "explain": "指纹 = 工具名 + 参数；提醒只是引导。", "tags": ["basic", "core"], "m": "ah_safe"}, {"id": "ahs-5", "type": "single", "stem": "通过 Middleware 实现高危命令人工审批时，等待审批期间引擎核心处于什么状态？", "options": ["引擎直接报错结束会话", "Middleware 层通过 channel 阻塞等待人工审批", "引擎不阻塞，先继续生成内容", "启动子智能体绕过安全拦截"], "answer": [1], "why": ["不是报错结束", "对", "不是先继续", "不是绕过"], "explain": "审批 = channel 阻塞等待，同意才执行。", "tags": ["basic"], "m": "ah_safe"}, {"id": "ahs-6", "type": "multi", "stem": "关于第 16 讲 Middleware，说法正确的有", "options": ["检查放在工具真正执行之前", "三种决策是 allow、ask、deny", "人工审批同意后才继续执行，拒绝则把结果告知 Agent", "课程示例已经实现了完整沙箱", "用规则识别危险命令，简单关键字不能识别所有危险情况"], "answer": [0, 1, 2, 4], "why": ["对", "对，允许/询问/拒绝", "对", "错，明确说没有实现完整沙箱", "对"], "explain": "Middleware：执行前检查，allow/ask/deny。", "tags": ["basic", "core"], "m": "ah_safe"}, {"id": "ahs-7", "type": "single", "stem": "课程中把启动子 Agent 设计成什么？", "options": ["一个工具，如 spawn_subagent", "一个独立进程，不经过主循环", "一个 Middleware", "一个 Benchmark 用例"], "answer": [0], "why": ["对", "它是主 Agent 调用的工具", "Middleware 管执行前检查", "那是评测"], "explain": "spawn_subagent 是工具。", "tags": ["basic"], "m": "ah_safe"}, {"id": "ahs-8", "type": "multi", "stem": "关于第 17 讲 Subagent，说法正确的有", "options": ["子 Agent 有自己的任务和对话历史", "子 Agent 最后把一份总结返回主 Agent", "子任务的中间过程不必全部塞进主会话", "上下文隔离意味着子 Agent 一定不能修改文件", "能否修改文件取决于它能调用的工具和运行权限"], "answer": [0, 1, 2, 4], "why": ["对", "对", "对", "错，隔离的是历史，不是权限", "对，有通用 bash 时「只读」描述也不能证明"], "explain": "隔离的是上下文，权限看工具。", "tags": ["basic", "core"], "m": "ah_safe"}]}, {"id": "ah_eval", "title": "评估：Cost Tracker、Tracing、Benchmark", "short": "成本·追踪·评测", "group": "Agent Harness · 第五章", "exam": "第 18—20 讲：CostTracker 包装 Provider、Trace/Span 树、Benchmark 用 ValidateScript 验证物理世界", "refs": [], "lessons": [{"title": "第 18 讲 · Cost Tracker 成本统计", "cards": ["### 一句话：给模型调用记账\n\nAgent 修一个错误可能调用模型十几二十次，每次都有<strong>输入和输出 Token<\/strong>（模型读写文字的计量单位）消耗。\n\n订单项目例子，顺序走一遍：\n1. <strong>Provider<\/strong> 从模型响应里取回 <strong>Usage<\/strong>（本次调用的用量信息）。\n2. 用一个 <strong>CostTracker<\/strong> 把真实 Provider <strong>包起来<\/strong>。\n3. 对主循环来说，它<strong>仍像 Provider<\/strong>，照样提供模型调用；但每次调用<strong>前后<\/strong>会记录<strong>用量和耗时<\/strong>。\n4. 会话把多次调用<strong>累计<\/strong>起来。\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 包住真实 Provider、记录每次调用用量和耗时 | <strong>CostTracker<\/strong> |\n| 本次调用的用量信息 | <strong>Usage<\/strong> |\n| 哪次调用耗时长？会话共用多少输入/输出 Token？ | Cost Tracker 能回答 |", "### 局限与易混\n\n- 要<strong>估算费用<\/strong>，还得知道对应模型的<strong>价格和实际计费规则<\/strong>，Token 数本身不等于钱。\n- 统计的是<strong>模型调用过程<\/strong>；Agent 在本地跑五分钟测试，Provider 计时器<strong>不一定看得到<\/strong>，要在<strong>工具执行处<\/strong>另外记录。\n- 总账不足以解释每一步 → 所以有第 19 讲的 Trace。\n\n| 易混的一对 | Cost Tracker（第 18 讲） | Tracing（第 19 讲） |\n|---|---|---|\n| 像什么 | <strong>总账<\/strong>：总共用了多少 | <strong>流水<\/strong>：每一步在哪、多久 |\n| 记录 | Token 用量、耗时 | Span 树：谁属于哪一轮、何时开始、耗时 |\n\n> 📌 必背陷阱：CostTracker 是<strong>包装（装饰）Provider<\/strong>，对主循环透明；它不等于追踪每一步。"]}, {"title": "第 19 讲 · Tracing 追踪", "cards": ["### 一句话：把一次任务画成一棵时间树\n\n订单修复跑了十分钟却失败。只知道总时间和 Token，判断不了是在<strong>反复读错文件<\/strong>，还是<strong>测试命令很慢<\/strong>。\n\n<strong>Trace（追踪）<\/strong> = 记录一次任务经过的<strong>步骤和时间<\/strong>。<strong>Span<\/strong> = 树上的一个节点。\n\n| 层级 | 对应 |\n|---|---|\n| 根节点 | <strong>一次完整运行<\/strong> |\n| 下一层 | 每个 <strong>Turn<\/strong>（一轮） |\n| 更细 | <strong>模型调用<\/strong>、<strong>工具执行<\/strong> |\n\n例子：第 1 轮并行读两个文件，第 2 轮修改代码，第 3 轮跑测试。测试占了大部分时间 → 就去查测试步骤。两个读取 Span 时间<strong>重叠<\/strong> → 说明它们同时运行过。", "### 实现方式与对号入座\n\n- 课程用 Go 的 <strong>context<\/strong> 传递<strong>当前 Span<\/strong>，数据写成 <strong>JSON<\/strong>。\n- 追踪能看到什么，取决于<strong>系统记录了什么<\/strong>：记了工具参数就能查参数；没记完整模型输入，就还原不了完整输入。\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 树的节点，记录开始时间和耗时 | <strong>Span<\/strong> |\n| 一次运行 → Turn → 模型调用/工具执行 | Trace 的树形结构 |\n| 定位「到底哪一步出了问题」 | <strong>Tracing<\/strong> |\n| 只想知道总共多少 Token | Cost Tracker |\n\n> 📌 必背陷阱：Trace 的根是<strong>一次完整运行<\/strong>，每个 <strong>Turn<\/strong> 是下一层，模型调用和工具执行更细。Cost Tracker 回答「用了多少」，Tracing 回答「卡在哪」。"]}, {"title": "第 20 讲 · Benchmark 基准评测", "cards": ["### 一句话：用验证脚本检查「物理世界真的变了没」\n\n改了上下文压缩策略，想知道有没有退步，不能只靠「回答看着顺眼」。课程建一个小型 <strong>Benchmark（基准评测）<\/strong>。\n\n每个测试用例的顺序：\n1. <strong>SetupScript<\/strong>：准备一个<strong>已知状态<\/strong>的工作区（例如放一个有错误的文件）。\n2. 给 Agent 一个任务（修复它）。\n3. <strong>ValidateScript<\/strong>：运行验证脚本，检查文件内容或运行测试。\n\n> 📌 必背陷阱（真题）：判断 Agent 是否真正完成任务的核心依据是 <strong>ValidateScript 验证物理世界（文件、测试结果）是否被正确改变<\/strong>。<strong>不是<\/strong>看回复里说「任务已完成」，<strong>不是<\/strong>数 Token，<strong>不是<\/strong>看 TODO.md 是否打勾。Agent 说「修好了」只是报告。", "### 结果评估 vs 轨迹评估\n\n| 层面 | 关心什么 | 例子 |\n|---|---|---|\n| <strong>结果评估<\/strong> | 任务<strong>是否达标<\/strong> | 测试通过了没有 |\n| <strong>轨迹评估<\/strong> | <strong>中间做了什么<\/strong> | 一个版本调用三次工具，另一个重试二十次 |\n\n- 两个版本最终都修好，<strong>结果相同<\/strong>，但耗时、消耗可能不同。可以一起记录<strong>成功率、耗时、Token、错误重试<\/strong>。\n- 模型输出有波动：比较方案要用<strong>相同任务、模型和环境<\/strong>，<strong>多次运行<\/strong>再看。\n- 还要求原有功能不坏，就要加<strong>回归检查<\/strong>。\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 准备已知状态的工作区 | SetupScript |\n| 检查文件内容或运行测试 | ValidateScript |\n| 看成功率、耗时、Token、重试 | 结果 + 轨迹一起评 |"]}], "questions": [{"id": "ahe-p1", "type": "single", "stem": "CostTracker 是怎样接入主循环的？", "options": ["把真实 Provider 包起来，对主循环仍像 Provider", "替换掉 Provider", "放在 Tool Registry 里", "写进 PLAN.md"], "answer": [0], "why": ["对", "不是替换，是包装", "它统计的是模型调用", "与文件计划无关"], "explain": "包装 Provider，记录用量和耗时。", "tags": [], "lesson": 0, "m": "ah_eval"}, {"id": "ahe-p2", "type": "single", "stem": "Trace 里一次完整运行是树的什么节点？", "options": ["根节点", "最细的叶子节点", "一个 Turn", "一个 Token"], "answer": [0], "why": ["对，Turn 是下一层", "叶子是模型调用/工具执行", "Turn 在根的下一层", "Token 不是节点"], "explain": "根 = 一次运行，下一层 = Turn。", "tags": [], "lesson": 1, "m": "ah_eval"}, {"id": "ahe-p3", "type": "single", "stem": "Benchmark 判断任务是否真正完成，靠的是？", "options": ["ValidateScript 验证物理世界是否被正确改变", "回复里写着「任务已完成」", "总 Token 数", "TODO.md 全部打勾"], "answer": [0], "why": ["对", "那只是报告", "不是依据", "不是依据"], "explain": "ValidateScript 验证。", "tags": [], "lesson": 2, "m": "ah_eval"}, {"id": "ahe-1", "type": "multi", "stem": "关于第 18 讲 Cost Tracker，说法正确的有", "options": ["Provider 从模型响应中取回 Usage 用量信息", "用 CostTracker 把真实 Provider 包起来", "每次调用前后会记录用量和耗时", "知道 Token 数就等于知道费用，不需要价格", "会话可以把多次调用累计起来"], "answer": [0, 1, 2, 4], "why": ["对", "对", "对", "错，估算费用还要知道模型价格和计费规则", "对"], "explain": "CostTracker 包装 Provider，记用量和耗时。", "tags": ["basic", "core"], "m": "ah_eval"}, {"id": "ahe-2", "type": "single", "stem": "Agent 在本地运行测试命令花了五分钟，仅靠 Provider 包装的计时器为什么不一定看得到？", "options": ["它统计的是模型调用过程，工具执行要另外记录", "因为 Usage 里不含时间", "因为 CostTracker 只能统计 Trace", "因为测试命令不消耗时间"], "answer": [0], "why": ["对", "错：原因不在 Usage 字段，而在计时范围只包住模型调用，本地测试耗时要在工具执行处记录", "反了，是 Trace 解决逐步记录", "错"], "explain": "模型调用 ≠ 工具执行。", "tags": ["basic"], "m": "ah_eval"}, {"id": "ahe-3", "type": "multi", "stem": "关于第 19 讲 Tracing，说法正确的有", "options": ["一次完整运行是根节点", "每个 Turn 是下一层节点", "模型调用和工具执行是更细的节点", "这些节点称为 Span，合起来形成树", "追踪能看到的内容与系统记录了什么无关"], "answer": [0, 1, 2, 3], "why": ["对", "对", "对", "对", "错，没记录的内容就看不到，如没记完整模型输入就无法还原"], "explain": "Trace 树：运行 → Turn → 模型调用/工具执行，节点叫 Span。", "tags": ["basic", "core"], "m": "ah_eval"}, {"id": "ahe-4", "type": "single", "stem": "要判断一次十分钟的失败任务，是在反复读错文件，还是测试命令很慢，应该用？", "options": ["Tracing（Span 时间树）", "Cost Tracker 的总 Token 数", "ValidateScript", "System Reminders"], "answer": [0], "why": ["对：用 Span 定位慢步骤；若记录了工具参数，还能看出是否反复读错路径", "总账不足以解释每一步", "它是检验结果的", "它是防死循环提醒"], "explain": "看每一步的耗时 → Trace。", "tags": ["basic", "core"], "m": "ah_eval"}, {"id": "ahe-5", "type": "single", "stem": "在自动化 Benchmark 跑分框架中，判断 Agent 是否真正完成任务的核心依据是？", "options": ["检查最终回复是否包含「任务已完成」", "通过 ValidateScript 验证物理世界是否被正确改变且符合预期", "计算总 Token 数", "检查 TODO.md 是否全部打勾"], "answer": [1], "why": ["那只是 Agent 的报告", "对", "Token 与是否完成无关", "文件打勾也只是自述"], "explain": "验证物理世界（文件、测试结果）。", "tags": ["basic"], "m": "ah_eval"}, {"id": "ahe-6", "type": "multi", "stem": "关于第 20 讲 Benchmark，说法正确的有", "options": ["用 SetupScript 准备已知状态的工作区", "用 ValidateScript 检查文件内容或运行测试", "结果评估看任务是否达标，轨迹评估看中间做了什么", "比较方案时应尽量用相同任务、模型和环境，多次运行", "只问一次「帮我修代码」，回答顺眼就足以判断没有退步"], "answer": [0, 1, 2, 3], "why": ["对", "对", "对", "对，模型输出有波动", "错，这正是需要 Benchmark 的原因"], "explain": "Setup 准备 → Agent 执行 → Validate 验证。", "tags": ["basic", "core"], "m": "ah_eval"}]}, {"id": "ah_app", "title": "组装实战：CLI、飞书 AgentOps、22 讲串讲", "short": "实战·串讲", "group": "Agent Harness · 第六章", "exam": "第 21—22 讲：CLI 组装、飞书入口 + 审批 + Reporter；全课零件怎样连成一次任务", "refs": [], "lessons": [{"title": "第 21 讲 · CLI 实战", "cards": ["### 一句话：把前面的零件装进一个命令行程序\n\n<strong>CLI<\/strong> = 命令行程序。入口按顺序做：读取配置 → 创建 <strong>Provider<\/strong>、工具 <strong>Registry<\/strong>、上下文处理器、<strong>Reporter<\/strong>（把运行状态汇报给用户的组件）、<strong>Tracker<\/strong> → 启动<strong>主循环<\/strong>。\n\n课程准备了一个<strong>带并发计数问题的 Go 项目<\/strong>，让 Agent 自己探索。讲师展示的流程：\n1. 先<strong>制订计划<\/strong>；\n2. 查看相关文件；\n3. 分析可能的修复方式；\n4. 修改代码并验证；\n5. 最后生成说明。", "### 本讲和前面怎么对应\n\n| 环节 | 用到的零件 |\n|---|---|\n| 记录计划 | <strong>PLAN / TODO<\/strong> |\n| 查看代码 | <strong>read<\/strong>（read_file） |\n| 修改代码 | <strong>edit<\/strong> 或 <strong>write<\/strong> |\n| 运行测试 | <strong>bash<\/strong> |\n| 记录模型消耗 | <strong>Tracker<\/strong> |\n\n- 最终是否修好，要看<strong>实际代码和测试结果<\/strong>。\n- 不同模型可能产生不同计划，任务也可能失败。\n\n> 📌 必背陷阱：第 21 讲的入口是 <strong>CLI<\/strong>；第 22 讲用<strong>飞书<\/strong>后台服务演示 AgentOps（飞书接入在第 09 讲就有了）。"]}, {"title": "第 22 讲 · 飞书 AgentOps", "cards": ["### 一句话：团队在飞书群里触发排障，危险操作走审批\n\n入口换成<strong>飞书后台服务<\/strong>。顺序走一遍（Nginx 异常）：\n1. 用户在群里说 <strong>Nginx 服务异常<\/strong> → 服务收到消息，<strong>启动 Agent<\/strong>。\n2. Agent 读工作区里的<strong>规则<\/strong>和<strong>运维 Skill<\/strong>，再看<strong>错误日志<\/strong>和<strong>配置<\/strong>。\n3. 示例提前准备了一份有问题的 <strong>nginx.conf<\/strong> 和较长的 <strong>error.log<\/strong>。\n4. Agent 提出修改配置 → 系统先<strong>发起审批<\/strong> → <strong>人工批准后<\/strong>才执行修改。\n5. Agent 若提出 <strong>reload<\/strong>，同样要经过<strong>规则检查和审批<\/strong>。\n6. 最后 <strong>Reporter<\/strong> 把结果和统计信息发回飞书。", "### 审批与多用户\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 高危命令人工审批，等待期间 | <strong>Middleware 层通过 channel 阻塞等待<\/strong>，同意才执行 |\n| 把结果和统计发回飞书 | <strong>Reporter<\/strong> |\n| 多用户并发，防止 A 的审批跑到 B 的对话里 | 每个请求用<strong>与自己会话对应的 Reporter<\/strong> |\n\n- 做法：为每个请求<strong>创建相应的引擎<\/strong>，并把 <strong>Reporter 随上下文传给中间件<\/strong>。\n- 这是一套<strong>模拟排障演示<\/strong>；要能说清：消息从哪进来、Agent 怎样获得资料、操作在哪被拦截、结果怎样回到用户。\n\n> 📌 必背陷阱：审批 = Middleware <strong>channel 阻塞等待<\/strong>，不是报错结束、不是先继续生成、不是启动子智能体绕过。"]}, {"title": "把 22 讲连成一次完整任务", "cards": ["### 一句话：「修复订单计算错误」从头到尾\n\n按顺序走一遍：\n1. 从<strong>终端或飞书<\/strong>提交任务，入口找到对应 <strong>Session<\/strong>（会话）。\n2. <strong>Prompt Composer<\/strong> 加入项目规则；<strong>Compactor<\/strong> 控制历史长度。\n3. <strong>Main Loop<\/strong> 通过 <strong>Provider<\/strong> 把请求发给模型。\n4. 模型提出 <strong>read_file<\/strong> → <strong>Registry<\/strong> 找到工具 → <strong>Middleware<\/strong> 检查后执行 → 结果返回模型。\n5. 编辑失败 → <strong>Recovery<\/strong>（Error Recovery）给建议。\n6. 反复执行相同失败操作 → <strong>Reminder<\/strong>（System Reminders）发提醒。\n7. 要执行需审批的操作 → <strong>Middleware 先暂停等人<\/strong>。\n8. 长任务：计划和待办写进文件（PLAN/TODO）；独立探索交给<strong>子 Agent<\/strong>。\n9. 运行期间 <strong>Tracker<\/strong> 统计用量，<strong>Trace<\/strong> 记录过程。\n10. 最后运行任务要求的<strong>验证<\/strong>；想比较新旧版本，用 <strong>Benchmark<\/strong> 在同一组任务上重复评估。", "### 对号入座：谁负责什么\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 按会话标识找到对应会话 | SessionManager |\n| 加入项目规则 | Prompt Composer |\n| 控制历史长度 | Compactor |\n| 把请求发给模型 | Provider |\n| 按工具名找到并分发工具 | Registry |\n| 执行前检查、审批 | Middleware |\n| 编辑失败给建议 | Error Recovery |\n| 重复失败给提醒 | System Reminders |\n| 独立探索、返回总结 | Subagent（spawn_subagent） |\n| 用量与耗时 | Cost Tracker |\n| 每一步时间树 | Tracing |\n| 比较版本、验证文件和测试 | Benchmark（ValidateScript） |\n\n<strong>易混的对：<\/strong> Provider（适配模型接口格式）vs Registry（按工具名管理分发工具）；一次错误建议（Recovery）vs 重复提醒（Reminders）；上下文隔离（Subagent）≠ 权限隔离。\n\n> 💡 核对「Agent 说修好了」：看<strong>实际改动与验收测试<\/strong>；必要时再看 Trace、耗时、成本、重试。"]}], "questions": [{"id": "aha-p1", "type": "single", "stem": "第 21 讲的入口形式是？", "options": ["CLI 命令行程序", "飞书后台服务", "Web 网页", "Benchmark 脚本"], "answer": [0], "why": ["对", "那是第 22 讲", "课程没这样讲", "那是评测"], "explain": "第 21 讲 CLI，第 22 讲飞书。", "tags": [], "lesson": 0, "m": "ah_app"}, {"id": "aha-p2", "type": "single", "stem": "第 22 讲里，Agent 提出修改 nginx.conf 后，系统先做什么？", "options": ["发起人工审批，批准后才执行", "直接修改", "启动子 Agent 绕过", "报错结束"], "answer": [0], "why": ["对", "要先审批", "不是绕过", "不是报错"], "explain": "先审批，同意才执行。", "tags": [], "lesson": 1, "m": "ah_app"}, {"id": "aha-p3", "type": "single", "stem": "全课串讲中，要执行需要审批的操作时，Middleware 怎么做？", "options": ["先暂停等人的决定", "先执行再补审批", "交给 Tracker", "交给 Benchmark"], "answer": [0], "why": ["对", "顺序反了", "Tracker 只统计用量", "Benchmark 是评测"], "explain": "审批 = 先暂停。", "tags": [], "lesson": 2, "m": "ah_app"}, {"id": "aha-1", "type": "multi", "stem": "关于第 21 讲 CLI 实战，说法正确的有", "options": ["入口读取配置，创建 Provider、Registry、上下文处理器、Reporter 和 Tracker，再启动主循环", "课程用一个带并发计数问题的 Go 项目让 Agent 自己探索", "流程是先制订计划、查看文件、分析修复方式、修改并验证、生成说明", "只要 Agent 说修好了，就不用再看代码和测试", "PLAN/TODO 记录计划，read 查看代码，可用 edit 或 write 修改，可用 bash 运行测试"], "answer": [0, 1, 2, 4], "why": ["对", "对", "对", "错，要看实际代码和测试结果", "对"], "explain": "CLI = 把各零件装起来。", "tags": ["basic", "core"], "m": "ah_app"}, {"id": "aha-2", "type": "single", "stem": "第 21 讲里，Tracker 在整个流程中负责什么？", "options": ["记录模型消耗", "运行测试", "修改代码", "制订计划"], "answer": [0], "why": ["对", "那是 bash", "那是 edit/write", "计划由 Agent 制订，PLAN.md 保存方案、TODO.md 记录进度"], "explain": "Tracker 记模型消耗。", "tags": ["basic"], "m": "ah_app"}, {"id": "aha-3", "type": "multi", "stem": "关于第 22 讲飞书 AgentOps，说法正确的有", "options": ["用户在群里说 Nginx 服务异常，服务收到消息后启动 Agent", "Agent 读取工作区里的规则和运维 Skill，再看错误日志和配置", "修改 nginx.conf 和 reload 都要经过规则检查和审批", "最后由 Reporter 把结果和统计信息发回飞书", "审批期间引擎报错结束会话"], "answer": [0, 1, 2, 3], "why": ["对", "对", "对", "对", "错，是 Middleware 层通过 channel 阻塞等待"], "explain": "飞书进、审批拦、Reporter 回。", "tags": ["basic", "core"], "m": "ah_app"}, {"id": "aha-4", "type": "single", "stem": "第 22 讲中，为了避免 A 发起的审批跑到 B 的对话里，课程的做法是？", "options": ["为每个请求创建对应的引擎，并把 Reporter 随上下文传给中间件", "所有用户共用同一个 Reporter", "禁止多用户同时使用", "让大模型自己区分用户"], "answer": [0], "why": ["对", "不是课程的做法：课程要求每个请求关联自己会话的 Reporter", "课程没这样做", "不靠模型"], "explain": "每个请求用自己的 Reporter。", "tags": ["basic", "core"], "m": "ah_app"}, {"id": "aha-5", "type": "multi", "stem": "在「修复订单计算错误」的完整任务中，以下对应关系正确的有", "options": ["编辑失败时，Error Recovery 给出建议", "反复执行相同失败操作时，System Reminders 发出提醒", "需要审批的操作，Middleware 先暂停等待人的决定", "运行期间 Tracker 统计用量，Trace 记录过程", "想比较新旧版本，用 Benchmark 在同一组任务上重复评估"], "answer": [0, 1, 2, 3, 4], "why": ["对", "对", "对", "对", "对"], "explain": "恢复、提醒、审批、统计、评测各管一段。", "tags": ["basic", "core"], "m": "ah_app"}, {"id": "aha-6", "type": "single", "stem": "模型提出 read_file 之后，真正按名字找到工具并分发的是？", "options": ["Registry", "Provider", "Compactor", "Benchmark"], "answer": [0], "why": ["对，Middleware 检查后执行", "Provider 适配模型接口格式", "Compactor 控制历史长度", "Benchmark 是评测"], "explain": "Registry 管工具，Provider 管模型。", "tags": ["basic"], "m": "ah_app"}]}, {"id": "ah_quiz", "title": "结课测试真题（10 题）", "short": "真题·Harness", "group": "Agent Harness · 结课测试", "exam": "结课测试原题", "quiz": true, "refs": [], "lessons": [{"title": "怎么用这 10 道真题", "cards": ["### 这是什么\n\n这 10 道题是《从 0 开始构建 Agent Harness》<strong>结课测试的原题<\/strong>（你截图、我转成文字）。\n\n- <strong>8 道单选 + 2 道多选<\/strong>（第 2、7 题）。\n- 截图里<strong>没有答案<\/strong>。网站上的答案是我按 GPT 笔记和题目本身判断的，每个选项都写了理由。本地没有原课，第 5 题笔记没讲，靠推理判的，标了 <strong>⚠️ 有争议<\/strong>。\n\n### 怎么刷\n\n去「刷题」，模块选「真题·Harness」，先做一遍；错的看解析，再回对应章节看讲解。\n\n> 📌 这门课真题的套路：考<strong>课程自己的设计细节<\/strong>（Thinking 阶段工具列表传空、退出条件是 ToolCalls 为空、提醒用哪个角色、并发怎么保证顺序、长日志截首尾各 500 字）。错误选项往往是「听起来也行的另一种做法」，比如加全局锁、退回串行、直接丢弃、让模型自己说完成了。"]}], "questions": [{"id": "ahq-1", "type": "single", "stem": "在本专栏中，我们将 Agent Harness（驾驭工程）比作计算机体系结构中的哪一层？", "options": ["应用程序 (Application)", "操作系统 (OS)", "内存 (RAM)", "中央处理器 (CPU)"], "answer": [1], "why": ["错：应用程序是跑在 Harness 之上的具体任务", "对：Harness 像操作系统，管理模型、工具、上下文、权限和执行过程", "错：常见类比里「内存」对应的是上下文窗口", "错：常见类比里「CPU」对应的是大模型本身"], "explain": "开篇词和结束语用<strong>操作系统<\/strong>做类比：模型负责「想」，Harness 像操作系统一样负责调度、调用工具、管理上下文和权限。（「模型像 CPU、上下文像内存」是业内常见说法，笔记没写，供排除选项用。）", "tags": ["basic", "core", "真题"], "m": "ah_quiz"}, {"id": "ahq-2", "type": "multi", "stem": "在第 03 讲中，为了防止大模型产生“行动冲动（Impulsive Action）”，我们在 Main Loop 中剥离了独立的 Thinking（慢思考）阶段。以下关于该机制的说法，正确的有哪些？", "options": ["在 Thinking 阶段，Harness 向大模型发起请求时，传入的可用工具列表（Available Tools）为 nil 或空数组。", "大模型在 Thinking 阶段依然可以调用 read_file 工具去读取文件。", "Thinking 阶段产出的纯文本“思考痕迹”，会被追加到上下文中，供 Action 阶段使用。", "通过增加 EnableThinking 开关，在简单的任务中关闭它以节省 Token。"], "answer": [0, 2, 3], "why": ["对：Thinking 阶段的请求<strong>不附带工具<\/strong>", "错：没给工具列表，模型就不能调用任何工具，只能用文字分析", "对：第二阶段（Acting）把这段分析加进上下文，再带上工具请求模型", "对：开着它每轮多一次模型请求，简单任务（如列目录）可以关掉省时间和 Token"], "explain": "两阶段：<strong>先不给工具做规划（Thinking），再带工具做行动（Acting）<\/strong>；思考文字进上下文；<strong>EnableThinking<\/strong> 开关控制要不要做第一阶段。", "tags": ["basic", "core", "真题"], "m": "ah_quiz"}, {"id": "ahq-3", "type": "single", "stem": "在原生的 ReAct 循环（Main Loop）中，触发引擎退出循环、宣告当前任务结束的标志是什么？", "options": ["大模型回复的纯文本内容超过了设定的最大长度。", "大模型返回的消息中，ToolCalls 数组为空（长度为 0）。", "引擎内部设置的 Turn 轮次达到了最大上限（如 10 轮）。", "底层工具执行报错（IsError == true）。"], "answer": [1], "why": ["错：回复长短和是否结束无关", "对：模型不再请求任何工具，说明它给出的是最终回答，循环结束", "错：轮次上限是防止跑飞的<strong>保护措施<\/strong>，触发了是被强行停下，不是任务正常完成", "错：工具报错会作为 ToolResult 交回模型，让它决定下一步，循环继续"], "explain": "主循环：问模型 → 有 ToolCall 就执行、把 ToolResult 交回 → 再问模型……<strong>直到模型返回的 ToolCalls 为空<\/strong>（即给出最终回答）。", "tags": ["basic", "core", "真题"], "m": "ah_quiz"}, {"id": "ahq-4", "type": "single", "stem": "参考 OpenClaw 的极简设计哲学，以下哪一组基础工具构成了系统级 Coding Agent 完备的核心工具原语？", "options": ["git, npm, grep, docker", "read_file, write_file, edit_file, bash", "search_web, read_file, python_repl, bash", "MCP_server, read_file, edit_file, ask_human"], "answer": [1], "why": ["错：这些是具体命令，可以通过 bash 调用，不是基础工具", "对：读、写（创建或覆盖）、改（局部替换）、执行命令，四个就够", "错：多了联网搜索和 Python 解释器，少了写和改", "错：MCP、问人不在四个基础工具里"], "explain": "第 06 讲：<strong>read / write / edit / bash<\/strong> 四个基础工具。工具越多，每次请求带的工具说明越长、模型越难选；其余操作用 bash 组合系统命令完成。", "tags": ["basic", "core", "真题"], "m": "ah_quiz"}, {"id": "ahq-5", "type": "single", "stem": "在 System Reminders（防死循环机制）中，当探测到大模型陷入死循环时，我们将干预指令作为什么角色的消息追加到上下文最末尾？", "options": ["RoleSystem", "RoleAssistant", "RoleUser", "RoleTool"], "answer": [2], "why": ["不选：系统提示通常只放在最开头，很多模型接口不允许在对话中间再插系统消息", "错：助手角色代表模型自己说过的话，用它等于替模型「说话」", "选：以用户角色在末尾补一句提醒，会进入下一次模型请求（模型仍可能不听，提醒只是引导）", "错：工具角色的消息必须对应某次工具调用的结果"], "explain": "⚠️ 有争议：笔记只写了「在下一次模型请求前加入提醒」，没写角色；这里按排除法和业内做法（如 Claude Code 的 system-reminder 就放在用户消息里）判 <strong>RoleUser<\/strong>。", "tags": ["basic", "core", "真题"], "m": "ah_quiz"}, {"id": "ahq-6", "type": "single", "stem": "在第 08 讲中，大模型在一个 Turn 里同时吐出了 3 个 bash 命令的请求。在 Harness 底层使用 Goroutine 并发执行这些工具时，为了保证最终追加到上下文中的 ToolResult 顺序与模型请求的顺序完全一致，我们采用了哪种设计？", "options": ["使用 sync.Mutex 全局锁，谁先执行完谁先 append 到切片里。", "取消并发，强制退回串行执行。", "预先分配固定长度的切片（Slice），各个 Goroutine 根据传入的索引无锁并发写入。", "让大模型自己通过 JSON 参数里的 ID 来重组顺序。"], "answer": [2], "why": ["错：谁先完成谁先放，顺序就乱了", "错：放弃并发就没有提速了", "对：第 1 个调用的结果写第 1 格、第 2 个写第 2 格，每格只有一个人写，不用加锁，顺序天然对得上", "错：顺序由 Harness 保证，不交给模型"], "explain": "第 08 讲 <strong>Fork-Join<\/strong>：goroutine 同时跑、WaitGroup 等全部完成，结果放进<strong>预先分好位置的切片，按索引写入<\/strong>。", "tags": ["basic", "core", "真题"], "m": "ah_quiz"}, {"id": "ahq-7", "type": "multi", "stem": "在第 13 讲中，我们探讨了“状态外部化（Externalized State）”理念，引导 Agent 使用 PLAN.md 和 TODO.md。这种设计带来了哪些核心优势？", "options": ["极高的透明性：人类开发者可以随时在 IDE 中打开文件查看进度。", "零成本的人机协同：人类可以直接修改 Markdown 文件内容来纠正 Agent 的方向。", "提升模型推理速度：读取磁盘文件的速度比访问内存中的变量更快。", "跨会话的持久化：即使引擎进程重启，Agent 只要重新读取文件就能恢复任务进度。"], "answer": [0, 1, 3], "why": ["对：计划和待办写在工作区文件里，人随时能看", "对：用户可以打开文件改计划，Agent 再读取后按新计划继续", "错：读磁盘比读内存<strong>慢<\/strong>，而且这和推理速度无关", "对：历史只在内存里，重启就丢；写在文件里，重启后读 TODO.md 就能接着做"], "explain": "PLAN.md 存整体方案和约束，TODO.md 存具体事项和进度。好处：<strong>透明、人能直接改、重启能恢复<\/strong>。", "tags": ["basic", "core", "真题"], "m": "ah_quiz"}, {"id": "ahq-8", "type": "single", "stem": "在 go-tiny-claw 的 Context Compaction（上下文压缩）机制中，当大模型读取了一个超过 1 万字的超长错误日志，且该日志正好处于最近的 Working Memory 保护区内时，我们的引擎是如何处理这条消息的？", "options": ["直接丢弃这条消息，以防 OOM。", "采用全量掩码，将其替换为提示信息。", "采用掐头去尾局部截断，保留首尾各 500 字。", "保持原样不处理，因为 Working Memory 绝对不可侵犯。"], "answer": [2], "why": ["错：丢掉会让工具调用和结果对不上，模型也完全看不到日志", "错：整条换成占位提示，是对<strong>较久以前<\/strong>的工具结果的做法", "对：近期但太长的结果，留开头和结尾，中间截掉", "错：一条巨型日志就能撑爆上下文窗口，保护区内也要处理"], "explain": "压缩分两层：<strong>旧的工具结果 → 整条换成占位说明（全量掩码）；近期（Working Memory 内）但超长的 → 保留首尾各 500 字，截去中间<\/strong>。注意：选项里的「掐头去尾」字面是去掉两头，和后半句「保留首尾」矛盾，按后半句理解。", "tags": ["basic", "core", "真题"], "m": "ah_quiz"}, {"id": "ahq-9", "type": "single", "stem": "在第 16 讲和 22 讲中，通过 Middleware 实现高危命令人工审批时，大模型 API 连接和引擎核心处于什么状态？", "options": ["引擎直接报错结束会话。", "Middleware 层通过 channel 阻塞等待人工审批。", "引擎不阻塞，先继续生成内容。", "启动子智能体绕过安全拦截。"], "answer": [1], "why": ["错：危险命令是暂停等人决定，不是结束", "对：工具执行前被中间件拦下，用 Go 的 channel 等飞书里的审批结果，同意才执行", "错：审批没回来前这次工具调用一直在等；主循环要等工具结果回来，才会发起下一次模型请求", "错：课程示例是 Middleware 通过 channel 等人工决定，没有绕过审批这回事"], "explain": "第 16 讲：Registry 收到 ToolCall 先过 <strong>Middleware<\/strong>，可以 allow / ask / deny；ask 时把操作发到飞书，<strong>channel 阻塞等待<\/strong>审批结果。", "tags": ["basic", "core", "真题"], "m": "ah_quiz"}, {"id": "ahq-10", "type": "single", "stem": "在第 20 讲的自动化 Benchmark 跑分框架中，判断一个 Agent 是否真正完成任务的核心依据是什么？", "options": ["检查最终回复是否包含“任务已完成”。", "通过 ValidateScript 验证物理世界是否被正确改变且符合预期。", "计算总 Token 数。", "检查 TODO.md 是否全部打勾。"], "answer": [1], "why": ["错：Agent 说修好了只是报告", "对：验证脚本检查文件内容或运行测试，通过了才算完成", "错：Token 数是成本，不是是否完成", "错：打勾也是 Agent 自己写的，不能证明真的做了"], "explain": "每个用例：<strong>SetupScript 准备环境 → 给 Agent 任务 → ValidateScript 验证结果<\/strong>。评估看<strong>结果<\/strong>（达标没有）和<strong>轨迹<\/strong>（中间做了什么）。", "tags": ["basic", "core", "真题"], "m": "ah_quiz"}]}, {"id": "spring_must", "title": "必背清单：一页过完 Spring 考点", "short": "必背·Spring", "group": "Spring · 先看这一页", "exam": "全课考点浓缩", "quiz": true, "refs": [], "lessons": [{"title": "Spring 必背清单", "cards": ["### 怎么用这一页\n\nSpring 没有结课测试可以参考，这里挑的是<strong>最常考、最基础<\/strong>的点。平时<strong>主要看这一页<\/strong>，再刷「必刷」题。后面 20 个模块是详细讲解，做错了再去查。\n\n### 1. 基础（IoC、注解）\n\n- <strong>Framework 是地基<\/strong>（IoC、AOP），<strong>Boot 快速搭建<\/strong>（自动配置、起步依赖），<strong>Cloud 管分布式<\/strong>（注册发现、配置中心、熔断）。\n- <strong>IoC<\/strong> = 对象交给 Spring 创建和管理；<strong>DI<\/strong> = 需要别的对象时由 Spring 自动塞进来；<strong>Bean<\/strong> = 被 Spring 管理的对象。\n- 分层注解：<strong>@Controller<\/strong>（处理请求）→ <strong>@Service<\/strong>（业务）→ <strong>@Repository<\/strong>（数据访问），都是 <strong>@Component<\/strong> 的特殊版本；<strong>@Autowired<\/strong> 自动塞。\n- <strong>@SpringBootApplication = @Configuration + @EnableAutoConfiguration + @ComponentScan<\/strong>。\n\n### 2. 数据访问\n\n- 连接池：<strong>HikariCP 是 Boot 2 默认，主打快<\/strong>；<strong>Druid（阿里）主打监控<\/strong>：SQL 统计、慢 SQL、防 SQL 注入。\n- JdbcTemplate：update 增删改，query 查多条，queryForObject 查一个，batchUpdate 批量。\n- <strong>ORM = 对象 ↔ 数据库表<\/strong>；<strong>JPA 是规范，Hibernate 是实现，Spring Data JPA 提供 Repository<\/strong>；@Entity 实体，<strong>@Id 主键<\/strong>，@GeneratedValue 自动生成。\n- <strong>MyBatis 自己写 SQL<\/strong>（适合复杂查询），<strong>JPA 自动生成 SQL<\/strong>（适合简单增删改查）。\n\n### 3. 事务（必考）\n\n- 三个核心接口：<strong>PlatformTransactionManager 干活、TransactionDefinition 定规则、TransactionStatus 看状态<\/strong>。\n- 默认传播 <strong>REQUIRED<\/strong>（有就加入，没有就新建）；<strong>REQUIRES_NEW = 总是另开新事务<\/strong>。\n- 并发问题：读到没提交的 → <strong>脏读<\/strong>；同一行值变了 → <strong>不可重复读<\/strong>；行数变了 → <strong>幻读<\/strong>；<strong>SERIALIZABLE<\/strong> 全挡。\n- <strong>@Transactional 靠 AOP 代理<\/strong>：默认只有<strong>运行时异常（RuntimeException）回滚<\/strong>。<strong>不生效的三种情况<\/strong>：类里自己调自己、错误被 catch 吞掉、贴在非 public 方法上。\n\n### 4. NoSQL 与缓存\n\n- Redis 五种结构：<strong>String、List、Hash、Set、ZSet<\/strong>；Boot 2 默认客户端 <strong>Lettuce<\/strong>。哨兵 = 监控 + 自动切换；集群 = 分片。\n- 缓存注解：<strong>@EnableCaching 打开<\/strong>；<strong>@Cacheable 有缓存就不执行方法<\/strong>；@CachePut 总执行并更新；@CacheEvict 清除。\n\n### 5. 响应式与 AOP\n\n- Reactor：<strong>Mono = 0 或 1 个，Flux = 0 到多个<\/strong>；<strong>不订阅不执行<\/strong>；实现 Reactive Streams（Publisher、Subscriber、Subscription、Processor）。\n- <strong>AOP<\/strong> 处理<strong>横切逻辑<\/strong>（日志、耗时、事务）；<strong>切面 = 通知（做什么）+ 切点（在哪做）<\/strong>。\n- 通知：@Before 前，@AfterReturning 正常返回后，@AfterThrowing 出错后，<strong>@After 不管成功失败都执行<\/strong>，@Around 包住整个方法。\n\n### 6. Web\n\n- <strong>DispatcherServlet<\/strong> 是总入口；<strong>HandlerMapping 找方法<\/strong>，HandlerAdapter 调方法，ViewResolver 解析视图。\n- <strong>@PathVariable<\/strong> 取网址路径里的值（/coffee/{id}），<strong>@RequestParam<\/strong> 取问号后的参数，<strong>@RequestBody<\/strong> 把 JSON 转成对象。@RequestMapping 可按路径、方法、参数、请求头、Content-Type 等限定。\n- Thymeleaf = 服务端<strong>模板引擎<\/strong>，模板放 classpath:/templates/。\n- <strong>RestTemplate 同步阻塞，WebClient 非阻塞<\/strong>；定制 RestTemplate 要设连接池和超时。\n- REST：<strong>安全方法 GET、HEAD、OPTIONS<\/strong>；<strong>POST、PATCH 不幂等<\/strong>，其余（GET、PUT、DELETE 等）幂等。状态码 <strong>201 新建成功，401 没登录，403 没权限<\/strong>，4xx 客户端错，5xx 服务器错。\n- 分布式 Session：粘性会话、会话复制、集中存储（Spring Session + Redis）。\n\n### 7. Spring Boot\n\n- <strong>@EnableAutoConfiguration<\/strong> 开启自动配置；<strong>@ConditionalOnMissingBean<\/strong> = 容器里没有才生效，让用户可以覆盖默认配置；@AutoConfigureBefore / After / Order 控制先后顺序。\n- 起步依赖命名：<strong>官方 spring-boot-starter-xxx，第三方 xxx-spring-boot-starter<\/strong>。\n- 配置优先级：<strong>命令行最高<\/strong>；带 profile 的高于不带的；jar 外高于 jar 内。\n- <strong>Actuator<\/strong>：HTTP 默认只开放 <strong>health 和 info<\/strong>；健康状态 <strong>UP、DOWN、OUT_OF_SERVICE、UNKNOWN<\/strong>。\n\n### 8. Spring Cloud\n\n- 微服务的代价：网络调用、数据一致性、测试运维复杂；<strong>不是拆得越细越好<\/strong>。Spring Cloud 提供注册发现、负载均衡、配置、熔断、消息、链路追踪等能力。\n- 注册中心：<strong>Eureka 是 AP<\/strong>（优先可用性），<strong>ZooKeeper 是 CP<\/strong>（优先一致性），Consul，<strong>Nacos（阿里，发现 + 配置）<\/strong>。\n- <strong>Feign<\/strong>：只写接口加 <strong>@FeignClient<\/strong> 就能调远程服务；客户端负载均衡 Ribbon → Spring Cloud LoadBalancer。\n- <strong>断路器三种状态：关闭（正常调用）、打开（直接拒绝）、半开（放少量请求试探）<\/strong>；失败时返回备用结果叫<strong>降级（fallback）<\/strong>。Hystrix 两种隔离：<strong>线程池、信号量<\/strong>。\n- 限流对号入座：<strong>按失败率 → 断路器；同时几个 → Bulkhead；每段时间几次 → RateLimiter<\/strong>。\n- 配置中心定位一份配置：<strong>application（应用名）、profile（环境）、label（Git 分支）<\/strong>；能<strong>监听变化自动刷新<\/strong>的有 ZooKeeper、Consul、Nacos。\n- <strong>Spring Cloud Stream<\/strong> 统一收发消息；链路追踪 <strong>Sleuth 采集、Zipkin 展示<\/strong>，日志里自动带 <strong>TraceID 和 SpanID<\/strong>，可以通过 HTTP 或 RabbitMQ / Kafka 把数据发给 Zipkin。"]}], "questions": []}, {"id": "sp1", "title": "基础、数据源与事务", "short": "基础·数据源·事务", "group": "Spring · 第 1 章", "exam": "第 01—14 讲", "refs": [], "lessons": [{"title": "初识 Spring（第 01—04、13 讲）", "cards": ["### 一句话\n\n<strong>Spring 全家桶 = 一组帮你写 Java 后端程序的工具。<\/strong>三个最重要的成员一层叠一层：\n\n| 成员 | 一句话 | 看到题目说…… |\n|---|---|---|\n| <strong>Spring Framework<\/strong> | 地基：管理对象、AOP、事务、Web 等基础能力 | IoC、AOP、「核心」「基础」 |\n| <strong>Spring Boot<\/strong> | 让程序<strong>快速搭起来、直接跑起来<\/strong> | 自动配置、起步依赖、「快速」「开箱即用」 |\n| <strong>Spring Cloud<\/strong> | 解决<strong>很多个服务<\/strong>一起工作的问题 | 服务发现、配置中心、熔断、「分布式」「微服务」 |\n\n> 💡 <strong>怎么学这个站<\/strong>：每个模块只要求「认得出」。看到题目里的描述，能选出对应的名字就够了。\n\n> 📌 记法：<strong>Framework 是地基，Boot 是快速盖房，Cloud 是管一片小区。<\/strong>", "### 课程的贯穿案例：SpringBucks\n\n课程一直在做一个咖啡店程序，叫 <strong>SpringBucks<\/strong>（模仿星巴克 Starbucks）。题目里看到「咖啡」「订单」「Waiter（服务员）」「Barista（咖啡师）」，都是这个案例里的东西，不用管业务细节。\n\n### 技术趋势（第 03 讲，了解即可）\n\n- <strong>Spring 5<\/strong> 开始要求 <strong>Java 8<\/strong> 以上，支持 <strong>Kotlin<\/strong> 语言，加入了<strong>响应式编程<\/strong>（WebFlux，后面会讲）。\n- 选择依赖的开源组件时，要看它<strong>还有没有人维护<\/strong>。", "### 两个最基础的词\n\n| 词 | 一句话 |\n|---|---|\n| <strong>IoC（控制反转）<\/strong> | 对象不用你自己 new，<strong>交给 Spring 创建和管理<\/strong> |\n| <strong>DI（依赖注入）<\/strong> | 一个对象需要另一个对象时，<strong>Spring 自动塞给它<\/strong> |\n| <strong>Bean<\/strong> | <strong>被 Spring 管理的对象<\/strong>就叫 Bean |\n| <strong>容器 / 应用上下文<\/strong>（ApplicationContext） | 装所有 Bean 的地方 |\n\n> 📌 认准：<strong>IoC = 交给 Spring 管；DI = Spring 自动塞；Bean = 被管的对象。<\/strong>", "### 常用注解：对号入座\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 把一个类交给 Spring 管理（通用） | <strong>@Component<\/strong> |\n| 业务层的类 | <strong>@Service<\/strong> |\n| 数据访问层的类 | <strong>@Repository<\/strong> |\n| 处理网页请求的类 | <strong>@Controller<\/strong> |\n| 让 Spring 自动塞一个 Bean 进来 | <strong>@Autowired<\/strong> |\n| 这个类是「配置类」 | <strong>@Configuration<\/strong> |\n| 在配置类里，用方法造一个 Bean | <strong>@Bean<\/strong> |\n| 让 Spring 去扫描某些包，找出带注解的类 | <strong>@ComponentScan<\/strong> |\n\n- @Service、@Repository、@Controller 其实都是 <strong>@Component 的特殊版本<\/strong>，只是名字表明了它在哪一层。\n- <strong>@SpringBootApplication<\/strong> 一个顶三个：<strong>@Configuration + @EnableAutoConfiguration + @ComponentScan<\/strong>（第 13 讲，补充）。", "### 用网站生成工程（第 04 讲）\n\n1. 打开 <strong>Spring Initializr<\/strong>（网址 start.spring.io），勾选需要的功能，比如 <strong>Web<\/strong>、<strong>Actuator<\/strong>；\n2. 下载生成好的工程，写一个 Controller（处理请求的类）；\n3. 直接运行——Spring Boot <strong>自带网页服务器<\/strong>（默认 Tomcat），不需要另外装。\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 在线生成 Spring Boot 工程的网站 | <strong>Spring Initializr<\/strong> |\n| 查看程序是否健康的地址 | <strong>/actuator/health<\/strong>（需要 Actuator 依赖） |\n| 统一管理一堆依赖的版本 | <strong>父 POM<\/strong>（spring-boot-starter-parent）或 <strong>BOM<\/strong> |\n| 把程序打成能直接 `java -jar` 运行的包 | <strong>spring-boot-maven-plugin<\/strong> 插件 |\n\n> 💡 POM 是 Maven（Java 的依赖管理工具）的配置文件，BOM 是「版本清单」。只要记住：<strong>父 POM / BOM 管版本，maven 插件打可执行 jar。<\/strong>"]}, {"title": "数据源与连接池（第 05—08 讲）", "cards": ["### 一句话\n\n- <strong>数据源（DataSource）<\/strong> = 程序拿数据库连接的地方。\n- <strong>连接池<\/strong> = 提前开好一批数据库连接放着，用的时候借，用完还回去，省得每次重新连接。\n\n### 单数据源：Boot 自动配好三样东西（第 05 讲）\n\n只要引入 JDBC 依赖和数据库驱动，Spring Boot 会<strong>自动<\/strong>配置：\n\n| 自动配好的 | 作用 |\n|---|---|\n| <strong>DataSource<\/strong> | 数据源（连接池） |\n| <strong>DataSourceTransactionManager<\/strong> | 事务管理器（事务模块讲过） |\n| <strong>JdbcTemplate<\/strong> | 操作数据库的工具（下个模块讲） |\n\n连接信息写在配置文件里：`spring.datasource.url`、`spring.datasource.username`、`spring.datasource.password`。\n\n程序启动时可以自动执行 <strong>schema.sql<\/strong>（建表）和 <strong>data.sql<\/strong>（插入数据）。\n\n> 📌 对比：<strong>传统 Spring 要自己一个个写出来，Spring Boot 自动配。<\/strong>", "### 多数据源（第 06 讲）\n\n一个程序连两个数据库时，Boot 不知道该自动配哪个，要你自己来。两种办法：\n\n1. <strong>排除自动配置，全部自己配<\/strong>：每个数据库各配一套 DataSource、事务管理器等；\n2. <strong>用 @Primary 指定主数据源<\/strong>：Boot 的自动配置就围绕主数据源进行。\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 多个同类型 Bean 里，指定<strong>默认用哪个<\/strong> | <strong>@Primary<\/strong> |\n| 不想用某个自动配置 | 在 @SpringBootApplication 里写 <strong>exclude<\/strong> |\n\n> ⚠️ 多数据源时，<strong>每个数据源要有自己的事务管理器<\/strong>。", "### 一句话\n\n<strong>HikariCP 是 Spring Boot 2.x 默认的连接池，主打「快」。<\/strong>（Hikari 是日语「光」。Spring Boot 1.x 默认的是 Tomcat 连接池。）\n\n### 为什么快（了解，认得出关键词就行）\n\n- 字节码层面做了精简优化；\n- 用自己写的 <strong>FastList<\/strong> 代替 ArrayList；\n- 用无锁的 <strong>ConcurrentBag<\/strong> 管理连接。\n\n### 常用配置（前缀 `spring.datasource.hikari.`）\n\n| 配置 | 意思 | 默认值（补充） |\n|---|---|---|\n| <strong>maximumPoolSize<\/strong> | 最多多少个连接 | 10 |\n| minimumIdle | 最少保留多少空闲连接 | 和最大值一样 |\n| connectionTimeout | 借连接最多等多久 | 30 秒 |\n| idleTimeout | 空闲连接多久后关掉 | 10 分钟 |\n| maxLifetime | 一个连接最长活多久 | 30 分钟 |\n\n> 📌 记住：<strong>Boot 2 默认 HikariCP；最大连接数 maximumPoolSize。<\/strong>", "### 一句话\n\n<strong>Druid 是阿里巴巴开源的连接池，最大特点是「能监控」。<\/strong>\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 阿里巴巴开源的连接池 | <strong>Druid<\/strong> |\n| 连接池 + SQL 监控、统计 | <strong>Druid<\/strong> |\n| Spring Boot 2 默认连接池、主打快 | <strong>HikariCP<\/strong> |\n\n### Druid 的能力（第 08、14 讲）\n\n- <strong>SQL 监控和统计<\/strong>：哪条 SQL 执行了多少次、多慢；\n- <strong>慢 SQL 记录<\/strong>：超过设定时间的 SQL 记下来；\n- <strong>防 SQL 注入<\/strong>：WallFilter（Wall = 防火墙）；\n- <strong>数据库密码加密<\/strong>：配置文件里不写明文密码；\n- <strong>Filter（过滤器）扩展<\/strong>：可以自己写 Filter 插入额外逻辑。\n\n接入方式：引入 <strong>druid-spring-boot-starter<\/strong>。\n\n> 💡 选连接池要综合看：稳定性、性能、能不能监控、还有没有人维护。"]}, {"title": "JdbcTemplate 与异常（第 09、12 讲）", "cards": ["### 一句话\n\n<strong>JdbcTemplate = Spring 提供的「写 SQL 操作数据库」的工具。<\/strong>它帮你处理打开连接、关闭连接这些杂事，你只管写 SQL。\n\n### 方法对号入座\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 增、删、改 | <strong>update()<\/strong> |\n| 查询，结果是多条 | <strong>query()<\/strong> / <strong>queryForList()<\/strong> |\n| 查询，结果只有一个（如一个数字、一个对象） | <strong>queryForObject()<\/strong> |\n| 批量执行多条 | <strong>batchUpdate()<\/strong> |\n| 执行任意语句（如建表） | <strong>execute()<\/strong> |\n\n> 💡 记法：<strong>改数据都用 update<\/strong>，不管是插入、修改还是删除。", "### 几个配套工具\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 把查询结果的<strong>一行<\/strong>变成一个 Java 对象 | <strong>RowMapper<\/strong> |\n| 插入数据并<strong>拿到自动生成的主键<\/strong> | <strong>SimpleJdbcInsert<\/strong> |\n| SQL 里用 <strong>:名字<\/strong> 代替 <strong>?<\/strong> 当参数 | <strong>NamedParameterJdbcTemplate<\/strong> |\n\n例子：`SELECT * FROM FOO WHERE ID = ?` 用问号占位；NamedParameterJdbcTemplate 可以写成 `WHERE ID = :id`，更好读。\n\n> 📌 本节要点：<strong>update 改、query 查、RowMapper 转对象、SimpleJdbcInsert 拿主键、Named… 用名字当参数。<\/strong>", "### 一句话\n\n不同数据库（MySQL、Oracle……）报错的代码各不相同。<strong>Spring 把它们统一翻译成自己的一套异常，根叫 DataAccessException。<\/strong>\n\n| 看到题目说…… | 就选 |\n|---|---|\n| Spring 数据访问异常的<strong>统一父类<\/strong> | <strong>DataAccessException<\/strong> |\n| 违反唯一约束（主键重复） | <strong>DuplicateKeyException<\/strong> |\n| 负责把数据库错误码翻译成 Spring 异常 | <strong>SQLErrorCodeSQLExceptionTranslator<\/strong> |\n| 记录各数据库错误码对照的文件 | <strong>sql-error-codes.xml<\/strong> |\n\n- DataAccessException 是<strong>运行时异常<\/strong>（名字链上有 Runtime），所以在事务里<strong>会回滚<\/strong>。\n- 想<strong>自定义翻译<\/strong>：在自己项目里放一个 sql-error-codes.xml，覆盖默认的对照表。\n\n> 📌 好处一句话：<strong>换数据库，上层代码捕获的异常不用改。<\/strong>"]}, {"title": "事务（第 10、11、14 讲）", "cards": ["### 一句话\n\n<strong>事务 = 一组数据库操作，要么全部成功，要么全部撤销。<\/strong>\n\n例子：下单要做两步，「插入订单」和「扣库存」。如果只做成了一步，数据就乱了。所以把两步捆在一起：\n\n- 都成功 → <strong>提交<\/strong>（正式保存）\n- 有一步失败 → <strong>回滚<\/strong>（全部撤销，当没发生过）\n\n> 💡 <strong>怎么学这个站<\/strong>：每个模块只要求「认得出」。看到题目里的描述，能选出对应的名字就够了。不用看懂代码，不用背原理。", "### 对号入座：三个核心接口（必背）\n\nSpring 用三个「接口」来管事务。接口你可以理解成「一个角色的名字」，不用管它是怎么写出来的。\n\n| 看到题目说…… | 就选 | 记法 |\n|---|---|---|\n| 负责<strong>开启、提交、回滚<\/strong> | <strong>PlatformTransactionManager<\/strong> | Manager = 经理，干活的 |\n| 描述事务的<strong>规则<\/strong>（传播、隔离、超时、只读） | <strong>TransactionDefinition<\/strong> | Definition = 定义，规则说明书 |\n| 表示事务<strong>当前的状态<\/strong> | <strong>TransactionStatus<\/strong> | Status = 状态 |\n\n> 📌 认准三个英文词：<strong>Manager 干活，Definition 定规则，Status 看状态。<\/strong>", "### 对号入座：不同技术用不同的「经理」\n\n| 用的是…… | 事务经理叫 |\n|---|---|\n| JDBC、JdbcTemplate、MyBatis | <strong>DataSource<\/strong>TransactionManager |\n| JPA | <strong>Jpa<\/strong>TransactionManager |\n| Hibernate | <strong>Hibernate<\/strong>TransactionManager |\n| 跨多个数据库（分布式事务） | <strong>Jta<\/strong>TransactionManager |\n\n记法：<strong>名字前半截就是它对应的技术<\/strong>，只有 JDBC 和 MyBatis 用的是 DataSource（数据源）。\n\n为什么要这样设计？一句话：<strong>上层代码只认「经理」这个角色，底层换技术时只换经理，上层不用改。<\/strong>这就是题目里说的「Spring 的事务抽象」。\n\nSpring Boot 会<strong>自动<\/strong>帮你配好对应的经理，不用自己写。", "### 四条规则（都写在 TransactionDefinition 里）\n\n| 规则 | 管什么 | <strong>默认值（必背）<\/strong> |\n|---|---|---|\n| <strong>传播行为<\/strong> | 一个有事务的方法调用另一个方法时，两者共不共用事务 | <strong>REQUIRED<\/strong> |\n| <strong>隔离级别<\/strong> | 同时进行的多个事务，互相能看到多少 | <strong>DEFAULT<\/strong>（跟着数据库自己的设置走） |\n| 超时 | 最多执行几秒，超时就回滚 | -1（不限制） |\n| 只读 | 是不是只查不改 | false（不是只读） |\n\n> 📌 考得最多的是两个默认值：<strong>传播 REQUIRED，隔离 DEFAULT。<\/strong>", "### 传播行为：7 种，名字就是意思\n\n场景：方法 A 已经开了事务，A 去调用方法 B。B 的传播行为决定 B 怎么做。\n\n| 名字 | 中文意思 | B 的做法 |\n|---|---|---|\n| <strong>REQUIRED<\/strong>（默认） | 需要 | 有事务就加入，没有就新建 |\n| <strong>REQUIRES_NEW<\/strong> | 需要<strong>新的<\/strong> | <strong>总是<\/strong>另开一个新事务 |\n| <strong>NESTED<\/strong> | 嵌套 | 在 A 的事务里「存个档」，嵌套执行 |\n| SUPPORTS | 支持 | 有就加入，没有就算了 |\n| NOT_SUPPORTED | 不支持 | 有也不用，不带事务执行 |\n| MANDATORY | 强制 | 必须已经有事务，<strong>没有就报错<\/strong> |\n| NEVER | 绝不 | 绝不能有事务，<strong>有就报错<\/strong> |\n\n> 💡 不用硬背表格，把英文单词翻成中文，意思基本就出来了。\n\n> ⚠️ 最容易混的一对：<strong>REQUIRES_NEW = 另开一个独立的新事务；NESTED = 还在原来的事务里，只是存了个档。<\/strong>", "### 隔离级别：先认三个「问题」，再认四个级别\n\n多个事务同时运行，可能出三种问题：\n\n| 问题 | 一句话 | 关键字 |\n|---|---|---|\n| <strong>脏读<\/strong> | 读到了别人<strong>还没提交<\/strong>的数据 | 未提交 |\n| <strong>不可重复读<\/strong> | 同一行数据，两次读到的<strong>值不一样<\/strong> | 值变了 |\n| <strong>幻读<\/strong> | 同样的查询，两次查到的<strong>行数不一样<\/strong> | 行数变了 |\n\n四个级别从低到高，每升一级多挡住一个问题：\n\n| 级别 | 挡住了 |\n|---|---|\n| READ_UNCOMMITTED（读未提交） | 什么都挡不住 |\n| <strong>READ_COMMITTED<\/strong>（读已提交） | 脏读 |\n| <strong>REPEATABLE_READ<\/strong>（可重复读） | 脏读、不可重复读 |\n| <strong>SERIALIZABLE<\/strong>（串行化） | 全部三个 |\n\n> 💡 记法：级别的名字就是它挡住的问题。「读已提交」→ 只读别人提交过的，所以没有脏读；「可重复读」→ 重复读同一行结果不变，所以没有不可重复读。", "### 两种写法：认准名字就行\n\n| 写法 | 怎么写 | 认法 |\n|---|---|---|\n| <strong>编程式事务<\/strong> | 在代码里用 <strong>TransactionTemplate<\/strong> 包住要做的事 | 看到 Template |\n| <strong>声明式事务<\/strong> | 在方法上方贴一个 <strong>@Transactional<\/strong> | 看到 @Transactional |\n\n- 开头带 `@` 的叫<strong>注解<\/strong>，就是贴在代码上的一个标签，告诉 Spring「这个方法要放进事务里」。\n- 编程式里想手动回滚，用 <strong>setRollbackOnly()<\/strong>（字面意思：设为只能回滚）。\n- 传统 Spring 要写 <strong>@EnableTransactionManagement<\/strong> 打开注解功能；<strong>Spring Boot 自动打开<\/strong>，不用写。\n\n声明式事务是怎么实现的？一个词：<strong>AOP 代理<\/strong>。Spring 在你的方法外面套了一层「代理」，由代理负责开事务、提交、回滚。你只要记住「<strong>声明式事务靠代理<\/strong>」，下一页的坑都是从这来的。", "### 坑一：不是所有错误都会回滚（必背）\n\n方法贴了 @Transactional，执行中出错了，会不会回滚？<strong>看错误的名字：<\/strong>\n\n| 题目里出现的错误名字 | 结果 |\n|---|---|\n| 带 <strong>Runtime<\/strong> 的（如 `RuntimeException`） | <strong>回滚<\/strong> |\n| 不带 Runtime 的（如 `Exception`、`IOException`、`SQLException`） | <strong>不回滚<\/strong>，照样提交 |\n\n除非注解里写了 <strong>rollbackFor<\/strong>：`@Transactional(rollbackFor = Exception.class)`，那遇到 Exception 也会回滚。\n\n> 📌 一句话：<strong>默认只有 Runtime 类的错误才回滚；想让别的错误也回滚，写 rollbackFor。<\/strong>\n\n> ⚠️ 判断题陷阱：「@Transactional 方法出任何错都会回滚」——<strong>错<\/strong>。", "### 坑二、坑三：事务「失效」了\n\n<strong>坑二：同一个类里，自己调自己，事务不生效。<\/strong>（第 11、14 讲专门讲过）\n\n一个类里有两个方法 a 和 b，b 贴了 @Transactional，a 没贴。外面调用 a，a 再调用 b → <strong>b 的事务不生效<\/strong>。\n\n原因一句话：事务是外面那层代理加的，<strong>a 调 b 是在类里面直接调的，没经过代理<\/strong>。\n\n修法：给 a 也贴上 @Transactional，或者让调用经过代理。\n\n<strong>坑三：错误被自己「接住」了，事务不回滚。<\/strong>\n\n方法里用 try / catch 把错误接住了（catch 就是「接住错误」的意思），外面的代理就不知道出过错，<strong>照样提交<\/strong>。\n\n<strong>另外记一条<\/strong>：@Transactional 要贴在 <strong>public<\/strong> 方法上，贴在 private 方法上不生效。\n\n> 📌 三个坑：<strong>① 不带 Runtime 的错误默认不回滚 ② 类里自己调自己不生效 ③ 错误被 catch 接住了不回滚。<\/strong>"]}], "questions": [{"id": "base-p1", "type": "single", "stem": "解决服务发现、配置中心、熔断等<strong>分布式<\/strong>问题的是？", "options": ["Spring Framework", "Spring Boot", "Spring Cloud", "Spring Data"], "answer": [2], "why": ["它是地基", "它负责快速搭建", "分布式、微服务 → Cloud", "它负责数据访问"], "explain": "Framework 地基，Boot 快速，Cloud 分布式。", "tags": [], "lesson": 0, "m": "sp1"}, {"id": "base-p2", "type": "single", "stem": "被 Spring 管理的对象叫什么？", "options": ["Bean", "POM", "Starter", "Jar"], "answer": [0], "why": ["对", "POM 是 Maven 配置文件", "Starter 是起步依赖", "Jar 是打包文件"], "explain": "被管的对象 = Bean。", "tags": [], "lesson": 0, "m": "sp1"}, {"id": "base-p3", "type": "single", "stem": "让 Spring 自动把需要的 Bean 塞进来，用哪个注解？", "options": ["@Component", "@Autowired", "@Bean", "@Service"], "answer": [1], "why": ["它是把类交给 Spring 管", "Autowired = 自动装配", "它是在配置类里造 Bean", "它是标记业务层"], "explain": "自动塞 → @Autowired。", "tags": [], "lesson": 0, "m": "sp1"}, {"id": "base-p4", "type": "single", "stem": "在线生成 Spring Boot 工程的网站是？", "options": ["Spring Initializr", "Maven Central", "Spring Boot Admin", "Docker Hub"], "answer": [0], "why": ["start.spring.io", "那是下载依赖的仓库", "那是监控程序的工具", "那是下载镜像的仓库"], "explain": "生成工程 → Initializr。", "tags": [], "lesson": 0, "m": "sp1"}, {"id": "base-1", "type": "single", "stem": "提供 IoC、AOP 等<strong>基础能力<\/strong>的是？", "options": ["Spring Framework", "Spring Boot", "Spring Cloud", "Spring Session"], "answer": [ ctional", "不是", "不是"], "explain": "Template → 编程式；@Transactional → 声明式。", "m": "sp1"}, {"id": "tx-16", "type": "single", "tags": ["basic"], "stem": "声明式事务（@Transactional）在 Spring 中是靠什么实现的？", "options": ["数据库触发器", "AOP 代理", "修改你的 SQL", "多线程"], "answer": [1], "why": ["无关", "Spring 在方法外面套一层代理来开事务、提交、回滚", "Spring 不改 SQL", "无关"], "explain": "声明式事务靠 AOP 代理。", "m": "sp1"}, {"id": "tx-17", "type": "single", "tags": ["basic"], "stem": "传统 Spring（不用 Spring Boot）中，用哪个注解<strong>打开<\/strong>注解式事务功能？", "options": ["@EnableTransactionManagement", "@Transactional", "@EnableAutoConfiguration", "@Service"], "answer": [0], "why": ["Enable = 打开，TransactionManagement = 事务管理", "它是贴在方法上用的，不是打开功能的开关", "那是 Boot 自动配置的开关", "那是标记业务类的"], "explain": "Spring Boot 会自动打开，不用写。", "m": "sp1"}, {"id": "tx-18", "type": "single", "tags": ["basic"], "stem": "@Transactional 方法中抛出哪种错误时，<strong>默认会回滚<\/strong>？", "options": ["RuntimeException", "IOException", "SQLException", "Exception"], "answer": [0], "why": ["名字带 Runtime → 回滚", "不带 Runtime → 默认不回滚", "不带 Runtime → 默认不回滚", "不带 Runtime → 默认不回滚"], "explain": "看名字：带 Runtime 回滚，不带不回滚。", "m": "sp1"}, {"id": "tx-19", "type": "single", "tags": ["basic"], "stem": "想让 @Transactional 遇到 `Exception` 时也回滚，应该在注解里加？", "options": ["timeout", "readOnly", "rollbackFor", "propagation"], "answer": [2], "why": ["超时设置", "只读设置", "rollbackFor = 遇到什么要回滚", "传播行为"], "explain": "`@Transactional(rollbackFor = Exception.class)`。", "m": "sp1"}, {"id": "tx-20", "type": "single", "tags": ["basic"], "stem": "判断：「@Transactional 方法出现任何错误，事务都会回滚」", "options": ["正确", "错误"], "answer": [1], "why": ["不带 Runtime 的错误默认不回滚", "默认只有 Runtime 类错误（和 Error）才回滚"], "explain": "常见陷阱题。", "m": "sp1"}, {"id": "tx-21", "type": "multi", "tags": ["basic", "core"], "stem": "下面哪些情况，@Transactional 的事务<strong>不会<\/strong>按预期回滚？", "options": ["同一个类里，没贴注解的方法调用了贴注解的方法", "方法里用 try/catch 把错误接住了", "抛出 IOException，且没写 rollbackFor", "抛出 RuntimeException 且没有被接住"], "answer": [0, 1, 2], "why": ["类里自己调自己，没经过代理，不生效", "错误被接住，代理不知道，照样提交", "不带 Runtime，默认不回滚", "这是标准的会回滚的情况"], "explain": "三个坑：自己调自己、错误被接住、不带 Runtime 的错误。", "m": "sp1"}, {"id": "tx-22", "type": "single", "tags": ["basic"], "stem": "@Transactional 贴在哪种方法上才生效（课程所用版本）？", "options": ["public 方法", "private 方法", "任何方法都一样", "只能贴在类上"], "answer": [0], "why": ["贴在 public 方法上才生效", "贴在 private 上不生效", "不一样", "方法和类上都可以贴"], "explain": "记住：public 才生效。", "m": "sp1"}, {"id": "tx-23", "type": "single", "tags": ["basic"], "stem": "编程式事务中，想手动让事务回滚，调用？", "options": ["setRollbackOnly()", "commit()", "setReadOnly()", "close()"], "answer": [0], "why": ["字面意思：设为只能回滚", "那是提交", "那是只读", "不是事务方法"], "explain": "setRollbackOnly = 设为只能回滚。", "m": "sp1"}, {"id": "tx-a1", "type": "single", "tags": ["进阶"], "stem": "【进阶，可跳过】A 有事务，A 调用 B（REQUIRES_NEW）插入一条日志，B 正常结束。之后 A 出错回滚。日志还在吗？", "options": ["在", "不在", "看隔离级别", "看是否只读"], "answer": [0], "why": ["B 是独立的新事务，B 结束时已经提交了，A 回滚管不到它", "NESTED 才会被一起回滚", "无关", "无关"], "explain": "REQUIRES_NEW：独立事务，先提交了就留下。", "m": "sp1"}, {"id": "tx-a2", "type": "single", "tags": ["进阶"], "stem": "【进阶，可跳过】同上一题，但 B 改成 NESTED。A 回滚后日志还在吗？", "options": ["在", "不在", "报错", "B 变成 REQUIRES_NEW"], "answer": [1], "why": ["NESTED 还在 A 的事务里，没有单独提交", "A 回滚，存档里的内容一起撤销", "不会报错", "不会自动转换"], "explain": "NESTED 是同一个事务里的存档，外层回滚连带它。", "m": "sp1"}, {"id": "tx-a3", "type": "single", "tags": ["进阶"], "stem": "【进阶，可跳过】外面调用 `invoke()`，表里会不会留下 BBB？\n\n```java\n@Transactional(rollbackFor = RollbackException.class)\npublic void insertThenRollback() throws RollbackException {\n    插入 BBB;\n    throw new RollbackException();\n}\n\npublic void invoke() throws RollbackException {\n    insertThenRollback();   // 同一个类里直接调用\n}\n```", "options": ["会留下", "不会留下", "启动报错", "不确定"], "answer": [0], "why": ["类里自己调自己，没经过代理，事务没开，BBB 直接保存了", "要经过代理才会回滚", "能正常启动", "结果是确定的"], "explain": "第 11、14 讲的经典例子：自己调自己，事务失效。", "m": "sp1"}, {"id": "tx-a4", "type": "multi", "tags": ["进阶"], "stem": "【进阶，可跳过】A 有事务，调用 B，B 出了 RuntimeException，A 用 try/catch 接住后继续正常结束。A 自己插入的数据<strong>能保存下来<\/strong>的是？", "options": ["B 是 REQUIRES_NEW", "B 是 NESTED", "B 是 REQUIRED"], "answer": [0, 1], "why": ["B 只回滚自己的独立事务", "B 只回滚到存档点", "B 和 A 共用一个事务，B 出错已经把整个事务标记成只能回滚，A 结束时也会回滚"], "explain": "（补充）REQUIRED 下内层出错会把共用的事务标记为只能回滚，外层接住也没用。", "m": "sp1"}]}, {"id": "sp2", "title": "ORM 与 NoSQL：JPA、MyBatis、Redis 与缓存", "short": "JPA·MyBatis·NoSQL", "group": "Spring · 第 2 章", "exam": "第 15—30 讲", "refs": [], "lessons": [{"title": "JPA（第 15—19、23 讲）", "cards": ["### 一句话\n\nJava 里是「对象」，数据库里是「表」，两者结构不一样。<strong>ORM（对象关系映射）就是把对象和表自动对应起来<\/strong>，你操作对象，它帮你生成 SQL。\n\n| 名字 | 是什么 | 打个比方 |\n|---|---|---|\n| <strong>JPA<\/strong> | 一套<strong>规范<\/strong>（只定规则，不干活） | 驾照考试标准 |\n| <strong>Hibernate<\/strong> | JPA 的一种<strong>实现<\/strong>（真正干活的） | 一个具体的司机 |\n| <strong>Spring Data JPA<\/strong> | Spring 在 JPA 之上再简化一层，提供 <strong>Repository<\/strong> | 给司机配了自动驾驶 |\n\n> 📌 认准：<strong>JPA 是规范，Hibernate 是实现，Spring Data JPA 用 Repository 再简化。<\/strong>", "### 实体注解：对号入座（第 16 讲）\n\n「实体」就是和一张表对应的 Java 类。\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 这个类对应数据库里的一张表 | <strong>@Entity<\/strong> |\n| 指定表名 | <strong>@Table<\/strong> |\n| 这个字段是主键 | <strong>@Id<\/strong> |\n| 主键自动生成 | <strong>@GeneratedValue<\/strong> |\n| 指定列名等 | <strong>@Column<\/strong> |\n| 多对多关系（如一个订单多杯咖啡，一种咖啡在多个订单里） | <strong>@ManyToMany<\/strong> |\n| 一对多 / 多对一 | <strong>@OneToMany / @ManyToOne<\/strong> |\n| 自动记录创建时间 / 更新时间 | <strong>@CreationTimestamp / @UpdateTimestamp<\/strong> |\n| 枚举存进数据库 | <strong>@Enumerated<\/strong> |\n| 多个实体的公共字段（如 id、创建时间）放到父类 | <strong>@MappedSuperclass<\/strong> |", "### 一句话\n\n<strong>Lombok 用注解自动生成那些又长又无聊的代码<\/strong>（取值、赋值、构造方法等），课程里大量使用。\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 自动生成 getter / setter / toString 等一大堆 | <strong>@Data<\/strong> |\n| 只生成 getter / setter | <strong>@Getter / @Setter<\/strong> |\n| 生成无参构造方法 | <strong>@NoArgsConstructor<\/strong> |\n| 生成全参构造方法 | <strong>@AllArgsConstructor<\/strong> |\n| 用「链式写法」创建对象 | <strong>@Builder<\/strong> |\n| 自动生成一个日志对象 log | <strong>@Slf4j<\/strong> |\n| 生成 toString 方法 | <strong>@ToString<\/strong> |\n\n### SpringBucks 建模要点（第 17 讲）\n\n- 金额不能用小数类型（会有精度问题），课程用 <strong>Joda Money<\/strong> 库表示金额；\n- 订单状态用<strong>枚举<\/strong>表示（如 INIT、PAID、BREWING、BREWED、TAKEN、CANCELLED）。", "### 一句话\n\n<strong>在 Spring Data JPA 里，你只需要写一个接口，不用写实现，Spring 自动帮你生成。<\/strong>\n\n三个常见的父接口，一个比一个功能多：\n\n| 接口 | 提供 |\n|---|---|\n| <strong>CrudRepository<\/strong> | 基本的增删改查（Crud = Create Read Update Delete） |\n| <strong>PagingAndSortingRepository<\/strong> | 再加上<strong>分页和排序<\/strong> |\n| <strong>JpaRepository<\/strong> | 再加上 JPA 特有的功能（如批量） |\n\n- 开启 Repository 扫描：<strong>@EnableJpaRepositories<\/strong>（Boot 自动开启）；\n- 不想让 Spring 为某个接口生成实现（比如它只是公共父接口）：<strong>@NoRepositoryBean<\/strong>。", "### 按方法名查询：方法名就是查询条件（第 18 讲）\n\n只要按规则起方法名，Spring 就能「读懂」并生成 SQL：\n\n| 方法名 | Spring 理解为 |\n|---|---|\n| `findByName(name)` | 按名字查 |\n| `findByNameAndPrice(...)` | 按名字<strong>和<\/strong>价格查 |\n| `findByCustomerOrderById(...)` | 按顾客查，<strong>按 id 排序<\/strong> |\n| `findTop3ByOrderByUpdateTimeDesc()` | 按更新时间倒序，取<strong>前 3 个<\/strong> |\n| `countByStatus(...)` | 按状态<strong>计数<\/strong> |\n\n- 开头：<strong>find…By / read…By / query…By / get…By<\/strong>（查询），<strong>count…By<\/strong>（计数）；\n- 中间：And、Or、OrderBy、Top / First；\n- 分页参数 <strong>Pageable<\/strong>，排序参数 <strong>Sort<\/strong>。\n\n### Repository 是怎么变成 Bean 的（第 19 讲，认关键词）\n\nSpring 为你的接口生成<strong>代理对象<\/strong>。基础的增删改查交给默认实现 <strong>SimpleJpaRepository<\/strong>；按方法名的查询，由框架<strong>解析方法名<\/strong>后执行。\n\n### Query by Example（第 23 讲）\n\n拿一个「样例对象」当查询条件：样例里填了什么字段，就按什么字段查。"]}, {"title": "MyBatis（第 20—22 讲）", "cards": ["### 一句话\n\n<strong>MyBatis = SQL 由你自己写，它负责把结果对应到对象上。<\/strong>JPA 则是你操作对象，SQL 由它生成。\n\n| | JPA | MyBatis |\n|---|---|---|\n| SQL 谁写 | 框架自动生成 | <strong>开发者自己写<\/strong> |\n| 适合 | 简单的增删改查 | <strong>复杂查询<\/strong>、需要精细控制 SQL、有 DBA 审核 SQL 的场景 |\n| 国内使用 | 较少 | <strong>很多<\/strong> |\n\n> 📌 认准：<strong>想自己控制 SQL → MyBatis。<\/strong>", "### 在 Spring Boot 中使用（第 20 讲）\n\n| 看到题目说…… | 就选 |\n|---|---|\n| MyBatis 的起步依赖 | <strong>mybatis-spring-boot-starter<\/strong> |\n| 标记一个接口是 MyBatis 的 Mapper | <strong>@Mapper<\/strong> |\n| 批量扫描某个包下的所有 Mapper | <strong>@MapperScan<\/strong> |\n| 在接口方法上直接写查询 SQL | <strong>@Select<\/strong>（还有 @Insert、@Update、@Delete） |\n| 插入后拿到自动生成的主键 | <strong>@Options(useGeneratedKeys = true)<\/strong> |\n| 自定义 Java 类型和数据库类型的转换 | <strong>TypeHandler<\/strong>（类型处理器） |\n\n常用配置（前缀 `mybatis.`）：\n- <strong>mapper-locations<\/strong>：XML 映射文件在哪；\n- <strong>type-handlers-package<\/strong>：类型处理器在哪个包；\n- <strong>configuration.map-underscore-to-camel-case<\/strong>：把数据库的 `create_time` 自动对应到 Java 的 `createTime`（下划线转驼峰）。", "### MyBatis Generator：自动生成代码（第 21 讲）\n\n<strong>根据数据库表结构，自动生成 Model（对应表的类）、Mapper 接口和 XML 映射文件。<\/strong>简称 <strong>MBG<\/strong>。\n\n- 配置文件：<strong>generatorConfig.xml<\/strong>，里面写清楚连哪个数据库、生成哪些表、生成到哪里、用哪些插件；\n- 运行方式：命令行、<strong>Maven 插件<\/strong>、或 Java 代码；\n- 生成的代码<strong>仍然需要人工检查<\/strong>。\n\n### PageHelper：分页插件（第 22 讲）\n\n<strong>给 MyBatis 加上分页功能，支持多种数据库。<\/strong>\n\n- 起步依赖：<strong>pagehelper-spring-boot-starter<\/strong>；\n- 发起分页的方式：传 <strong>RowBounds<\/strong> 参数、或在方法参数里直接传页码和每页条数；\n- 分页结果信息可以用 <strong>PageInfo<\/strong> 包装（总条数、总页数等）。\n\n> 📌 认准：<strong>Generator = 生成代码；PageHelper = 分页。<\/strong>"]}, {"title": "NoSQL 与缓存（第 24—30 讲）", "cards": ["### 一句话\n\n<strong>Docker 让你不用安装，一条命令就把 MongoDB、Redis 这类软件跑起来。<\/strong>课程用它来辅助开发。\n\n| 词 | 一句话 |\n|---|---|\n| <strong>镜像（image）<\/strong> | 软件的「安装包」，只读 |\n| <strong>容器（container）<\/strong> | 镜像<strong>运行起来<\/strong>的实例 |\n| <strong>端口映射<\/strong> | 把容器里的端口对到电脑上，`-p 电脑端口:容器端口` |\n| <strong>数据卷（volume）<\/strong> | 把数据存到容器外面，容器删了数据还在，`-v` |\n| <strong>环境变量<\/strong> | 启动时传配置，`-e` |\n\n| 命令 | 作用 |\n|---|---|\n| docker <strong>pull<\/strong> | 下载镜像 |\n| docker <strong>run<\/strong> | 用镜像创建并启动容器 |\n| docker <strong>ps<\/strong> | 看正在运行的容器 |\n| docker <strong>logs<\/strong> | 看容器日志 |\n| docker <strong>stop / start<\/strong> | 停止 / 启动容器 |\n\n> 📌 认准：<strong>镜像是安装包，容器是跑起来的程序。<\/strong>", "### MongoDB：存「文档」的数据库（第 25 讲）\n\nMongoDB 不用表，存的是类似 JSON 的<strong>文档<\/strong>。\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 标记一个类对应 MongoDB 里的文档 | <strong>@Document<\/strong> |\n| 主键 | <strong>@Id<\/strong> |\n| 操作 MongoDB 的工具类 | <strong>MongoTemplate<\/strong> |\n| 只写接口就能操作 MongoDB | <strong>MongoRepository<\/strong> |\n| 特殊类型（如金额）的读写转换 | 自定义<strong>转换器<\/strong>（Converter） |\n\n> 💡 和 JPA 对比着记：JPA 是 @Entity + JpaRepository，MongoDB 是 <strong>@Document + MongoRepository<\/strong>，模板类叫 <strong>MongoTemplate<\/strong>。", "### Redis：放在内存里的键值数据库（第 26、27、29 讲）\n\n<strong>Redis 很快，常用来做缓存。<\/strong>数据结构有：<strong>String（字符串）、List（列表）、Hash（哈希）、Set（集合）、ZSet（有序集合）<\/strong>。\n\n<strong>Java 连 Redis 的两个客户端：<\/strong>\n\n| 客户端 | 特点 |\n|---|---|\n| <strong>Jedis<\/strong> | <strong>不是线程安全的<\/strong>，多线程要用连接池 <strong>JedisPool<\/strong> |\n| <strong>Lettuce<\/strong> | 基于 Netty，线程安全，<strong>Spring Boot 2 默认<\/strong> |\n\n<strong>Redis 的两种高可用部署：<\/strong>\n\n| 模式 | 一句话 | Jedis 里用 |\n|---|---|---|\n| <strong>哨兵（Sentinel）<\/strong> | 哨兵<strong>监控<\/strong>主从节点，主挂了<strong>自动切换<\/strong> | JedisSentinelPool |\n| <strong>集群（Cluster）<\/strong> | 数据<strong>分片<\/strong>存到多个节点，共 <strong>16384 个哈希槽<\/strong> | JedisCluster |\n\n> ⚠️ 易混：<strong>哨兵 = 监控 + 故障切换；集群 = 分片。<\/strong>", "### 在 Spring 里操作 Redis（第 29 讲）\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 操作 Redis 的模板类 | <strong>RedisTemplate<\/strong>（专门处理字符串的：<strong>StringRedisTemplate<\/strong>） |\n| 操作字符串值 / 哈希 / 列表 | <strong>opsForValue() / opsForHash() / opsForList()<\/strong> |\n| 用 Repository 的方式操作 Redis，实体上贴 | <strong>@RedisHash<\/strong> |\n| 存进 Redis 时怎么把对象转成字节 | <strong>序列化器<\/strong>（RedisSerializer），可自定义，如转成 JSON |\n\n> 💡 「ops」是 operations（操作）的缩写，后面跟数据结构名。", "### 一句话\n\n<strong>在方法上贴个注解，Spring 就自动帮你缓存结果。<\/strong>第二次调用时直接拿缓存，不再查数据库。\n\n先用 <strong>@EnableCaching<\/strong> 打开缓存功能。然后：\n\n| 注解 | 做什么 | 记法 |\n|---|---|---|\n| <strong>@Cacheable<\/strong> | 先查缓存，<strong>有就直接返回<\/strong>，没有才执行方法并放进缓存 | able = 可以缓存 |\n| <strong>@CachePut<\/strong> | <strong>总是执行方法<\/strong>，然后把结果更新到缓存 | Put = 放进去 |\n| <strong>@CacheEvict<\/strong> | <strong>清除<\/strong>缓存 | Evict = 赶走 |\n| @Caching | 把上面几个组合起来 | |\n| @CacheConfig | 贴在类上，写一些公共设置（如缓存名） | Config = 配置 |\n\n> 📌 必背：<strong>Cacheable 有缓存就不执行；CachePut 总是执行再更新；CacheEvict 清除。<\/strong>", "### 缓存放在哪\n\nSpring 只定义了「怎么用缓存」，缓存具体存在哪可以换：\n\n- 本地内存：ConcurrentHashMap、EhCache、Caffeine；\n- 分布式：<strong>Redis<\/strong>（多个程序共用一份缓存）。\n\n配置举例：`spring.cache.type=redis`（用 Redis 做缓存）、`spring.cache.redis.time-to-live`（缓存多久过期）。\n\n<strong>怎么选（第 28 讲）：<\/strong>\n- 只在一台机器上用、数据变化少 → 本地缓存；\n- 多台机器要共享、数据量大 → Redis 这种分布式缓存；\n- 都要考虑<strong>数据一致性<\/strong>和<strong>过期策略<\/strong>。\n\n### SpringBucks 进度（第 30 讲）\n\n咖啡店把<strong>菜单<\/strong>放进 Redis 缓存（菜单读多改少，很适合缓存），订单数据仍然用 JPA 存数据库。"]}], "questions": [{"id": "jpa-p1", "type": "single", "stem": "JPA、Hibernate 的关系是？", "options": ["JPA 是规范，Hibernate 是它的一种实现", "Hibernate 是规范，JPA 是实现", "两者完全无关", "两者是同一个东西"], "answer": [0], "why": ["对", "说反了", "有关", "不同"], "explain": "JPA 规范，Hibernate 实现。", "tags": [], "lesson": 0, "m": "sp2"}, {"id": "jpa-p2", "type": "single", "stem": "标记一个类对应数据库中的一张表，用？", "options": ["@Entity", "@Id", "@Column", "@Service"], "answer": [0], "why": ["Entity = 实体", "主键", "列", "业务层"], "explain": "实体 → @Entity。", "tags": [], "lesson": 0, "m": "sp2"}, {"id": "jpa-p3", "type": "single", "stem": "Lombok 中，自动生成 getter、setter、toString 等的注解是？", "options": ["@Data", "@Builder", "@Slf4j", "@Entity"], "answer": [0], "why": ["一个顶一堆", "链式创建对象", "日志", "JPA 注解"], "explain": "@Data。", "tags": [], "lesson": 0, "m": "sp2"}, {"id": "jpa-p4", "type": "single", "stem": "在 Spring Data JPA 中，方法 `findByName(String name)` 的作用是？", "options": ["按名字查询", "删除名字", "修改名字", "统计名字数量"], "answer": [0], "why": ["find…By + 条件", "删除是 delete", "修改用 save", "计数是 count"], "explain": "方法名就是查询条件。", "tags": [], "lesson": 0, "m": "sp2"}, {"id": "jpa-1", "type": "single", "stem": "Spring Data JPA 在 JPA 之上提供的核心抽象是？", "options": ["Repository", "JdbcTemplate", "DataSource", "DispatcherServlet"], "answer": [0], "why": ["对", "那是 Spring JDBC 的", "数据源", "Web 的入口
