| 词 | 一句话 |\n|---|---|\n| <strong>预训练<\/strong> | 用海量数据训练出一个<strong>通用<\/strong>的基础模型（如 BERT、GPT、Llama 2），学会通用语言规律 |\n| <strong>微调<\/strong>（Fine-tuning） | 在预训练模型基础上，用<strong>特定领域/任务的少量数据继续训练<\/strong>，让它更适合具体任务 |\n| <strong>量化<\/strong> | 用<strong>更低精度<\/strong>（如 8 位、4 位）表示模型参数，<strong>减小体积、降低硬件要求<\/strong>，效果可能略降 |\n\n- 大模型发展的关键：2017 年 Google 提出 <strong>Transformer<\/strong> 架构；之后形成「<strong>预训练 + 微调<\/strong>」的模式。\n- <strong>HuggingFace<\/strong> = 最大的开源模型社区/平台，课程从这里下载 <strong>Llama 2<\/strong>（Meta 开源）等模型。用 Transformers 库的 <strong>AutoTokenizer<\/strong>（分词器，文字↔token）+ <strong>AutoModelForCausalLM<\/strong>（语言模型）加载运行。\n\n> 📌 别混：<strong>RAG 是给模型递资料，不改参数；微调会改模型参数。<\/strong>", "### 在 LangChain 里调用开源模型的方法（必考清单）\n\n| 方法 | 一句话 |\n|---|---|\n| <strong>通过 HuggingFace Hub<\/strong> | 用 `HuggingFaceHub` 类，填 `repo_id`（如 google/flan-t5），需要 HuggingFace 的 API Token，<strong>在 HuggingFace 服务器上运行<\/strong> |\n| <strong>通过 HuggingFace Pipeline<\/strong> | 先用 Transformers 的 `pipeline` 在<strong>本地<\/strong>建好推理流程，再用 `HuggingFacePipeline` 包装给 LangChain |\n| <strong>自定义语言模型<\/strong> | **继承 LangChain 的 `LLM` 基类**（langchain.llms.base），实现 `_call`（怎么生成）和 `_llm_type`，就能接入任何模型；课程用它调用<strong>量化版 Llama 2<\/strong>（llama-cpp-python 加载） |\n\n### 远程 API vs 开源模型\n\n| | 远程 API（OpenAI 等） | 自己部署开源模型 |\n|---|---|---|\n| 优点 | 省事，不用管硬件 | <strong>数据隐私<\/strong>可控，可微调，长期成本可能低 |\n| 缺点 | 按调用付费，数据要发给服务商 | 要自己准备 <strong>GPU<\/strong> 和运维 |"]}, {"title": "输出解析器（第 07 讲）", "cards": ["### 一句话：输出解析器\n\n模型返回的是一段文字，程序要的是<strong>结构化数据<\/strong>（如：花的种类、价格、文案、理由四列）。<strong>输出解析器<\/strong>负责：先告诉模型要什么格式，再把返回的文字转成程序能用的数据。\n\n两个核心方法（必背）：\n\n| 方法 | 干什么 |\n|---|---|\n| <strong>get_format_instructions<\/strong> | 生成<strong>格式说明<\/strong>，放进提示，告诉模型按什么格式输出 |\n| <strong>parse<\/strong> | 把模型返回的<strong>字符串解析<\/strong>成目标结构 |\n| parse_with_prompt（可选） | 解析时还带上<strong>原始提示<\/strong>，方便出错时重试 |\n\n### Pydantic 解析器的用法（课程步骤）\n\n1. 用 <strong>Pydantic<\/strong> 定义数据模型 `FlowerDescription`（flower_type、price、description、reason）；\n2. 创建 <strong>PydanticOutputParser<\/strong>，用 `get_format_instructions()` 取得格式说明；\n3. 把格式说明放进提示模板；\n4. 调用模型，用 `parse()` 解析成对象；\n5. 放进 DataFrame。", "### 输出解析器种类：对号入座\n\n| 解析器 | 看到题目说……就选 |\n|---|---|\n| <strong>CommaSeparatedListOutputParser<\/strong>（列表） | 输出<strong>逗号分隔的列表<\/strong> |\n| <strong>DatetimeOutputParser<\/strong>（日期时间） | 输出<strong>日期时间<\/strong> |\n| <strong>EnumOutputParser<\/strong>（枚举） | 输出限定在<strong>几个固定选项<\/strong>里 |\n| <strong>StructuredOutputParser<\/strong>（结构化） | 用 <strong>ResponseSchema<\/strong> 定义几个字段，输出 <strong>JSON<\/strong> |\n| <strong>PydanticOutputParser<\/strong>（Pydantic / JSON） | 用 <strong>Pydantic 模型<\/strong>定义字段和类型，输出 <strong>JSON<\/strong> 并校验类型 |\n| <strong>XMLOutputParser<\/strong> | 输出 <strong>XML<\/strong> 格式 |\n| <strong>OutputFixingParser<\/strong>（自动修复） | 输出<strong>格式错了<\/strong>（如 JSON 用了单引号），再调一次模型<strong>修复格式<\/strong> |\n| <strong>RetryWithErrorOutputParser<\/strong>（重试） | 输出<strong>缺内容<\/strong>（如只有 action 没有 action_input），把<strong>原始提示 + 错误输出<\/strong>交给模型<strong>重新生成<\/strong> |\n\n> 📌 真题：「要把原始文本转成 <strong>JSON<\/strong>」→ <strong>PydanticOutputParser、StructuredOutputParser<\/strong>。XML 解析器出 XML，逗号列表解析器出列表，都不对。\n> 📌 修复 vs 重试：<strong>OutputFixing 只修格式<\/strong>（只看错误输出和格式要求）；<strong>RetryWithError 还会带上原始提示<\/strong>，能补全缺失的内容。两者都用 `from_llm(parser=..., llm=...)` 创建。"]}], "questions": [{"id": "lcm-p1", "type": "single", "stem": "在 LangChain 中调用自定义语言模型，要继承哪个基类？", "options": ["LLM（langchain.llms.base）", "PromptTemplate", "LLMChain", "ConversationBufferMemory"], "answer": [0], "why": ["对，实现 _call 和 _llm_type", "是提示模板", "是链", "是记忆"], "explain": "自定义模型 = 继承 LLM 基类。", "tags": [], "lesson": 0, "m": "lc_model"}, {"id": "lcm-p2", "type": "single", "stem": "输出解析器中，负责生成「格式说明」放进提示的方法是？", "options": ["get_format_instructions", "parse", "run", "predict"], "answer": [0], "why": ["对", "parse 是解析返回的字符串", "链的调用方法", "链的调用方法"], "explain": "get_format_instructions 出格式说明，parse 解析。", "tags": [], "lesson": 1, "m": "lc_model"}, {"id": "lcm-1", "type": "multi", "stem": "在 LangChain 中，课程介绍的调用开源模型的方法有", "options": ["通过 HuggingFace Hub", "通过 HuggingFace Pipeline", "继承 LLM 基类，调用自定义语言模型", "通过 OutputFixingParser"], "answer": [0, 1, 2], "why": ["对", "对", "对", "错，那是输出解析器"], "explain": "Hub（远程）、Pipeline（本地）、自定义 LLM 类。", "tags": ["basic"], "m": "lc_model"}, {"id": "lcm-2", "type": "multi", "stem": "关于预训练、微调和量化，下列说法正确的是", "options": ["预训练是用海量数据训练出通用的基础模型", "微调是在预训练模型基础上用特定任务数据继续训练", "量化是用更低精度表示参数，减小模型体积和硬件要求", "把手册切块存入向量库再检索，就是对模型做了微调"], "answer": [0, 1, 2], "why": ["对", "对", "对", "错，那是 RAG，不改模型参数"], "explain": "预训练通用，微调专项，量化瘦身；RAG 不是微调。", "tags": ["basic", "core"], "m": "lc_model"}, {"id": "lcm-3", "type": "single", "stem": "判断：使用 HuggingFacePipeline 时，模型是先用 Transformers 的 pipeline 在本地建好推理流程，再交给 LangChain", "options": ["正确", "错误"], "answer": [0], "why": ["对", "Pipeline = 本地推理再包装"], "explain": "Hub 远程，Pipeline 本地。", "tags": ["basic"], "m": "lc_model"}, {"id": "lcm-4", "type": "multi", "stem": "需要把模型输出的原始文本转换为结构化的 JSON 格式，可以选择哪些输出解析器", "options": ["PydanticOutputParser", "XMLOutputParser", "StructuredOutputParser", "CommaSeparatedListOutputParser"], "answer": [0, 2], "why": ["对，Pydantic 模型 → JSON", "错，输出 XML", "对，ResponseSchema → JSON", "错，输出逗号分隔列表"], "explain": "JSON → Pydantic / Structured。", "tags": ["basic"], "m": "lc_model"}, {"id": "lcm-5", "type": "multi", "stem": "下列输出解析器与用途对应正确的是", "options": ["CommaSeparatedListOutputParser：输出逗号分隔的列表", "DatetimeOutputParser：输出日期时间", "EnumOutputParser：输出限定在几个固定选项中", "OutputFixingParser：输出格式错误时调用模型修复格式", "RetryWithErrorOutputParser：把模型输出翻译成英文"], "answer": [0, 1, 2, 3], "why": ["对", "对", "对", "对", "错，它带上原始提示让模型重新生成缺失内容"], "explain": "列表、日期、枚举、修复、重试。", "tags": ["basic", "core"], "m": "lc_model"}, {"id": "lcm-6", "type": "single", "stem": "模型输出缺少必要内容（比如只给了 action 没给 action_input），课程用哪个解析器把原始提示和错误输出一起交给模型重新生成？", "options": ["RetryWithErrorOutputParser", "OutputFixingParser", "EnumOutputParser", "DatetimeOutputParser"], "answer": [0], "why": ["对", "它只修格式，不看原始提示", "枚举解析器", "日期解析器"], "explain": "缺内容用 RetryWithError，格式错用 OutputFixing。", "tags": ["basic", "core"], "m": "lc_model"}]}, {"id": "lc_chain", "title": "链与记忆", "short": "链·记忆", "group": "LangChain · 链与记忆", "exam": "第 08—10 讲", "refs": [], "lessons": [{"title": "链与调用方式（第 08 讲）", "cards": ["### 一句话：链（Chain）\n\n<strong>链<\/strong> = 把多个组件（提示模板、模型、输出解析器……）<strong>串成一个可调用的整体<\/strong>。链<strong>不是模型<\/strong>，是组织调用流程的方式。\n\n| 链 | 一句话 |\n|---|---|\n| <strong>LLMChain<\/strong> | <strong>最简单<\/strong>的链：<strong>提示模板 + 模型<\/strong>（可加输出解析器）。输入 → 格式化提示 → 调模型 → 返回 |\n| <strong>SequentialChain<\/strong> | <strong>顺序链<\/strong>：把多个链<strong>按顺序<\/strong>连起来，前一个的输出给后一个用 |\n| SimpleSequentialChain | 简单顺序链：每步只有一个输入、一个输出 |\n| <strong>RouterChain<\/strong> | <strong>路由链<\/strong>：根据输入<strong>选择<\/strong>走哪条链（第 09 讲） |\n\n### 链的 5 种调用方式（必背）\n\n| 方式 | 特点 |\n|---|---|\n| <strong>直接调用<\/strong> `llm_chain(...)` | 像函数一样调用，返回<strong>字典<\/strong>（含输入和输出 text） |\n| <strong>run<\/strong> | 返回<strong>字符串<\/strong> |\n| <strong>predict<\/strong> | 输入用<strong>关键字参数<\/strong>（而不是字典） |\n| <strong>apply<\/strong> | 输入一个<strong>列表<\/strong>，<strong>一次处理多个输入<\/strong> |\n| <strong>generate<\/strong> | 类似 apply，但返回 <strong>LLMResult 对象<\/strong>，带<strong>令牌数量、模型名称<\/strong>等生成信息 |", "### 顺序链实战：三个角色写鲜花推文\n\n| 顺序 | 角色（一个 LLMChain） | 输入 → 输出（output_key） |\n|---|---|---|\n| 1 | <strong>植物学家<\/strong> | 花名、颜色 → <strong>鲜花介绍<\/strong>（introduction） |\n| 2 | <strong>鲜花评论者<\/strong> | 介绍 → <strong>评论<\/strong>（review） |\n| 3 | <strong>社交媒体运营经理<\/strong> | 介绍 + 评论 → <strong>推广文案<\/strong>（social_post_text） |\n\n- 用 `SequentialChain(chains=[...], input_variables=[...], output_variables=[...], verbose=True)` 串起来。\n- 每个 LLMChain 用 <strong>output_key<\/strong> 给输出起名，后一步的模板变量要和前一步的 output_key <strong>对得上<\/strong>。\n- verbose=True 可看到每一步的中间结果。\n\n> 📌 顺序链 = <strong>按固定次序<\/strong>一步接一步；路由链 = <strong>根据问题选一条<\/strong>。"]}, {"title": "路由链（第 09 讲）", "cards": ["### 一句话：路由链\n\n易速鲜花的客服既会被问「<strong>玫瑰怎么浇水<\/strong>」（养护），也会被问「<strong>婚礼怎么用花布置<\/strong>」（装饰）。<strong>路由链<\/strong>先判断问题属于哪类，再交给对应的专家链回答。\n\n| 组成 | 干什么 | 课程例子 |\n|---|---|---|\n| <strong>目标链<\/strong>（destination chains） | 每类问题一条，各有自己的提示 | <strong>鲜花护理专家<\/strong>（flower_care）、<strong>鲜花装饰专家<\/strong>（flower_decoration） |\n| <strong>路由链<\/strong>（RouterChain） | 读问题和各目标链的<strong>描述<\/strong>，决定去哪条 | <strong>LLMRouterChain<\/strong>（让模型来选） |\n| <strong>默认链<\/strong>（default chain） | 问题<strong>不属于任何一类<\/strong>时兜底 | <strong>ConversationChain<\/strong> |\n| <strong>MultiPromptChain<\/strong> | 把路由链、目标链、默认链<strong>组合<\/strong>起来 | — |\n\n- 路由链的输出由 <strong>RouterOutputParser<\/strong> 解析，得到 <strong>destination<\/strong>（去哪条链）和 <strong>next_inputs<\/strong>（传过去的输入）。\n- 路由提示模板用 <strong>MULTI_PROMPT_ROUTER_TEMPLATE<\/strong>；每个目标链的信息写在 prompt_infos（key、description、template）里。", "### 构建步骤（真题四项全对）\n\n1. <strong>定义若干个 prompt 和相关的目标链<\/strong>（destination Chain）；\n2. <strong>构建 RouterChain<\/strong>，比如 <strong>LLMRouterChain<\/strong>；\n3. <strong>把目标链和路由链（加上默认链）组合成 MultiPromptChain<\/strong>；\n4. <strong>根据问题，RouterChain 选择相关的 prompt 和目标链来回答<\/strong>。\n\n### 三个问题走一遍\n\n| 问题 | 去哪 |\n|---|---|\n| 如何为玫瑰浇水？ | 鲜花护理链 |\n| 如何为婚礼场地装饰花朵？ | 鲜花装饰链 |\n| 如何考入哈佛大学？ | 都不沾边 → <strong>默认链<\/strong> |\n\n> 📌 目标链的<strong>描述<\/strong>写得越清楚，路由选得越准。"]}, {"title": "记忆（第 10 讲）", "cards": ["### 一句话：记忆（Memory）\n\n模型每次调用<strong>不会自动记得<\/strong>上一轮聊了什么。<strong>记忆<\/strong>就是把历史对话保存下来，每轮调用时放回提示里。\n\n<strong>ConversationChain<\/strong>（对话链）的提示模板里有两个变量：<strong>history<\/strong>（历史对话）和 <strong>input<\/strong>（当前输入），模板开头是「The following is a friendly conversation between a human and an AI……」。\n\n### 四种记忆（类名必背）\n\n| 记忆 | 中文 | 怎么处理历史 |\n|---|---|---|\n| <strong>ConversationBufferMemory<\/strong> | 缓冲记忆 | <strong>保存全部<\/strong>对话原文 |\n| <strong>ConversationBufferWindowMemory<\/strong> | 缓冲窗口记忆 | 只保留<strong>最近 k 轮<\/strong>（参数 <strong>k<\/strong>） |\n| <strong>ConversationSummaryMemory<\/strong> | 对话总结记忆 | 用模型把历史<strong>压缩成摘要<\/strong> |\n| <strong>ConversationSummaryBufferMemory<\/strong> | 混合记忆 | <strong>早期对话做摘要 + 最近几轮保留原文<\/strong>（参数 <strong>max_token_limit<\/strong>） |\n\n> 📌 真题：「既记得很多轮之前的摘要，又记得最近几轮原文」→ <strong>ConversationSummaryBufferMemory（混合记忆）<\/strong>。", "### 四种记忆的优缺点\n\n| 记忆 | 优点 | 缺点 |\n|---|---|---|\n| <strong>Buffer<\/strong> | 信息<strong>最完整<\/strong> | token 越来越多，<strong>慢、贵<\/strong>，会超出 token 上限 |\n| <strong>BufferWindow<\/strong> | 只留最近 k 轮，<strong>省 token<\/strong> | <strong>忘记早期<\/strong>对话 |\n| <strong>Summary<\/strong> | 长对话 token 增长慢 | <strong>短对话反而可能更费 token<\/strong>；总结要<strong>额外调模型<\/strong>；依赖总结质量 |\n| <strong>SummaryBuffer<\/strong> | 兼顾<strong>早期背景 + 近期细节<\/strong> | 同样要额外调模型做总结；短对话也可能多费 token |\n\n例：窗口 k=1 时，第三轮问「她喜欢粉色」，模型已看不到第一轮「姐姐过生日」。\n\n> 💡 记忆 ≠ 知识库：记忆存<strong>本次会话的交互<\/strong>；知识库检索的是<strong>外部资料<\/strong>（手册等）。"]}], "questions": [{"id": "lcc-p1", "type": "single", "stem": "链的调用方式中，可以一次处理<strong>一个输入列表<\/strong>（多个输入）的是？", "options": ["apply", "predict", "run", "直接调用"], "answer": [0], "why": ["对", "predict 用关键字参数", "run 处理单个输入", "直接调用处理单个输入，返回字典"], "explain": "apply 批量，generate 批量 + LLMResult。", "tags": [], "lesson": 0, "m": "lc_chain"}, {"id": "lcc-p2", "type": "single", "stem": "路由链中，问题不属于任何已定义类别时，由谁来处理？", "options": ["默认链", "目标链", "RouterOutputParser", "SequentialChain"], "answer": [0], "why": ["对，课程用 ConversationChain", "目标链只处理自己那一类", "它只解析路由结果", "顺序链与路由无关"], "explain": "兜底 = 默认链。", "tags": [], "lesson": 1, "m": "lc_chain"}, {"id": "lcc-p3", "type": "single", "stem": "既能记住很多轮之前的对话摘要，又能记住最近几轮原始内容的记忆是？", "options": ["ConversationBufferMemory", "ConversationBufferWindowMemory", "ConversationSummaryMemory", "ConversationSummaryBufferMemory"], "answer": [3], "why": ["全部原文", "只留最近 k 轮", "只有摘要", "对，混合记忆"], "explain": "摘要 + 近期原文 = SummaryBuffer。", "tags": [], "lesson": 2, "m": "lc_chain"}, {"id": "lcc-1", "type": "multi", "stem": "链的调用方式有哪几种", "options": ["直接调用", "通过 run 方法", "通过 predict 方法", "通过 apply 方法", "通过 generate 方法"], "answer": [0, 1, 2, 3, 4], "why": ["是，返回字典", "是，返回字符串", "是，关键字参数", "是，处理输入列表", "是，返回 LLMResult"], "explain": "直接调用、run、predict、apply、generate 五种全对。", "tags": ["basic"], "m": "lc_chain"}, {"id": "lcc-2", "type": "multi", "stem": "关于链，下列说法正确的是", "options": ["LLMChain 把提示模板和模型组合在一起", "SequentialChain 把多个链按顺序连接，前一步的输出给后一步用", "generate 方法返回 LLMResult 对象，包含令牌数量等信息", "链是一种新的大语言模型"], "answer": [0, 1, 2], "why": ["对", "对", "对", "错，链是组织调用的方式"], "explain": "链不是模型，是把组件串起来。", "tags": ["basic", "core"], "m": "lc_chain"}, {"id": "lcc-3", "type": "single", "stem": "判断：课程的鲜花推文顺序链中，三个角色依次是植物学家、鲜花评论者、社交媒体运营经理", "options": ["正确", "错误"], "answer": [0], "why": ["对", "介绍 → 评论 → 推广文案"], "explain": "植物学家 → 评论者 → 运营。", "tags": ["basic"], "m": "lc_chain"}, {"id": "lcc-4", "type": "multi", "stem": "如何利用 RouterChain 构建一个根据问题选择相关 prompt 的问答链", "options": ["定义若干个 prompt 和相关的 destination Chain", "构建 RouterChain，比如 LLMRouterChain", "将 destination Chain 和 RouterChain 组合成 MultiPromptChain", "根据问题，RouterChain 会选择相关的 prompt 和 destination Chain 来回答问题"], "answer": [0, 1, 2, 3], "why": ["对", "对", "对", "对"], "explain": "定义目标链 → 建路由链 → 组合成 MultiPromptChain → 按问题路由。", "tags": ["basic"], "m": "lc_chain"}, {"id": "lcc-5", "type": "multi", "stem": "路由链的组成与作用对应正确的是", "options": ["目标链：每类问题一条，如鲜花护理链、鲜花装饰链", "LLMRouterChain：让模型根据问题和各链的描述选择目标链", "RouterOutputParser：解析出 destination 和 next_inputs", "默认链：按固定顺序依次调用所有目标链"], "answer": [0, 1, 2], "why": ["对", "对", "对", "错，默认链只在问题不匹配任何类别时兜底"], "explain": "目标链、路由链、默认链、MultiPromptChain。", "tags": ["basic", "core"], "m": "lc_chain"}, {"id": "lcc-6", "type": "multi", "stem": "下列记忆类型与描述对应正确的是", "options": ["ConversationBufferMemory：保存全部对话原文", "ConversationBufferWindowMemory：只保留最近 k 轮对话", "ConversationSummaryMemory：把历史对话压缩成摘要", "ConversationSummaryBufferMemory：早期做摘要，最近几轮保留原文", "ConversationBufferMemory：最省 token"], "answer": [0, 1, 2, 3], "why": ["对", "对", "对", "对", "错，保存全部原文最费 token"], "explain": "Buffer 全量、Window 最近 k 轮、Summary 摘要、SummaryBuffer 混合。", "tags": ["basic", "core"], "m": "lc_chain"}, {"id": "lcc-7", "type": "multi", "stem": "关于记忆，下列说法正确的是", "options": ["ConversationChain 的提示里用 history 放历史对话、input 放当前输入", "ConversationSummaryMemory 生成摘要需要额外调用模型", "对话很短时，总结记忆反而可能比缓冲记忆更费 token", "模型每次调用都会自动记得上一轮对话，不需要记忆组件"], "answer": [0, 1, 2], "why": ["对", "对", "对", "错，模型不会自动记得，要靠记忆放回提示"], "explain": "history + input；总结要额外调模型。", "tags": ["basic"], "m": "lc_chain"}]}, {"id": "lc_agent", "title": "代理与工具：ReAct、AgentExecutor、结构化工具、工具箱", "short": "代理·工具", "group": "LangChain · 代理", "exam": "第 11—14 讲", "refs": [], "lessons": [{"title": "ReAct 框架与代理类型（第 11 讲）", "cards": ["### 一句话：代理（Agent）是什么\n\n<strong>代理<\/strong> = 让大模型<strong>自己决定下一步做什么、用哪个工具<\/strong>的组件。链（Chain）的步骤是<strong>事先写死<\/strong>的；代理的步骤是<strong>模型根据情况临时决定<\/strong>的。\n\n- <strong>工具（Tool）<\/strong> = 真正去干活的程序，比如<strong>搜索<\/strong>、<strong>计算器<\/strong>。模型自己不会上网、算数也可能算错，所以要配工具。\n- 课程例子：「<strong>目前市场上玫瑰花的平均价格是多少？如果我在此基础上加价 15% 卖出，应该如何定价？<\/strong>」\n  - 配两个工具：<strong>SerpAPI 搜索<\/strong>（`serpapi`）+ <strong>llm-math 计算器<\/strong>（`llm-math`）。\n  - 过程：先用 <strong>Search<\/strong> 查到均价（示例为每打 80.16 美元）→ 再用 <strong>Calculator<\/strong> 算 80.16 × 1.15 ≈ 92.18 → 给出最终答案。\n- 课程写法（旧版）：`load_tools([\"serpapi\", \"llm-math\"], llm=llm)` 加载工具，`initialize_agent(tools, llm, agent=AgentType.ZERO_SHOT_REACT_DESCRIPTION, verbose=True)` 创建代理。`verbose=True` 能看到中间每一步。", "### ReAct 框架：推理 + 行动\n\n<strong>ReAct = Reasoning（推理）+ Acting（行动）<\/strong>，出自 Yao 等人 2022 年的论文。\n\n| 看到题目说…… | 对不对 |\n|---|---|\n| ReAct 的灵感来自「<strong>行动<\/strong>」和「<strong>推理<\/strong>」之间的<strong>协同作用<\/strong> | ✅ 原话 |\n| 这种协同让人类（和模型）能<strong>学习新任务并作出决策或推理<\/strong> | ✅ 原话 |\n| 课程描述的步骤：<strong>观察（环境）→ 思考 → 行动<\/strong>，简化成「推理—行动」 | ✅ |\n| 运行日志里每轮出现 <strong>Thought（思考）→ Action（行动）→ Action Input（行动输入）→ Observation（观察）<\/strong>，最后是 <strong>Final Answer<\/strong> | ✅ |\n| ReAct 是最流行的<strong>前端开发框架<\/strong> | ❌ 那是 <strong>React<\/strong>（Facebook 的网页框架），只是名字像 |\n\n- <strong>和思维链（CoT）的区别<\/strong>：CoT 只在脑子里一步步想，<strong>接触不到外部世界<\/strong>，容易出现事实幻觉；ReAct 把<strong>调用工具 + 看工具结果<\/strong>放进循环，能拿到实时外部信息。\n\n> 📌 必背陷阱：<strong>ReAct ≠ React<\/strong>。题目说「ReAct 是前端框架」——错。", "### 代理类型名：对号入座（AgentType）\n\n| 类型名 | 认得出 |\n|---|---|\n| <strong>ZERO_SHOT_REACT_DESCRIPTION<\/strong> | 最基础：零样本、按<strong>工具描述<\/strong>用 ReAct 选工具（第 11 讲例子用它） |\n| <strong>CHAT_ZERO_SHOT_REACT_DESCRIPTION<\/strong> | 同上，但用<strong>聊天模型<\/strong> |\n| <strong>CONVERSATIONAL_REACT_DESCRIPTION<\/strong> / <strong>CHAT_CONVERSATIONAL_REACT_DESCRIPTION<\/strong> | 带<strong>对话记忆<\/strong>的 ReAct 代理 |\n| <strong>STRUCTURED_CHAT_ZERO_SHOT_REACT_DESCRIPTION<\/strong> | <strong>结构化工具对话代理<\/strong>，能用<strong>多输入<\/strong>工具（第 13 讲） |\n| <strong>SELF_ASK_WITH_SEARCH<\/strong> | <strong>自问自答 + 搜索<\/strong>（第 13 讲） |\n| <strong>OPENAI_FUNCTIONS<\/strong> / <strong>OPENAI_MULTI_FUNCTIONS<\/strong> | 用 OpenAI 的<strong>函数调用<\/strong>能力 |\n| <strong>REACT_DOCSTORE<\/strong> | 配合文档库（搜索 + 查找）的 ReAct |\n\n- 名字里的 <strong>ZERO_SHOT<\/strong> = 不给示例；<strong>REACT<\/strong> = 用 ReAct 框架；<strong>DESCRIPTION<\/strong> = 靠工具描述来选工具；<strong>CHAT<\/strong> = 聊天模型；<strong>CONVERSATIONAL<\/strong> = 有记忆。\n\n> 💡 LangChain 把代理大致分两类：<strong>行动代理（Action Agents）<\/strong>——每步现想现做；<strong>计划与执行代理（Plan-and-Execute Agents）<\/strong>——先定计划再一步步执行。"]}, {"title": "AgentExecutor：角色分工与执行循环（第 12 讲）", "cards": ["### 四个角色：谁干什么\n\n| 角色 | 一句话 | 看到题目说……就选 |\n|---|---|---|\n| <strong>大模型（LLM）<\/strong> | 提供推理能力，生成「下一步做什么」的文字 | 「逻辑引擎」「生成预测」 |\n| <strong>代理（Agent）<\/strong> | 组装提示、<strong>调用模型<\/strong>、决定下一步是<strong>用哪个工具<\/strong>还是<strong>结束<\/strong> | 「决定下一步行动」「plan」 |\n| <strong>工具（Tool）<\/strong> | 真正执行搜索、计算等操作，返回结果 | 「执行具体操作」 |\n| <strong>工具箱（Toolkit）<\/strong> | 一组相关工具 | 「一组工具」 |\n| <strong>代理执行器（AgentExecutor）<\/strong> | 代理的<strong>运行环境<\/strong>：<strong>维护工具并交给代理<\/strong>、<strong>解析代理输出<\/strong>、调用工具、把结果反馈回去，<strong>循环直到结束<\/strong> | 「驱动循环」「执行代理选择的操作」 |\n\n> 📌 必背陷阱（真题）：\n> - 「AgentExecutor <strong>直接调用 LLM<\/strong> 生成回复」——<strong>错<\/strong>，调模型的是 <strong>Agent<\/strong>（通过 plan）。\n> - 「AgentExecutor <strong>为每个任务调用新的代理实例<\/strong>」——<strong>错<\/strong>，同一个代理在循环里反复用。\n> - 「AgentExecutor <strong>维护工具（链）并传递给代理<\/strong>」「<strong>负责解析代理的输出<\/strong>」——<strong>对<\/strong>。", "### 执行循环：跟着源码走一遍\n\n课程用调试器追了一遍旧版源码，关键方法名认得出就行：\n\n1. `agent.run(问题)` → 进入 <strong>AgentExecutor<\/strong> 的 `_call`。\n2. 循环调用 **`_take_next_step`**（走一步）。\n3. 里面调用代理的 **`plan`<strong>：代理把<\/strong>工具名称和描述 + 任务 + 之前的步骤**拼成提示，交给模型（LLMChain 的 predict）。\n4. <strong>输出解析器<\/strong>解析模型输出，得到两种结果之一：\n   - <strong>AgentAction<\/strong>（要用工具）→ 找到对应工具，`tool.run(输入)` → 得到 <strong>Observation<\/strong>，拼进下一轮提示；\n   - <strong>AgentFinish<\/strong>（完成）→ 返回最终答案，循环结束。\n\n<strong>玫瑰例子两轮<\/strong>：第 1 轮模型输出 Action = Search → 搜索结果作为 Observation；第 2 轮模型看到价格，输出 Action = Calculator → 得到 92.18；第 3 轮输出 <strong>Final Answer<\/strong>。\n\n> 💡 模型能不能选对工具，<strong>全靠工具的名称和描述写得清不清楚<\/strong>——描述就写在提示里给模型看。"]}, {"title": "结构化工具、Self-Ask、Plan and Execute（第 13 讲）", "cards": ["### 第 13 讲的三种代理：对号入座\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 能使用<strong>多输入（多参数）的工具<\/strong>；能<strong>组合调用多个工具<\/strong>完成复杂任务；用 ReAct 逻辑 | <strong>结构化工具对话代理<\/strong>（STRUCTURED_CHAT_ZERO_SHOT_REACT_DESCRIPTION） |\n| 把复杂问题拆成<strong>子问题<\/strong>，逐个搜索，再回答原问题（多跳问题） | <strong>自主询问搜索代理<\/strong>（Self-Ask with Search） |\n| <strong>先制定计划，再由执行器逐步完成<\/strong>子任务 | <strong>计划与执行代理<\/strong>（Plan and Execute） |\n\n### 结构化工具对话代理\n\n- 早期工具只能接收<strong>一个字符串<\/strong>输入；<strong>结构化工具（StructuredTool）<\/strong>能接收<strong>多个字段<\/strong>（例如网址 + CSS 选择器 + 属性）。\n- 课程用 <strong>Playwright 浏览器工具箱<\/strong>（PlayWrightBrowserToolkit）演示：问「python.langchain.com 上有哪些标题」，代理先 `navigate_browser` 打开网页，再 `get_elements` 提取标题。\n\n| 浏览器工具名 | 干嘛 |\n|---|---|\n| navigate_browser | 打开网址 |\n| previous_webpage | 返回上一页 |\n| click_element | 点击元素 |\n| extract_text | 提取页面文字 |\n| extract_hyperlinks | 提取链接 |\n| get_elements | 按 CSS 选择器取元素 |\n| current_webpage | 当前网址 |\n\n> 📌 必背陷阱：「结构化工具对话代理<strong>只能调用单一工具<\/strong>」「<strong>两个代理交互管理对话<\/strong>」——都<strong>错<\/strong>（后者像第 18 讲的 CAMEL）。", "### Self-Ask with Search 与 Plan and Execute\n\n<strong>Self-Ask with Search（自问自答式搜索）<\/strong>\n- 课程问题：「<strong>使用玫瑰作为国花的国家的首都是哪里？<\/strong>」——这是<strong>多跳问题<\/strong>：先问「哪个国家国花是玫瑰」（英国）→ 再问「英国首都」（伦敦）。\n- 每个子问题的答案叫 <strong>中间答案<\/strong>；配的搜索工具名字必须叫 <strong>Intermediate Answer<\/strong>。\n- 类型名 <strong>SELF_ASK_WITH_SEARCH<\/strong>。\n\n<strong>Plan and Execute（计划与执行）<\/strong>\n- 两部分：<strong>规划器（Planner）<\/strong>——用模型列出步骤计划；<strong>执行器（Executor）<\/strong>——一般是一个带工具的代理，逐步执行。\n- 灵感来自 <strong>BabyAGI<\/strong> 和 <strong>Plan-and-Solve<\/strong> 论文。课程放在 <strong>langchain_experimental<\/strong> 里：`PlanAndExecute`、`load_chat_planner`、`load_agent_executor`。\n- 课程问题：「<strong>在纽约，100 美元能买几束玫瑰？<\/strong>」——先计划（查价格 → 计算），再执行。\n\n| 一对易混 | 区别 |\n|---|---|\n| 行动代理（如 ReAct） | <strong>每一步现想现做<\/strong> |\n| 计划与执行代理 | <strong>先把整个计划想好<\/strong>，再一步步做 |"]}, {"title": "工具与工具箱：arXiv、Gmail（第 14 讲）", "cards": ["### Tool 和 Toolkit\n\n<strong>工具（Tool）<\/strong> = 代理可以调用的一个功能单元，包含：\n\n| 组成 | 说明 |\n|---|---|\n| <strong>名称（name）<\/strong> | 工具叫什么 |\n| <strong>描述（description）<\/strong> | 什么时候用、能干什么——<strong>写进提示给模型看<\/strong> |\n| <strong>输入格式（JSON 模式 / args_schema）<\/strong> | 需要什么参数 |\n| <strong>调用的函数<\/strong> | 真正执行的代码 |\n| <strong>return_direct<\/strong> | 结果是否直接返回给用户 |\n\n<strong>工具箱（Toolkit）<\/strong> = 为完成某类任务而<strong>组合在一起的一组工具<\/strong>，用 `get_tools()` 取出里面的工具列表交给代理。\n\n<strong>使用工具的流程<\/strong>：① <strong>初始化 / 加载工具<\/strong>（`load_tools([...])` 或自定义）→ ② 把工具（或工具箱里的工具）交给代理（`initialize_agent`）→ ③ 代理运行时由执行器调用工具的 `run` 方法，把结果作为观察返回。\n\n| 常见内置工具（认得出） | 常见工具箱（认得出） |\n|---|---|\n| SerpAPI、Google 搜索、Bing 搜索、DuckDuckGo、<strong>arXiv<\/strong>、Wikipedia、Wolfram Alpha、Python REPL、Shell、Requests、OpenWeatherMap、YouTube、Zapier、<strong>Human（人类当工具）<\/strong> | <strong>Gmail<\/strong>、<strong>PlayWright 浏览器<\/strong>、<strong>SQL Database<\/strong>、CSV、JSON、Pandas DataFrame、GitHub、Jira、Office365、OpenAPI、Vectorstore |", "### 两个案例\n\n<strong>arXiv 科研助理<\/strong>\n- `load_tools([\"arxiv\"])` 加载 arXiv 工具，用 <strong>ZERO_SHOT_REACT_DESCRIPTION<\/strong> 代理。\n- 问题：「<strong>介绍一下 2005.14165 这篇论文的创新点<\/strong>」（即 GPT-3 论文 *Language Models are Few-Shot Learners*）。代理看到 arXiv 工具描述 → 生成搜索动作 → 工具返回论文信息 → 模型总结。\n\n<strong>Gmail 工具箱<\/strong>\n- <strong>GmailToolkit<\/strong>，要先在 Google 开通 API，下载 <strong>credentials.json<\/strong>（授权后生成 token.json）。\n- 用<strong>结构化工具对话代理<\/strong>（STRUCTURED_CHAT_ZERO_SHOT_REACT_DESCRIPTION）——因为邮件工具需要多个参数。\n- 问题：「<strong>易速鲜花客服给我发邮件了么？最新的邮件是谁发给我的？<\/strong>」\n- 工具箱里的工具：<strong>创建草稿<\/strong>（GmailCreateDraft）、<strong>发送邮件<\/strong>（GmailSendMessage）、<strong>搜索邮件<\/strong>（GmailSearch）、<strong>获取邮件<\/strong>（GmailGetMessage）、<strong>获取会话<\/strong>（GmailGetThread）。\n\n> 📌 模型只<strong>提出<\/strong>调用意图，真正读邮件、搜论文的是<strong>工具<\/strong>；能不能读到邮件取决于<strong>授权<\/strong>。"]}], "questions": [{"id": "lca-p1", "type": "single", "stem": "ReAct 框架名字里的两个词是？", "options": ["Reasoning（推理）和 Acting（行动）", "Reading（阅读）和 Action（动作）", "Retrieval（检索）和 Answer（回答）", "React 前端框架的缩写"], "answer": [0], "why": ["对", "不是", "那更像 RAG", "ReAct ≠ React"], "explain": "ReAct = 推理 + 行动。", "tags": [], "lesson": 0, "m": "lc_agent"}, {"id": "lca-p2", "type": "single", "stem": "在代理执行循环中，真正调用大模型、决定下一步用哪个工具的是？", "options": ["Agent（代理），通过 plan 方法", "AgentExecutor 直接调用 LLM", "Tool（工具）", "Toolkit（工具箱）"], "answer": [0], "why": ["对", "AgentExecutor 是驱动循环的，不直接调 LLM", "工具只执行操作", "工具箱只是一组工具"], "explain": "Agent 想，Tool 做，Executor 驱动循环。", "tags": [], "lesson": 1, "m": "lc_agent"}, {"id": "lca-p3", "type": "single", "stem": "能使用多输入工具、组合调用多个工具的代理是？", "options": ["结构化工具对话代理", "Self-Ask with Search 代理", "CAMEL", "REACT_DOCSTORE 代理"], "answer": [0], "why": ["对，STRUCTURED_CHAT_ZERO_SHOT_REACT_DESCRIPTION", "它是拆子问题搜索", "那是第 18 讲的角色扮演", "配合文档库"], "explain": "多输入工具 → 结构化工具对话代理。", "tags": [], "lesson": 2, "m": "lc_agent"}, {"id": "lca-p4", "type": "single", "stem": "判断：Toolkit（工具箱）是为完成某类任务而组合在一起的一组相关工具，例如 Gmail 工具箱", "options": ["正确", "错误"], "answer": [0], "why": ["对", "这正是工具箱的定义"], "explain": "工具箱 = 一组工具。", "tags": [], "lesson": 3, "m": "lc_agent"}, {"id": "lca-1", "type": "multi", "stem": "关于智能代理的 ReAct 框架，下列说法正确的是", "options": ["ReAct 框架的灵感来自「行动」和「推理」之间的协同作用", "这种协同作用使得人类能够学习新任务并作出决策或推理", "ReAct 是目前最流行的前端开发框架", "课程把它的过程描述为「观察—思考—行动」，简化为「推理—行动」", "与只在内部推理的思维链相比，ReAct 能借助工具获取外部信息"], "answer": [0, 1, 3, 4], "why": ["原话", "原话", "错，那是 React，名字像而已", "对", "对，CoT 接触不到外部世界"], "explain": "ReAct = 推理 + 行动 + 工具观察的循环，不是 React。", "tags": ["basic"], "m": "lc_agent"}, {"id": "lca-2", "type": "multi", "stem": "第 11 讲「查玫瑰均价再加价 15%」的例子中，代理用到了哪些工具？", "options": ["SerpAPI 搜索工具", "llm-math 计算工具", "Gmail 工具箱", "arXiv 工具", "Playwright 浏览器工具"], "answer": [0, 1], "why": ["对，先搜价格", "对，再算加价", "那是第 14 讲", "那是第 14 讲", "那是第 13 讲"], "explain": "玫瑰定价 = Search + Calculator。", "tags": ["basic", "core"], "m": "lc_agent"}, {"id": "lca-3", "type": "multi", "stem": "AgentType.<strong>ZERO_SHOT_REACT_DESCRIPTION<\/strong> 中各部分的含义，说法正确的是", "options": ["ZERO_SHOT：不提供示例", "REACT：使用 ReAct 框架", "DESCRIPTION：根据工具的描述来选择工具", "这种代理自带对话记忆", "它是第 11 讲玫瑰定价例子用的代理类型"], "answer": [0, 1, 2, 4], "why": ["对", "对", "对", "错，带记忆的是 CONVERSATIONAL_REACT_DESCRIPTION", "对"], "explain": "零样本 + ReAct + 按工具描述选工具。", "tags": ["basic", "core"], "m": "lc_agent"}, {"id": "lca-4", "type": "multi", "stem": "AgentExecutor 用于驱动代理和工具完成任务，关于它的工作原理，正确的是", "options": ["AgentExecutor 直接调用 LLM 生成回复", "AgentExecutor 维护工具并将其传递给代理", "AgentExecutor 负责解析代理的输出，决定调用工具还是结束", "AgentExecutor 为每个任务调用新的代理实例"], "answer": [1, 2], "why": ["错，调用 LLM 的是代理（plan）", "对", "对", "错，同一个代理在循环中反复使用"], "explain": "Executor 管循环、管工具、管解析，不直接调 LLM。", "tags": ["basic"], "m": "lc_agent"}, {"id": "lca-5", "type": "multi", "stem": "代理执行循环中，模型输出被解析后可能得到哪两种结果？", "options": ["AgentAction：要调用某个工具", "AgentFinish：任务完成，返回最终答案", "Toolkit：新建一个工具箱", "Memory：写入记忆", "Retriever：检索文档"], "answer": [0, 1], "why": ["对，执行工具后得到 Observation", "对，循环结束", "不是解析结果", "不是解析结果", "不是解析结果"], "explain": "AgentAction 继续，AgentFinish 结束。", "tags": ["basic", "core"], "m": "lc_agent"}, {"id": "lca-6", "type": "single", "stem": "判断：模型能否选对工具，很大程度取决于工具的名称和描述是否清楚，因为这些描述会写进提示交给模型", "options": ["正确", "错误"], "answer": [0], "why": ["对", "工具描述就在提示里"], "explain": "工具描述写清楚，模型才会选。", "tags": ["basic"], "m": "lc_agent"}, {"id": "lca-7", "type": "multi", "stem": "结构化工具对话代理的特点包括", "options": ["使用 ReAct 逻辑", "能够调用多个工具以完成复杂任务", "只能调用单一工具以保证准确性", "两个代理交互管理对话进程", "能使用接收多个参数的结构化工具"], "answer": [0, 1, 4], "why": ["对，类型名里就有 REACT", "对", "错，正相反", "错，那像 CAMEL 的角色扮演", "对"], "explain": "结构化 = 多输入、多工具、ReAct。", "tags": ["basic"], "m": "lc_agent"}, {"id": "lca-8", "type": "multi", "stem": "下列代理与描述对应正确的是", "options": ["Self-Ask with Search：把问题拆成子问题，逐个搜索后回答原问题", "Plan and Execute：先制定计划，再由执行器逐步完成", "Self-Ask with Search 适合「使用玫瑰作为国花的国家的首都是哪里」这类多跳问题", "Plan and Execute 每一步都现想现做，不做整体计划", "Self-Ask with Search 的搜索工具要命名为 Intermediate Answer"], "answer": [0, 1, 2, 4], "why": ["对", "对", "对", "错，那是行动代理的特点", "对，中间答案"], "explain": "Self-Ask 拆子问题；Plan and Execute 先计划后执行。", "tags": ["basic", "core"], "m": "lc_agent"}, {"id": "lca-9", "type": "single", "stem": "Playwright 浏览器工具箱的例子中，代理先打开网页、再提取标题，用到的两个工具是？", "options": ["navigate_browser 和 get_elements", "serpapi 和 llm-math", "arxiv 和 wikipedia", "GmailSearch 和 GmailGetMessage"], "answer": [0], "why": ["对", "那是第 11 讲", "不是浏览器工具", "那是 Gmail 工具箱"], "explain": "打开网页 navigate_browser，取元素 get_elements。", "tags": ["basic"], "m": "lc_agent"}, {"id": "lca-10", "type": "multi", "stem": "关于 LangChain 中工具（Tool）的组成，下列说法正确的是", "options": ["有名称", "有描述，告诉模型什么时候用、能干什么", "有输入参数格式（JSON 模式）", "有真正执行的函数", "必须是一个大模型"], "answer": [0, 1, 2, 3], "why": ["对", "对", "对", "对", "错，工具可以是搜索、计算、数据库查询等任何功能"], "explain": "工具 = 名称 + 描述 + 输入格式 + 执行函数。", "tags": ["basic", "core"], "m": "lc_agent"}, {"id": "lca-11", "type": "multi", "stem": "关于第 14 讲的两个案例，说法正确的是", "options": ["arXiv 案例用 load_tools([\"arxiv\"]) 加载工具，询问论文 2005.14165 的创新点", "Gmail 案例需要先开通 Google API，准备 credentials.json 授权", "Gmail 工具箱包含搜索邮件、获取邮件、创建草稿、发送邮件等工具", "Gmail 案例中，大模型自己直接登录邮箱读取邮件", "Gmail 案例使用结构化工具对话代理"], "answer": [0, 1, 2, 4], "why": ["对", "对", "对", "错，读邮件的是工具，模型只提出调用意图", "对，邮件工具需要多个参数"], "explain": "模型出主意，工具去执行，授权决定能不能读。", "tags": ["basic"], "m": "lc_agent"}, {"id": "lca-12", "type": "multi", "stem": "下列属于 LangChain 工具箱（Toolkit）的是", "options": ["Gmail 工具箱", "PlayWright 浏览器工具箱", "SQL Database 工具箱", "Pandas DataFrame 工具箱", "ConversationBufferMemory"], "answer": [0, 1, 2, 3], "why": ["对", "对", "对", "对", "错，那是记忆类，不是工具箱"], "explain": "工具箱：Gmail、浏览器、SQL、CSV/JSON/Pandas……", "tags": ["basic", "core"], "m": "lc_agent"}]}, {"id": "lc_rag", "title": "RAG、连接数据库与回调", "short": "RAG·数据库·回调", "group": "LangChain · 检索与数据", "exam": "第 15—17 讲", "refs": [], "lessons": [{"title": "RAG：加载、切分、嵌入、向量库、检索器、索引（第 15 讲）", "cards": ["### 一句话：RAG 是什么\n\n<strong>RAG（Retrieval-Augmented Generation，检索增强生成）<\/strong>：回答问题前，先从外部资料里<strong>检索<\/strong>相关内容，再和问题一起交给大模型<strong>生成<\/strong>答案。不用重新训练模型，资料更新了也能答。\n\n<strong>RAG 的工作原理三步（真题原话）<\/strong>：\n\n| 步骤 | 原话 |\n|---|---|\n| <strong>检索<\/strong> | 对于给定的输入（问题），模型首先使用检索系统从大型文档集合中<strong>查找相关的文档或段落<\/strong> |\n| <strong>上下文编码<\/strong> | 找到相关的文档或段落后，模型将它们<strong>与原始输入（问题）一起编码<\/strong> |\n| <strong>生成<\/strong> | 使用编码的上下文信息，通过大模型<strong>生成输出（答案）<\/strong> |\n\n> 📌 必背陷阱：RAG 只有 <strong>检索 → 上下文编码 → 生成<\/strong> 三步。「<strong>检查<\/strong>：通过搜索核对最终信息是否准确」——<strong>不是<\/strong> RAG 的步骤。\n\n<strong>整条流水线（对应第 02 讲的知识库问答）<\/strong>：文档<strong>加载<\/strong> → 文本<strong>切分<\/strong> → <strong>嵌入<\/strong>并存入<strong>向量库<\/strong> → <strong>检索<\/strong> → 交给模型<strong>生成<\/strong>。", "### 加载与切分：对号入座\n\n<strong>文档加载器（Document Loader）<\/strong>：把 PDF、Word、网页、文本等读成 LangChain 的 <strong>Document<\/strong>（正文 page_content + 元数据 metadata）。\n\n| 加载器 | 读什么 |\n|---|---|\n| TextLoader | 纯文本 |\n| PyPDFLoader | PDF |\n| Docx2txtLoader | Word |\n| CSVLoader | CSV |\n| UnstructuredFileLoader / WebBaseLoader 等 | 各种文件 / 网页 |\n\n<strong>文本切分器（Text Splitter）<\/strong>：把长文档切成小块（文档块）。\n\n| 切分器 | 认得出 |\n|---|---|\n| <strong>CharacterTextSplitter<\/strong> | 按<strong>字符<\/strong>（默认按换行）切 |\n| <strong>RecursiveCharacterTextSplitter<\/strong> | <strong>递归<\/strong>按段落→句子→词逐级切，<strong>通用文本推荐<\/strong> |\n| 按 <strong>Token<\/strong> 切（如 tiktoken） | 按模型的 token 数控制大小 |\n| <strong>MarkdownHeaderTextSplitter<\/strong> | 按 Markdown <strong>标题<\/strong>切 |\n| 代码切分（Language） | 按编程语言语法切 |\n\n- 三个关键参数：<strong>分割依据（separators）<\/strong>、<strong>块大小（chunk_size）<\/strong>、<strong>块之间的重叠（chunk_overlap）<\/strong>。重叠是为了不把一句话的上下文切断。\n- <strong>文档转换<\/strong>不只是切分，还包括：<strong>过滤冗余<\/strong>（去重）、<strong>翻译<\/strong>、<strong>提取元数据<\/strong>、把对话<strong>转成问答格式<\/strong>。", "### 嵌入、缓存、向量库、检索器、索引\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 给<strong>多个文档<\/strong>生成向量 | <strong>embed_documents<\/strong> |\n| 给<strong>单条查询<\/strong>生成向量 | <strong>embed_query<\/strong> |\n| 嵌入结果<strong>缓存<\/strong>起来，相同文本不再重复计算 | <strong>CacheBackedEmbeddings<\/strong> |\n| 存向量、做相似度搜索 | <strong>向量数据库<\/strong>（Chroma、FAISS、Qdrant、Pinecone 等） |\n| 按问题返回相关文档（不一定存向量） | <strong>检索器 Retriever<\/strong>（如 `vectorstore.as_retriever()`） |\n| 一行代码从加载器建好索引再提问 | <strong>VectorstoreIndexCreator<\/strong>（`from_loaders` → `query`） |\n| 记录文档哈希、写入时间、来源 ID，避免<strong>重复写入<\/strong>、清理旧内容 | <strong>索引 API + 记录管理器（SQLRecordManager）<\/strong> |\n\n- 为什么嵌入分两个方法：有些模型对<strong>文档<\/strong>和<strong>查询<\/strong>的处理方式不同。\n- <strong>CacheBackedEmbeddings<\/strong>：包一层<strong>底层嵌入模型<\/strong>，用<strong>文本哈希<\/strong>作键，缓存可存在<strong>内存（InMemoryStore）、本地文件（LocalFileStore）、Redis<\/strong> 等；用 <strong>namespace<\/strong> 区分不同模型的缓存。\n- 索引的清理模式：<strong>None<\/strong>（不清理）、<strong>incremental<\/strong>（增量）、<strong>full<\/strong>（全量）。\n\n> 📌 易混一对：<strong>向量库<\/strong>负责「存 + 相似搜索」；<strong>检索器<\/strong>负责「给问题，返回文档」，接口更通用。"]}, {"title": "连接数据库：SQLDatabaseChain 与 SQL Agent（第 16 讲）", "cards": ["### 一句话：用自然语言查数据库\n\n用户说人话（「有多少种不同的鲜花？」），数据库只懂 SQL。流程：\n\n<strong>提出问题 → 大模型把问题转成 SQL（Text-to-SQL）→ 执行 SQL → 大模型把查询结果整理成自然语言答案<\/strong>\n\n- 课程用 Python 自带的 <strong>sqlite3<\/strong> 建了 <strong>SQLite<\/strong> 数据库 `FlowerShop.db`，表 <strong>Flowers<\/strong>，字段有：名称（Name）、种类（Type）、产地（Source）、进价（PurchasePrice）、售价（SalePrice）、库存（StockQuantity）、销量（SoldQuantity）、有效期（ExpiryDate）、描述、录入日期等。\n- SQLite 是<strong>文件型数据库<\/strong>，不用单独启动数据库服务器，适合演示。\n\n### SQLDatabaseChain 三步\n\n| 步骤 | 写法 |\n|---|---|\n| ① 连接数据库 | `db = SQLDatabase.from_uri(\"sqlite:///FlowerShop.db\")` |\n| ② 创建链，<strong>传入 LLM 和数据库<\/strong> | `db_chain = SQLDatabaseChain.from_llm(llm, db, verbose=True)` |\n| ③ 用 <strong>run<\/strong> 提问 | `db_chain.run(\"有多少种不同的鲜花？\")` |\n\n> 📌 必背陷阱：用 SQLDatabaseChain <strong>不需要自己写 SQL 语句或检索函数<\/strong>——SQL 是<strong>模型自动生成<\/strong>的。", "### SQL Agent：更灵活\n\n- 创建：`create_sql_agent(llm, toolkit=SQLDatabaseToolkit(db=db, llm=llm), verbose=True)`。\n- 它是一个带<strong>数据库工具箱<\/strong>的代理，能自己决定先干什么，<strong>出错还能改 SQL 重试<\/strong>。\n\n| SQLDatabaseToolkit 的工具 | 干嘛 |\n|---|---|\n| <strong>sql_db_list_tables<\/strong> | <strong>列出<\/strong>数据库里有哪些表 |\n| <strong>sql_db_schema<\/strong> | 查看指定表的<strong>结构<\/strong>和样例行 |\n| <strong>sql_db_query_checker<\/strong> | 执行前<strong>检查 SQL<\/strong> 写得对不对 |\n| <strong>sql_db_query<\/strong> | <strong>执行<\/strong> SQL，返回结果 |\n\n典型过程：列出表 → 看表结构 → 写 SQL（检查）→ 执行 → 根据结果回答。\n\n| 一对易混 | 区别 |\n|---|---|\n| <strong>SQLDatabaseChain<\/strong> | 步骤<strong>相对固定<\/strong>：生成 SQL → 执行 → 回答 |\n| <strong>SQL Agent<\/strong> | 用工具<strong>自主多步<\/strong>探索，更灵活，但调用轮数更多 |"]}, {"title": "回调：CallbackHandler、事件、配置位置、异步（第 17 讲）", "cards": ["### 一句话：回调是什么\n\n<strong>回调（Callback）<\/strong> = 把一个函数交给别的程序，让它<strong>在特定时机调用<\/strong>。课程例子：`compute(3, 4, callback)` 算出 7 后调用 callback，传打印函数就打印 7。\n\n- <strong>回调 ≠ 异步<\/strong>：同步程序也能用回调；<strong>异步<\/strong>是指等待（如等网络）时把执行权让出去、先干别的。课程用 Python 的 <strong>asyncio<\/strong>（`async`/`await`、`asyncio.gather` 并发）演示。\n\n<strong>LangChain 的回调<\/strong>：在<strong>模型、链、工具、代理<\/strong>运行的各个阶段触发，用来做<strong>日志、监控、流式输出、统计 token<\/strong> 等。\n\n| 名字 | 认得出 |\n|---|---|\n| <strong>CallbackHandler<\/strong>（BaseCallbackHandler） | <strong>回调处理器<\/strong>：写好在各事件上要做什么 |\n| <strong>AsyncCallbackHandler<\/strong> | 异步版处理器 |\n| <strong>CallbackManager<\/strong> | <strong>回调管理器<\/strong>：在事件发生时调用已注册的处理器 |\n| <strong>StdOutCallbackHandler<\/strong> | 把事件打印到终端（`verbose=True` 就相当于它） |\n| <strong>FileCallbackHandler<\/strong> | 把事件写进<strong>日志文件<\/strong> |", "### 回调事件：LLM / Chain / Tool 都有开始和结束\n\n| 对象 | 事件方法 |\n|---|---|\n| <strong>LLM<\/strong> | <strong>on_llm_start<\/strong>、<strong>on_llm_new_token<\/strong>（生成新 token，流式输出用）、<strong>on_llm_end<\/strong>、on_llm_error；聊天模型还有 on_chat_model_start |\n| <strong>Chain<\/strong> | <strong>on_chain_start<\/strong>、<strong>on_chain_end<\/strong>、on_chain_error |\n| <strong>Tool<\/strong> | <strong>on_tool_start<\/strong>、<strong>on_tool_end<\/strong>、on_tool_error |\n| <strong>Agent<\/strong> | <strong>on_agent_action<\/strong>、<strong>on_agent_finish<\/strong> |\n| 其它 | on_text |\n\n> 📌 真题：可以在哪些地方用回调？<strong>LLM 执行前/后、Tool 执行前/后、Chain 执行前/后——全选<\/strong>。\n\n### 在哪里配置回调\n\n| 方式 | 写法 | 作用范围 |\n|---|---|---|\n| <strong>构造函数回调<\/strong> | 创建对象时传 `callbacks=[handler]`，如 `LLMChain(..., callbacks=[handler])` | 这个对象的<strong>所有调用<\/strong> |\n| <strong>请求回调<\/strong> | 调用时传，如 `chain.run(..., callbacks=[handler])` | <strong>只对这一次请求<\/strong>有效 |\n\n- <strong>get_openai_callback<\/strong>：`with get_openai_callback() as cb:` 包住调用，之后看 <strong>cb.total_tokens<\/strong> 等，统计 <strong>token 用量和花费<\/strong>。课程用它统计带记忆的多轮对话消耗。\n- 课程例子：同步处理器在 on_llm_new_token 里<strong>流式<\/strong>打印鲜花店回答；异步处理器在 on_llm_start / on_llm_end 里模拟准备与整理。"]}], "questions": [{"id": "lcr-p1", "type": "single", "stem": "Embeddings 类中，给<strong>单条查询<\/strong>生成向量的方法是？", "options": ["embed_query", "embed_documents", "as_retriever", "from_loaders"], "answer": [0], "why": ["对", "那是给多个文档", "那是把向量库变检索器", "那是 VectorstoreIndexCreator 的"], "explain": "文档 embed_documents，查询 embed_query。", "tags": [], "lesson": 0, "m": "lc_rag"}, {"id": "lcr-p2", "type": "single", "stem": "SQLDatabaseToolkit 中，用来<strong>列出数据库有哪些表<\/strong>的工具是？", "options": ["sql_db_list_tables", "sql_db_schema", "sql_db_query", "sql_db_query_checker"], "answer": [0], "why": ["对", "看表结构", "执行 SQL", "检查 SQL"], "explain": "list_tables 列表，schema 看结构，query 执行。", "tags": [], "lesson": 1, "m": "lc_rag"}, {"id": "lcr-p3", "type": "single", "stem": "判断：回调就是异步，只能在异步程序中使用", "options": ["正确", "错误"], "answer": [1], "why": ["错", "回调 ≠ 异步，同步程序也能用回调"], "explain": "回调是「到点调用」，异步是「等待时让出执行权」。", "tags": [], "lesson": 2, "m": "lc_rag"}, {"id": "lcr-1", "type": "multi", "stem": "RAG 的工作原理可以概括为下面哪几个步骤？", "options": ["检索：对于给定的输入，先用检索系统从大型文档集合中查找相关的文档或段落", "上下文编码：把找到的文档或段落与原始输入一起编码", "生成：使用编码的上下文信息，通过大模型生成输出", "检查：通过搜索功能，核对最终信息是否准确"], "answer": [0, 1, 2], "why": ["原话", "原话", "原话", "编造的第四步，RAG 只有三步"], "explain": "RAG = 检索 → 上下文编码 → 生成。", "tags": ["basic"], "m": "lc_rag"}, {"id": "lcr-2", "type": "multi", "stem": "关于文本切分，下列说法正确的是", "options": ["RecursiveCharacterTextSplitter 递归地按段落、句子等逐级切分，是通用文本的推荐选择", "chunk_size 控制块的大小", "chunk_overlap 控制相邻块之间的重叠，减少上下文被切断", "MarkdownHeaderTextSplitter 按 Markdown 标题切分", "切分块越小越好，越小答案越准"], "answer": [0, 1, 2, 3], "why": ["对", "对", "对", "对", "错，太小会丢失上下文条件"], "explain": "三个参数：分割依据、块大小、重叠。", "tags": ["basic", "core"], "m": "lc_rag"}, {"id": "lcr-3", "type": "multi", "stem": "关于嵌入与缓存，下列说法正确的是", "options": ["embed_documents 为多个文档生成向量，embed_query 为单条查询生成向量", "CacheBackedEmbeddings 可以缓存嵌入结果，避免重复计算", "嵌入缓存可以存放在内存、本地文件或 Redis 中", "CacheBackedEmbeddings 本身是一个新的嵌入模型，不需要底层模型", "更换嵌入模型时可以用 namespace 区分缓存"], "answer": [0, 1, 2, 4], "why": ["对", "对", "对", "错，它要包住一个底层嵌入模型", "对"], "explain": "缓存包住底层模型，用哈希作键。", "tags": ["basic", "core"], "m": "lc_rag"}, {"id": "lcr-4", "type": "multi", "stem": "实现一个简单的 SQLDatabaseChain，需要的步骤包括", "options": ["用 SQLDatabase.from_uri 初始化数据库连接", "自己定义 SQL 查询语句，按问题文本匹配", "用 SQLDatabaseChain.from_llm 构建链，传入 LLM 和数据库", "用链的 run 方法传入自然语言问题，得到答案", "自己编写数据库检索函数，返回文档列表"], "answer": [0, 2, 3], "why": ["对", "错，SQL 由模型自动生成", "对", "对", "错，不需要自己写检索函数"], "explain": "连库 → from_llm(llm, db) → run(问题)。", "tags": ["basic"], "m": "lc_rag"}, {"id": "lcr-5", "type": "multi", "stem": "下列属于 SQLDatabaseToolkit（SQL Agent 使用）的工具是", "options": ["sql_db_list_tables：列出表", "sql_db_schema：查看表结构", "sql_db_query_checker：检查 SQL", "sql_db_query：执行 SQL", "serpapi：网页搜索"], "answer": [0, 1, 2, 3], "why": ["对", "对", "对", "对", "错，那是搜索工具"], "explain": "SQL 工具箱四件套：列表、结构、检查、执行。", "tags": ["basic", "core"], "m": "lc_rag"}, {"id": "lcr-6", "type": "single", "stem": "「用自然语言查询数据库」的整体流程是？", "options": ["提出问题 → 模型生成 SQL → 执行 SQL → 模型把结果整理成答案", "提出问题 → 直接执行问题文本 → 返回结果", "模型生成答案 → 再去数据库核对 → 写入数据库", "先训练数据库 → 再让模型微调"], "answer": [0], "why": ["对，Text-to-SQL", "数据库不懂自然语言", "顺序不对", "不相关"], "explain": "问题 → SQL → 执行 → 整理答案。", "tags": ["basic"], "m": "lc_rag"}, {"id": "lcr-7", "type": "multi", "stem": "在 LangChain 中，可以在哪些地方使用 Callback 机制？", "options": ["LLM 执行前", "LLM 执行后", "Tool 执行前", "Tool 执行后", "Chain 执行前", "Chain 执行后"], "answer": [0, 1, 2, 3, 4, 5], "why": ["on_llm_start", "on_llm_end", "on_tool_start", "on_tool_end", "on_chain_start", "on_chain_end"], "explain": "六个全选：LLM、Tool、Chain 都有 start 和 end。", "tags": ["basic"], "m": "lc_rag"}, {"id": "lcr-8", "type": "multi", "stem": "关于回调的配置位置，下列说法正确的是", "options": ["构造函数回调：创建对象时传入 callbacks，对该对象的所有调用生效", "请求回调：调用时传入 callbacks，只对这一次请求生效", "verbose=True 相当于使用了把事件打印到终端的处理器", "回调只能在构造函数中配置", "FileCallbackHandler 可以把事件写进日志文件"], "answer": [0, 1, 2, 4], "why": ["对", "对", "对，StdOutCallbackHandler", "错，还可以在请求时配置", "对"], "explain": "构造时管全部，请求时管这一次。", "tags": ["basic", "core"], "m": "lc_rag"}, {"id": "lcr-9", "type": "single", "stem": "想统计一段代码调用 OpenAI 用掉了多少 token，应使用？", "options": ["get_openai_callback", "on_llm_new_token", "CacheBackedEmbeddings", "SQLDatabaseChain"], "answer": [0], "why": ["对，with 包住后看 cb.total_tokens", "那是流式输出时每个新 token 触发的事件", "那是嵌入缓存", "那是查数据库"], "explain": "数 token 用 get_openai_callback。", "tags": ["basic", "core"], "m": "lc_rag"}]}, {"id": "lc_app", "title": "多代理与实战：CAMEL、BabyAGI、人脉工具、客服机器人、加餐", "short": "多代理·实战", "group": "LangChain · 实战与加餐", "exam": "第 18—23 讲、加餐", "refs": [], "lessons": [{"title": "CAMEL：角色扮演（第 18 讲）", "cards": ["### 一句话：CAMEL 是什么\n\n<strong>CAMEL<\/strong>（Communicative Agents for \"Mind\" Exploration of Large Scale Language Model Society）：让<strong>两个扮演不同角色的 AI 代理互相对话<\/strong>，一步步把任务做完，人只需要给个初步想法。\n\n- 它属于 <strong>模拟代理（Simulation Agents）<\/strong>：在<strong>模拟环境中进行角色扮演<\/strong>，模拟特定场景或行为。\n- 核心方法叫 <strong>角色扮演（Role-Playing）框架<\/strong>，开场用 <strong>初始提示（Inception Prompting）<\/strong> 给双方定好规则。\n\n| 角色 | 干什么 |\n|---|---|\n| <strong>人类<\/strong> | 给出<strong>初步想法<\/strong>，指定两个角色 |\n| <strong>任务指定代理（Task Specifier Agent）<\/strong> | 把模糊想法<strong>变成具体任务<\/strong> |\n| <strong>AI 用户（AI User）<\/strong> | 像老板一样<strong>提出指令<\/strong>（Instruction） |\n| <strong>AI 助手（AI Assistant）<\/strong> | 按指令<strong>给出解决方案<\/strong>（Solution） |\n\n- 论文例子：<strong>Python 程序员<\/strong>（助手）+ <strong>股票交易员<\/strong>（用户），任务是为股市<strong>开发一个交易机器人<\/strong>。\n- 课程例子：<strong>花店营销专员<\/strong>（助手）+ <strong>花店老板<\/strong>（用户），为鲜花店策划<strong>营销方案<\/strong>（夏季玫瑰之夜）。\n\n> 📌 真题：「哪种代理被视为<strong>模拟代理<\/strong>」——选 <strong>CAMEL<\/strong>。AutoGPT、BabyAGI、HuggingGPT 是<strong>自治代理<\/strong>。", "### 初始提示与对话规则（认得出）\n\n- <strong>Inception prompting<\/strong>：开始时分别告诉双方「你是谁、目标是什么、你负责<strong>出指令<\/strong>还是<strong>完成指令<\/strong>、每轮怎么输出」。相当于给双方定一份交流规则。\n- 双方的提示：<strong>assistant_inception_prompt<\/strong>（助手）、<strong>user_inception_prompt<\/strong>（用户）；还有 <strong>task_specify_prompt<\/strong>（任务指定）。\n- 输出格式：AI 用户每轮写 <strong>「Instruction: …  Input: …」<\/strong>；AI 助手每轮以 <strong>「Solution: …」<\/strong> 开头、以 <strong>「Next request.」<\/strong> 结尾。\n- 结束标志：AI 用户认为任务完成时输出 **`<CAMEL_TASK_DONE>`<strong>；程序也设了<\/strong>对话轮数上限**（chat_turn_limit）。\n- 课程自己写了一个 <strong>CAMELAgent<\/strong> 类，管理消息：reset（重置）、update_messages（更新消息）、step（走一轮）。\n\n> 💡 两个角色聊得再热闹，<strong>不等于方案已落地<\/strong>，还要人来检查。"]}, {"title": "自治代理：AutoGPT、BabyAGI、HuggingGPT（第 19 讲）", "cards": ["### 模拟代理 vs 自治代理\n\n| 类别 | 代表 | 特点 |\n|---|---|---|\n| <strong>模拟代理<\/strong> | <strong>CAMEL<\/strong>（还有斯坦福「生成式代理」小镇） | 多角色在<strong>模拟环境里角色扮演<\/strong> |\n| <strong>自治（自主、自驱）代理<\/strong> | <strong>AutoGPT、BabyAGI、HuggingGPT<\/strong> | 给个<strong>目标<\/strong>，自己拆任务、执行、再生成新任务，<strong>持续推进<\/strong> |\n\n### 三个自治代理：对号入座\n\n| 看到题目说…… | 就选 |\n|---|---|\n| <strong>自动链接多个任务<\/strong>来实现用户设定的大目标；能上网、有长短期记忆 | <strong>AutoGPT<\/strong> |\n| 有<strong>三个代理<\/strong>：执行、创建任务、排优先级，循环跑任务列表 | <strong>BabyAGI<\/strong> |\n| 用 ChatGPT 当「大脑」，从 <strong>Hugging Face<\/strong> 上<strong>选择合适的专家模型<\/strong>执行任务；能处理<strong>多模态<\/strong>（图像、语音等）任务 | <strong>HuggingGPT<\/strong> |\n\n> 📌 必背陷阱：「<strong>BabyAGI<\/strong> 整合了多模态感知能力，处理多 AI 任务」——<strong>错<\/strong>，那是在说 <strong>HuggingGPT<\/strong>。", "### BabyAGI 的三个代理与 HuggingGPT 的四个阶段\n\n<strong>BabyAGI<\/strong>（作者 Yohei Nakajima）\n\n| 代理 | 干什么 |\n|---|---|\n| <strong>执行代理（Execution Agent）<\/strong> | 根据<strong>总目标<\/strong>和上下文，<strong>完成当前任务<\/strong> |\n| <strong>任务创建代理（Task Creation Agent）<\/strong> | 根据目标和刚完成任务的结果，<strong>创建新任务<\/strong> |\n| <strong>优先级代理（Prioritization Agent）<\/strong> | 给任务列表<strong>重新排序<\/strong> |\n\n- 循环：取任务 → 执行 → <strong>结果存进向量库<\/strong>（课程用 FAISS）→ 创建新任务 → 重新排序 → 继续。\n- 课程目标：「<strong>分析一下北京市今天的气候情况，写出鲜花储存策略<\/strong>」；课程用 <strong>langchain_experimental<\/strong> 里的 BabyAGI 实现，并设最大迭代次数防止停不下来。\n\n<strong>HuggingGPT<\/strong>（浙江大学 + 微软，又叫 JARVIS）四个阶段：\n\n1. <strong>任务规划<\/strong>（Task Planning）：ChatGPT 理解请求，拆成子任务；\n2. <strong>模型选择<\/strong>（Model Selection）：按<strong>模型描述<\/strong>从 Hugging Face 挑专家模型；\n3. <strong>任务执行<\/strong>（Task Execution）：调用选中的模型执行；\n4. <strong>响应生成<\/strong>（Response Generation）：ChatGPT 汇总结果回答用户。"]}, {"title": "实战项目：人脉工具与客服机器人（第 20—23 讲）", "cards": ["### 易速鲜花人脉工具：五步（第 20—21 讲）\n\n目标：找到适合推广鲜花的<strong>微博大 V<\/strong>，自动生成<strong>合作联系文案<\/strong>。\n\n| 步骤 | 做什么 | 用到的 LangChain 组件 |\n|---|---|---|\n| ① | 通过<strong>搜索<\/strong>找到相关微博大 V，取出 <strong>UID<\/strong> | <strong>代理 + 自定义搜索工具<\/strong>（包装 SerpAPI） |\n| ② | 根据 UID <strong>爬取<\/strong>大 V 的公开资料（JSON），并<strong>过滤<\/strong>无用字段 | 爬虫函数 |\n| ③ | 让模型根据资料写<strong>介绍和联系信<\/strong> | <strong>提示模板 + 链<\/strong> |\n| ④ | 把模型输出<strong>解析<\/strong>成结构化数据 | <strong>输出解析器<\/strong>（PydanticOutputParser） |\n| ⑤ | 做成<strong>网页<\/strong> | <strong>Flask<\/strong> |\n\n- 第 ③ 步生成的内容包括：<strong>简介（summary）、有趣的事实（facts）、可能感兴趣的话题（interest）、联系信（letter）<\/strong>。\n- 为什么<strong>自定义工具<\/strong>：内置搜索工具不能直接满足「拿到 UID」的需要。自定义工具核心 = <strong>名称 + 描述 + 调用函数<\/strong>。\n- 第 20 讲做 ①②，第 21 讲做 ③④⑤。", "### 易速鲜花客服机器人（第 22—23 讲）\n\n<strong>三步迭代（第 22 讲）<\/strong>：\n\n| 版本 | 加了什么 | 组件 |\n|---|---|---|\n| ① 能聊天 | 系统消息设定「<strong>花卉行家<\/strong>」角色，命令行循环对话 | ChatOpenAI + SystemMessage / HumanMessage |\n| ② 有<strong>记忆<\/strong> | 记住前面说过什么（「她会喜欢吗」里的「她」是谁） | <strong>Memory<\/strong>（对话记忆）+ 链 |\n| ③ 能<strong>检索<\/strong>内部资料 | 加载 PDF、Word、TXT → 切分 → 嵌入 → <strong>Qdrant<\/strong> 向量库 → 检索回答 | <strong>ConversationalRetrievalChain<\/strong> + 记忆 |\n\n- 「实时查询订单、库存」是课程留的<strong>扩展 / 思考题<\/strong>，思路参考第 16 讲<strong>连接数据库<\/strong>。\n\n> 📌 易混一对：<strong>记忆<\/strong>回答「用户刚才说过什么」；<strong>检索<\/strong>回答「内部资料里写了什么」。\n\n<strong>做界面（第 23 讲）<\/strong>：\n\n| 工具 | 认得出 |\n|---|---|\n| <strong>Streamlit<\/strong> | 用 Python 脚本快速搭<strong>数据交互网页<\/strong>；用 `streamlit run app.py` 启动；课程先用<strong>平方计算器（滑块）<\/strong>举例；用 session_state 保存会话 |\n| <strong>Gradio<\/strong> | 快速把 Python 函数接到输入输出组件，<strong>适合展示模型<\/strong>；`launch()` 启动 |\n| <strong>Flask<\/strong> | 通用 Web 框架，自己写路由和 HTML（第 21 讲人脉工具用它） |"]}, {"title": "加餐：LCEL、LangSmith、LangGraph 与 A2A", "cards": ["### 加餐：认得出就行\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 用<strong>管道符<\/strong>把提示、模型、解析器像流水线一样串起来 | <strong>LCEL<\/strong>（LangChain 表达式语言） |\n| 组件都实现统一的 <strong>Runnable<\/strong> 接口：<strong>invoke<\/strong>（调用）、<strong>batch<\/strong>（批量）、<strong>stream<\/strong>（流式），还有异步版 ainvoke 等 | <strong>LCEL / Runnable<\/strong> |\n| <strong>跟踪（Tracing）、调试（Debug）、评估<\/strong>大模型应用的平台 | <strong>LangSmith<\/strong> |\n| 用<strong>状态（State）、节点（Node）、边（Edge）<\/strong>组织有状态的 Agent 工作流，可以有分支和循环 | <strong>LangGraph<\/strong>（StateGraph） |\n| <strong>Agent 与 Agent 之间通信<\/strong>的协议，有任务状态管理 | <strong>A2A<\/strong>（Agent2Agent，Google 提出） |\n\n- LCEL 写法：`chain = prompt | model | output_parser`，前一个组件的输出自动成为后一个组件的输入，替代旧版的 LLMChain 写法。\n- LangSmith：设置环境变量（如 LANGCHAIN_TRACING_V2、LANGCHAIN_API_KEY）后，每次运行的<strong>步骤、输入输出、耗时、错误<\/strong>都能在网页上看到。\n- 热点加餐案例：用 LangGraph + A2A 做<strong>货币兑换 Agent<\/strong>；A2A 任务有处理中、需要用户补充输入、完成等<strong>状态<\/strong>，结果可以用 <strong>SSE 或 Webhook<\/strong> 推送给前端。\n\n> 📌 易混一对：<strong>LangSmith 管观察和调试<\/strong>，<strong>LangGraph 管流程编排<\/strong>。"]}], "questions": [{"id": "lcx-p1", "type": "single", "stem": "CAMEL 中负责<strong>提出指令<\/strong>的角色是？", "options": ["AI 用户", "AI 助手", "任务指定代理", "优先级代理"], "answer": [0], "why": ["对", "AI 助手负责给出解决方案", "它把模糊想法变成具体任务", "那是 BabyAGI 的"], "explain": "用户出指令，助手给方案。", "tags": [], "lesson": 0, "m": "lc_app"}, {"id": "lcx-p2", "type": "single", "stem": "BabyAGI 中负责<strong>给任务列表重新排序<\/strong>的是？", "options": ["优先级代理", "执行代理", "任务创建代理", "任务指定代理"], "answer": [0], "why": ["对", "它完成当前任务", "它创建新任务", "那是 CAMEL 的"], "explain": "执行、创建、排序三个代理。", "tags": [], "lesson": 1, "m": "lc_app"}, {"id": "lcx-p3", "type": "single", "stem": "易速鲜花人脉工具中，把模型输出解析成结构化数据用的是？", "options": ["输出解析器（PydanticOutputParser）", "Flask", "自定义搜索工具", "Qdrant 向量库"], "answer": [0], "why": ["对，第 ④ 步", "那是第 ⑤ 步做网页", "那是第 ① 步找 UID", "那是客服机器人的检索"], "explain": "第 ④ 步 = 输出解析。", "tags": [], "lesson": 2, "m": "lc_app"}, {"id": "lcx-p4", "type": "single", "stem": "用管道符 `|` 把提示、模型、解析器串成链的写法叫？", "options": ["LCEL（LangChain 表达式语言）", "LangSmith", "A2A", "CAMEL"], "answer": [0], "why": ["对", "那是跟踪调试平台", "那是 Agent 间通信协议", "那是角色扮演代理"], "explain": "管道符 = LCEL。", "tags": [], "lesson": 3, "m": "lc_app"}, {"id": "lcx-1", "type": "single", "stem": "下面哪种类型的代理被视为模拟代理（在模拟环境中进行角色扮演，试图模拟特定场景或行为）？", "options": ["AutoGPT", "BabyAGI", "CAMEL", "HuggingGPT"], "answer": [2], "why": ["自治代理", "自治代理", "对，角色扮演", "自治代理"], "explain": "模拟代理 = CAMEL，其余三个是自治代理。", "tags": ["basic"], "m": "lc_app"}, {"id": "lcx-2", "type": "multi", "stem": "关于 CAMEL 框架，下列说法正确的是", "options": ["采用角色扮演框架，让两个 AI 代理通过对话协作完成任务", "任务指定代理负责把人类的初步想法变成具体任务", "用 inception prompting（初始提示）给双方设定角色和交流规则", "AI 助手负责提出指令，AI 用户负责执行", "AI 用户认为任务完成时输出 `<CAMEL_TASK_DONE>`"], "answer": [0, 1, 2, 4], "why": ["对", "对", "对", "反了：AI 用户出指令，AI 助手给方案", "对，终止标志"], "explain": "人类给想法，任务指定代理细化，用户指令，助手解决。", "tags": ["basic", "core"], "m": "lc_app"}, {"id": "lcx-3", "type": "multi", "stem": "下列说法正确的是", "options": ["AutoGPT 能自动链接多个任务，实现大目标", "BabyAGI 的特点是整合了多模态感知能力，处理多 AI 任务", "HuggingGPT 从 Hugging Face 上选择适当的专家模型执行任务", "AutoGPT、BabyAGI 和 HuggingGPT 都是自驱（自治）型代理"], "answer": [0, 2, 3], "why": ["对", "错，多模态是 HuggingGPT 的特点", "对", "对"], "explain": "AutoGPT 链任务，BabyAGI 三代理，HuggingGPT 选专家模型。", "tags": ["basic"], "m": "lc_app"}, {"id": "lcx-4", "type": "multi", "stem": "BabyAGI 包含的代理有", "options": ["执行代理", "任务创建代理", "优先级代理", "任务指定代理", "AI 助手代理"], "answer": [0, 1, 2], "why": ["对", "对", "对", "错，那是 CAMEL 的", "错，那是 CAMEL 的"], "explain": "BabyAGI：执行、创建、排序。", "tags": ["basic", "core"], "m": "lc_app"}, {"id": "lcx-5", "type": "multi", "stem": "HuggingGPT 的工作阶段包括", "options": ["任务规划", "模型选择", "任务执行", "响应生成", "角色扮演"], "answer": [0, 1, 2, 3], "why": ["对", "对，按模型描述挑专家模型", "对", "对", "错，那是 CAMEL"], "explain": "规划 → 选模型 → 执行 → 生成回答。", "tags": ["basic", "core"], "m": "lc_app"}, {"id": "lcx-6", "type": "multi", "stem": "易速鲜花人脉工具的步骤与组件，对应正确的是", "options": ["找大 V 的 UID：代理 + 自定义搜索工具", "根据 UID 爬取公开资料，并过滤无用字段", "根据资料生成简介和联系信：提示模板 + 链", "把输出解析成结构化数据：输出解析器", "做网页：Streamlit"], "answer": [0, 1, 2, 3], "why": ["对", "对", "对", "对", "错，人脉工具用的是 Flask"], "explain": "搜 UID → 爬资料 → 写文案 → 解析 → Flask。", "tags": ["basic"], "m": "lc_app"}, {"id": "lcx-7", "type": "single", "stem": "判断：人脉工具中自己定义搜索工具，是因为内置搜索工具不能直接满足「拿到大 V 的 UID」的需要", "options": ["正确", "错误"], "answer": [0], "why": ["对", "课程原意如此"], "explain": "自定义工具 = 名称 + 描述 + 函数。", "tags": ["basic"], "m": "lc_app"}, {"id": "lcx-8", "type": "multi", "stem": "关于易速鲜花客服机器人，下列说法正确的是", "options": ["第一版用系统消息让模型扮演「花卉行家」", "加入记忆后，能理解「她会喜欢吗」里的「她」指谁", "加入检索后，把内部 PDF、Word、TXT 资料存进 Qdrant 向量库来回答", "课程已经完整实现了实时订单查询", "记忆管对话历史，检索管内部资料"], "answer": [0, 1, 2, 4], "why": ["对", "对", "对", "错，订单/库存查询是扩展思考题", "对"], "explain": "聊天 → 记忆 → 检索；订单查询是扩展。", "tags": ["basic"], "m": "lc_app"}, {"id": "lcx-9", "type": "multi", "stem": "第 23 讲为客服机器人做界面，用到的两个 Python 工具是", "options": ["Streamlit", "Gradio", "Flask", "LangSmith", "Qdrant"], "answer": [0, 1], "why": ["对", "对", "第 21 讲人脉工具用的", "那是跟踪调试平台", "那是向量库"], "explain": "客服界面：Streamlit + Gradio。", "tags": ["basic", "core"], "m": "lc_app"}, {"id": "lcx-10", "type": "multi", "stem": "下列名称与用途对应正确的是", "options": ["LCEL：用管道符把组件串成链", "LangSmith：跟踪、调试、评估大模型应用", "LangGraph：用状态、节点、边组织 Agent 工作流", "A2A：Agent 与 Agent 之间通信的协议", "LangSmith：用节点和边编排工作流"], "answer": [0, 1, 2, 3], "why": ["对", "对", "对", "对", "错，编排工作流的是 LangGraph"], "explain": "LCEL 串链，LangSmith 观察，LangGraph 编排，A2A 通信。", "tags": ["basic"], "m": "lc_app"}, {"id": "lcx-11", "type": "multi", "stem": "LCEL 中组件统一实现的 Runnable 接口，常用方法包括", "options": ["invoke", "batch", "stream", "embed_query"], "answer": [0, 1, 2], "why": ["调用", "批量", "流式", "错，那是嵌入模型的方法"], "explain": "Runnable：invoke / batch / stream。", "tags": ["basic", "core"], "m": "lc_app"}]}, {"id": "lc_quiz", "title": "结课测试真题（20 题）", "short": "真题·LangChain", "group": "LangChain · 结课测试", "exam": "结课测试原题", "quiz": true, "refs": [], "lessons": [{"title": "怎么用这 20 道真题", "cards": ["### 这是什么\n\n这 20 道题是《LangChain 实战课》<strong>结课测试的原题<\/strong>（你截图、我转成文字）。\n\n- <strong>16 道多选 + 4 道单选<\/strong>，多选要逐项判断，少选多选都算错。\n- 截图里<strong>没有答案<\/strong>。网站上的答案是我按课程内容（2023 年的旧版 LangChain）逐项判断的，每个选项都写了理由。\n- 这门课本地没有原课可以核对，有 6 道我拿不准，解析里标了 <strong>⚠️ 有争议<\/strong>。其中 3 道（第 7、15、17 题）按<strong>出题人意图<\/strong>判：这份真题凡是「步骤 / 方法包括哪些」的题几乎都是全选，选项像是照一段标准答案拆出来的，考试看的是出题人的答案。解析里也写了技术上的实际情况。\n\n### 怎么刷\n\n去「刷题」，模块选「真题·LangChain」，先做一遍；错的看解析，再回对应章节看讲解。\n\n> 📌 这门课真题的套路：考<strong>清单<\/strong>（核心组件、链的调用方式、回调位置）、考<strong>类名<\/strong>（FewShotPromptTemplate、ConversationSummaryBufferMemory、MultiPromptChain）、把<strong>别的东西的特点安上来<\/strong>（把 CAMEL 的「两个代理对话」安到结构化工具代理上，把 HuggingGPT 的「多模态」安到 BabyAGI 上）。"]}], "questions": [{"id": "lcq-1", "type": "multi", "stem": "LangChain 的核心组件包括？", "options": ["链", "记忆", "代理", "模型", "数据库"], "answer": [0, 1, 2, 3], "why": ["对", "对", "对", "对（模型 I/O）", "错：数据库是外部数据源，可以通过链/代理连接，但不是 LangChain 的核心组件"], "explain": "LangChain 六大组件：<strong>模型（Model I/O）、数据检索（Retrieval）、链、记忆、代理、回调<\/strong>。数据库不在里面。", "tags": ["basic", "core", "真题"], "m": "lc_quiz"}, {"id": "lcq-2", "type": "single", "stem": "Chat 模型和 Text 模型的区别主要在于？", "options": ["Chat 模型较新", "Chat 模型返回的数据格式与 Chat 模型不同", "Chat 模型的消息中可以有角色提示符", "Text 模型中一次可以传递多个消息"], "answer": [2], "why": ["新旧不是本质区别", "题目原文有错字（两个都写成 Chat），不是要点", "对：Chat 模型的输入是带角色（system / user / assistant）的消息列表", "反了：一次传多条消息的是 Chat 模型，Text 模型只接收一段字符串"], "explain": "Text 模型：一段字符串进、一段文本出；<strong>Chat 模型：带角色的消息列表进<\/strong>。", "tags": ["basic", "core", "真题"], "m": "lc_quiz"}, {"id": "lcq-3", "type": "multi", "stem": "一个本地文档问答系统的构造可以包含下面哪些步骤？", "options": ["Loading，文档加载器把 Documents 加载为 LangChain 能够读取的形式", "Splitting，文本分割器把 Documents 切分为指定大小的分割，即“文档块”或者“文档片”", "Storage，将分割好的“文档块”以“嵌入”的形式存储到向量数据库中，形成一个个的“嵌入片”", "Retrieval，从存储中检索分割后的文档", "Synthesis，把问题和相似的嵌入片传递给语言模型生成答案"], "answer": [0, 1, 2, 3, 4], "why": ["对", "对", "对", "对", "对：最后一步把问题和检索到的文档片交给模型生成答案（课程里也叫 Output）"], "explain": "第 02 讲 5 步：<strong>加载 Loading → 切分 Splitting → 存储 Storage（嵌入后进向量库）→ 检索 Retrieval → 生成答案<\/strong>。五个都对。", "tags": ["basic", "core", "真题"], "m": "lc_quiz"}, {"id": "lcq-4", "type": "multi", "stem": "在 LangChain 的 Model I/O 模块中，包含哪些组件？", "options": ["模型，Model I/O 的核心是对模型的调用", "提示，通过提示模板和提示工程，把提示信息传入模型", "生成，通过检索本地文档生成回答", "输出解析，把模型返回的响应内容解析为正确的格式"], "answer": [0, 1, 3], "why": ["对", "对", "错：检索本地文档是 RAG（数据检索）的事，不属于 Model I/O", "对"], "explain": "Model I/O 三环节：<strong>提示（输入）→ 模型（调用）→ 输出解析（输出）<\/strong>。", "tags": ["basic", "core", "真题"], "m": "lc_quiz"}, {"id": "lcq-5", "type": "single", "stem": "如果希望实现少样本提示，应该选择哪种提示模板？", "options": ["PromptTemplate", "ChatPromptTemplate", "FewShotPromptTemplate", "PipelinePromptTemplate"], "answer": [2], "why": ["普通字符串模板", "聊天消息模板", "对：Few-shot = 少样本", "把多个模板组合起来用的"], "explain": "少样本 = <strong>Few-shot<\/strong> → FewShotPromptTemplate（常配合 ExampleSelector 挑示例）。", "tags": ["basic", "core", "真题"], "m": "lc_quiz"}, {"id": "lcq-6", "type": "multi", "stem": "CoT 提示模板中的具体内容应包括？", "options": ["AI 的角色和目标描述", "思考链条的说明", "遵循思考链条的一些示例", "多条思维路径的集束搜索"], "answer": [0, 1, 2], "why": ["对：课程的 CoT 模板先说明 AI 是花店助手、目标是什么", "对", "对：Few-shot CoT 给出按思考链条推理的示例", "错：多条路径、搜索是<strong>思维树 ToT<\/strong> 的做法"], "explain": "CoT 模板 = 角色和目标 + 思考链条 + 示例；<strong>多条路径分支搜索是 ToT<\/strong>。", "tags": ["basic", "core", "真题"], "m": "lc_quiz"}, {"id": "lcq-7", "type": "multi", "stem": "在 LangChain 中，有哪些调用开源模型的方法？", "options": ["LangChain 内置的开源模型接口", "通过 HuggingFace Hub", "通过 HuggingFace Pipeline", "通过 Base.LLM 接口调用自定义语言模型"], "answer": [0, 1, 2, 3], "why": ["对（按出题人意图）：LangChain 本身集成了一些开源模型的接口", "对", "对", "对：继承 LangChain 的 LLM 基类，自己包装一个模型（课程用它接本地的 Llama 模型）"], "explain": "第 06 讲重点讲了三种：<strong>HuggingFace Hub、HuggingFace Pipeline、自定义 LLM 类<\/strong>。⚠️ 有争议：A 课程没单独展开，但说法本身没错，这类「有哪些方法」的题出题人通常全选，所以四个都选。", "tags": ["basic", "core", "真题"], "m": "lc_quiz"}, {"id": "lcq-8", "type": "multi", "stem": "场景：你正在构建一个智能写作助手，使用 GPT-3 作为语言模型。GPT-3 的输出是一段原始文本，你需要将其转换为结构化的 JSON 格式，以便应用进一步处理。你会选择哪种 LangChain 输出解析器？", "options": ["PydanticOutputParser", "XMLOutputParser", "StructuredOutputParser", "CommaSeparatedListOutputParser"], "answer": [0, 2], "why": ["对：按 Pydantic 定义的字段解析成结构化对象（JSON）", "错：输出的是 XML，不是 JSON", "对：按定义的字段输出 JSON", "错：输出的是逗号分隔的列表"], "explain": "要 JSON / 结构化 → <strong>Pydantic<\/strong> 或 <strong>Structured<\/strong>；要列表 → CommaSeparatedList；要 XML → XML。", "tags": ["basic", "core", "真题"], "m": "lc_quiz"}, {"id": "lcq-9", "type": "single", "stem": "下面哪种类型的记忆，既能够记住很多轮之前的对话内容摘要，又能够记住最近几轮对话的原始内容？", "options": ["ConversationBufferMemory（缓冲记忆）", "ConversationBufferWindowMemory（缓冲窗口记忆）", "ConversationSummaryMemory（对话总结记忆）", "ConversationSummaryBufferMemory（混合记忆）"], "answer": [3], "why": ["它保存全部原文", "它只保留最近 K 轮", "它只保存摘要", "对：早的做摘要，近的留原文"], "explain": "四种记忆：Buffer 全留、Window 留最近 K 轮、Summary 只留摘要、<strong>SummaryBuffer 摘要 + 最近原文<\/strong>。", "tags": ["basic", "core", "真题"], "m": "lc_quiz"}, {"id": "lcq-10", "type": "multi", "stem": "链的调用方式有哪几种？", "options": ["直接调用", "通过 run 方法", "通过 predict 方法", "通过 apply 方法", "通过 generate 方法"], "answer": [0, 1, 2, 3, 4], "why": ["对", "对", "对", "对：一次处理一组输入", "对：返回带生成信息的结果对象"], "explain": "第 08 讲五种：<strong>直接调用、run、predict、apply、generate<\/strong>。五个都对。", "tags": ["basic", "core", "真题"], "m": "lc_quiz"}, {"id": "lcq-11", "type": "multi", "stem": "如何利用 RouterChain 构建一个根据问题选择相关 prompt 的问答链？", "options": ["定义若干个 prompt 和相关的 destination Chain", "构建 RouterChain，比如 LLMRouterChain", "将 destination Chain 和 RouterChain 组合成 MultiPromptChain", "根据问题，RouterChain 会选择相关的 prompt 和 destination Chain 来回答问题"], "answer": [0, 1, 2, 3], "why": ["对：目标链", "对：路由链", "对：组合器", "对"], "explain": "第 09 讲：<strong>目标链（每类问题一个）+ 路由链（LLMRouterChain 选目的地）+ 默认链 → 组合成 MultiPromptChain<\/strong>。四个都对。", "tags": ["basic", "core", "真题"], "m": "lc_quiz"}, {"id": "lcq-12", "type": "multi", "stem": "关于智能代理的 ReAct 框架，下列说法正确的是？", "options": ["ReAct 框架的灵感正是来自“行动”和“推理”之间的协同作用", "ReAct 能够学习新任务并作出决策或推理", "ReAct 可以说是目前最为流行的前端开发框架", "ReAct 的具体步骤是观察、思考、行动"], "answer": [0, 1, 3], "why": ["对：ReAct = Reasoning + Acting", "对：课程说这种协同让模型能学习新任务、做出决策或推理", "错：那是名字很像的 <strong>React<\/strong>（前端框架）", "对：模型观察工具结果 → 思考下一步 → 行动，循环往复"], "explain": "ReAct = <strong>推理 + 行动<\/strong>，循环「思考 → 行动 → 观察」。C 是拿前端框架 React 混淆。⚠️ 有争议：B、D 措辞来自课程的概括，B 原话是在说这种协同让人（和模型）能学习新任务；D 的顺序写成「观察、思考、行动」，本质还是同一个循环，所以都判为正确。", "tags": ["basic", "core", "真题"], "m": "lc_quiz"}, {"id": "lcq-13", "type": "multi", "stem": "结构化工具对话代理的特点包括？", "options": ["使用 ReAct 逻辑", "能够调用多个工具以完成复杂任务", "只能调用单一工具以保证大模型的准确性", "两个代理交互管理对话进程"], "answer": [0, 1], "why": ["对", "对：工具的输入可以有多个字段，能组合多个工具（如 Playwright 浏览器工具箱）", "错：恰恰相反", "错：两个代理对话是 <strong>CAMEL<\/strong>"], "explain": "结构化工具代理：ReAct 逻辑 + 多字段输入的工具 + 能用多个工具。D 是把 CAMEL 的特点安上来。", "tags": ["basic", "core", "真题"], "m": "lc_quiz"}, {"id": "lcq-14", "type": "multi", "stem": "AgentExecutor 是 LangChain 中的一个组件，用于驱动代理模型和工具链完成各种任务。下面关于它工作原理的描述，正确的是？", "options": ["AgentExecutor 直接调用 LLM 生成回复", "AgentExecutor 维护一个工具链并将其传递给代理", "AgentExecutor 负责解析代理的输出", "AgentExecutor 为每个任务调用新的代理实例"], "answer": [1, 2], "why": ["错：调用 LLM 的是代理（Agent 的 plan 里组装提示、调用模型）", "对：执行器拿着工具列表，交给代理选择", "对：执行器拿到代理的输出，判断是要调用工具（AgentAction）还是已经结束（AgentFinish）", "错：同一个代理在循环里反复决策，不是每次新建"], "explain": "分工：<strong>代理（Agent）调模型、决定下一步；执行器（AgentExecutor）跑循环、调用工具、把观察结果交回代理<\/strong>。⚠️ 有争议：C，严格说文本解析是代理的输出解析器做的，执行器是根据解析结果决定下一步；按课程「执行器处理代理输出」的说法判为正确。", "tags": ["basic", "core", "真题"], "m": "lc_quiz"}, {"id": "lcq-15", "type": "multi", "stem": "LangChain 在调用工具时采取哪些步骤？", "options": ["初始化工具", "将工具添加到管理它们的 Toolkit 对象中", "在 Toolkit 对象上调用 .run()，传递输入", "直接在工具上调用 .run()"], "answer": [0, 1, 2], "why": ["对：比如用 load_tools 加载工具", "对（按出题人意图）：把相关工具放进 Toolkit 统一管理", "对（按出题人意图）：通过 Toolkit 运行，传入输入", "不选（按出题人意图）：A→B→C 是一套流程，D 是绕开 Toolkit 的另一种做法，像是干扰项"], "explain": "按出题人意图选 <strong>初始化工具 → 放进 Toolkit → 通过 Toolkit 运行<\/strong>。⚠️ 有争议：技术上 .run() 是单个工具的方法，直接 tool.run() 也行；但这题 A、B、C 明显是按一段标准答案拆出来的流程，D 是混进来的另一种做法。考试按 ABC 选。", "tags": ["basic", "core", "真题"], "m": "lc_quiz"}, {"id": "lcq-16", "type": "multi", "stem": "RAG 的工作原理可以概括为下面哪几个步骤？", "options": ["检索：对于给定的输入（问题），模型首先使用检索系统从大型文档集合中查找相关的文档或段落", "上下文编码：找到相关的文档或段落后，模型将它们与原始输入（问题）一起编码", "生成：使用编码的上下文信息，通过大模型生成输出（答案）", "检查：通过搜索功能，核对最终信息是否准确"], "answer": [0, 1, 2], "why": ["对", "对", "对", "错：RAG 没有「检查」这一步"], "explain": "RAG 三步：<strong>检索 → 上下文编码 → 生成<\/strong>。", "tags": ["basic", "core", "真题"], "m": "lc_quiz"}, {"id": "lcq-17", "type": "multi", "stem": "实现一个简单的 SQLDatabaseChain，用于从 SQL 数据库中检索文档的步骤包括？", "options": ["初始化 SQL 数据库连接", "定义 SQL 查询语句，根据问题文本进行匹配查询", "定义数据库检索函数，查询数据库并返回文档列表", "构建 SQLDatabaseChain，传入数据库检索函数和 LLM", "使用 Chain 的 run 方法，传入问题并返回结果文档"], "answer": [0, 1, 2, 3, 4], "why": ["对：SQLDatabase.from_uri 连接数据库", "对（按出题人意图）", "对（按出题人意图）", "对（按出题人意图）", "对：chain.run(问题) 得到结果"], "explain": "⚠️ 有争议：五个选项是按顺序拆开的一套流程，同类的「步骤包括」题（第 3、10、11、18 题）都是全选，所以考试按全选。技术上的实际用法是：<strong>连接数据库（SQLDatabase）→ SQLDatabaseChain.from_llm(llm, db) → run(问题)<\/strong>，SQL 由模型自动生成，并不需要自己写查询和检索函数——了解即可，别在考场上纠结。", "tags": ["basic", "core", "真题"], "m": "lc_quiz"}, {"id": "lcq-18", "type": "multi", "stem": "在 LangChain 中，可以在哪些地方使用 Callback 机制？", "options": ["LLM 执行前", "LLM 执行后", "Tool 执行前", "Tool 执行后", "Chain 执行前", "Chain 执行后"], "answer": [0, 1, 2, 3, 4, 5], "why": ["对：on_llm_start", "对：on_llm_end", "对：on_tool_start", "对：on_tool_end", "对：on_chain_start", "对：on_chain_end"], "explain": "回调事件覆盖 <strong>LLM、Tool、Chain 的开始和结束<\/strong>（还有 on_llm_new_token 流式输出、出错事件等）。六个都对。", "tags": ["basic", "core", "真题"], "m": "lc_quiz"}, {"id": "lcq-19", "type": "single", "stem": "下面那种类型的代理被视为模拟代理（在模拟环境中进行角色扮演，试图模拟特定场景或行为）？", "options": ["AutoGPT", "BabyAGI", "CAMEL", "HuggingGPT"], "answer": [2], "why": ["自治代理", "自治代理", "对：角色扮演、两个代理对话", "自治代理"], "explain": "<strong>模拟代理 = CAMEL<\/strong>（角色扮演）；<strong>自治代理 = AutoGPT、BabyAGI、HuggingGPT<\/strong>。", "tags": ["basic", "core", "真题"], "m": "lc_quiz"}, {"id": "lcq-20", "type": "multi", "stem": "下列说法正确的是？", "options": ["AutoGPT 能自动链接多个任务，实现大目标", "BabyAGI 的特点是整合了多模态感知能力，处理多 AI 任务", "HuggingGPT 从 Hugging Face 上选择适当的专家模型执行任务", "AutoGPT、BabyAGI 和 HuggingGPT 都是自驱（自治）型代理"], "answer": [0, 2, 3], "why": ["对", "错：整合多个（多模态）专家模型的是 <strong>HuggingGPT<\/strong>；BabyAGI 是「执行、创建任务、排优先级」三个代理循环", "对", "对"], "explain": "BabyAGI = 执行代理 + 任务创建代理 + 优先级代理；HuggingGPT = 规划 → 选专家模型 → 执行 → 汇总；AutoGPT = 自动串联任务。B 把 HuggingGPT 的特点安到了 BabyAGI 上。", "tags": ["basic", "core", "真题"], "m": "lc_quiz"}]}, {"id": "ah_must", "title": "必背清单：一页过完 Agent Harness 考点", "short": "必背·Harness", "group": "Agent Harness · 先看这一页", "exam": "全课考点浓缩", "quiz": true, "refs": [], "lessons": [{"title": "Agent Harness 必背清单", "cards": ["### 怎么用这一页\n\n平时<strong>主要看这一页<\/strong>，再刷「必刷」题；做错了再点进对应章节看详细讲解。标 📌 的是结课测试真题考过的。课程用 Go 写一个 Coding Agent，叫 <strong>go-tiny-claw<\/strong>；笔记用同一个例子串讲各组件：让 Agent 修好订单项目里的计算错误（第 21、22 讲另有实战案例）。\n\n### 0. 总体\n\n- <strong>Agent<\/strong> = 能反复「看结果 → 调工具 → 再决定」的系统；<strong>Harness<\/strong> = 围绕模型搭的运行环境和控制程序。<strong>模型决定做什么，Harness 负责怎么调用、把结果交回、出了异常怎么办。<\/strong>\n- 📌 Harness 好比<strong>操作系统（OS）<\/strong>（不是应用程序、内存、CPU）。\n- <strong>四层<\/strong>：<strong>入口交互层<\/strong>（CLI、飞书）、<strong>核心引擎层<\/strong>（跑循环）、<strong>上下文工程层<\/strong>（系统提示、项目规则、历史、控制长度）、<strong>工具执行层<\/strong>（管理、分发工具，执行前后加控制）。\n\n### 1. 让 Agent 能运行（第 01—05 讲）\n\n- <strong>Main Loop（主循环）<\/strong>，用 <strong>ReAct<\/strong>（推理 + 行动）：问模型 → 模型给出 <strong>ToolCall（工具调用请求）<\/strong> → 执行 → <strong>ToolResult（工具结果）<\/strong> 加回历史 → 再问模型。一来一回叫一个 <strong>Turn（轮次）<\/strong>。先用 <strong>Mock（模拟实现）<\/strong> 验证循环走得通。\n- 📌 <strong>退出循环的标志：模型返回的 ToolCalls 为空<\/strong>（给出最终回答）。轮次上限是保护措施，工具报错会交回模型继续。\n- 📌 <strong>Thinking 两阶段<\/strong>：先发一次<strong>不带工具<\/strong>（工具列表为 nil / 空）的请求让模型用文字规划 → 规划文字<strong>加进上下文<\/strong> → 再<strong>带工具<\/strong>请求（Acting）。<strong>EnableThinking<\/strong> 开关：简单任务关掉，省时间和 Token。\n- <strong>Provider（模型适配层）<\/strong>：把引擎统一的消息格式翻译成各家接口（OpenAI 兼容、Claude）的格式，再翻译回来。<strong>Tool Registry（工具注册表）<\/strong>：记录工具的名称、说明、参数格式、执行方法，按工具名找到并执行。<strong>Provider 管模型差异，Registry 管工具。<\/strong>\n- 模型只给出「要读 order.go」的请求，<strong>真正打开文件的是 Harness 里的工具<\/strong>。工具输出太长要截断。\n\n### 2. 操作文件和工具（第 06—09 讲）\n\n- 📌 <strong>四个基础工具：read_file、write_file（创建或覆盖）、edit_file（局部修改）、bash（执行命令）<\/strong>，参考 OpenClaw 的极简思路：工具少，说明短，其余用 bash 组合。本地宽松执行叫 <strong>YOLO<\/strong>；bash 要设超时、截断长输出。\n- <strong>edit<\/strong> 三个参数：文件路径、<strong>old_text<\/strong>、<strong>new_text<\/strong>。<strong>四级匹配<\/strong>：精确 → 统一换行符 → 忽略首尾空行 → 逐行去首尾空白（容忍缩进）。<strong>多处匹配就拒绝替换<\/strong>，让模型给更多上下文。\n- <strong>并发（Fork-Join）<\/strong>：goroutine 同时跑，WaitGroup 等全部完成。📌 <strong>预先分配固定长度切片，按索引无锁写入<\/strong>，结果顺序和请求顺序一致。前提是同一轮的调用互不依赖；写入类操作要小心（只读并发、写入串行、按文件加锁）。\n- <strong>Reporter（报告接口）<\/strong>：TerminalReporter 打到终端，FeishuReporter 发到飞书；引擎不用为每种界面写一套循环。飞书：用户发消息 → <strong>Webhook<\/strong> 送事件 → 启动 Agent → Reporter 回报。这一版每条消息都重新开始，不记得上一条。\n\n### 3. 记得住、装得下（第 10—13 讲）\n\n- <strong>Prompt Composer（提示词组装器）<\/strong>拼三样：<strong>基础系统提示 + 工作区的 AGENTS.md（项目规则）+ Skills（某类任务的做法）<\/strong>。技能放在 <strong>.claw/skills<\/strong> 下，<strong>SKILL.md<\/strong> 开头有 <strong>name 和 description<\/strong>。渐进加载 = 先看名字和描述、要用再读正文（课程简化实现是全读）。\n- <strong>Session（会话）<\/strong>：<strong>SessionManager<\/strong> 按会话标识分开各自的历史，加锁防并发。<strong>Working Memory<\/strong> 只取最近若干条，截取时<strong>工具调用和工具结果要成对保留<\/strong>。<strong>历史分开 ≠ 工作区分开<\/strong>（工具可能还是同一个目录）。\n- 📌 <strong>Context Compaction（上下文压缩）<\/strong>两层：<strong>旧的工具结果 → 整条换成占位提示（全量掩码），保留调用记录<\/strong>；<strong>近期（保护区内）但超长的 → 保留首尾各 500 字、截去中间<\/strong>。用字符数估算；原始 Session 历史保留，发给模型的是压缩副本。\n- 📌 <strong>PLAN.md（整体方案和约束）+ TODO.md（具体事项和进度）<\/strong> = <strong>状态外部化<\/strong>。好处：<strong>透明<\/strong>（人随时看）、<strong>人可以直接改文件纠偏<\/strong>、<strong>进程重启后读文件就能接着做<\/strong>。由 <strong>Plan Mode<\/strong> 开关控制。<strong>Plan Mode 管跨步骤的任务计划；Thinking 是每次行动前多一次规划调用<\/strong>，两者可以一起用。\n\n### 4. 出错处理与危险操作（第 14—17 讲）\n\n- <strong>Error Recovery（错误恢复）<\/strong>：工具出错时按错误类型<strong>附加一条建议<\/strong>（如 edit 匹配失败 → 先重新读文件、核对原文和缩进）。<strong>RecoveryManager<\/strong> 用字符串匹配分类（更稳的是错误码）。系统只给建议，不替模型改。\n- <strong>System Reminders<\/strong>：防 <strong>Doom Loop（死循环，原地打转重复同一个失败操作）<\/strong>。<strong>ReminderInjector<\/strong> 用<strong>工具名 + 参数生成指纹<\/strong>，连续相同失败就提醒它停下、换思路或报告做不到。📌 提醒在下一次请求模型前<strong>追加到上下文最末尾<\/strong>，真题判的角色是 <strong>RoleUser（用户角色）<\/strong>（⚠️ 笔记没写角色，是按排除法推断的）。<strong>Recovery 管一次错误，Reminder 管一串重复。<\/strong>提醒只是引导，硬限制要靠程序。\n- <strong>Middleware（中间件）<\/strong>：工具<strong>真正执行之前<\/strong>检查，三种决策 <strong>allow（允许）/ ask（问人）/ deny（拒绝）<\/strong>。📌 审批时 <strong>Middleware 通过 channel 阻塞等待<\/strong>飞书里的人工结果，同意才执行，拒绝就把结果告诉 Agent。关键字规则挡不住所有危险；课程没实现完整沙箱。\n- <strong>Subagent（子 Agent）<\/strong>：用工具 <strong>spawn_subagent<\/strong> 启动，有<strong>自己的任务和对话历史<\/strong>，做完只把<strong>总结<\/strong>交回主 Agent，避免主上下文被撑满。<strong>上下文隔离 ≠ 没有写权限<\/strong>，能不能改文件看它有哪些工具和权限。\n\n### 5. 评估（第 18—20 讲）\n\n- <strong>Cost Tracker<\/strong>：Provider 从响应里取 <strong>Usage（用量）<\/strong>；<strong>CostTracker 把 Provider 包一层<\/strong>，每次调用记录输入 / 输出 Token 和耗时，按会话累计。只统计模型调用，<strong>本地跑测试的时间看不到<\/strong>。\n- <strong>Tracing（追踪）<\/strong>：一次运行是根节点，下面每个 <strong>Turn<\/strong>，再下面是模型调用和工具执行；每个节点叫 <strong>Span<\/strong>，合起来是一棵树。用 Go 的 <strong>context<\/strong> 传当前 Span，写成 <strong>JSON<\/strong>。两个 Span 时间重叠 = 同时运行过。<strong>Cost Tracker 看总账，Trace 看每一步。<\/strong>\n- 📌 <strong>Benchmark（基准评测）<\/strong>：<strong>SetupScript 准备环境 → 给任务 → ValidateScript 验证文件或测试结果<\/strong>；Agent 说「修好了」、TODO 打勾、Token 数都不算。评估看<strong>结果<\/strong>（达没达标）和<strong>轨迹<\/strong>（中间怎么做的：重试几次、耗时、Token）。比较方案要同任务、同模型、同环境、多跑几次。\n\n### 6. 组装实战（第 21—22 讲）\n\n- <strong>CLI 实战<\/strong>：入口读配置，创建 Provider、Registry、上下文处理器、Reporter、Tracker，启动主循环；修一个<strong>带并发计数问题的 Go 项目<\/strong>：定计划 → 看文件 → 分析 → 修改 → 验证 → 写说明。\n- <strong>飞书 AgentOps<\/strong>：群里报 <strong>Nginx<\/strong> 异常 → 启动 Agent → 读规则和运维 Skill → 看 <strong>error.log<\/strong> 和 <strong>nginx.conf<\/strong> → 提出改配置 → <strong>先审批<\/strong> → 批准后执行；<strong>reload 也要审批<\/strong> → Reporter 把结果和统计发回飞书。多人同时用时，<strong>每个请求用自己会话的 Reporter<\/strong>，免得 A 的审批跑到 B 的群里。"]}], "questions": []}, {"id": "ah_run", "title": "让 Agent 能运行：架构、主循环、Thinking、Provider、Tool Registry", "short": "运行·主循环", "group": "Agent Harness · 第一章", "exam": "开篇词 + 第 01—05 讲：Harness≈操作系统、四层架构、主循环退出条件、Thinking 两阶段、Provider、Tool Registry", "refs": [], "lessons": [{"title": "第 01 讲 · Harness 的整体架构（含开篇词）", "cards": ["### 一句话：Agent 和 Harness 是什么\n\n- <strong>Agent（智能体）<\/strong> = 能<strong>持续观察、调用工具、根据反馈行动<\/strong>的系统。普通聊天框的模型只看你发的文字，不知道你电脑里有什么文件。\n- <strong>Harness（驾驭工程 / 运行环境）<\/strong> = 围绕模型搭建的<strong>运行环境和控制程序<\/strong>：把模型、工具、历史记录、权限、执行过程组织起来。模型决定「下一步做什么」，Harness 负责「怎么调用、结果怎么交回、出异常怎么办」。\n- <strong>开篇词的类比：Harness ≈ 操作系统（OS）。<\/strong> Harness 像操作系统一样管理模型、工具、上下文和权限（业内常说「模型像 CPU、上下文像内存」，笔记没展开，只用来排除选项）。\n\n| 看到题目说…… | 就选 |\n|---|---|\n| Harness 对应计算机体系结构的哪一层 | <strong>操作系统（OS）<\/strong> |\n| ❌ 应用程序 / 内存 RAM / CPU | 都是换了个概念的干扰项 |\n\n> 📌 必背陷阱：Harness 比作 <strong>操作系统<\/strong>，不是 CPU，也不是应用程序。\n\n笔记用同一个例子串讲：<strong>让 Agent 修复订单项目里的计算错误<\/strong>。", "### go-tiny-claw 的四层架构\n\n课程用 <strong>Go<\/strong> 写了一个叫 <strong>go-tiny-claw<\/strong> 的 Coding Agent，分四层：\n\n| 层 | 干什么 |\n|---|---|\n| <strong>入口交互层<\/strong> | 接收 <strong>CLI（终端）或飞书<\/strong>消息，也把运行状态、审批请求展示给用户 |\n| <strong>核心引擎层<\/strong> | 运行<strong>循环<\/strong>：调用模型，判断返回的是最终回答还是工具请求 |\n| <strong>上下文工程层<\/strong> | 准备系统提示、项目规则、历史，<strong>控制发给模型的内容长度<\/strong> |\n| <strong>工具执行层<\/strong> | 管理可用工具、分发调用，在执行前后加入控制 |\n\n- 计划和待办放在<strong>工作区文件<\/strong>里，人和 Agent 都能看。\n- 目录：`cmd/claw` 是启动入口；`internal` 下有 <strong>engine、provider、context、tools<\/strong> 四个组件目录。\n\n> 💡 对应关系：engine = 核心引擎，provider = 模型适配，context = 上下文工程，tools = 工具执行。"]}, {"title": "第 02 讲 · Main Loop：Agent 怎么一步步做事", "cards": ["### Main Loop（主循环）走一遍\n\n<strong>Main Loop<\/strong> = 反复执行「<strong>问模型 → 执行工具 → 把结果交回模型<\/strong>」。课程用 <strong>ReAct<\/strong>（推理 + 行动结合）描述它。\n\n订单项目例子：\n1. 用户说「找出订单金额计算错误」→ 放入<strong>消息历史<\/strong>。\n2. 模型回答「我要读 order.go」，给出一次工具调用请求，叫 <strong>ToolCall<\/strong>。\n3. 程序执行读文件工具，文件内容作为 <strong>ToolResult<\/strong>（工具结果）加入历史。\n4. 把更新后的历史<strong>再发给模型<\/strong>，它可能再请求改文件、跑测试。\n5. 模型给出<strong>最终回答<\/strong>（不再请求工具）→ 循环结束。\n\n- <strong>Turn（轮次）<\/strong> = 每次从调用模型到处理完这一轮动作。\n- 课程定义统一的 <strong>Message、ToolCall、ToolResult<\/strong>，主循环不用管各家模型和工具的内部细节。\n- 先用 <strong>Mock<\/strong>（模拟实现，返回预设结果）检查循环能不能走通。", "### 退出条件：对号入座\n\n| 看到题目说…… | 对不对 |\n|---|---|\n| 模型返回的消息里 <strong>ToolCalls 数组为空（长度为 0）<\/strong> → 退出循环 | ✅ <strong>正常结束标志<\/strong> |\n| 纯文本内容超过最大长度 | ❌ |\n| <strong>Turn 轮次<\/strong>达到最大上限（如 10 轮） | ❌ 那是保险，不是「任务完成」的标志 |\n| 工具执行报错（<strong>IsError == true<\/strong>） | ❌ 报错会作为结果交回模型，让它决定下一步 |\n\n| 易混的一对 | 区别 |\n|---|---|\n| <strong>Provider<\/strong> | 和<strong>模型<\/strong>通信、翻译格式 |\n| <strong>Tool Registry<\/strong> | 找<strong>工具<\/strong>并执行 |\n\n> 📌 必背陷阱：不再要工具（<strong>ToolCalls 为空<\/strong>）= 任务结束；轮次上限、工具报错都不是正常的结束标志。"]}, {"title": "第 03 讲 · Thinking：让行动前多一次规划", "cards": ["### Thinking 两阶段\n\nAgent 看到文件就改，可能没弄清订单计算和退款计算的关系。课程把一次行动拆成两阶段，防止大模型的「<strong>行动冲动（Impulsive Action）<\/strong>」：\n\n| 阶段 | 请求里带不带工具 | 做什么 |\n|---|---|---|\n| <strong>① Thinking（慢思考）<\/strong> | <strong>不带<\/strong>：可用工具列表（Available Tools）传 <strong>nil / 空数组<\/strong> | 模型只能用<strong>文字<\/strong>分析情况，<strong>不能调用工具<\/strong>（连 read_file 也不行） |\n| <strong>② Acting（行动）<\/strong> | <strong>带<\/strong>工具列表 | 模型选工具执行 |\n\n- Thinking 产出的纯文本「<strong>思考痕迹<\/strong>」会<strong>追加进上下文<\/strong>，供 Acting 阶段使用。\n- 一句话：<strong>先不给工具做规划，再带工具做行动。<\/strong>", "### EnableThinking 开关与 Thinking vs Plan Mode\n\n- <strong>EnableThinking<\/strong> = 控制是否执行第一阶段的开关。\n- 打开时每轮<strong>多一次模型请求<\/strong>，要更多时间和 <strong>Token<\/strong>（模型处理文本的计量单位，文本越多越费）。\n- 「列出当前目录」这类简单任务可以<strong>关掉<\/strong>省 Token；复杂修改，规划可能有帮助。\n\n| 看到题目说…… | 对不对 |\n|---|---|\n| Thinking 阶段工具列表为 nil 或空数组 | ✅ |\n| Thinking 阶段模型还能调用 read_file | ❌ |\n| 思考文字追加到上下文给 Action 阶段用 | ✅ |\n| 增加 EnableThinking 开关，简单任务关掉省 Token | ✅ |\n\n| 易混的一对 | 区别 |\n|---|---|\n| <strong>Thinking（第 03 讲）<\/strong> | 模型<strong>行动前的一次额外规划调用<\/strong>（不带工具） |\n| <strong>Plan Mode（第 13 讲）<\/strong> | <strong>跨步骤<\/strong>的任务计划，用 PLAN.md / TODO.md 记录；两者可以一起用 |"]}, {"title": "第 04 讲 · Provider：怎么接不同的大模型", "cards": ["### Provider = 模型适配层\n\n订单 Agent 今天用<strong>兼容 OpenAI 格式<\/strong>的接口，明天换<strong>Claude 格式<\/strong>的接口，两者对消息和工具调用的表示不一样。若差异写满主循环，每换模型都要改引擎。\n\n- <strong>Provider（模型适配层）<\/strong>：引擎只用<strong>自己统一的消息格式<\/strong>；Provider 负责<strong>翻译<\/strong>成目标服务要的请求格式，再把返回的文本或工具调用<strong>翻译回来<\/strong>。\n- 好处：模型协议变化<strong>集中在适配层<\/strong>处理，引擎不用改。\n- 课内演示了 <strong>OpenAI 兼容协议<\/strong>和 <strong>Claude 协议<\/strong>，用<strong>智谱<\/strong>的兼容接口做示例，用<strong>模拟天气工具<\/strong>测试，并比较开启 / 关闭 Thinking。", "### 对号入座\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 把统一消息翻译成各家模型的请求格式 | <strong>Provider<\/strong> |\n| 换模型时主循环不用改 | Provider 的作用 |\n| 找到工具并执行 | 那是 <strong>Tool Registry<\/strong>（第 05 讲） |\n\n- 有统一接口之后，仍要处理不同服务<strong>能力和格式的差异<\/strong>。\n- 开启 Thinking 时，模型多输出一段规划，还出现过<strong>文本形式的伪工具调用<\/strong>，真正的工具调用发生在后续请求。\n\n> 📌 必背陷阱：Provider 管<strong>和模型说话的格式<\/strong>，Tool Registry 管<strong>工具的登记和分发<\/strong>，别搞反。"]}, {"title": "第 05 讲 · Tool Registry：模型提出调用，谁去执行？", "cards": ["### 模型只「提」，Registry 去「做」\n\n模型说「我要读 order.go」，给的只是一个<strong>结构化请求<\/strong>：工具名 `read_file` + 参数（文件路径）。<strong>模型本身没有替你打开文件。<\/strong>\n\n- <strong>Tool Registry（工具注册表）<\/strong> = 一张目录表，记录有哪些工具。每个工具提供：<strong>名称、用途说明、参数格式、实际执行方法<\/strong>。\n- 引擎拿到 ToolCall → 把<strong>名称和参数<\/strong>交给 Registry → Registry 找到工具、执行、返回结果。\n\n本讲实现 <strong>read_file<\/strong>，顺序：\n<strong>注册工具 → 把工具说明交给模型 → 模型给出文件路径 → Registry 分发 → 工具读取 → 结果回到主循环 → 模型根据内容回答。<\/strong>", "### 长输出怎么办\n\n文件可能非常长。\n\n- 课程示例对<strong>单次输出做长度截断<\/strong>，防止一份文件占满模型输入。\n- 缺点：关键内容可能被藏在被截掉的后面。\n- 课内讨论的另一思路：<strong>保存完整输出，只返回预览和位置<\/strong>，让模型按需再读。\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 谁真正打开文件 | <strong>工具<\/strong>，由 <strong>Registry 分发<\/strong>，不是模型 |\n| 工具要提供哪些东西 | 名称、用途说明、参数格式、执行方法 |\n\n> 📌 必背陷阱：模型只<strong>提出<\/strong>调用请求，不亲自执行。"]}], "questions": [{"id": "ahr-p1", "type": "single", "stem": "专栏把 Agent Harness（驾驭工程）比作计算机体系结构中的哪一层？", "options": ["应用程序", "操作系统（OS）", "内存（RAM）", "中央处理器（CPU）"], "answer": [1], "why": ["不是", "对，开篇词的类比", "不是", "不是，业内常把模型比作 CPU"], "explain": "Harness ≈ 操作系统。", "tags": [], "lesson": 0, "m": "ah_run"}, {"id": "ahr-p2", "type": "single", "stem": "主循环正常结束的标志是？", "options": ["模型返回的 ToolCalls 为空", "轮次达到上限", "工具报错", "文本超长"], "answer": [0], "why": ["对", "那是保险，不是正常标志", "报错会交回模型", "不是"], "explain": "ToolCalls 为空 = 结束。", "tags": [], "lesson": 1, "m": "ah_run"}, {"id": "ahr-p3", "type": "single", "stem": "判断：Thinking 阶段请求模型时，传入的工具列表为 nil 或空", "options": ["正确", "错误"], "answer": [0], "why": ["对", "不带工具才是 Thinking"], "explain": "Thinking 不给工具。", "tags": [], "lesson": 2, "m": "ah_run"}, {"id": "ahr-p4", "type": "single", "stem": "把统一消息翻译成不同模型服务的请求格式，负责的是？", "options": ["Provider", "Tool Registry", "Reporter", "Middleware"], "answer": [0], "why": ["对，模型适配层", "管工具", "管报告输出", "管执行前检查"], "explain": "Provider = 模型适配层。", "tags": [], "lesson": 3, "m": "ah_run"}, {"id": "ahr-p5", "type": "single", "stem": "模型请求 read_file 后，真正去执行并返回结果的是？", "options": ["模型自己", "Tool Registry 分发给对应工具", "Provider", "用户"], "answer": [1], "why": ["模型只提请求", "对", "Provider 管模型格式", "不是"], "explain": "Registry 找工具并执行。", "tags": [], "lesson": 4, "m": "ah_run"}, {"id": "ahr-1", "type": "multi", "stem": "关于 Harness 和 go-tiny-claw 的架构，下列说法正确的是", "options": ["专栏把 Harness 比作计算机里的操作系统", "四层架构包括入口交互层、核心引擎层、上下文工程层、工具执行层", "核心引擎层负责运行循环，判断模型返回的是最终回答还是工具请求", "上下文工程层负责接收飞书消息", "Harness 是模型本身的一部分，用来提高模型的推理能力"], "answer": [0, 1, 2], "why": ["对", "对", "对", "错，接收 CLI / 飞书消息的是入口交互层", "错，Harness 是围绕模型的运行环境和控制程序"], "explain": "Harness ≈ OS，四层各司其职。", "tags": ["basic", "core"], "m": "ah_run"}, {"id": "ahr-2", "type": "single", "stem": "「控制发给模型的内容长度，准备系统提示、项目规则和历史」属于哪一层？", "options": ["入口交互层", "核心引擎层", "上下文工程层", "工具执行层"], "answer": [2], "why": ["管 CLI / 飞书入口", "管循环", "对", "管工具分发"], "explain": "管内容长度 = 上下文工程层。", "tags": ["basic", "core"], "m": "ah_run"}, {"id": "ahr-3", "type": "single", "stem": "原生 ReAct 主循环中，触发引擎退出循环、宣告任务结束的标志是？", "options": ["模型回复的文本超过最大长度", "模型返回的消息中 ToolCalls 数组为空", "Turn 达到最大上限（如 10 轮）", "工具执行报错（IsError == true）"], "answer": [1], "why": ["不是", "对", "轮次上限是保险，不是正常标志", "报错会作为结果交回模型"], "explain": "ToolCalls 为空 = 模型不再要工具 = 结束。", "tags": ["basic"], "m": "ah_run"}, {"id": "ahr-4", "type": "multi", "stem": "关于主循环里的名字，下列说法正确的是", "options": ["ToolCall 是模型提出的一次工具调用请求", "ToolResult 是工具执行的结果，会加入消息历史", "Turn 是从调用模型到处理这一轮动作的一个轮次", "Mock 是调用真实模型的实现", "主循环会把更新后的历史再次发给模型"], "answer": [0, 1, 2, 4], "why": ["对", "对", "对", "错，Mock 是模拟实现，返回预设结果以检查循环", "对"], "explain": "请求 ToolCall，结果 ToolResult，一轮 Turn。", "tags": ["basic", "core"], "m": "ah_run"}, {"id": "ahr-5", "type": "multi", "stem": "为防止大模型的「行动冲动」，Main Loop 剥离了独立的 Thinking 阶段。关于它，正确的有", "options": ["Thinking 阶段请求模型时，可用工具列表为 nil 或空数组", "Thinking 阶段模型仍可以调用 read_file", "Thinking 产出的文字思考痕迹会追加进上下文，供 Action 阶段使用", "通过 EnableThinking 开关，简单任务可关闭它以节省 Token", "Thinking 阶段与 Acting 阶段都带完整工具列表"], "answer": [0, 2, 3], "why": ["对", "错，没给工具，调不了", "对", "对", "错，只有 Acting 阶段带工具"], "explain": "Thinking 不带工具，思考文字给 Acting 用。", "tags": ["basic"], "m": "ah_run"}, {"id": "ahr-6", "type": "multi", "stem": "Thinking（第 03 讲）和 Plan Mode（第 13 讲）的区别，正确的是", "options": ["Thinking 是行动前的一次额外规划调用；Plan Mode 关注跨步骤的任务计划与记录", "两者完全是同一个东西", "两者不能同时使用", "Plan Mode 用 PLAN.md / TODO.md 记录"], "answer": [0, 3], "why": ["对", "错", "错，两者可以一起用", "对"], "explain": "Thinking 管一次规划，Plan Mode 管长任务记录。", "tags": ["basic", "core"], "m": "ah_run"}, {"id": "ahr-7", "type": "multi", "stem": "Provider（模型适配层）的作用，正确的有", "options": ["引擎只使用统一的消息格式", "把统一消息翻译为目标服务需要的请求格式", "把服务返回的文本或工具调用翻译回统一格式", "找到工具并执行它", "模型协议变化主要集中在适配层处理"], "answer": [0, 1, 2, 4], "why": ["对", "对", "对", "错，那是 Tool Registry", "对"], "explain": "Provider 管模型格式翻译，不管工具。", "tags": ["basic", "core"], "m": "ah_run"}, {"id": "ahr-8", "type": "single", "stem": "订单 Agent 今天用兼容 OpenAI 格式的接口，明天换 Claude 格式的接口，为避免每次改引擎，应引入？", "options": ["Provider", "Reporter", "SessionManager", "Compactor"], "answer": [0], "why": ["对", "管进度报告", "管会话", "管压缩上下文"], "explain": "换模型协议 → Provider。", "tags": ["basic"], "m": "ah_run"}, {"id": "ahr-9", "type": "multi", "stem": "关于 Tool Registry，正确的有", "options": ["它是工具注册表，记录系统里有哪些工具", "每个工具提供名称、用途说明、参数格式和执行方法", "引擎把 ToolCall 的名称和参数交给它，由它找到工具并执行", "模型自己打开 order.go 并读取内容", "它负责把消息翻译成 Claude 格式"], "answer": [0, 1, 2], "why": ["对", "对", "对", "错，模型只提结构化请求", "错，那是 Provider"], "explain": "Registry 登记并分发工具。", "tags": ["basic", "core"], "m": "ah_run"}, {"id": "ahr-10", "type": "multi", "stem": "课程在第 05 讲实现 read_file，对超长文件输出采用的做法（及讨论）是？", "options": ["示例对单次输出做长度截断，防止占满模型输入", "课内也讨论了保存完整输出、只返回预览和位置的思路", "每次都把整个文件原样交给模型", "直接禁止读取长文件"], "answer": [0, 1], "why": ["对", "对", "错", "错"], "explain": "示例用截断，另讨论预览加位置。", "tags": ["basic"], "m": "ah_run"}]}, {"id": "ah_tools", "title": "操作文件和工具：四个基础工具、Edit、并发、飞书 Reporter", "short": "工具·并发", "group": "Agent Harness · 第二章", "exam": "第 06—09 讲：四个基础工具、YOLO、edit 模糊匹配、Fork-Join 并发与按索引写入、Reporter 与飞书 Webhook", "refs": [], "lessons": [{"title": "第 06 讲 · 四种基础工具与 YOLO", "cards": ["### 四个基础工具\n\n课程示例围绕四个工具（参考 <strong>OpenClaw<\/strong> 的极简设计哲学），构成系统级 Coding Agent 的核心工具原语：\n\n| 工具 | 干什么 |\n|---|---|\n| <strong>read_file<\/strong> | 读取文件 |\n| <strong>write_file<\/strong> | 创建或覆盖文件 |\n| <strong>edit_file<\/strong> | 修改已有文件中的<strong>一部分<\/strong> |\n| <strong>bash<\/strong> | 执行 shell 命令（还能组合系统已有命令，如看目录、跑测试） |\n\n- 为什么不把每个动作都做成单独工具？工具越多，请求里携带的<strong>工具说明越长<\/strong>，选择和维护也更复杂。少量基础工具是课程的<strong>设计选择<\/strong>。\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 核心工具原语是哪一组 | <strong>read_file, write_file, edit_file, bash<\/strong> |\n| ❌ git, npm, grep, docker | 命令行程序，不是工具原语 |\n| ❌ 含 MCP_server / ask_human / search_web / python_repl 的组合 | 都不是这四个 |", "### write_file、bash 与 YOLO\n\n本讲实现 <strong>write_file<\/strong> 和 <strong>bash<\/strong>。\n\n- bash 示例设置<strong>执行超时<\/strong>，对<strong>过长的输出做截断<\/strong>；<strong>错误结果返回给模型<\/strong>，让它决定下一步。\n- <strong>YOLO<\/strong>：课程把某些<strong>本地宽松执行<\/strong>方式称为 YOLO。\n- <strong>第 16 讲<\/strong>继续讨论：团队或远端环境里，如何在执行前<strong>拦截需要人工决定的操作<\/strong>（Middleware 审批）。\n- 工作目录、超时、输出截断本身<strong>覆盖不了所有执行风险<\/strong>。\n\n> 📌 必背陷阱：四个工具是 <strong>read_file / write_file / edit_file / bash<\/strong>；本讲亲手实现的是 <strong>write_file 和 bash<\/strong>（read_file 在第 05 讲、edit_file 在第 07 讲）。"]}, {"title": "第 07 讲 · Edit：为什么修改代码还要做模糊匹配", "cards": ["### edit 工具要三个东西\n\nAgent 想把文件里的旧代码换成新代码，要告诉 edit 工具：\n\n| 参数 | 意思 |\n|---|---|\n| <strong>文件路径<\/strong> | 改哪个文件 |\n| <strong>old_text<\/strong> | 要找的旧文本 |\n| <strong>new_text<\/strong> | 替换后的新文本 |\n\n<strong>困难<\/strong>：文件里是四个空格缩进，模型给出的旧文本却没有空格。只做<strong>完全一致<\/strong>的匹配，就会报「找不到」。所以课程设计了<strong>模糊匹配<\/strong>。", "### 四级匹配尝试（按顺序）\n\n| 级 | 做法 |\n|---|---|\n| 1 | <strong>精确匹配<\/strong> |\n| 2 | 处理不同系统的<strong>换行符<\/strong>差异 |\n| 3 | 忽略文本块<strong>首尾多余的空行<\/strong> |\n| 4 | <strong>逐行去掉首尾空白<\/strong>再比较，容忍缩进差异 |\n\n- 放宽匹配的新问题：文件里可能<strong>有两段内容都匹配<\/strong>。课程要求：<strong>多处匹配时拒绝替换<\/strong>，让模型提供更多上下文。\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 精确 → 换行符 → 去首尾空行 → 逐行去首尾空白 | 四级匹配顺序 |\n| 匹配到多处怎么办 | <strong>拒绝替换<\/strong>，要求更多上下文 |\n\n> 📌 必背陷阱：多处匹配时<strong>不是<\/strong>替换第一处，而是<strong>拒绝<\/strong>。"]}, {"title": "第 08 讲 · 并发：多个工具能不能同时运行", "cards": ["### Fork-Join 与
