"explain": "Zipkin 展示。", "tags": ["basic"], "m": "sp6"}, {"id": "stream-16", "type": "single", "stem": "Sleuth 底层使用的追踪库是？", "options": ["Brave", "Hystrix", "Ribbon", "Lettuce"], "answer": [0], "why": ["对", "熔断", "负载均衡", "Redis 客户端"], "explain": "Brave。", "tags": ["basic"], "m": "sp6"}, {"id": "stream-17", "type": "multi", "stem": "加了 Sleuth 后，日志里会自动带上？", "options": ["Trace ID", "Span ID", "数据库密码", "用户手机号"], "answer": [0, 1], "why": ["是", "是", "不会", "不会"], "explain": "方便按编号查跨服务日志。", "tags": ["basic", "core"], "m": "sp6"}, {"id": "stream-18", "type": "single", "stem": "Sleuth 设置采样比例的配置是？", "options": ["spring.sleuth.sampler.probability", "spring.zipkin.base-url", "spring.sleuth.enabled", "management.metrics"], "answer": [0], "why": ["对（默认 0.1）", "Zipkin 地址", "开关", "指标"], "explain": "probability = 概率。", "tags": ["basic"], "m": "sp6"}, {"id": "stream-19", "type": "multi", "stem": "Sleuth 把追踪数据发送给 Zipkin 的方式有？", "options": ["HTTP", "RabbitMQ", "Kafka", "发邮件"], "answer": [0, 1, 2], "why": ["可以", "可以", "可以", "不可以"], "explain": "spring.zipkin.sender.type。", "tags": ["basic", "core"], "m": "sp6"}, {"id": "stream-20", "type": "single", "stem": "判断：链路追踪就是服务治理的全部", "options": ["正确", "错误"], "answer": [1], "why": ["错", "对：还有容量、依赖、变更、审计、监控等"], "explain": "第 121 讲。", "tags": ["basic"], "m": "sp6"}, {"id": "stream-21", "type": "single", "stem": "第 122 讲中，用什么把咖啡店的所有服务和依赖一起编排启动？", "options": ["Docker Compose", "Maven", "Spring Initializr", "Turbine"], "answer": [0], "why": ["对", "构建工具", "生成工程", "Hystrix 聚合"], "explain": "Docker Compose。", "tags": ["basic"], "m": "sp6"}]}], "cheatsheet": "\n\n### 入门与实战 5 步（开篇词、第 01—04 讲）\n\n- 定义：机器学习是<strong>从数据生成规则、发现模型<\/strong>，来预测、判断、分组和解决问题的技术。传统程序：规则 + 数据 → 答案；机器学习：答案 + 数据 → 规则。\n- 自变量 = <strong>特征<\/strong>，因变量 = <strong>标签<\/strong>；训练 = <strong>拟合<\/strong>；训练集训练 → 验证集验证泛化 → 测试集最终测试。\n- 四大类：<strong>监督<\/strong>（全有标签，最主流）、<strong>无监督<\/strong>（无标签，聚类/降维）、<strong>半监督<\/strong>（部分有，多「伪标签」，无固定比例）、<strong>强化<\/strong>（agent 最大化累积奖励，从奖惩中学）。\n- 回归 vs 分类看<strong>标签类型<\/strong>：连续 → 回归，离散 → 分类。逻辑回归是分类算法。\n- 深度学习 = 一种算法（深层神经网络），横跨四类；擅长非结构化输入（视觉、NLP）；DNN 流失、CNN 鲜花图片、RNN 激活率。\n- Python + Anaconda（免费、管库、跨平台）+ Jupyter Notebook（交互式、富文本、<strong>支持多种语言<\/strong>）。只装 Anaconda。Code / Markdown 单元格；[ ] 编号 = 执行顺序；绿编辑蓝命令；pip install 装包。\n- 实战 5 步：<strong>定义问题 → 收集数据和预处理 → 选择算法建模 → 训练拟合 → 评估优化<\/strong>，循环迭代；不含部署。\n- 预处理 6 小步：收集、可视化、清洗、特征工程、建 X/y、拆分。次序不固定、不必全用；<strong>特征缩放在拆分之后<\/strong>。\n- 清洗 4 种：<strong>缺失<\/strong>（均值/随机值/0 补值 = 数据修复）、<strong>重复<\/strong>（drop_duplicates）、<strong>错误<\/strong>（负值删或转正）、<strong>不可用<\/strong>（统一单位、是/否 → 1/0）。NaN：isna().sum() 统计、dropna() 删除。\n- 箱线图五数：最小、Q1、中位数、Q3、最大；看离群点（建议保留）。散点图看线性关系。\n- 拆分：train_test_split，测试 20% 或 30%，random_state 固定结果；小项目可省验证集。\n- 内部参数（w 权重、b 偏置，机器学）vs 超参数（fit_intercept 默认 True、normalize 默认 False，人设）。\n- fit 训练（减小损失，梯度下降调内部参数）、predict 预测（训练集也能用）、score 评分（R²，0—1，越大越好）。回归指标：R²、MSE。\n- 评估不好：调超参数 → 换算法 → 回第 2 步查数据。\n\n### 获客与变现（第 05—07 讲）\n\n- 五关：<strong>获客<\/strong>（数据探索、聚类）→ <strong>变现<\/strong>（回归、特征工程、防过拟合、交叉验证）→ 激活 → 留存 → 裂变。\n- <strong>R 新近度<\/strong> = 上次消费以来的天数（热乎度，越大越休眠）；<strong>F 消费频率<\/strong> = 是否频繁使用（黏性风向标）；<strong>M 消费金额<\/strong> = 一段时间的总金额。R/F 定义互换是陷阱。\n- 求 RFM：R = 最新日期 − 上次消费日期；F = count 订单次数；M = sum(单价×数量)。先建用户层级表。求 RFM 是<strong>特征工程<\/strong>。\n- Pandas：read_csv 读、to_datetime 转日期、drop_duplicates 去重、isna().sum() 数缺失、describe 看统计找脏数据、<strong>loc 名称 / iloc 位置<\/strong>、groupby 分组、merge 合并。负数量用 loc 筛掉。\n- 无监督：<strong>聚类（分组）和降维<\/strong>最常见。聚类 = 把空间位置相近的数据归为一组（簇）。<strong>K-Means<\/strong> 最常用，<strong>K 人工指定<\/strong>，随机选质心 → 就近归类 → 质心不动就停。\n- <strong>手肘法<\/strong>：损失曲线（inertia_）的拐点定 K；不一定都是 3 组。聚类<strong>不知道含义也没有顺序<\/strong>，人为贴标签 = <strong>聚类后概念化<\/strong>。\n- 总分 0—8（9 层）：低 0—2，中 3—4，高 5—8。R 降序、F/M 升序。高价值用户和 F 相关度高。\n- <strong>LTV<\/strong>（CLV）= 生命周期价值，连续值 → <strong>回归<\/strong> → 监督学习。特征 = 头 3 个月 RFM，标签 = 一年总消费。用户码删掉，城市要转哑变量。X 大写 y 小写。\n- 回归算法清单：线性、贝叶斯、SVR、决策树（CART）、随机森林、AdaBoost/XGBoost、神经网络。<strong>没有逻辑回归<\/strong>。\n- 线性回归 = 基准；决策树 = IF ELSE；随机森林 = 多棵树集成，纠正决策树过拟合，回归取平均、分类取众数。R² 越大越好，其它误差越小越好；随机森林最优<strong>仅限当前场景<\/strong>。\n\n### 模型优化（第 08—10 讲）\n\n- <strong>四个法宝<\/strong>：特征工程（提高特征与模型匹配度）、防过拟合（拟合与泛化平衡）、交叉验证（避免一次划分不合理的偏差）、参数调优（GridSearchCV）。\n- <strong>特征工程<\/strong>三思路：选择（减少）、变换（改变）、构建（新增，最具创造力）。「数据和特征决定上限，模型和算法只是逼近」。\n- 特征选择：热力图看皮尔逊系数；SelectKBest 单变量、独立于模型；RFE / SelectFromModel / SequentialFeatureSelector 要结合模型。PCA 无监督、LDA 有监督。\n- 缩放：StandardScaler 均值0方差1；MinMaxScaler 归一化 0～1，不改分布；RobustScaler 抗离群；Normalizer 单位范数。<strong>先拆分再缩放<\/strong>，训练集 fit_transform，验证/测试只 transform，否则数据泄露。\n- get_dummies：drop_first=True 虚拟变量（m-1，无冗余），False 独热（m，有冗余→共线性，但直观）。分桶 = 连续变离散：等距、等频、模型分桶。\n- <strong>过拟合<\/strong>：过度适应训练集，新数据表现差。阶段：欠拟合→平衡点→过拟合（充分训练反而过拟合）。办法：加数据、特征工程、简单模型（奥卡姆剃刀）、正则化。\n- 决策树：构造 + 剪枝；根/内部/叶节点；选熵小的作根；剪枝用 max_depth（另有 min_samples_leaf / split）；剪枝也算正则化。\n- L1 = Lasso（系数变 0，丢特征）；L2 = Ridge（只缩小不丢）；正则项 = 惩罚项；逻辑回归 C 值也是正则化参数。\n- <strong>交叉验证<\/strong>：k-1 份训练 1 份验证，重复 k 次取平均，常用 10 折；只是评估方式，不训练新模型。KFold（n_splits=5，shuffle=False，random_state=None）；cross_val_score 一步到位；cross_validate 多指标。\n- <strong>GridSearchCV<\/strong> 网格搜索，自动调参神器，穷举 + 交叉验证；n_jobs=-1 用全部 CPU；best_params_ 看结果；最优参数对别的数据集未必适用。RandomizedSearchCV 更快但可能稍差。\n\n### 激活关：深度学习（第 11—13 讲）\n\n- 深度学习：<strong>自动提取特征<\/strong>、擅长<strong>非结构化数据<\/strong>；训练 = 确定网络参数。TensorFlow（Google，工业界）、PyTorch（Facebook，学术界）、Keras（TF 高级 API，新手入门）；传统机器学习 sklearn。\n- 张量 = NumPy 数组：标量 0D、向量 1D、矩阵/表格 2D、文本 3 阶、<strong>图片 4 阶（数量，宽，高，通道）<\/strong>、视频 5 阶。像素 X/255 归一化（神经网络爱小数值）。\n- CNN：输入层 → (<strong>卷积 + 池化<\/strong>)×几次 → 展平 → 全连接 → Softmax 输出。卷积核 = 滤波器，自动提特征；池化降维（最大/平均）；尺寸<strong>变小<\/strong>、深度<strong>变深<\/strong>；卷积层参数<strong>少于<\/strong>全连接层。关键层 <strong>Conv2D<\/strong>。\n- 层名：Sequential 序贯模型（盖楼）、Conv2D、MaxPooling2D、Flatten、Dense、Dropout；DNN 看 Dense，CNN 看 Conv1D/2D/3D，RNN 看 SimpleRNN/GRU/LSTM。\n- compile(loss, optimizer, metrics)；fit(epochs 轮次, batch_size 批量, validation_split 边训边验)；predict 出概率，np.argmax 取最大。\n- 损失：多分类 categorical_crossentropy（One-hot）、二分类 binary_crossentropy、回归 mse；（补充）整数标签多分类 sparse_categorical_crossentropy。指标：分类 acc、回归 mae。relu 常用，softmax 多分类输出。\n- RNN：<strong>记忆机制<\/strong>，状态在神经元间循环传递；适合自然语言、视频、时间序列。三种层 SimpleRNN（短期记忆）→ GRU（折衷）→ <strong>LSTM<\/strong>（遗忘/输入/输出门 + 记忆细胞，性能最好）。\n- 时序数据：和时间相关 + 连续数值（股价、点击数、销量）；用前 60 天当特征；X_train (579,60,1) 三阶；预测后 inverse_transform。\n- 3 招：①<strong>数据增广<\/strong>（ImageDataGenerator，翻转/位移/裁剪/颜色抖动/加噪，60%→78%）②<strong>Dropout<\/strong>（随机丢神经元、最常用正则化、0.2~0.5、只在训练时）③<strong>换优化器 + 学习速率<\/strong>（越过局部最低点；SGD 动量、Adagrad 自适应、RMSprop、<strong>Adam 集大成首选<\/strong>；学习速率太小冲不出去）。\n\n### 留存关（第 14—16 讲）\n\n- 留存关 = <strong>生存分析 + 二元分类 + 性能评估<\/strong>。留存 = 让老用户一直使用产品；留存和流失此消彼长。第 14 讲是<strong>数据探索类型问题<\/strong>（不是回归也不是分类）。数据 7043 条，标签「已停付会费」：<strong>留存 73%、流失 27%<\/strong>。\n- <strong>lifelines<\/strong>（生命线库，精算师 + 医疗专业人员开发，简单快捷）：<strong>Kaplan-Meier<\/strong> 画整体 / 分组留存曲线；<strong>Cox 危害系数模型<\/strong>（COX 比例危害模型）预测<strong>特定用户<\/strong>留存概率（predict_survival_function）+ 各因子系数（cph.plot）。输入「入会月数」+「已停付会费」。常用 <strong>95%<\/strong> 置信水平。\n- Cox 要<strong>虚拟变量<\/strong>：pd.get_dummies，drop_first=True 少 1 个，避免冗余 / 多重共线性。危害系数 <strong>> 0 负面（促流失），< 0 正面（促留存）<\/strong>。\n- 结论：性别影响不明显；就餐时付费、手工转账、月卡 → 流失；微信自动扣款 / 花呗、长期卡、优惠套餐（系数 < 0）→ 留存；入会 5 年留存约 60%。\n- 流失预测：标签离散非 1 即 0 → <strong>二元分类<\/strong>，监督学习。分类算法：逻辑回归、贝叶斯（贝叶斯推断）、SVM（超平面）、KNN（k 个邻居）、决策树（CART 二叉树）、随机森林、AdaBoost/XGBoost、神经网络。\n- <strong>逻辑回归 = 线性回归 + Sigmoid<\/strong>（转成 0~1 概率），<strong>P ≥ 0.5 判 1<\/strong>；本质仍是线性回归，最基础、常作基准。LogisticRegression；predict 给类别，<strong>predict_proba 给概率<\/strong>；score = 准确率均值。\n- 1958 Rosenblatt <strong>感知器<\/strong> = 单个神经元 = <strong>逻辑回归<\/strong>。CNN 图像，RNN 文本时序，<strong>Dense 层（无卷积无循环）→ DNN<\/strong> 适合特征多的分类。神经网络适合特征多、样本大。binary_crossentropy 二分类损失，RMSProp。验证曲线振荡 = 没训练起来 → <strong>神经网络不喜欢未归一化数据<\/strong>（MinMaxScaler）。\n- <strong>激活函数引入非线性<\/strong>，没有就纯线性。sigmoid 早期；tanh（-1~1）易梯度消失；<strong>ReLU 最常用<\/strong>、加速收敛、缓解梯度消失，缺点会「死掉」；变体 Leaky ReLU、eLu、PreLu、Parametric ReLU、Randomized ReLU。<strong>输出层：二分类 sigmoid，多分类 softmax<\/strong>，ReLU 不行。tanh 更快 = 错。\n- 不平衡数据<strong>绝对不能单用准确率<\/strong>。四方法：<strong>混淆矩阵、精确率和召回率、F1、ROC/AUC<\/strong>。\n- 混淆矩阵：左上 TN、右上 FP、左下 FN、<strong>右下 TP（第一眼看）<\/strong>；真假 = 一致与否，正负 = 预测 1/0；不是分数性指标。confusion_matrix + sns.heatmap。\n- <strong>精确率 = 查准率 = TP/(TP+FP)<\/strong>；<strong>召回率 = 查全率 = TPR 真阳性率 = TP/(TP+FN)<\/strong>；怕误判为流失（FP）看精确率，怕漏掉流失（FN）看召回率。<strong>F1 = 调和均值<\/strong>，两高才高，最适合不平衡、简单比较模型；classification_report。\n- <strong>ROC = 受试者工作特征曲线<\/strong>，X 轴 FPR = FP/(FP+TN)（伪阳性率），Y 轴 TPR；左上好，对角线 = 随机猜。<strong>AUC 在 0.5~1<\/strong>，越接近 1 越好，0.5 无价值。roc_curve + auc。DNN 0.811 ＞ 逻辑回归 0.756。分层采样：StratifiedKFold、StratifiedShuffleSplit、stratify。\n\n### 裂变与收官（第 17—21 讲）\n\n- <strong>集成学习<\/strong>：组合多个（可以较弱的）模型；是算法家族不是一种算法；同时降方差和偏差。欠拟合 = 高偏差，过拟合 = 高方差；低偏差低方差不可兼得（偏差-方差窘境）；先降偏差再降方差。\n- <strong>Boosting 降偏差<\/strong>（梯度下降思想，弱模型拟合逐渐增强）：AdaBoost（分错样本加权）→ GBDT（损失函数、一阶导）→ XGBoost（二阶导、收敛快）。\n- <strong>Bagging 降方差<\/strong>（有放回抽 K 个训练集，训练 K 个模型；分类投票、回归取均值）：树的 Bagging、随机森林（随机选特征）、极端随机森林（随机选分支）。基模型差异越大越好。推荐：Bagging 选随机森林，Boosting 选 XGBoost。\n- <strong>增长模型<\/strong>（Uplift，思路不是算法）：完全不睬者 Lost Causes、促销响应者 Persuadable（重点）、肯定会买者 Sure Things、别来烦我者 Do-Not-Disturb。增量 = (TR + CN) − (TN + CR)；多分类 + XGBoost + predict_proba。\n- <strong>选算法<\/strong>：先定义问题；监督/无监督 → 回归/分类 → 数据量、特征数、可解释性、速度、线性程度。样本少特征多 → 高偏差低方差（线性回归、朴素贝叶斯、线性 SVM）；数据大特征少 → 低偏差高方差（KNN、决策树、核 SVM）；特征多数据少 → SVM。生成新数据 → GAN、DeepDream、VAE。从简单模型开始；更好的数据胜过更好的算法。\n- <strong>部署<\/strong>：重写模型 / Web 应用部署到 Web 服务器 / Tensorflow Lite 部署到移动端。pickle.dump 序列化、pickle.load 反序列化，只认 Python。Joblib 并行，ONNX 跨语言，PMML 1997 且只支持部分模型，POJO/MOJO 限 H2O。Flask：Python 轻量级 Web 框架，@app.route 映射 URL，render_template 渲染页面。\n- <strong>持续精进<\/strong>：迁移学习（A 任务模型用到 B，VGG19 冻结 1—4 块微调第 5 块）；AutoML 三方面（特征工程、选模型调参、部署）；三大学派：符号（知识图谱）、连接（神经网络）、行为（强化学习）；GNN 是 2021 年「红星」，图 = 非欧几里德数据。\n\n### 机器学习 · 结课测试真题要点\n\n- 半监督没有 50/50 比例；Jupyter 支持多种语言；部署：重写模型、Web 应用、Tensorflow Lite 移动端、AutoML 自动部署。\n- Boosting 降偏差，Bagging 降方差；不平衡数据看精确率、召回率、F1、ROC/AUC，不看准确率。\n- 损失：二分类 binary，多分类 categorical（One-hot）/ sparse_categorical（整数），回归 mse。激活：隐藏层 relu，二分类输出 sigmoid，多分类 softmax。\n- 虚拟变量 m−1，独热 m（有冗余 → 共线性）。RNN 由简到繁：SimpleRNN → GRU → LSTM。CNN 参数比全连接少。\n- 防过拟合：加数据、特征工程、简单模型（奥卡姆剃刀）、正则项（惩罚项）、限制树深；「充分训练」会导致过拟合。\n- 逻辑回归是分类；聚类要人贴标签；R 新进度、F 频率、M 金额；归一化在拆分之后；清洗 4 种：缺失、重复、错误、不可用；回归/分类看标签类型。\n\n\n\n### 入门（开篇词、第 01—02 讲）\n\n- LangChain = 开发大模型应用的<strong>框架<\/strong>，不是模型。<strong>六大组件<\/strong>：模型（Model I/O）、提示、数据检索、记忆、链、代理。<strong>数据库不是组件<\/strong>。\n- 课程四篇：启程篇 → 基础篇 → 应用篇 → 实战篇；案例公司「易速鲜花」。\n- <strong>Text 模型<\/strong>：输入字符串，`OpenAI` 类，text-davinci-003；<strong>Chat 模型<\/strong>：输入<strong>带角色的消息列表<\/strong>，`ChatOpenAI` 类，gpt-3.5-turbo。区别 = <strong>Chat 消息有角色<\/strong>。\n- 角色：<strong>system<\/strong>（设定身份）/ <strong>user<\/strong>（用户，HumanMessage）/ <strong>assistant<\/strong>（AI 回复，AIMessage）。temperature 管随机，max_tokens 管长度。\n- 文档问答 5 步：<strong>Loading<\/strong>（加载器）→ <strong>Splitting<\/strong>（分割器，文档块）→ <strong>Storage<\/strong>（嵌入存向量库，嵌入片）→ <strong>Retrieval<\/strong>（余弦相似度检索）→ <strong>Output<\/strong>（问题 + 嵌入片交给模型生成答案）。\n- 工具：PyPDFLoader/Docx2txtLoader/TextLoader；RecursiveCharacterTextSplitter（200/10）；OpenAIEmbeddings；Qdrant（:memory:）；MultiQueryRetriever；RetrievalQA；Flask。\n\n### 模型 I/O 与提示工程（第 03—05 讲）\n\n- <strong>Model I/O = 提示（Format）+ 模型（Predict，核心）+ 输出解析（Parse）<\/strong>。「检索本地文档生成回答」不属于它。\n- 三类模型：<strong>LLM<\/strong>（文本→文本）、<strong>Chat Model<\/strong>（消息）、<strong>Embedding Model<\/strong>（文本→向量）。\n- LangChain 好处：模板管理、变量提取检查、模型切换、输出解析。`PromptTemplate.from_template` 自动识别变量。\n- 提示四部分：指令、上下文、提示输入、输出指示器。\n- 模板：<strong>PromptTemplate<\/strong>（基础）、<strong>ChatPromptTemplate<\/strong>（角色消息）、<strong>FewShotPromptTemplate<\/strong>（少样本）、<strong>PipelinePromptTemplate<\/strong>（组合多个）、自定义。\n- Zero-shot 无示例 / One-shot 一个 / Few-shot 少量；示例不改参数。<strong>ExampleSelector<\/strong>（SemanticSimilarityExampleSelector）挑最相似示例。\n- <strong>CoT<\/strong>：Few-Shot CoT（示例带推理）、Zero-Shot CoT（「一步步思考」）。模板 = <strong>角色和目标 + 思考链说明 + 示例<\/strong>。\n- <strong>ToT<\/strong>：多分支、评估、搜索（BFS/DFS）、回溯；「多条思维路径搜索」是 ToT 不是 CoT。\n\n### 调用模型与输出解析（第 06—07 讲）\n\n- <strong>预训练<\/strong>（海量数据，通用基础模型）→ <strong>微调<\/strong>（特定数据继续训练，改参数）；<strong>量化<\/strong> = 低精度、减体积。RAG ≠ 微调。\n- Transformer（2017 Google）；HuggingFace 开源社区；Llama 2（Meta）；AutoTokenizer + AutoModelForCausalLM。\n- 调开源模型三法：<strong>HuggingFace Hub<\/strong>（HuggingFaceHub，repo_id，远程）、<strong>HuggingFace Pipeline<\/strong>（本地 pipeline 再包装）、<strong>自定义 LLM 类<\/strong>（继承 LLM 基类，实现 `_call`、`_llm_type`，课程跑量化 Llama 2）。\n- 解析器两方法：<strong>get_format_instructions<\/strong>（格式说明放进提示）+ <strong>parse<\/strong>（解析字符串）；可选 parse_with_prompt。\n- 种类：列表（CommaSeparatedList）、日期（Datetime）、枚举（Enum）、结构化（Structured + ResponseSchema）、<strong>Pydantic<\/strong>、XML、<strong>OutputFixing<\/strong>（修格式）、<strong>RetryWithError<\/strong>（带原始提示重试补内容）。\n- 要 JSON → <strong>Pydantic / Structured<\/strong>。\n\n### 链与记忆（第 08—10 讲）\n\n- <strong>链<\/strong> = 把组件串成一个整体，不是模型。<strong>LLMChain<\/strong>（提示 + 模型）、<strong>SequentialChain<\/strong>（顺序）、SimpleSequentialChain、<strong>RouterChain<\/strong>（路由）。\n- 调用 5 种：<strong>直接调用<\/strong>（返回字典）、<strong>run<\/strong>（字符串）、<strong>predict<\/strong>（关键字参数）、<strong>apply<\/strong>（输入列表）、<strong>generate<\/strong>（返回 LLMResult，带 token 数等）。\n- 顺序链三角色：<strong>植物学家<\/strong>（介绍）→ <strong>鲜花评论者<\/strong>（评论）→ <strong>社交媒体运营经理<\/strong>（文案）；output_key 要对得上。\n- 路由链：<strong>目标链<\/strong>（护理 / 装饰）+ <strong>LLMRouterChain<\/strong>（选链）+ <strong>默认链<\/strong>（兜底，ConversationChain）→ 组合成 <strong>MultiPromptChain<\/strong>；RouterOutputParser 解析 destination、next_inputs。\n- 记忆：ConversationChain 用 <strong>history + input<\/strong>。<strong>Buffer<\/strong>（全量）、<strong>BufferWindow<\/strong>（最近 k 轮）、<strong>Summary<\/strong>（摘要，要额外调模型）、<strong>SummaryBuffer<\/strong>（摘要 + 近期原文，max_token_limit）。\n- 「早期摘要 + 最近原文」= <strong>ConversationSummaryBufferMemory<\/strong>。\n\n### 代理与工具（第 11—14 讲）\n\n- <strong>代理<\/strong>：模型自己决定下一步用哪个工具；链的步骤写死，代理的步骤临时决定。\n- <strong>ReAct = Reasoning + Acting<\/strong>，灵感来自行动与推理的<strong>协同作用<\/strong>；观察—思考—行动；日志 Thought → Action → Action Input → Observation → Final Answer。<strong>ReAct ≠ React 前端框架<\/strong>。\n- 玫瑰定价例：<strong>serpapi + llm-math<\/strong>，`load_tools` + `initialize_agent`，类型 <strong>ZERO_SHOT_REACT_DESCRIPTION<\/strong>（零样本 + ReAct + 按工具描述选）。\n- 代理类型：ZERO_SHOT / CHAT_ZERO_SHOT / CONVERSATIONAL（带记忆）/ <strong>STRUCTURED_CHAT<\/strong>（多输入工具）/ <strong>SELF_ASK_WITH_SEARCH<\/strong> / OPENAI_FUNCTIONS / REACT_DOCSTORE。\n- 角色：LLM 生成；<strong>Agent 调模型、决定下一步（plan）<\/strong>；Tool 执行；Toolkit 一组工具；<strong>AgentExecutor 维护工具、解析输出、驱动循环<\/strong>，不直接调 LLM，不为每个任务新建代理。\n- 循环：`_take_next_step` → `plan` → 解析成 <strong>AgentAction<\/strong>（调工具得 Observation）或 <strong>AgentFinish<\/strong>（结束）。\n- 结构化工具对话代理：多参数工具、多个工具、ReAct；Playwright：navigate_browser、get_elements 等。\n- <strong>Self-Ask with Search<\/strong>：拆子问题搜索（玫瑰国花国家的首都），工具名 Intermediate Answer。<strong>Plan and Execute<\/strong>：规划器先计划 + 执行器逐步做（纽约 100 美元买几束玫瑰）。\n- Tool = 名称 + 描述 + 输入格式 + 函数（+ return_direct）；Toolkit 用 get_tools() 取工具。arXiv 问 2005.14165；Gmail 工具箱要 credentials.json，用结构化代理。\n\n### RAG、数据库与回调（第 15—17 讲）\n\n- <strong>RAG 三步：检索 → 上下文编码 → 生成<\/strong>。「检查/核对」不是 RAG 步骤。\n- 流水线：加载（TextLoader、PyPDFLoader、Docx2txtLoader）→ 切分 → 嵌入入向量库 → 检索 → 生成。\n- 切分器：Character、<strong>RecursiveCharacter（推荐）<\/strong>、按 Token、MarkdownHeader、代码；参数 separators / <strong>chunk_size<\/strong> / <strong>chunk_overlap<\/strong>。转换还有去冗余、翻译、提取元数据、对话转问答。\n- <strong>embed_documents<\/strong> 多文档，<strong>embed_query<\/strong> 单查询；<strong>CacheBackedEmbeddings<\/strong> 缓存（内存/文件/Redis，namespace）。向量库存+搜，<strong>Retriever<\/strong> 给问题返文档；VectorstoreIndexCreator；索引 API 记哈希防重复（None/incremental/full）。\n- 数据库：问题 → <strong>模型生成 SQL<\/strong> → 执行 → 整理答案。`SQLDatabase.from_uri` → `SQLDatabaseChain.from_llm(llm, db)` → `run`，不用自己写 SQL。\n- <strong>create_sql_agent + SQLDatabaseToolkit<\/strong>：sql_db_list_tables、sql_db_schema、sql_db_query_checker、sql_db_query。Chain 固定，Agent 灵活。\n- 回调 ≠ 异步。<strong>CallbackHandler<\/strong>（处理器）、<strong>CallbackManager<\/strong>（管理器）、StdOut/File 处理器。\n- 事件：on_llm_start / on_llm_new_token / on_llm_end、on_chain_start/end、on_tool_start/end、on_agent_action/finish。<strong>LLM、Tool、Chain 前后都能回调<\/strong>。\n- <strong>构造函数回调<\/strong>管所有调用，<strong>请求回调<\/strong>只管这一次。<strong>get_openai_callback<\/strong> 数 token；asyncio.gather 并发。\n\n### 多代理与实战（第 18—23 讲、加餐）\n\n- <strong>CAMEL<\/strong> = 角色扮演框架，<strong>模拟代理<\/strong>。人类给想法 → <strong>任务指定代理<\/strong>细化 → <strong>AI 用户<\/strong>出指令（Instruction/Input）→ <strong>AI 助手<\/strong>给方案（Solution … Next request.）。<strong>inception prompting<\/strong> 定规则；`<CAMEL_TASK_DONE>` 结束。论文：Python 程序员 + 股票交易员；课程：花店营销专员 + 花店老板。\n- <strong>自治代理<\/strong>：AutoGPT（自动链接多任务）、BabyAGI、HuggingGPT。<strong>模拟代理只有 CAMEL<\/strong>。\n- <strong>BabyAGI 三代理<\/strong>：执行、任务创建、优先级；结果存向量库；北京气候 → 鲜花储存策略。<strong>多模态不是 BabyAGI<\/strong>。\n- <strong>HuggingGPT 四阶段<\/strong>：任务规划 → 模型选择（Hugging Face 专家模型）→ 任务执行 → 响应生成。\n- <strong>人脉工具五步<\/strong>：代理 + 自定义搜索找 UID → 爬资料并过滤 → 提示模板写简介/联系信 → <strong>输出解析器<\/strong> → <strong>Flask<\/strong>。\n- <strong>客服机器人<\/strong>：花卉行家聊天 → 加<strong>记忆<\/strong> → 加<strong>检索<\/strong>（PDF/Word/TXT → Qdrant，ConversationalRetrievalChain）；订单查询是扩展。界面 <strong>Streamlit<\/strong>（streamlit run）、<strong>Gradio<\/strong>（launch）。\n- 加餐：<strong>LCEL<\/strong> 管道符 `prompt | model | parser`，Runnable 的 invoke/batch/stream；<strong>LangSmith<\/strong> 跟踪调试评估；<strong>LangGraph<\/strong> 状态 + 节点 + 边；<strong>A2A<\/strong> Agent 间通信协议（货币兑换 Agent，SSE/Webhook 推送）。\n\n\n\n\n\n### 让 Agent 能运行（开篇词 + 第 01—05 讲）\n\n- <strong>Harness ≈ 操作系统<\/strong>（不是应用程序 / RAM / CPU）。Harness = 围绕模型的运行环境和控制程序。\n- go-tiny-claw 四层：<strong>入口交互层<\/strong>（CLI/飞书）、<strong>核心引擎层<\/strong>（循环）、<strong>上下文工程层<\/strong>（控制长度）、<strong>工具执行层<\/strong>（分发工具）。\n- Main Loop：问模型 → 执行工具 → 结果交回。<strong>ToolCall<\/strong>（请求）、<strong>ToolResult<\/strong>（结果）、<strong>Turn<\/strong>（一轮）、<strong>Mock<\/strong>（模拟实现）。\n- <strong>退出标志 = ToolCalls 为空<\/strong>；轮次上限、工具报错（IsError）都不是正常结束标志。\n- <strong>Thinking<\/strong>：请求不带工具（<strong>nil/空<\/strong>），不能调工具；思考文字追加进上下文给 <strong>Acting<\/strong> 用；<strong>EnableThinking<\/strong> 开关，简单任务可关省 Token。Thinking ≠ Plan Mode。\n- <strong>Provider<\/strong> = 模型适配层（统一消息格式 ↔ OpenAI 兼容 / Claude 协议）；<strong>Tool Registry<\/strong> = 工具注册表（名称、说明、参数格式、执行方法），模型只提请求，Registry 分发执行。\n\n### 操作文件和工具（第 06—09 讲）\n\n- <strong>四个基础工具（参考 OpenClaw 极简设计）<\/strong>：<strong>read_file / write_file / edit_file / bash<\/strong>。第 06 讲实现 write_file 和 bash；bash 有<strong>超时<\/strong>、<strong>输出截断<\/strong>，错误回传模型。<strong>YOLO<\/strong> = 本地宽松执行，第 16 讲再拦截。\n- <strong>edit<\/strong>：参数 <strong>文件路径 + old_text + new_text<\/strong>；四级匹配：<strong>精确 → 换行符 → 去首尾空行 → 逐行去首尾空白<\/strong>；<strong>多处匹配 → 拒绝替换<\/strong>。\n- <strong>并发<\/strong>：<strong>Fork-Join<\/strong>；goroutine + WaitGroup；<strong>预分配固定长度切片，按索引无锁写入<\/strong>，保证顺序；要先判断任务是否独立（读并发、写串行）。\n- <strong>Reporter<\/strong>：TerminalReporter / FeishuReporter，引擎不用各写主循环；飞书流程：消息 → <strong>Webhook<\/strong> → 启动 Agent → Reporter 回报；缺点：无历史，第 11 讲 Session 解决。\n\n### 记得住、装得下（第 10—13 讲）\n\n- <strong>Prompt Composer<\/strong>：运行时拼<strong>基础系统提示 + AGENTS.md（项目规则）+ Skills（任务方法）<\/strong>；技能在 <strong>.claw/skills<\/strong>，<strong>SKILL.md<\/strong> 含 name、description；渐进加载只是思路，<strong>本讲实现是正文一起加载<\/strong>。\n- <strong>Session / SessionManager<\/strong>：按会话标识各看各的历史，用锁保护；<strong>Working Memory<\/strong> 取最近若干条，工具调用与结果要成对；<strong>会话隔离 ≠ 工作区隔离<\/strong>。\n- <strong>Context Compactor<\/strong>（发送前处理）：<strong>旧的工具结果整条换占位提示（全量掩码）<\/strong>，保留调用记录；<strong>保护区内超长结果保留首尾各 500 字、截去中间<\/strong>；原始历史与压缩副本分开。\n- <strong>状态外部化<\/strong>：<strong>PLAN.md<\/strong>（方案和约束）+ <strong>TODO.md<\/strong>（事项和进度）；三好处：<strong>透明、人可直接改文件纠偏、进程重启后读文件恢复<\/strong>；「读磁盘比内存快」是错的。Plan Mode ≠ Thinking。\n\n### 出错处理与危险操作控制（第 14—17 讲）\n\n- <strong>Error Recovery<\/strong>：工具出错后附「<strong>错误信息 + 建议<\/strong>」（edit 失败 → 先重读文件）；<strong>RecoveryManager 用字符串匹配<\/strong>，更稳是错误类型/错误码；系统不替模型改文件。\n- <strong>System Reminders<\/strong>（ReminderInjector）：按<strong>工具名 + 参数生成指纹<\/strong>，连续重复失败 = <strong>Doom Loop<\/strong>；提醒以 <strong>RoleUser<\/strong> 消息追加到<strong>最末尾<\/strong>（不是 System/Assistant/Tool）；只是引导，不是强制。\n- <strong>Middleware<\/strong>：工具<strong>执行前<\/strong>检查，决策 <strong>allow / ask / deny<\/strong>；人工审批时 <strong>Middleware 层通过 channel 阻塞等待<\/strong>，同意才执行；示例没有完整沙箱。\n- <strong>Subagent<\/strong>：独立任务和历史，只回一份总结；启动做成工具 <strong>spawn_subagent<\/strong>；上下文隔离 ≠ 权限隔离。\n- 对比：Error Recovery（一次错误）vs System Reminders（重复行为）。\n\n### 评估（第 18—20 讲）\n\n- <strong>Cost Tracker<\/strong>：Provider 取回 <strong>Usage<\/strong>，<strong>CostTracker 包装 Provider<\/strong>，调用前后记<strong>用量和耗时<\/strong>，会话累计；估费用还要价格；工具执行耗时不在内。\n- <strong>Tracing<\/strong>：<strong>Trace<\/strong> = 一次任务的步骤和时间；<strong>Span<\/strong> = 节点；<strong>根 = 一次完整运行 → Turn → 模型调用/工具执行<\/strong>；Go 的 <strong>context<\/strong> 传当前 Span，写成 JSON；记了什么才能看什么。\n- 对比：Cost Tracker = 总账（用了多少）；Tracing = 流水（卡在哪）。\n- <strong>Benchmark<\/strong>：<strong>SetupScript<\/strong> 准备已知状态 → Agent 做 → <strong>ValidateScript 验证物理世界（文件、测试结果）<\/strong>，这才是是否完成的核心依据（不是回复说完成、不是 Token、不是 TODO.md 打勾）。\n- <strong>结果评估<\/strong>（是否达标）vs <strong>轨迹评估<\/strong>（中间做了什么）；相同任务/模型/环境，多次运行。\n\n### 组装实战与串讲（第 21—22 讲）\n\n- <strong>第 21 讲 CLI<\/strong>：入口读配置 → 创建 Provider、Registry、上下文处理器、<strong>Reporter<\/strong>、Tracker → 启动主循环；并发计数 Go 项目；计划 → 看文件 → 分析 → 改并验证 → 说明；PLAN/TODO 记计划、read 看、edit/write 改、bash 测试、Tracker 记消耗。\n- <strong>第 22 讲 飞书 AgentOps<\/strong>：群里说 Nginx 异常 → 启动 Agent → 读规则和运维 Skill、nginx.conf、error.log → 改配置<strong>先审批<\/strong>（Middleware channel 阻塞等待）→ reload 也审批 → <strong>Reporter<\/strong> 发回飞书；多用户：每请求自己的引擎和 Reporter 随上下文传给中间件。\n- <strong>串讲<\/strong>：Session → Prompt Composer → Compactor → Main Loop → Provider → Registry → Middleware → 执行；失败：Recovery 建议、Reminders 提醒、Middleware 审批；长任务：PLAN/TODO、子 Agent；Tracker 用量、Trace 过程；最后验证；Benchmark 比版本。\n- 易混：Provider（适配模型接口）vs Registry（管工具分发）；Recovery（一次）vs Reminders（重复）。\n\n\n\n\n\n### 初识 Spring（第 01—04、13 讲）\n\n- Framework 地基（IoC、AOP），Boot 快速搭建（自动配置、起步依赖），Cloud 分布式（发现、配置、熔断）。\n- IoC = 交给 Spring 管；DI = Spring 自动塞；Bean = 被管的对象；容器 = ApplicationContext。\n- 分层注解：@Controller → @Service → @Repository，都是 @Component；@Autowired 自动塞；@Configuration + @Bean 用方法造 Bean。\n- @SpringBootApplication = @Configuration + @EnableAutoConfiguration + @ComponentScan。\n- start.spring.io = Initializr；/actuator/health 看健康；父 POM / BOM 管版本；spring-boot-maven-plugin 打可执行 jar。Spring 5 要 Java 8+。\n\n### 数据源与连接池（第 05—08 讲）\n\n- 单数据源：Boot 自动配 <strong>DataSource + DataSourceTransactionManager + JdbcTemplate<\/strong>；配置前缀 spring.datasource；schema.sql 建表、data.sql 插数据。\n- 多数据源：每个配自己的事务管理器；排除自动配置（exclude）或用 <strong>@Primary<\/strong> 指定主数据源。\n- <strong>HikariCP<\/strong> = Boot 2 默认，主打快（字节码精简、FastList、ConcurrentBag）；maximumPoolSize 最大连接数（默认 10），maxLifetime 寿命，connectionTimeout 等待。Boot 1 默认 Tomcat 连接池。\n- <strong>Druid<\/strong> = 阿里，主打监控：SQL 统计、慢 SQL、WallFilter 防注入、密码加密、Filter 扩展；druid-spring-boot-starter。\n\n### JdbcTemplate 与异常（第 09、12 讲）\n\n- update 增删改；query / queryForList 查多条；queryForObject 查一个；batchUpdate 批量；execute 任意语句。\n- RowMapper 行 → 对象；SimpleJdbcInsert 插入拿主键；NamedParameterJdbcTemplate 用 :名字 当参数。\n- 异常根 <strong>DataAccessException<\/strong>（运行时异常）；主键重复 DuplicateKeyException；翻译器 SQLErrorCodeSQLExceptionTranslator；对照表 sql-error-codes.xml（可自定义覆盖）。\n\n### 事务（第 10、11、14 讲）\n\n- 事务 = 一组操作要么全成功（提交），要么全撤销（回滚）。\n- <strong>Manager 干活<\/strong>（PlatformTransactionManager：开启/提交/回滚），<strong>Definition 定规则<\/strong>（TransactionDefinition），<strong>Status 看状态<\/strong>（TransactionStatus）。\n- 经理名字前半截 = 技术：JDBC / MyBatis → <strong>DataSource<\/strong>；JPA → <strong>Jpa<\/strong>；分布式 → <strong>Jta<\/strong>。\n- 默认值：传播 <strong>REQUIRED<\/strong>，隔离 <strong>DEFAULT（跟数据库走）<\/strong>，超时 -1，只读 false。\n- 传播：REQUIRES_NEW = 总是新的独立事务；NESTED = 原事务里存档；MANDATORY 没有就报错；NEVER 有就报错。\n- 并发问题：未提交 → 脏读；值变了 → 不可重复读；行数变了 → 幻读。SERIALIZABLE 全挡。\n- Template → 编程式（手动回滚 setRollbackOnly）；@Transactional → 声明式，靠 <strong>AOP 代理<\/strong>；传统 Spring 用 @EnableTransactionManagement 打开，Boot 自动打开。\n- 回滚：<strong>带 Runtime 的错误回滚，不带的不回滚<\/strong>，除非写 rollbackFor。\n- 三个坑：类里自己调自己不生效；错误被 catch 接住不回滚；贴在非 public 方法上不生效。\n\n### JPA（第 15—19、23 讲）\n\n- ORM 对象 ↔ 表；<strong>JPA 规范，Hibernate 实现，Spring Data JPA 提供 Repository<\/strong>。\n- @Entity 实体，@Table 表名，@Id 主键，@GeneratedValue 自动生成，@Column 列，@ManyToMany 多对多，@CreationTimestamp / @UpdateTimestamp，@Enumerated 枚举，@MappedSuperclass 公共父类。\n- Lombok：@Data 一大堆，@Builder 链式，@Slf4j 日志，@NoArgsConstructor / @AllArgsConstructor。金额用 Joda Money。\n- CrudRepository（增删改查）→ PagingAndSortingRepository（+分页排序）→ JpaRepository；@EnableJpaRepositories；@NoRepositoryBean。\n- 方法名查询：findBy… And / OrderBy / Top3 / Desc；countBy…；Pageable 分页、Sort 排序。\n- 接口 → 代理 → 默认实现 SimpleJpaRepository。Query by Example = 样例对象当条件。\n\n### MyBatis（第 20—22 讲）\n\n- MyBatis 自己写 SQL（复杂查询、精细控制）；JPA 自动生成 SQL（简单增删改查）。\n- mybatis-spring-boot-starter；@Mapper / @MapperScan；@Select 等写 SQL；@Options(useGeneratedKeys=true) 拿主键；TypeHandler 类型转换。\n- 配置：mapper-locations（XML 位置）、type-handlers-package、map-underscore-to-camel-case（下划线转驼峰）。\n- <strong>MyBatis Generator<\/strong> 生成 Model / Mapper / XML，配置 generatorConfig.xml，命令行 / Maven 插件 / Java 运行，结果要审查。\n- <strong>PageHelper<\/strong> 分页：pagehelper-spring-boot-starter，RowBounds 或方法参数，PageInfo。\n\n### NoSQL 与缓存（第 24—30 讲）\n\n- Docker：镜像 = 安装包，容器 = 运行实例；-p 端口，-v 数据卷，-e 环境变量；pull / run / ps / logs / stop。\n- MongoDB：@Document + @Id，MongoTemplate，MongoRepository，自定义 Converter。\n- Redis：String / List / Hash / Set / ZSet。<strong>Jedis 线程不安全（JedisPool），Lettuce 线程安全、Boot 2 默认<\/strong>。\n- <strong>哨兵 = 监控 + 自动切换<\/strong>（JedisSentinelPool）；<strong>集群 = 分片，16384 哈希槽<\/strong>（JedisCluster）。\n- RedisTemplate / StringRedisTemplate；opsForValue / opsForHash / opsForList；@RedisHash；可自定义序列化器。\n- 缓存：@EnableCaching 打开；<strong>@Cacheable 有就不执行；@CachePut 总执行再更新；@CacheEvict 清除<\/strong>；@Caching 组合；@CacheConfig 类级配置。共享用 Redis，spring.cache.redis.time-to-live 过期。\n\n### Reactor 响应式（第 31—35 讲）\n\n- Reactor 实现 Reactive Streams（Publisher / Subscriber / Subscription / Processor）。\n- <strong>Mono 0..1，Flux 0..N<\/strong>；<strong>不订阅不执行<\/strong>；<strong>背压 = 下游用 request(n) 控制速度<\/strong>。\n- map 一对一，flatMap 变流再合并，filter 过滤，onErrorReturn 默认值 / onErrorResume 换流，doOnNext 顺便做事。\n- Schedulers 指定线程；publishOn 管后面，subscribeOn 管源头。\n- ReactiveRedisTemplate（只能用 Lettuce），ReactiveMongoTemplate，<strong>R2DBC<\/strong>（ConnectionFactory、DatabaseClient，当时在孵化）。\n\n### AOP（第 36—38 讲）\n\n- AOP = 不改代码，在方法前后加横切逻辑（日志、耗时、事务）。\n- <strong>切面 = 通知 + 切点；通知 = 做什么；切点 = 在哪<\/strong>；连接点 = 方法执行；织入 = 应用过程；目标对象；AOP 代理。\n- 通知：@Before 前，@AfterReturning 正常返回后，@AfterThrowing 出错后，@After 都执行（finally），<strong>@Around 包住<\/strong>（proceed() 执行原方法，适合统计耗时）。\n- @Aspect + @Component；@EnableAspectJAutoProxy（Boot 自动）；<strong>@Order 越小越先<\/strong>。\n- 切点表达式：execution（最常用）、within、@annotation、bean。\n- 有接口 JDK 动态代理或 CGLIB；没接口 CGLIB。\n\n### Spring MVC（第 39—45、49—52 讲）\n\n- 总入口 <strong>DispatcherServlet<\/strong>；HandlerMapping 找方法，HandlerAdapter 调方法，HandlerExceptionResolver 处理异常，ViewResolver 解析视图，MultipartResolver 上传。\n- @RestController = @Controller + @ResponseBody；@RequestMapping / @GetMapping…；@PathVariable 路径变量，@RequestParam 问号参数，@RequestBody 请求体，@RequestHeader，@ResponseStatus。\n- 父子上下文：<strong>子看父，父看不到子<\/strong>；切面只对同一上下文生效。\n- 流程：DispatcherServlet → Mapping → Adapter → preHandle → 方法 → postHandle → 视图 / 异常 → afterCompletion。\n- Converter / Formatter（Boot 自动注册）；@Valid + BindingResult；MultipartFile。\n- 页面 ViewResolver → View；JSON <strong>HttpMessageConverter<\/strong>；内容协商；redirect: / forward:。\n- @ExceptionHandler 单个，<strong>@ControllerAdvice<\/strong> 集中；拦截器 preHandle（false 拦下）/ postHandle / afterCompletion，WebMvcConfigurer.addInterceptors。\n\n### 视图与静态资源（第 46—48 讲）\n\n- JSON 默认 Jackson；XML 加 jackson-dataformat-xml；@JsonComponent 自定义序列化。\n- Thymeleaf：spring-boot-starter-thymeleaf，模板在 classpath:/templates/，后缀 .html，开发时 spring.thymeleaf.cache=false。\n- 静态资源目录：/static、/public、/resources、/META-INF/resources；static-path-pattern 访问路径，static-locations 目录；Cache-Control 缓存；生产交给 CDN / Nginx。\n\n### HTTP 客户端（第 53—57 讲）\n\n- <strong>RestTemplate<\/strong> 同步阻塞；Boot 不自动建，用 <strong>RestTemplateBuilder<\/strong>。\n- getForObject 只要内容，getForEntity 要完整响应（ResponseEntity）；postForObject / put / delete；<strong>exchange<\/strong> 最灵活。\n- RequestEntity 构造请求，UriComponentsBuilder 拼网址，ParameterizedTypeReference 处理泛型。\n- 底层换 Apache HttpClient：HttpComponentsClientHttpRequestFactory；配连接池、连接 / 读取超时（下游慢会卡住线程）。\n- <strong>WebClient<\/strong> 非阻塞，返回 Mono / Flux，底层 Reactor Netty；retrieve() → bodyToMono / bodyToFlux。\n\n### REST 与 WebFlux（第 58—66 讲）\n\n- 成熟度：0 POX → 1 资源 → 2 HTTP 方法 → <strong>3 超媒体（HATEOAS）<\/strong>。网址用名词复数、分层级。\n- <strong>安全<\/strong>：GET、HEAD、OPTIONS；<strong>不幂等<\/strong>：POST、PATCH（其余幂等）。\n- 状态码：200 成功，201 新建，204 无内容，304 没变，400 请求错，<strong>401 没登录，403 没权限<\/strong>，404，405，500。4 客户端错，5 服务器错。\n- HATEOAS 响应带链接；HAL：_links、_embedded。Spring Data REST：spring-boot-starter-data-rest，@RepositoryRestResource，/search。\n- Session：粘性会话 / 会话复制 / 集中存储；Spring Session + Redis，@EnableRedisHttpSession。\n- WebFlux：非阻塞、Reactor、默认 Netty；不一定更快，少线程高并发；全链路非阻塞（R2DBC）；注解或 RouterFunction。\n\n### Boot 原理（第 67—74 讲）\n\n- 四部分：<strong>自动配置、起步依赖、CLI、Actuator<\/strong>。Boot 不是：应用服务器、Java EE 实现、代码生成器、Spring 替代品。\n- <strong>@EnableAutoConfiguration → AutoConfigurationImportSelector → META-INF/spring.factories → 条件注解<\/strong>。\n- 条件：OnClass / OnMissingClass / OnBean / <strong>OnMissingBean（用户可覆盖）<\/strong> / OnProperty / OnWebApplication / OnResource。\n- 顺序 @AutoConfigureBefore / After / Order；--debug 看条件报告；exclude 排除；低版本用 BeanFactoryPostProcessor。\n- Starter：<strong>官方 spring-boot-starter-xxx，第三方 xxx-spring-boot-starter<\/strong>；拆 autoconfigure + starter；BOM 管版本；mvn dependency:tree + exclusion。\n- 优先级：<strong>命令行最高；带 profile > 不带；jar 外 > jar 内<\/strong>；spring.profiles.active；宽松绑定（推荐中划线）。\n- PropertySource → Environment；<strong>@ConfigurationProperties 一组，@Value 单个<\/strong>；EnvironmentPostProcessor 加配置源。\n\n### Boot 运维（第 75—85 讲）\n\n- Actuator 端点在 /actuator：health、info、beans、conditions、configprops、env、mappings、metrics、loggers（可改级别）、threaddump、heapdump、shutdown（默认关）。HTTP 默认只开 <strong>health、info<\/strong>；exposure.include=* 全开。\n- HealthIndicator，Health.up() / down()；UP / DOWN / OUT_OF_SERVICE / UNKNOWN；有一个 DOWN 整体 DOWN；show-details 默认 never。\n- <strong>Micrometer = 监控界的 SLF4J<\/strong>；Counter 只增，Gauge 当前值，Timer 计时；Tag 维度；MeterRegistry。\n- Spring Boot Admin（codecentric）：@EnableAdminServer；spring.boot.admin.client.url。\n- server.port、server.compression.enabled、server.tomcat.max-threads；WebServerFactoryCustomizer。HTTPS：keytool + server.ssl.key-store；HTTP/2：server.http2.enabled（浏览器需 HTTPS）。\n- web-application-type=none；ApplicationRunner（ApplicationArguments）/ CommandLineRunner（原始参数）；@Order；ExitCodeGenerator。\n- 可执行 jar：repackage；MANIFEST <strong>Main-Class = JarLauncher，Start-Class = 你的入口<\/strong>；BOOT-INF/classes、BOOT-INF/lib；仍需 Java。\n- Dockerfile：FROM → COPY / ADD → ENTRYPOINT。\n\n### 微服务与云原生（第 86—90 讲）\n\n- 微服务好处：独立部署扩容、技术多样、故障隔离；代价：网络调用、数据一致性、测试运维复杂；按业务拆，不是越细越好。\n- 云原生四方面：<strong>DevOps、持续交付、微服务、容器<\/strong>。\n- 12-Factor：基准代码、依赖、<strong>配置（放环境）<\/strong>、后端服务、构建发布运行分离、<strong>进程（无状态）<\/strong>、端口绑定、并发（加进程）、<strong>易处理（快启优雅停）<\/strong>、环境等价、日志（事件流）、管理进程。\n- Spring Cloud：注册发现、负载均衡、配置、熔断、消息、追踪、网关；实现可替换。版本 = 伦敦地铁站名按字母序（Finchley↔Boot 2.0，Greenwich↔Boot 2.1）；spring-cloud-dependencies 管版本。\n\n### 注册与发现（第 91—99 讲）\n\n- 注册 = 登记，发现 = 查；<strong>DiscoveryClient<\/strong>（getServices、getInstances）。\n- Eureka（Netflix，<strong>AP<\/strong>，2.x 停止）：@EnableEurekaServer；@EnableDiscoveryClient；defaultZone；心跳 30 秒、90 秒剔除。\n- 客户端负载均衡：<strong>Ribbon<\/strong>（维护）→ <strong>Spring Cloud LoadBalancer<\/strong>；<strong>@LoadBalanced<\/strong> 让 RestTemplate 认服务名。\n- <strong>Feign<\/strong>：spring-cloud-starter-openfeign，@EnableFeignClients，<strong>@FeignClient(name=)<\/strong>，可配超时、换 HttpClient / OkHttp。\n- ZooKeeper（Apache，<strong>CP<\/strong>，临时节点，不太适合做注册中心）；Consul（HashiCorp，健康检查、DNS、KV）；<strong>Nacos（阿里，发现 + 配置，8848）<\/strong>，server-addr。\n\n### 熔断与限流（第 100—106 讲）\n\n- 断路器防雪崩：<strong>关闭 = 正常调用；打开 = 直接拒绝；半开 = 放少量试探<\/strong>；降级 fallback。\n- Hystrix（Netflix，已维护）：@EnableCircuitBreaker，@HystrixCommand(fallbackMethod)，线程池 / 信号量隔离；Feign：feign.hystrix.enabled + fallback；Dashboard 读 /actuator/hystrix.stream，<strong>Turbine 聚合<\/strong>。\n- Resilience4j：轻量、Java 8 函数式、按模块引入（CircuitBreaker、Bulkhead、RateLimiter、Retry、TimeLimiter、Cache）。\n- <strong>失败率 → 断路器<\/strong>（failureRateThreshold 默认 50%，waitDurationInOpenState）；<strong>同时几个 → Bulkhead<\/strong>（maxConcurrentCalls，BulkheadFullException）；<strong>每段时间几次 → RateLimiter<\/strong>（limitForPeriod、limitRefreshPeriod，RequestNotPermitted）。可配合使用。\n\n### 配置中心（第 107—113 讲）\n\n- 配置中心管「用什么配置」，注册中心管「服务在哪」。\n- Config Server：<strong>@EnableConfigServer<\/strong>，默认 <strong>Git<\/strong>，端口 8888；<strong>application 应用名 / profile 环境 / label 分支<\/strong>。\n- 客户端：spring-cloud-starter-config，写在 <strong>bootstrap.yml<\/strong>，spring.cloud.config.uri，fail-fast，spring-retry 重试，discovery.enabled。\n- 刷新：<strong>@RefreshScope + POST /actuator/refresh<\/strong>；Spring Cloud <strong>Bus<\/strong> 广播（/actuator/bus-refresh）；ZooKeeper / Consul / Nacos 监听自动刷新。\n- PropertySourceLocator 接入远程配置，默认远程优先。\n- ZooKeeper 节点监听；Consul KV + Watch；<strong>Nacos（阿里）Data ID + Group<\/strong>；<strong>Apollo（携程）灰度、权限、审计、多环境<\/strong>。\n\n### 消息与追踪（第 114—122 讲）\n\n- Stream 统一收发消息；<strong>Binder 对接中间件，Binding 绑通道和目的地<\/strong>；@EnableBinding、@StreamListener、@Input / @Output、Source 发 / Sink 收 / Processor、@SendTo。\n- <strong>消费组<\/strong>：不同组各收一份；同组只有一个实例处理（bindings.<通道>.group）。\n- RabbitMQ：交换机、队列、路由键；Kafka：Topic、broker、消费组。消息通知代替轮询；@Scheduled、Spring 事件解耦。\n- Dapper：<strong>Trace = 一次完整请求（Trace ID），Span = 一个工作单元（Span ID）<\/strong>；采样；cs / sr / ss / cr。\n- <strong>Sleuth 采集（底层 Brave），Zipkin 展示（9411）<\/strong>；spring.zipkin.base-url；spring.sleuth.sampler.probability 默认 0.1；日志带 TraceID / SpanID；HTTP 或 RabbitMQ / Kafka 上报；消息链路也能追踪。\n- 治理不只链路：容量、依赖、变更、审计、监控；Docker Compose 编排。", "harness": "", "stages": [{"n": 1, "name": "零基础实战机器学习", "desc": "21 讲：任务类型、数据准备、RFM 与聚类、模型优化、深 <script>'use strict';

/* ============================================================
 * 数据
 * ============================================================ */
const DATA = window.EXAM_DATA;
const MODS = DATA.modules;
const MOD = Object.fromEntries(MODS.map(m => [m.id, m]));
const QS = {};
MODS.forEach(m => m.questions.forEach(q => { QS[q.id] = q; }));

const STAGES = DATA.stages;

// 模拟卷结构：按考试大纲题号
const BLUEPRINT = DATA.blueprint;

const TYPE_NAME = { single: '单选', multi: '多选', short: '简答', code: '代码' };
const DAY = 24 * 3600 * 1000;
const isPractice = q => q.lesson !== undefined;
const inScope = q => !!(S.settings && S.settings.extra) || (q.tags || []).includes('core');
const drillPool = () => Object.values(QS).filter(q => !isPractice(q) && inScope(q));

/* ============================================================
 * 进度存储
 * ============================================================ */
const KEY = DATA.storageKey;
const DEFAULT_STATE = () => ({ lessons: {}, q: {}, mocks: [], code: {}, last: null, settings: { blind: false } });
let S = loadState();

function loadState() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY));
    if (raw && typeof raw === 'object') return Object.assign(DEFAULT_STATE(), raw);
  } catch (e) { /* 损坏就重新开始 */ }
  return DEFAULT_STATE();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('进度保存失败：浏览器存储不可用'); }
}

const qs = id => S.q[id] || {};
const lessonKey = (mid, li) => `${mid}:${li}`;
const lessonState = (mid, li) => S.lessons[lessonKey(mid, li)] || {};

// 记录一次作答。错题进错题本；在错题本里连续答对 2 次移出
function record(id, ok) {
  const st = S.q[id] || (S.q[id] = { n: 0, wrong: 0 });
  st.n++; st.ok = ok; st.t = Date.now();
  if (!ok) {
    st.wrong++;
    st.box = { lv: 0, due: Date.now() };
  } else if (st.box) {
    if (st.box.lv === 0) st.box = { lv: 1, due: Date.now() + DAY };
    else delete st.box;
  }
  save();
}
function toggleUnsure(id) {
  const st = S.q[id] || (S.q[id] = { n: 0, wrong: 0 });
  st.unsure = !st.unsure;
  save();
  return st.unsure;
}

const FILTERS = {
  all: { name: '全部', fn: () => true },
  new: { name: '没做过', fn: id => !qs(id).n },
  wrong: { name: '做错过', fn: id => qs(id).wrong > 0 },
  unsure: { name: '不熟', fn: id => !!qs(id).unsure },
};

function modStats(mid) {
  const m = MOD[mid];
  const pool = m.questions.filter(q => !isPractice(q) && inScope(q));
  const done = pool.filter(q => qs(q.id).n);
  const right = done.filter(q => qs(q.id).ok);
  const lessonsDone = m.lessons.filter((_, i) => lessonState(mid, i).done).length;
  return { total: pool.length, done: done.length, right: right.length, lessons: m.lessons.length, lessonsDone };
}
const dueList = () => Object.keys(S.q).filter(id => QS[id] && S.q[id].box && S.q[id].box.due <= Date.now());
const boxList = () => Object.keys(S.q).filter(id => QS[id] && S.q[id].box);

/* ============================================================

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function h(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
function confirmBox(msg, okText = '确定', cancelText = '取消') {
  return new Promise(resolve => {
    const m = $('#modal');
    m.innerHTML = `<div class="modal-bg"><div class="modal-card" role="dialog"><div class="modal-msg">${msg}</div>
      <div class="modal-actions"><button class="btn secondary" data-v="0">${cancelText}</button><button class="btn primary" data-v="1">${okText}</button></div></div></div>`;
    m.classList.add('show');
    const done = v => { m.classList.remove('show'); m.innerHTML = ''; document.removeEventListener('keydown', onKey, true); resolve(v); };
    const onKey = e => {
      if (e.key === 'Escape') { e.stopPropagation(); done(false); }
      if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); done(true); }
    };
    document.addEventListener('keydown', onKey, true);
    m.querySelectorAll('button').forEach(b => b.onclick = () => done(b.dataset.v === '1'));
    $('.btn.primary', m).focus();

}

/* ============================================================
 * Markdown 渲染 + 简易语法高亮

const PY_KW = new Set('False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield'.split(' '));
const PY_BI = new Set('print len range list dict set tuple str int float bool type isinstance sorted enumerate zip map filter sum min max abs open iter next repr id super object Exception ValueError TypeError KeyError IndexError StopIteration ZeroDivisionError'.split(' '));
const SQL_KW = new Set('SELECT FROM WHERE AND OR NOT GROUP BY HAVING ORDER ASC DESC AS COUNT SUM AVG MIN MAX INSERT INTO VALUES CREATE TABLE LIMIT JOIN ON IN IS NULL DISTINCT BETWEEN LIKE'.split(' '));


const JAVA_KW = new Set('public private protected class interface extends implements static final void return new if else for while try catch finally throw throws this super null true false int long boolean double String import package'.split(' '));
function highlightJava(code) {
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:[^"\\\n]|\\.)*")|(\b\d+(?:\.\d+)?[LlFfDd]?\b)|(@\w+)|([A-Za-z_$][\w$]*)|([^/"\w@$]+|.)/g;
  return code.replace(re, (m, c, s, n, ann, w) => {
    if (c) return `<span class="hl-c">${esc(c)}</span>`;
    if (s) return `<span class="hl-s">${esc(s)}</span>`;
    if (n) return `<span class="hl-n">${n}</span>`;
    if (ann) return `<span class="hl-d">${esc(ann)}</span>`;
    if (w) return JAVA_KW.has(w) ? `<span class="hl-k">${w}</span>` : /^[A-Z]/.test(w) ? `<span class="hl-b">${w}</span>` : w;
    return esc(m);
  });
}

function highlight(code, lang) {
  if (lang === 'java') return highlightJava(code);
  if (lang === 'sql') {
    return code.replace(/(--[^\n]*)|('(?:[^'\\]|\\.)*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)|([^\w'-]+|-)/g, (m, c, s, n, w) => {
      if (c) return `<span class="hl-c">${esc(c)}</span>`;
      if (s) return `<span class="hl-s">${esc(s)}</span>`;
      if (n) return `<span class="hl-n">${n}</span>`;
      if (w && SQL_KW.has(w.toUpperCase())) return `<span class="hl-k">${w}</span>`;
      return esc(m);
    });
  }
  if (lang !== 'python' && lang !== 'py') return esc(code);
  const re = /(#[^\n]*)|([rbfuRBFU]{0,2}(?:"""[\s\S]*?"""|'''[\s\S]*?'''|"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'))|(\b\d[\d_]*(?:\.\d+)?(?:e-?\d+)?\b)|(@\w+)|([A-Za-z_]\w*)|([^#'"\w@]+|.)/g;
  let prevDef = false;
  return code.replace(re, (m, c, s, n, deco, w) => {
    if (c) return `<span class="hl-c">${esc(c)}</span>`;
    if (s) return `<span class="hl-s">${esc(s)}</span>`;
    if (n) return `<span class="hl-n">${n}</span>`;
    if (deco) return `<span class="hl-d">${esc(deco)}</span>`;
    if (w) {
      if (prevDef) { prevDef = false; return `<span class="hl-f">${w}</span>`; }
      if (PY_KW.has(w)) { prevDef = (w === 'def' || w === 'class'); return `<span class="hl-k">${w}</span>`; }
      if (PY_BI.has(w)) return `<span class="hl-b">${w}</span>`;
      return w;
    }
    return esc(m);
  });
}

marked.use({
  gfm: true,
  renderer: {
    code({ text, lang }) {
      const parts = (lang || '').trim().split(/\s+/);
      const language = parts[0] || '';

        + `<pre><code${runnable ? ' contenteditable="plaintext-only" spellcheck="false"' : ''}>${highlight(text, language)}</code></pre>`
        + (runnable ? `<div class="run-out" hidden><div class="run-out-label">输出</div><pre></pre></div>` : '')
        + `</div>`;
    },
  },
});
function md(src) {
  const el = document.createElement('div');
  el.className = 'md';
  el.innerHTML = marked.parse(src || '');
  $$('a[href^="http"]', el).forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  $$('blockquote', el).forEach(decorateCallout);
  return el;
}
const mdHtml = src => md(src).innerHTML;

// 引用块按开头的符号变成「提示 / 注意 / 本节要点」卡片
const CALLOUTS = [
  { re: /^\s*💡\uFE0F?\s*/, cls: 'tip', label: '提示', icon: 'bulb' },
  { re: /^\s*⚠\uFE0F?\s*/, cls: 'warn', label: '注意', icon: 'alert' },
  { re: /^\s*📌\uFE0F?\s*/, cls: 'key', label: '本节要点', icon: 'bookmark' },
];
function decorateCallout(bq) {
  const walker = document.createTreeWalker(bq, NodeFilter.SHOW_TEXT);
  let node;
  while ((node = walker.nextNode()) && !node.nodeValue.trim());
  if (!node) return;
  const c = CALLOUTS.find(c => c.re.test(node.nodeValue));
  if (!c) { bq.classList.add('callout', 'tip'); return; }
  node.nodeValue = node.nodeValue.replace(c.re, '');
  const first = bq.firstElementChild;
  if (c.cls === 'key' && first && /^本节要(记住|点)$/.test(first.textContent.trim())) first.remove();
  bq.classList.add('callout', c.cls);
  bq.prepend(h(`<div class="callout-head">${icon(c.icon, 15)}<span>${c.label}</span></div>`));
}
const mdInline = src => marked.parseInline(src || '');

// 讲解里的“▶ 运行”
document.addEventListener('click', async e => {
  const btn = e.target.closest('.run-btn');
  if (!btn) return;
  const box = btn.closest('.code');
  const code = $('code', box).innerText;

  out.hidden = false; out.className = 'run-out loading'; pre.textContent = '运行中…';
  btn.disabled = true;
  const r = await Py.run(code, '', status => { pre.textContent = status; });
  btn.disabled = false;
  out.classList.remove('loading');
  if (r.ok) {
    pre.textContent = r.out || '（没有输出。想看结果要用 print）';
  } else {
    out.classList.add('err');
    pre.textContent = (r.out ? r.out + '\n' : '') + r.error;
  }
});

/* ============================================================
 * Python 运行环境（Pyodide，放在 Web Worker 里，死循环可以强制停）
 * ============================================================ */
const PY_URL = 'https://cdn.jsdelivr.net/pyodide/v0.29.0/full/';
const Py = (() => {
  let worker = null, ready = false, readyWaiters = [], seq = 0, pending = {}, loadError = null;
  const src = `
    importScripts('${PY_URL}pyodide.js');
    const boot = loadPyodide({ indexURL: '${PY_URL}' }).then(py => { postMessage({ type: 'ready' }); return py; },
      err => { postMessage({ type: 'fail', error: String(err && err.message || err) }); throw err; });
    function clean(msg) {
      const lines = String(msg).split('\\n');
      const i = lines.findIndex(l => l.includes('File "<exec>"'));
      return i >= 0 ? 'Traceback (most recent call last):\\n' + lines.slice(i).join('\\n').trim() : String(msg).trim();
    }
    self.onmessage = async e => {
      const { id, code, after } = e.data;
      const py = await boot;
      const out = [];
      py.setStdout({ batched: s => out.push(s) });
      py.setStderr({ batched: s => out.push(s) });
      const ns = py.globals.get('dict')();
      let phase = 'user';
      try {
        const all = code + '\\n' + (after || '');
        const want = ['numpy', 'pandas', 'scipy', 'sqlite3'].filter(p => new RegExp('^\\\\s*(import|from)\\\\s+' + p + '\\\\b', 'm').test(all));
        if (want.length) await py.loadPackage(want, { messageCallback: () => {} });
        await py.runPythonAsync(code, { globals: ns });
        let results = null;
        if (after) {
          phase = 'tests';
          await py.runPythonAsync(after, { globals: ns });
          results = ns.get('_results_json');
        }
        postMessage({ type: 'done', id, ok: true, out: out.join('\\n'), results });
      } catch (err) {
        postMessage({ type: 'done', id, ok: false, phase, out: out.join('\\n'), error: clean(err && err.message || err) });
      } finally { ns.destroy(); }
    };`;

  function start() {
    ready = false; loadError = null;
    worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
    worker.onmessage = e => {
      const d = e.data;
      if (d.type === 'ready') { ready = true; readyWaiters.splice(0).forEach(f => f(true)); updateBadge(); }
      else if (d.type === 'fail') { loadError = d.error; readyWaiters.splice(0).forEach(f => f(false)); updateBadge(); }
      else if (d.type === 'done' && pending[d.id]) { pending[d.id](d); delete pending[d.id]; }
    };
    worker.onerror = e => {
      loadError = e.message || '无法加载 Python 运行环境';
      readyWaiters.splice(0).forEach(f => f(false));
      updateBadge();
    };
    updateBadge();
  }
  function waitReady() {
    if (!worker) start();
    if (ready) return Promise.resolve(true);
    if (loadError) return Promise.resolve(false);
    return new Promise(r => readyWaiters.push(r));
  }
  function updateBadge() {
    const b = $('#py-status');
    if (b) b.textContent = status();
  }
  function status() {
    if (!worker) return '未加载（第一次运行代码时自动加载）';
    if (ready) return '✅ 已就绪';
    if (loadError) return '❌ 加载失败：' + loadError;
    return '⏳ 加载中…';
  }
  async function run(code, after, onStatus, timeoutMs = 15000) {
    if (!ready) onStatus && onStatus('正在加载 Python 运行环境（第一次需要联网下载约 10MB，之后会快很多）…');
    const ok = await waitReady();
    if (!ok) {
      const err = loadError;
      worker && worker.terminate(); worker = null; // 下次重试
      return { ok: false, offline: true, error: 'Python 运行环境加载失败（需要联网）。\n' + (err || '') };
    }
    onStatus && onStatus('运行中…');
    const id = ++seq;
    return new Promise(resolve => {
      const timer = setTimeout(() => {
        delete pending[id];
        worker.terminate(); worker = null; ready = false;
        resolve({ ok: false, error: `运行超过 ${timeoutMs / 1000} 秒被强制停止——是不是写了死循环？` });
      }, timeoutMs);
      pending[id] = d => { clearTimeout(timer); resolve(d); };
      worker.postMessage({ id, code, after });
    });
  }
  return { run, status, preload: () => waitReady() };
})();

const HARNESS = DATA.harness + '\n';
async function runTests(q, userCode, onStatus) {
  const after = HARNESS + q.tests + '\nimport json as _json\n_results_json = _json.dumps(_results, ensure_ascii=False)\n';
  const r = await Py.run(userCode, after, onStatus);
  if (r.ok) r.results = JSON.parse(r.results);
  return r;
}

// 环形进度
function ring(pct, size = 44, stroke = 4, cls = '') {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  const p = Math.max(0, Math.min(1, pct));
  return `<svg class="ring ${cls}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-width="${stroke}" class="ring-bg" fill="none"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-width="${stroke}" class="ring-fg" fill="none"
      stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p)}" transform="rotate(-90 ${size / 2} ${size / 2})" stroke-linecap="round"/></svg>`;
}

function route() {
  if (viewLeave) { viewLeave(); viewLeave = null; }

  const parts = hash.slice(2).split('/').filter(Boolean);
  const main = $('#main');
  main.innerHTML = '';

  const [p0, p1, p2] = parts;
  if (!p0) viewHome(main);
  else if (p0 === 'm' && MOD[p1]) viewModule(main, p1);
  else if (p0 === 'l' && MOD[p1] && MOD[p1].lessons[+p2]) viewLesson(main, p1, +p2);
  else if (p0 === 'drill') viewDrill(main, p1);
  else if (p0 === 'run') viewRun(main);
  else if (p0 === 'review') viewReview(main);
  else if (p0 === 'mock' && p1) viewMockPaper(main, p1);
  else if (p0 === 'mock') viewMockHome(main);
  else if (p0 === 'sheet') viewSheet(main);
  else if (p0 === 'settings') viewSettings(main);
  else viewHome(main);
  document.body.classList.toggle('focus-mode', p0 === 'run' || p0 === 'l' || (p0 === 'mock' && !!p1));

  window.scrollTo(0, 0);
}

  if ((e.ctrlKey || e.metaKey) && e.key !== 'Enter') return;

});

  const allLessons = MODS.reduce((a, m) => a + m.lessons.length, 0);

  }

  const due = dueList().length;
  main.append(h(`<section class="kpis">
    <a class="kpi" href="#/"><div class="kpi-ic">${icon('book', 18)}</div><div><b>${doneLessons}<small> / ${allLessons}</small></b><span>已学课时</span></div></a>
    <a class="kpi" href="#/drill"><div class="kpi-ic">${icon('list', 18)}</div><div><b>${done}<small> / ${pool.length}</small></b><span>刷题单已做</span></div></a>
    <a class="kpi" href="#/drill"><div class="kpi-ic">${icon('target', 18)}</div><div><b>${done ? Math.round(right / done * 100) + '<small>%</small>' : '—'}</b><span>最近正确率</span></div></a>
    <a class="kpi ${due ? 'alert' : ''}" href="#/review"><div class="kpi-ic">${icon('review', 18)}</div><div><b>${due}</b><span>${due ? '道错题待复习' : '暂无待复习错题'}</span></div></a>
  </section>`));

  const path = h(`<section class="path"><div class="section-title"><h2>学习路线</h2><span class="muted">${STAGES.length} 个阶段 · ${MODS.length} 个模块</span></div></section>`);
  for (const st of STAGES) {
    const mods = st.mods.filter(m => MOD[m]);
    const stDone = mods.filter(mid => { const s = modStats(mid); return s.lessons && s.lessonsDone === s.lessons; }).length;
    const sec = h(`<div class="stage">
      <div class="stage-head"><span class="stage-n">${st.n}</span><div class="stage-title"><h3>${st.name}</h3><p>${st.desc}</p></div><span class="stage-meta">${stDone}/${mods.length} 完成</span></div>
      <div class="mod-list"></div></div>`);
    const list = $('.mod-list', sec);
    for (const mid of mods) {
      const m = MOD[mid], s = modStats(mid);
      const lp = s.lessons ? s.lessonsDone / s.lessons : 0;
      const finished = s.lessons && s.lessonsDone === s.lessons;
      const status = finished ? `<span class="mod-status done">${icon('check', 16)}</span>`
        : s.lessonsDone ? `<span class="mod-status doing">${ring(lp, 30, 3)}</span>`
          : `<span class="mod-status todo"></span>`;
      list.append(h(`<a class="mod-row" href="#/m/${mid}">
        ${status}
        <div class="mod-main"><b>${esc(m.short)}</b><span>课程 ${esc((m.exam || '').replace(/（[^）]*分值[^）]*）/, ''))}</span></div>
        <div class="mod-stat"><span class="label">课时</span><span>${s.lessonsDone}/${s.lessons}</span></div>
        <div class="mod-stat wide"><span class="label">刷题 ${s.done}/${s.total}</span><div class="meter"><i style="width:${s.total ? s.done / s.total * 100 : 0}%"></i></div></div>
        <div class="mod-stat"><span class="label">正确率</span><span>${s.done ? Math.round(s.right / s.done * 100) + '%' : '—'}</span></div>
        <span class="chev">${icon('chevronRight', 18)}</span>
      </a>`));
    }
    path.append(sec);
  }
  main.append(path);
}

/* ============================================================
 * 模块页
 * ============================================================ */
function viewModule(main, mid) {
  const m = MOD[mid];
  const s = modStats(mid);
  main.className = 'wide';
  const nl = m.lessons.findIndex((_, i) => !lessonState(mid, i).done);
  main.append(pageHead({
    crumbs: [['学习路线', '#/'], [m.short]],
    eyebrow: esc(m.group || ''),
    title: esc(m.title),
    desc: `对应课程 ${esc(m.exam || '')}`,
    aside: nl >= 0 ? `<a class="btn primary lg" href="#/l/${mid}/${nl}">${nl ? '继续学习' : '开始学习'}${icon('arrowRight', 16)}</a>`
      : `<a class="btn primary lg" href="#/drill/${mid}">去刷题${icon('arrowRight', 16)}</a>`,
  }));
  const allDone = nl < 0;

  const grid = h(`<div class="two-col"><section class="card lessons-card"><div class="card-head"><h3>课程 <span class="muted head-count">${s.lessonsDone}/${s.lessons} 已学</span></h3><button class="btn ghost sm mark-all">${allDone ? `${icon('reset', 14)}全部重新学` : `${icon('skip', 14)}全部标为已学`}</button></div><ol class="timeline"></ol></section><aside class="side-col"></aside></div>`);
  m.lessons.forEach((l, i) => {
    const ls = lessonState(mid, i);
    const prac = m.questions.filter(q => q.lesson === i);
    const pracDone = prac.filter(q => qs(q.id).n).length;
    const isNext = i === nl;
    $('.timeline', grid).append(h(`<li class="${ls.done ? 'done' : ''} ${ls.skipped ? 'skipped' : ''} ${isNext ? 'next' : ''}"><a href="#/l/${mid}/${i}">
      <span class="tl-dot">${ls.done ? (ls.skipped ? icon('skip', 14) : icon('check', 14)) : i + 1}</span>
      <span class="tl-body"><b>${esc(l.title)}</b><span>${ls.skipped ? '已跳过 · ' : ''}${l.cards.length} 步${prac.length ? ` · 课后练习 ${pracDone}/${prac.length}` : ''}</span></span>
      ${isNext ? `<span class="pill accent">${ls.card ? '继续' : '下一节'}</span>` : ''}
      <span class="chev">${icon('chevronRight', 16)}</span></a>
      <button class="tl-toggle ${ls.done ? 'on' : ''}" data-i="${i}" title="${ls.done ? '撤销，改回未学' : '已经学过，跳过这一节'}">${ls.done ? '撤销' : '标为已学'}</button></li>`));
  });
  $('.timeline', grid).addEventListener('click', e => {
    const b = e.target.closest('.tl-toggle'); if (!b) return;
    const i = +b.dataset.i;
    const done = lessonState(mid, i).done;
    setLessonDone(mid, i, !done);
    toast(done ? `已改回未学：${m.lessons[i].title}` : `已标为学过：${m.lessons[i].title}`);
    route();
  });
  $('.mark-all', grid).onclick = async () => {
    if (allDone) {
      if (!(await confirmBox(`把「${esc(m.short)}」的 ${m.lessons.length} 节课都改回未学？<br>做过的题和错题记录不受影响。`, '改回未学'))) return;
      m.lessons.forEach((_, i) => setLessonDone(mid, i, false));
      toast('已全部改回未学');
    } else {
      m.lessons.forEach((_, i) => { if (!lessonState(mid, i).done) setLessonDone(mid, i, true); });
      toast(`「${m.short}」已全部标为学过`);
    }
    route();
  };
  const side = $('.side-col', grid);
  side.append(h(`<section class="card stat-card">
    <div class="card-head"><h3>刷题单</h3></div>
    <div class="ring-stat">${ring(s.total ? s.done / s.total : 0, 76, 6)}<div><b>${s.done}<small> / ${s.total}</small></b><span>已做</span></div></div>
    <dl class="mini-stats"><div><dt>答对</dt><dd>${s.right}</dd></div><div><dt>正确率</dt><dd>${s.done ? Math.round(s.right / s.done * 100) + '%' : '—'}</dd></div><div><dt>没做过</dt><dd>${s.total - s.done}</dd></div></dl>
    <a class="btn secondary block" href="#/drill/${mid}">${icon('list', 16)}刷本模块的题</a>
  </section>`));
  if (m.refs && m.refs.length) {
    side.append(h(`<section class="card"><div class="card-head"><h3>官方资料</h3><span class="muted small">选读</span></div>
      <ul class="ref-list">${m.refs.map(r => `<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${icon('external', 14)}<span>${esc(r.label)}</span></a></li>`).join('')}</ul></section>`));
  }
  main.append(grid);
}

/* ============================================================
 * 讲解：一步一步往下翻
 * ============================================================ */
function viewLesson(main, mid, li) {
  const m = MOD[mid], l = m.lessons[li];
  const key = lessonKey(mid, li);
  const st = S.lessons[key] || (S.lessons[key] = {});
  const practice = m.questions.filter(q => q.lesson === li);
  let idx = Math.min(st.card || 0, l.cards.length - 1);
  if (st.done) idx = 0;
  setLast(`#/l/${mid}/${li}`, `${m.short} · ${l.title}`);

  main.className = 'reading';
  const wrap = h(`<div class="lesson">
    <div class="focus-bar">
      <a class="icon-btn" href="#/m/${mid}" aria-label="返回模块">${icon('x', 20)}</a>
      <div class="focus-progress"><div class="segs"></div></div>
      <span class="focus-count"></span>
      ${st.done ? '' : `<button class="btn ghost sm skip-lesson" title="已经学过，直接跳到下一节">${icon('skip', 14)}跳过本节</button>`}
    </div>
    <div class="lesson-title"><div class="eyebrow">${esc(m.short)} · 第 ${li + 1} 节</div><h1>${esc(l.title)}</h1></div>
    <div class="card-stage"></div>
    <div class="action-bar"><div class="action-inner">
      <button class="btn secondary" data-act="prev">${icon('arrowLeft', 16)}上一步</button>
      <span class="kbd-hint">${icon('keyboard', 15)}<kbd>←</kbd><kbd>→</kbd> 翻页</span>
      <button class="btn primary" data-act="next"></button>
    </div></div></div>`);
  main.append(wrap);
  const stage = $('.card-stage', wrap), segs = $('.segs', wrap);
  const prevBtn = $('[data-act=prev]', wrap), nextBtn = $('[data-act=next]', wrap);

  function show(i, dir = 0) {
    idx = i;
    st.card = i; save();
    const card = md(l.cards[i]);
    card.classList.add('lesson-card', 'prose');
    if (dir) card.classList.add(dir > 0 ? 'in-right' : 'in-left');
    stage.innerHTML = '';
    stage.append(card);
    segs.innerHTML = l.cards.map((_, k) => `<i class="${k < i ? 'past' : k === i ? 'cur' : ''}"></i>`).join('');
    $('.focus-count', wrap).textContent = `${i + 1} / ${l.cards.length}`;
    prevBtn.disabled = i === 0;
    const last = i === l.cards.length - 1;
    nextBtn.innerHTML = last ? (practice.length ? `做课后练习 · ${practice.length} 题${icon('arrowRight', 16)}` : `完成本节${icon('check', 16)}`) : `下一步${icon('arrowRight', 16)}`;
    if (dir) window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function finish() {
    st.done = true; delete st.skipped; st.card = 0; save();
    if (practice.length) {
      startSession({
        title: `课后练习 · ${l.title}`, qids: practice.map(q => q.id), mode: 'practice',
        back: `#/m/${mid}`, next: nextLessonHash(mid, li),
      });
    } else {
      go(nextLessonHash(mid, li).hash);
    }
  }
  const skipBtn = $('.skip-lesson', wrap);
  if (skipBtn) skipBtn.onclick = () => {
    setLessonDone(mid, li, true);
    const nx = nextLessonHash(mid, li);
    toast(`已跳过「${l.title}」，想重学可以在模块页撤销`);
    go(nx.hash);
  };
  prevBtn.onclick = () => idx > 0 && show(idx - 1, -1);
  nextBtn.onclick = () => idx < l.cards.length - 1 ? show(idx + 1, 1) : finish();
  viewKeys = e => {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') { e.preventDefault(); nextBtn.click(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); prevBtn.click(); }
    else if (e.key === 'Escape') go(`#/m/${mid}`);
  };
  show(idx);
}
// 标记一节为已学（跳过）或改回未学
function setLessonDone(mid, li, done) {
  const key = lessonKey(mid, li);
  const st = S.lessons[key] || (S.lessons[key] = {});
  if (done) { if (!st.done) { st.done = true; st.skipped = true; } st.card = 0; }
  else { delete st.done; delete st.skipped; st.card = 0; }
  save();
}
function nextLessonHash(mid, li) {
  const m = MOD[mid];
  if (li + 1 < m.lessons.length) return { hash: `#/l/${mid}/${li + 1}`, label: `下一节：${m.lessons[li + 1].title}` };
  return { hash: `#/m/${mid}`, label: '本模块讲完了，回到模块页' };
}

/* ============================================================
 * 题目组件：单选 / 多选 / 简答 / 代码
 *   opts.exam = true 时不给反馈（模拟考）
 * ============================================================ */
const LETTERS = 'ABCDEFGH';

function questionCard(q, opts = {}) {
  const m = MOD[q.m];
  const unsure = !!qs(q.id).unsure;
  const el = h(`<article class="q-card">
    <header class="q-meta">
      <span class="pill type-${q.type}">${TYPE_NAME[q.type]}</span>
      <span class="q-src">${esc(m ? m.short : '')}${opts.label ? ' · ' + esc(opts.label) : ''}</span>
      <button class="unsure-btn ${unsure ? 'on' : ''}" title="标记为不熟，会出现在错题本的「不熟」里（快捷键 U）">${icon('star', 15)}<span>${unsure ? '已标不熟' : '不熟'}</span></button>
    </header>
    <div class="q-stem prose"></div>
    <div class="q-body"></div>
    <div class="feedback" hidden></div>
    <footer class="q-actions"></footer>
  </article>`);
  $('.q-stem', el).append(md(q.stem));
  const unsureBtn = $('.unsure-btn', el);
  const flipUnsure = () => {
    const on = toggleUnsure(q.id);
    unsureBtn.classList.toggle('on', on);
    $('span', unsureBtn).textContent = on ? '已标不熟' : '不熟';
    toast(on ? '已标记不熟，可以在错题本里集中复习' : '已取消不熟标记');
  };
  unsureBtn.onclick = flipUnsure;
  const ctl = { el, answered: false, keys: null };
  const impl = { single: choiceQ, multi: choiceQ, short: shortQ, code: codeQ }[q.type];
  impl(q, el, ctl, opts);
  const inner = ctl.keys;
  ctl.keys = e => {
    if ((e.key === 'u' || e.key === 'U') && !e.ctrlKey && !e.metaKey) { flipUnsure(); return; }
    if (inner) inner(e);
  };
  return ctl;
}

function feedbackHtml(kind, title) {
  const ic = kind === 'ok' ? 'check' : kind === 'no' ? 'x' : 'bulb';
  return `<div class="fb-head"><span class="fb-ic">${icon(ic, 16)}</span><b>${title}</b></div>`;
}

function choiceQ(q, el, ctl, opts) {
  const multi = q.type === 'multi';
  const body = $('.q-body', el), actions = $('.q-actions', el), fb = $('.feedback', el);
  let picked = new Set(opts.value || []);
  const n = q.options.length;
  body.innerHTML = `<div class="q-hint">${multi ? '多选题 · 选出所有正确的选项' : '单选题'}<span class="desk"> · 按数字键 1–${n} ${multi ? '勾选' : '选择'}</span></div>
    <div class="opts">${q.options.map((o, i) => `<button class="opt" data-i="${i}">
      <span class="opt-key">${LETTERS[i]}</span>
      <span class="opt-main"><span class="opt-text">${mdInline(o)}</span><span class="opt-why" hidden></span></span>
      <kbd class="opt-kbd">${i + 1}</kbd></button>`).join('')}</div>`;
  const optEls = $$('.opt', body);
  const paint = () => optEls.forEach((b, i) => b.classList.toggle('picked', picked.has(i)));
  paint();

  function pick(i) {
    if (ctl.answered || i >= n) return;
    if (multi) picked.has(i) ? picked.delete(i) : picked.add(i);
    else picked = new Set([i]);
    paint();
    if (opts.exam) opts.onChange([...picked].sort());
    else submitBtn.disabled = picked.size === 0;
  }
  optEls.forEach((b, i) => b.onclick = () => pick(i));

  let submitBtn;
  if (!opts.exam) {
    submitBtn = h(`<button class="btn primary" disabled>提交答案<kbd class="on-btn">Enter</kbd></button>`);
    (opts.bar || actions).append(submitBtn);
    submitBtn.onclick = submit;
  }
  const isRight = () => { const ans = new Set(q.answer); return picked.size === ans.size && [...picked].every(i => ans.has(i)); };
  function submit() {
    if (ctl.answered || !picked.size) return;
    ctl.answered = true;
    const ok = isRight();
    reveal(ok);
    opts.onAnswered && opts.onAnswered(ok);
  }
  function reveal(ok) {
    const ans = new Set(q.answer);
    body.classList.add('revealed');
    optEls.forEach((b, i) => {
      b.disabled = true;
      const key = $('.opt-key', b);
      if (ans.has(i)) { b.classList.add(picked.has(i) ? 'right' : 'missed'); key.innerHTML = icon('check', 15); }
      else if (picked.has(i)) { b.classList.add('wrong'); key.innerHTML = icon('x', 15); }
      const why = q.why && q.why[i];
      if (why) { const w = $('.opt-why', b); w.innerHTML = mdInline(why); w.hidden = false; }
    });
    const letters = q.answer.map(i => LETTERS[i]).join('、');
    fb.hidden = false;
    fb.className = 'feedback ' + (ok ? 'ok' : 'no');
    fb.innerHTML = feedbackHtml(ok ? 'ok' : 'no', ok ? '回答正确' : `正确答案是 ${letters}`);
    if (q.explain) { const d = md(q.explain); d.classList.add('fb-body', 'prose'); fb.append(d); }
    if (submitBtn) submitBtn.remove();
  }
  ctl.reveal = value => { picked = new Set(value || []); paint(); ctl.answered = true; reveal(isRight()); };
  ctl.keys = e => {
    if (/^[1-8]$/.test(e.key)) { e.preventDefault(); pick(+e.key - 1); return; }
    if (e.key === 'Enter' && !opts.exam && !ctl.answered) { e.preventDefault(); submit(); }
  };
}

function shortQ(q, el, ctl, opts) {
  const body = $('.q-body', el), actions = $('.q-actions', el), fb = $('.feedback', el);
  body.innerHTML = `<div class="q-hint">简答题 · 先用自己的话写下来，再对照得分点</div><textarea class="answer-box" placeholder="不用写很长，把要点写到就行…"></textarea>`;
  const ta = $('textarea', body);
  ta.value = opts.value || '';
  ta.oninput = () => opts.onChange && opts.onChange(ta.value);
  if (opts.exam) return;
  const btn = h(`<button class="btn primary">写完了，对照得分点</button>`);
  (opts.bar || actions).append(btn);
  btn.onclick = () => showKeypoints();
  function showKeypoints(readonly) {
    btn.remove();
    fb.hidden = false; fb.className = 'feedback neutral';
    fb.innerHTML = feedbackHtml('neutral', '逐条勾选你写到的得分点')
      + `<ul class="kp">${q.keypoints.map((k, i) => `<li><label><input type="checkbox" data-i="${i}"><span class="kp-box">${icon('check', 13)}</span><span>${mdInline(k)}</span></label></li>`).join('')}</ul>
      <details class="ref"><summary>${icon('eye', 15)}查看参考答案</summary></details>`;
    const ref = md(q.ref); ref.classList.add('prose');
    $('details', fb).append(ref);
    if (readonly) { $('details', fb).open = true; return; }
    const self = h(`<div class="fb-actions"><button class="btn secondary" data-v="0">没写全</button><button class="btn success" data-v="1">${icon('check', 16)}要点都写到了</button></div>`);
    (opts.bar || fb).append(self);
    const boxes = $$('input', fb);
    $$('button', self).forEach(b => b.onclick = () => {
      const ok = b.dataset.v === '1';
      if (ok && !boxes.every(x => x.checked)) { toast('还有得分点没勾上。真写到了就勾上，没写到就算没掌握'); return; }
      ctl.answered = true; self.remove();
      fb.className = 'feedback ' + (ok ? 'ok' : 'no');
      $('.fb-head', fb).outerHTML = feedbackHtml(ok ? 'ok' : 'no', ok ? '要点都答到了' : '这题还没掌握，已放进错题本');
      opts.onAnswered && opts.onAnswered(ok);
    });
  }
  ctl.reveal = () => showKeypoints(true);
  ctl.keys = e => { if (e.key === 'Enter' && btn.isConnected) { e.preventDefault(); showKeypoints(); } };
}

function codeQ(q, el, ctl, opts) {
  const body = $('.q-body', el), actions = $('.q-actions', el), fb = $('.feedback', el);
  const blind = S.settings.blind;
  const saved = opts.value !== undefined ? opts.value : S.code[q.id];
  body.innerHTML = `<div class="editor">
      <div class="editor-bar"><span class="editor-tab">${icon('code', 14)}answer.py</span><span class="editor-tips">Tab 缩进 · 回车自动缩进 · <kbd>Ctrl</kbd>+<kbd>Enter</kbd> ${blind ? '提交' : '运行测试'}</span></div>
      <textarea class="editor-input" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
    </div>
    <div class="test-out" hidden></div>`;
  const ta = $('.editor-input', body), out = $('.test-out', body);
  ta.value = saved != null ? saved : q.starter;
  const fit = () => { ta.style.height = 'auto'; ta.style.height = Math.max(240, ta.scrollHeight + 4) + 'px'; };
  bindEditor(ta, () => runBtn.isConnected && runBtn.click());
  let saveTimer;
  ta.addEventListener('input', () => {
    fit();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { if (!opts.exam) { S.code[q.id] = ta.value; save(); } }, 400);
    opts.onChange && opts.onChange(ta.value);
  });
  requestAnimationFrame(fit);

  let sawSolution = false;
  const runBtn = h(`<button class="btn primary">${icon('play', 14)}${blind && !opts.exam ? '提交（盲写模式，只有一次机会）' : '运行测试'}</button>`);
  const resetBtn = h(`<button class="btn secondary">${icon('reset', 15)}恢复初始代码</button>`);
  const solBtn = h(`<button class="btn ghost">${icon('eye', 15)}看参考答案</button>`);
  if (!(opts.exam && blind)) (opts.bar || actions).append(runBtn);
  actions.append(resetBtn);
  if (!opts.exam) actions.append(solBtn);

  resetBtn.onclick = async () => {
    if (ta.value !== q.starter && !(await confirmBox('把编辑器恢复成初始代码？你写的内容会丢掉。', '恢复'))) return;
    ta.value = q.starter; ta.dispatchEvent(new Event('input'));
  };
  solBtn.onclick = () => {
    if (!sawSolution && !ctl.answered) {
      sawSolution = true;
      toast('看过答案，这题就记作“没做出来”，过两天在错题本里再自己写一遍');
    }
    showSolution();
  };
  function showSolution() {
    if ($('.solution', el)) return;
    const box = h(`<div class="solution"><div class="fb-head"><span class="fb-ic">${icon('eye', 16)}</span><b>参考答案</b></div></div>`);
    box.append(md('```python\n' + q.solution + '\n```'));
    if (q.explain) { const d = md(q.explain); d.classList.add('prose'); box.append(d); }
    fb.after(box);
    box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  runBtn.onclick = async () => {
    runBtn.disabled = true;
    out.hidden = false; out.className = 'test-out loading'; out.innerHTML = `<div class="spinner"></div><span>准备运行…</span>`;
    const r = await runTests(q, ta.value, s => { out.innerHTML = `<div class="spinner"></div><span>${esc(s)}</span>`; });
    runBtn.disabled = false;
    const allOk = renderTestResult(out, r);
    if (opts.exam || ctl.answered) return;
    if (r.offline) { offlineFallback(); return; }
    if (blind) { finish(allOk); return; }
    if (allOk) finish(!sawSolution);
  };
  function finish(ok) {
    ctl.answered = true;
    runBtn.remove();
    fb.hidden = false;
    fb.className = 'feedback ' + (ok ? 'ok' : 'no');
    fb.innerHTML = feedbackHtml(ok ? 'ok' : 'no', ok ? '全部测试通过，这题拿下了'
      : sawSolution ? '测试通过了，但看过答案，记作没做出来，过两天再写一遍' : '有测试没通过（盲写模式只算第一次提交）');
    if (!ok || blind) showSolution();
    opts.onAnswered && opts.onAnswered(ok);
  }
  function offlineFallback() {
    if ($('.offline', el)) return;
    const box = h(`<div class="feedback neutral offline">${feedbackHtml('neutral', '现在没法联网运行代码，改成对照参考答案自查')}
      <div class="fb-actions"><button class="btn secondary" data-v="0">我写得不对</button><button class="btn success" data-v="1">${icon('check', 16)}思路一致，边界都处理了</button></div></div>`);
    fb.before(box);
    showSolution();
    $$('button', box).forEach(b => b.onclick = () => { box.remove(); finish(b.dataset.v === '1'); });
  }
  ctl.reveal = (value, result) => {
    ta.value = value != null ? value : ''; ta.readOnly = true; fit();
    runBtn.remove(); resetBtn.remove();
    if (result) renderTestResult(out, result);
    showSolution();
  };
  ctl.keys = e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && runBtn.isConnected) { e.preventDefault(); runBtn.click(); } };
}

function renderTestResult(out, r) {
  out.hidden = false;
  if (!r.ok) {
    out.className = 'test-out err';
    out.innerHTML = `<div class="to-head">${icon('alert', 16)}<b>${r.offline ? '无法运行' : r.phase === 'tests' ? '测试代码运行出错' : '代码运行出错'}</b></div>${r.out ? `<pre>${esc(r.out)}</pre>` : ''}<pre>${esc(r.error)}</pre>`;
    return false;
  }
  const res = r.results || [];
  const pass = res.filter(x => x.ok).length;
  const allOk = res.length > 0 && pass === res.length;
  out.className = 'test-out ' + (allOk ? 'ok' : 'no');
  out.innerHTML = `<div class="to-head">${icon(allOk ? 'check' : 'x', 16)}<b>测试通过 ${pass} / ${res.length}</b><div class="to-bar"><i style="width:${res.length ? pass / res.length * 100 : 0}%"></i></div></div>
    <ul class="tests">${res.map(x => `<li class="${x.ok ? 'pass' : 'fail'}"><span class="t-ic">${icon(x.ok ? 'check' : 'x', 14)}</span><div><span>${esc(x.name)}</span>${x.ok ? '' : `<div class="cmp"><div><em>期望</em><code>${esc(x.expected)}</code></div><div><em>实际</em><code>${esc(x.got)}</code></div></div>`}</div></li>`).join('')}</ul>`
    + (r.out ? `<div class="to-sub">print 输出</div><pre>${esc(r.out)}</pre>` : '');
  return allOk;
}

function bindEditor(ta, onRun) {
  ta.addEventListener('keydown', e => {
    const v = ta.value, s = ta.selectionStart, en = ta.selectionEnd;
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); onRun(); return; }
    if (e.key === 'Tab') {
      e.preventDefault();
      const ls = v.lastIndexOf('\n', s - 1) + 1;
      if (e.shiftKey) {
        const n = v.slice(ls, ls + 4).match(/^ {0,4}/)[0].length;
        ta.setRangeText('', ls, ls + n, 'preserve');
        ta.setSelectionRange(Math.max(ls, s - n), Math.max(ls, en - n));
      } else if (s !== en && v.slice(s, en).includes('\n')) {
        ta.setRangeText(v.slice(ls, en).replace(/^/gm, '    '), ls, en, 'select');
      } else {
        ta.setRangeText('    ', s, en, 'end');
      }
      ta.dispatchEvent(new Event('input'));
    } else if (e.key === 'Enter' && !e.shiftKey && s === en) {
      e.preventDefault();
      const ls = v.lastIndexOf('\n', s - 1) + 1;
      const line = v.slice(ls, s);
      let ind = line.match(/^\s*/)[0];
      if (/:\s*(#.*)?$/.test(line)) ind += '    ';
      ta.setRangeText('\n' + ind, s, en, 'end');
      ta.dispatchEvent(new Event('input'));
    } else if (e.key === 'Backspace' && s === en && s > 0) {
      const ls = v.lastIndexOf('\n', s - 1) + 1;
      const before = v.slice(ls, s);
      if (before.length && /^ +$/.test(before)) {
        e.preventDefault();
        const n = before.length % 4 || 4;
        ta.setRangeText('', s - n, s, 'end');
        ta.dispatchEvent(new Event('input'));
      }
    }
  });
}

/* ============================================================
 * 连续做题（课后练习 / 刷题单 / 错题复习）
 * ============================================================ */
let SESSION = null;
function startSession(opt) {
  SESSION = Object.assign({ i: 0, results: {} }, opt);
  go('#/run');
}

function barResultText(q, ok) {
  if (q.type === 'single' || q.type === 'multi') return ok ? '回答正确' : `正确答案是 ${q.answer.map(i => LETTERS[i]).join('、')}`;
  if (q.type === 'code') return ok ? '全部测试通过' : '这题记作没做出来';
  return ok ? '要点都答到了' : '已放进错题本';
}

function viewRun(main) {
  if (!SESSION || !SESSION.qids.length) { go('#/'); return; }
  const ss = SESSION;
  main.className = 'reading';
  const wrap = h(`<div class="session">
    <div class="focus-bar">
      <a class="icon-btn" href="${ss.back || '#/'}" aria-label="退出">${icon('x', 20)}</a>
      <div class="focus-progress"><div class="meter lg"><i></i></div></div>
      <span class="focus-count"></span>
    </div>
    <div class="session-head"><span class="eyebrow">${esc(ss.title)}</span><span class="score"></span></div>
    <div class="q-stage"></div>
    <div class="answer-bar"><div class="ab-inner"><div class="ab-status"></div><div class="ab-actions"></div></div></div></div>`);
  main.append(wrap);
  const stage = $('.q-stage', wrap), meter = $('.meter i', wrap);
  const bar = $('.answer-bar', wrap), barStatus = $('.ab-status', wrap), barActs = $('.ab-actions', wrap);

  function paintHead() {
    const vals = Object.values(ss.results);
    const right = vals.filter(Boolean).length, wrong = vals.length - right;
    $('.focus-count', wrap).textContent = `${Math.min(ss.i + 1, ss.qids.length)} / ${ss.qids.length}`;
    meter.style.width = (ss.i / ss.qids.length * 100) + '%';
    $('.score', wrap).innerHTML = vals.length ? `<span class="good">${icon('check', 14)}${right}</span><span class="bad">${icon('x', 14)}${wrong}</span>` : '';
  }

  function show() {
    if (ss.i >= ss.qids.length) return summary();
    const q = QS[ss.qids[ss.i]];
    paintHead();
    const nextBtn = h(`<button class="btn primary next-btn">${ss.i + 1 < ss.qids.length ? '下一题' : '查看结果'}${icon('arrowRight', 16)}</button>`);
    const skipBtn = h(`<button class="btn ghost skip-btn">${icon('skip', 15)}跳过</button>`);
    bar.className = 'answer-bar';
    barStatus.innerHTML = ''; barActs.innerHTML = '';
    barActs.append(skipBtn);
    const ctl = questionCard(q, {
      label: qs(q.id).n ? `做过 ${qs(q.id).n} 次` : '新题',
      bar: barActs,
      onAnswered(ok) {
        ss.results[q.id] = ok;
        record(q.id, ok);
        // 操作栏原位换成「下一题」，并直接显示对错
        bar.className = 'answer-bar ' + (ok ? 'ok' : 'no');
        barStatus.innerHTML = `<span class="ab-ic">${icon(ok ? 'check' : 'x', 16)}</span><span class="ab-text"><b>${barResultText(q, ok)}</b><small>解析在上方，可以往上看</small></span>`;
        barActs.innerHTML = '';
        barActs.append(nextBtn);
        nextBtn.focus({ preventScroll: true });
        paintHead();
        renderNav();
      },
    });
    skipBtn.onclick = () => { ss.i++; show(); };
    nextBtn.onclick = () => { ss.i++; show(); };
    stage.innerHTML = '';
    ctl.el.classList.add('in-right');
    stage.append(ctl.el);
    window.scrollTo({ top: 0 });
    viewKeys = e => {
      if (e.key === 'Enter' && ctl.answered && !(e.ctrlKey || e.metaKey)) { e.preventDefault(); nextBtn.click(); return; }
      if (e.key === 'Escape') { go(ss.back || '#/'); return; }
      ctl.keys && ctl.keys(e);
    };
  }

  function summary() {
    viewKeys = null;
    bar.remove();
    meter.style.width = '100%';
    $('.focus-count', wrap).textContent = '完成';
    const ids = Object.keys(ss.results);
    const wrong = ids.filter(id => !ss.results[id]);
    const right = ids.length - wrong.length;
    const pct = ids.length ? right / ids.length : 0;
    const tone = !ids.length ? 'neutral' : !wrong.length ? 'ok' : pct >= .6 ? 'mid' : 'low';
    stage.innerHTML = '';
    const box = h(`<section class="result-card ${tone}">
      <div class="result-ring">${ring(pct, 120, 9)}<div class="rr-text"><b>${right}<small>/${ids.length}</small></b><span>答对</span></div></div>
      <h2>${!ids.length ? '这一组都跳过了' : !wrong.length ? '全部答对' : pct >= .6 ? '不错，还差一点' : '这部分要再巩固一下'}</h2>
      <p>${wrong.length ? `错的 ${wrong.length} 题已经放进错题本，明天会提醒你再做一遍。` : ids.length ? '状态很好，继续保持。' : '可以回去重新做，或者直接往下学。'}</p>
      <div class="result-actions"></div></section>`);
    const acts = $('.result-actions', box);
    if (wrong.length) {
      const again = h(`<button class="btn secondary">${icon('reset', 15)}马上重做错的 ${wrong.length} 题</button>`);
      again.onclick = () => startSession(Object.assign({}, ss, { i: 0, results: {}, qids: wrong, title: ss.title + ' · 重做错题' }));
      acts.append(again);
    }
    if (ss.next) {
      acts.append(h(`<a class="btn secondary" href="${ss.back || '#/'}">返回</a>`));
      acts.append(h(`<a class="btn primary" href="${ss.next.hash}">${esc(ss.next.label)}${icon('arrowRight', 16)}</a>`));
      viewKeys = e => { if (e.key === 'Enter') { e.preventDefault(); go(ss.next.hash); } };
    } else {
      acts.append(h(`<a class="btn primary" href="${ss.back || '#/'}">完成</a>`));
      viewKeys = e => { if (e.key === 'Enter') { e.preventDefault(); go(ss.back || '#/'); } };
    }
    stage.append(box);
  }
  show();
}

    scope: [['core', '必刷'], ['all', '必刷 + 加练']],
    mod: [['all', '全部模块'], ...allMods.map(m => [m, MOD[m].short])],
    filter: Object.entries(FILTERS).map(([k, f]) => [k, f.name]),
    type: [['all', '全部'], ...Object.entries(TYPE_NAME)],
    random: [[false, '按顺序'], [true, '随机打乱']],
  };
