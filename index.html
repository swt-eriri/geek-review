r", "Sequential"], "answer": [0], "why": ["对，训练时用 augs_gen.flow 动态生成增强后的训练集", "那是归一化缩放器", "那是标签编码", "那是序贯模型"], "explain": "增广器 = ImageDataGenerator。", "tags": ["basic"], "m": "ml_dl"}, {"id": "mld-29", "type": "multi", "stem": "关于 Dropout，下列说法正确的是", "options": ["它将该层的一部分神经元的输出特征随机丢掉（设为 0），相当于随机消灭一部分神经元", "它是神经网络中最常用的正则化机制", "Dropout(0.2) 中的 0.2 是被随机丢弃的神经元比例，通常设为 0.2 ~ 0.5", "对于大型的深层神经网络来说，添加 Dropout 层已经是一个标准配置", "它在训练和测试时都会丢掉神经元"], "answer": [0, 1, 2, 3], "why": ["原文原话", "原文原话", "对", "原文原话", "原文：只对训练集起作用，测试时没有神经元被丢掉"], "explain": "Dropout：随机丢、正则化、0.2~0.5、只管训练。", "tags": ["basic"], "m": "ml_dl"}, {"id": "mld-30", "type": "multi", "stem": "关于神经网络优化器，下列说法正确的是", "options": ["SGD 利用动量原理，借助惯性越过当前的局部最低点", "Adagrad 是自适应梯度，不同的参数可以拥有不同的学习速率", "RMSprop 解决了 Adagrad 中学习速率有时会急剧下降的问题", "Adam 是前面各种优化器的集大成者，一般情况下是优化器的首选项", "学习速率越小，越容易冲出局部最低点"], "answer": [0, 1, 2, 3], "why": ["对", "对", "对", "对", "相反：学习速率很小，小球就冲不出局部最低点"], "explain": "SGD 动量、Adagrad 自适应、RMSprop 补 Adagrad、Adam 集大成。", "tags": ["basic", "core"], "m": "ml_dl"}, {"id": "mld-31", "type": "single", "stem": "神经网络通过梯度下降训练，却不能总是得到最佳结果，原因是？", "options": ["函数十分复杂，有很多局部最低点，在这些点导数为 0，梯度下降失去方向感", "神经网络没有损失函数", "神经网络只有一个全局最低点", "神经网络不使用梯度下降"], "answer": [0], "why": ["对", "有损失函数", "只有一个全局最低点的是线性回归", "它用梯度下降"], "explain": "局部最低点 → 用优化器 + 学习速率越过去。", "tags": ["basic"], "m": "ml_dl"}, {"id": "mld-32", "type": "multi", "stem": "`compile` 方法可以调节的 3 个参数是", "options": ["loss", "optimizer", "metrics", "epochs"], "answer": [0, 1, 2], "why": ["损失函数", "优化器", "评估指标", "epochs 是 fit 的参数"], "explain": "compile 三件套：loss、optimizer、metrics。", "tags": ["basic"], "m": "ml_dl"}, {"id": "mld-33", "type": "multi", "stem": "按原文，下列损失函数 / 评估指标的选择正确的是", "options": ["多元分类问题一般用 categorical_crossentropy", "二元分类问题一般用 binary_crossentropy", "回归问题可以选择 mse（均方误差）", "回归问题的评估指标可以用 mae，分类问题可以用 acc", "回归问题一般用 binary_crossentropy"], "answer": [0, 1, 2, 3], "why": ["原文原话", "原文原话", "原文原话", "对", "回归用 mse"], "explain": "多分类 categorical、二分类 binary、回归 mse；指标分类 acc、回归 mae。", "tags": ["basic"], "m": "ml_dl"}, {"id": "mld-34", "type": "single", "stem": "compile 的 3 个参数中，和性能优化最相关的是？", "options": ["optimizer", "loss", "metrics", "都一样"], "answer": [0], "why": ["对：很多时候网络没训练起来，就是优化器和学习速率设定得不好", "损失函数按问题类型选", "评估指标只是看结果", "不一样"], "explain": "调性能先看优化器。", "tags": ["basic"], "m": "ml_dl"}, {"id": "mld-35", "type": "multi", "stem": "关于数据增广，下列说法正确的是", "options": ["它也叫数据增强，能通过已有的图片增加数据量，增强模型的泛化能力", "一张图片通过变换可以当成多张来用", "由于数据增广需要时间，模型训练速度比没有增广时慢了很多", "原文中花朵 CNN 增广后测试准确率从约 60% 提升到 78% 以上", "数据增广会让模型的过拟合风险变大"], "answer": [0, 1, 2, 3], "why": ["原文原话", "对，一张变多张", "对", "对：60.03% → 78.56%", "相反：数据的量越大，过拟合风险越小"], "explain": "增广：一张变多张，变慢但更准（60 → 78）。", "tags": ["basic"], "m": "ml_dl"}, {"id": "mld-36", "type": "single", "stem": "判断：原文说：数据的量越大，模型出现过拟合的风险就越小", "options": ["正确", "错误"], "answer": [0], "why": ["对，所以数据多多益善", "错误理解"], "explain": "数据越多，越不容易过拟合。", "tags": ["basic"], "m": "ml_dl"}, {"id": "mld-37", "type": "single", "stem": "判断：过拟合对应「高偏差」，欠拟合对应「高方差」", "options": ["正确", "错误"], "answer": [1], "why": ["错误理解", "对，说反了：欠拟合—高偏差，过拟合—高方差"], "explain": "欠偏过方。", "tags": ["basic"], "m": "ml_dl"}, {"id": "mld-38", "type": "single", "stem": "判断：Adagrad 对稀疏特征使用较小的学习速率，对非稀疏特征使用较大的学习速率", "options": ["正确", "错误"], "answer": [1], "why": ["错误理解", "对，说反了：稀疏特征用较大的学习速率"], "explain": "Adagrad：稀疏的步子大。", "tags": ["basic"], "m": "ml_dl"}, {"id": "mld-39", "type": "multi", "stem": "下列哪些是 `fit`（训练）语句里的参数？", "options": ["epochs（训练轮次）", "batch_size（批量大小）", "validation_data / validation_split（验证集）", "optimizer（优化器）"], "answer": [0, 1, 2], "why": ["对", "对，如 batch_size=256", "对", "optimizer 是 compile 的参数，学习速率在优化器里设，如 Adam(lr=1e-4)"], "explain": "compile 管 loss/optimizer/metrics；fit 管 epochs/batch_size/验证。", "tags": ["basic"], "m": "ml_dl"}]}, {"id": "ml_churn", "title": "留存关：留存分析、二元分类、不平衡数据的评估指标", "short": "留存·分类·评估", "group": "机器学习 · 留存关", "exam": "第 14—16 讲", "refs": [], "lessons": [{"title": "留存分析：lifelines、Kaplan-Meier、Cox（第 14 讲）", "cards": ["### 一句话\n\n<strong>留存关 = 生存分析 + 二元分类 + 性能评估<\/strong>（第 14、15、16 讲各一个）。\n\n- 原话：「<strong>留存就是让老用户一直使用你的产品<\/strong>。」和它相对的是<strong>流失<\/strong>：「用户的留存和流失，是<strong>阴和阳的两极，此消彼长<\/strong>」。\n- 第 14 讲的任务：画出易速鲜花的<strong>会员留存曲线<\/strong>，找出会员卡的哪些机制<strong>对留存影响大<\/strong>、哪些<strong>容易造成流失<\/strong>。\n- 原话：这个问题「<strong>既不是一个回归问题，也不是一个分类问题，它是一个数据探索类型的问题<\/strong>」。\n\n### 数据准备里的几个小点\n\n| 看到题目说…… | 就选 / 就记 |\n|---|---|\n| 数据量 | <strong>7043 条<\/strong>会员数据 |\n| 检查一个字段<strong>是不是数值类型<\/strong> | <strong>is_numeric_dtype<\/strong>（「总消费」一开始输出 False，因为它其实是字符串） |\n| 把字符串字段转成数值 | <strong>to_numeric<\/strong>（再用 fillna(0) 补 0） |\n| 标签（用户是否流失）是哪个字段 | <strong>「已停付会费」<\/strong>（否 73%，是 27%） |\n| 汉字「是」「否」怎么喂给模型 | 转成 <strong>1 / 0<\/strong>（用 replace） |\n\n> 📌 记住 <strong>73% 留存、27% 流失<\/strong>——第 16 讲讲「不平衡数据」就是拿这组数字开头的。", "### lifelines 工具包：对号入座\n\n<strong>lifelines（生命线库）<\/strong>：画留存曲线、做留存分析的 Python 工具包。原话：它的优点是「<strong>简单快捷<\/strong>，还能显示整个数据集中用户<strong>随着时间推移的留存情况<\/strong>」。\n\n- 它<strong>最早是由精算师和医疗专业人员开发的<\/strong>，用来根据病人的病情等特征分析<strong>病人的生存可能性<\/strong>；把因子换成用户行为特征和产品特征，也能分析用户留存率（流失率）。\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 显示<strong>整体<\/strong>用户留存曲线；画<strong>不同群体<\/strong>的留存曲线，看各特征对留存的影响 | <strong>Kaplan-Meier 生存模型<\/strong>（KaplanMeierFitter） |\n| 预测<strong>某一个（特定）用户<\/strong>的留存概率；显示<strong>各因子和留存的相关系数<\/strong> | <strong>Cox 危害系数模型<\/strong>（本讲重点里叫 <strong>COX 比例危害模型<\/strong>，CoxPHFitter） |\n| 显示某一个用户的留存概率曲线 | <strong>predict_survival_function<\/strong> |\n| 把每个特征的危害系数和置信区间画出来 | <strong>cph.plot<\/strong> |\n| 和「留存时间」关系最密切、要输入模型的两个字段 | <strong>「入会月数」+「已停付会费」<\/strong> |\n\n- Cox 模型原话：它「会<strong>分析每一个字段对于生存的影响<\/strong>，然后<strong>预测出某一个人大概在多久之后会『死亡』<\/strong>，并给出随时间延长生存的概率」。这里的「死亡」= <strong>会员流失<\/strong>。\n- 「危害」可以理解为<strong>风险因子<\/strong>：这个特征是增加还是减少生存（留存）机会。\n\n### 置信区间（一句话）\n\n留存曲线上的<strong>蓝色阴影就是置信区间<\/strong>——「置信区间是<strong>一个范围<\/strong>」。原话：「<strong>一般来说，我们使用 95% 的置信水平进行区间估计<\/strong>。」\n\n> 📌 易混一对：<strong>Kaplan-Meier 看「一群人」的曲线；Cox 看「某一个人」+ 每个特征的系数。<\/strong>", "### Cox 模型要虚拟变量\n\n- Cox 模型能读取的格式是<strong>虚拟变量编码<\/strong>，所以要用 <strong>pd.get_dummies<\/strong> 把多类别字段拆成多个二元字段（如「会员卡类型」拆成「年卡」「月卡」「双年卡」三列，每列只有 1/0）。\n- <strong>drop_first=True<\/strong>：哑变量个数比类别数<strong>少 1<\/strong>。原话：保留 k 个虚拟变量「就会存在一个级别的<strong>冗余<\/strong>……会导致<strong>多重共线性<\/strong>问题」。\n- 为什么不在前面的特征工程就拆？因为要<strong>保留<\/strong>「会费支付方式」「会员卡类型」这些原始分类字段来<strong>画分组留存曲线<\/strong>——一拆，原字段就没了。\n\n### 危害系数怎么读（必背原话）\n\n> 「<strong>大于 0<\/strong> 的系数值预示着对留存有<strong>负面<\/strong>影响，值越大，影响越大；而<strong>小于 0<\/strong> 的系数值则对留存有<strong>正面<\/strong>影响，值越小，影响越大。」\n\n### 第 14 讲的结论\n\n| 因素 | 结论 |\n|---|---|\n| <strong>性别<\/strong> | 两条曲线几乎重合，影响<strong>不明显<\/strong> |\n| <strong>就餐时付费<\/strong>、<strong>手工转账<\/strong> | 对留存<strong>负面<\/strong>（就餐时付会员费，流失率大幅上升） |\n| <strong>微信自动扣款<\/strong>、<strong>花呗付款<\/strong> | <strong>最佳<\/strong>付费方案 → 要说服会员选<strong>自动付费<\/strong> |\n| <strong>月卡<\/strong> | 潜在流失原因 → 努力让用户办<strong>长期卡<\/strong> |\n| 各种<strong>优惠套餐<\/strong> | 危害系数都<strong>小于 0<\/strong>，对留存<strong>正面<\/strong>；郁金香、胡姬花套餐尤为明显 |\n| 整体 | 入会 <strong>5 年<\/strong>之后，整体留存率还在 <strong>60% 左右<\/strong> |\n\n> 📌 必背陷阱：<strong>系数 > 0 = 坏（促流失），系数 < 0 = 好（促留存）<\/strong>。题目把正负说反就错。"]}, {"title": "二元分类：逻辑回归、神经网络、激活函数（第 15 讲）", "cards": ["### 为什么是「二元分类」\n\n- 要预测的标签是<strong>「已停付会费」<\/strong>；有标签 → <strong>监督学习<\/strong>。\n- 回归还是分类，「要看<strong>标签是连续值还是离散值<\/strong>」。这个标签非 1 即 0，是离散的 → <strong>分类问题<\/strong>，而且是<strong>典型的二元分类问题<\/strong>。\n- 原话：用户的「高风险值」是<strong>多个特征相组合<\/strong>显现出的结果，<strong>并不是单纯取决于某个特征<\/strong>。\n\n### 常见分类算法：对号入座（原话）\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 在线性回归的基础上加了一个 <strong>Sigmoid 函数（非线性）映射<\/strong> | <strong>逻辑回归<\/strong> |\n| 用统计学中<strong>贝叶斯推断<\/strong>方法求解 | <strong>贝叶斯分类器<\/strong> |\n| 计算出一个<strong>分类超平面<\/strong>，把数据点分为两类 | <strong>SVM 分类器<\/strong> |\n| 找出训练集中与测试样本<strong>最靠近的 k 个<\/strong>样本，基于这 k 个「邻居」预测 | <strong>最近邻（KNN）<\/strong> |\n| 主要指 <strong>CART<\/strong> 算法，<strong>二叉树<\/strong>结构（「是」「否」） | <strong>决策树分类器<\/strong> |\n| <strong>多棵决策树<\/strong>组合而成的集成学习模型 | <strong>随机森林<\/strong> |\n| 利用 <strong>Boosting<\/strong> 方法基于决策树建立的集成学习模型 | <strong>AdaBoost、XGBoost 等梯度提升算法<\/strong> |\n| 由一组<strong>相互连接的神经元<\/strong>构建出的深度学习模型 | <strong>神经网络<\/strong> |\n\n- 实际做项目通常<strong>选多种算法建模，相互比较<\/strong>后再定。本讲挑了两个：<strong>逻辑回归<\/strong>和<strong>神经网络<\/strong>。", "### 逻辑回归 + Sigmoid\n\n流程：<strong>特征 x → 线性函数（wx + b）→ Sigmoid 函数 → 概率 P → P ≥ 0.5 判为 1（流失），P ＜ 0.5 判为 0（留存）<\/strong>。\n\n- <strong>Sigmoid 函数<\/strong>：把线性回归的预测值做<strong>非线性转换<\/strong>，变成 <strong>0~1 之间<\/strong>的值，这个值就是<strong>分类概率<\/strong>。公式 f(x) = 1/(1+e^-x)（认得出即可）。\n- 例：结果 0.7 → 可能流失；0.4 → 留存可能性高。判断病人是否患病、客户是否欺诈，同理。\n- 原话：「<strong>逻辑回归的本质仍然是线性回归<\/strong>，这也是为什么它的名字中仍然保留了『回归』二字」。\n- 原话：逻辑回归是<strong>最为基础的分类算法<\/strong>，地位和线性回归在回归算法中一样，常常作为<strong>基准算法<\/strong>。\n\n| 看到题目说…… | 就选 |\n|---|---|\n| sklearn 里的逻辑回归类 | <strong>LogisticRegression<\/strong>（来自 sklearn.linear_model，模型名叫 logreg） |\n| 给出「预测准确率的均值」 | <strong>score<\/strong> |\n| 预测<strong>分类的值<\/strong>（0 或 1） | <strong>predict()<\/strong> |\n| 输出<strong>分类的概率<\/strong> | <strong>predict_proba()<\/strong> |\n\n- 本讲逻辑回归测试集准确率 <strong>78.70%<\/strong>。\n- 0.51 和 0.99 都判为「会流失」，但 0.99 的<strong>信心高得多<\/strong>——这就是 predict_proba 的用处。\n\n> 📌 必背：<strong>逻辑回归 = 线性回归 + Sigmoid，阈值 0.5，名字带「回归」其实做分类。<\/strong>", "### 从感知器到 DNN\n\n- <strong>1958 年，Rosenblatt<\/strong> 提出一元的<strong>「感知器」（Perceptron）<\/strong>：「一种<strong>单个神经元<\/strong>的神经网络，也是<strong>最基本、最简单的神经网络<\/strong>」。\n- 图题原话：「<strong>一元的感知器和逻辑回归模型完全相同<\/strong>」——「最基本、最简单的神经网络就是逻辑回归模型」。\n- 再深的网络都能拆成多个「一元感知器」，所以神经网络都能很好地解决二元分类。\n- 原话：神经网络<strong>适合解决特征数量比较多、数据集样本数量庞大<\/strong>的分类问题（结构复杂，拟合能力强）。\n\n| 网络 | 擅长 |\n|---|---|\n| <strong>CNN<\/strong> | <strong>图形图像<\/strong>等计算机视觉问题 |\n| <strong>RNN<\/strong> | <strong>自然语言、文字和时序<\/strong>问题 |\n| <strong>DNN<\/strong>（用 <strong>Dense 层<\/strong>搭的网络） | 本项目这种结构化特征的<strong>分类问题<\/strong>，「尤其是特征比较多的情况」 |\n\n- <strong>Dense 层（密集连接层）<\/strong>：「最普通的<strong>全连接<\/strong>网络层，因为它其中<strong>既没有卷积，也没有循环<\/strong>」。\n\n### 搭建与训练：认得出就行\n\n| 位置 / 参数 | 本讲用的 |\n|---|---|\n| 隐藏层激活函数 | <strong>relu<\/strong> |\n| 输出层 | <strong>Dense(units=1, activation='sigmoid')<\/strong> |\n| 损失函数 | <strong>binary_crossentropy<\/strong>——「专门用来<strong>二分类<\/strong>问题的损失函数」 |\n| 优化器 / 指标 | <strong>RMSProp<\/strong> / <strong>acc<\/strong>（准确率） |\n| fit 里的 epochs / batch_size / validation_split | 训练<strong>轮次<\/strong> / 数据<strong>批量<\/strong> / 从训练集里<strong>拆验证集<\/strong> |\n\n- 第一次训练：验证集曲线<strong>振荡<\/strong>——「这种情况意味着<strong>网络没有训练起来<\/strong>」。原因：「<strong>神经网络非常不喜欢未经归一化的数据<\/strong>」。\n- 补上 <strong>MinMaxScaler<\/strong> 归一化后曲线平滑，测试准确率 <strong>77% → 78%<\/strong>。本讲共三个模型：逻辑回归、未归一化 DNN、归一化 DNN。\n- 神经网络的 predict() 输出的是<strong>概率<\/strong>，要手工转成分类（课程用 np.argmax）。", "### 激活函数（真题第 7 题考这里）\n\n<strong>激活函数<\/strong> = 每个神经元往下一层输出时做的一次变换。原话：「激活函数在神经网络中是用来<strong>引入非线性因素<\/strong>的，目的是<strong>提升模型的表达能力<\/strong>」。没有它，各层之间<strong>只存在线性关系<\/strong>（网络就是纯线性的），覆盖不了复杂的特征空间。\n\n| 函数 | 记住这几点 |\n|---|---|\n| <strong>sigmoid<\/strong> | <strong>早期<\/strong>神经网络全用它；输出 0~1 |\n| <strong>tanh<\/strong> | 和 sigmoid 类似，值域 <strong>-1 到 1<\/strong>；输入较大时<strong>梯度接近零<\/strong>，参数几乎不更新，可能<strong>梯度消失<\/strong> |\n| <strong>ReLU<\/strong> | f(z) = max(0, z)；<strong>实现简单、加速梯度下降的收敛、没有饱和问题、大大缓解梯度消失<\/strong>；「<strong>目前普通神经网络中最常用的激活函数<\/strong>」，初学者用它就行 |\n\n- <strong>ReLU 的缺点<\/strong>：权重都在负值区间时导数可能永远为零，这个神经元<strong>永远不参与学习，等同于「死掉」<\/strong>。\n- <strong>ReLU 的变体<\/strong>：<strong>Leaky ReLU、eLu、PreLu、Parametric ReLU、Randomized ReLU<\/strong> 等——给负区间一点斜率，让导数不为零。\n- <strong>反向传播<\/strong>：神经网络梯度下降中，<strong>从后面的层向前面层<\/strong>传播的过程。\n\n### 输出层用什么（必背）\n\n输出层的激活只为<strong>确定分类概率<\/strong>，概率必须在 <strong>0~1<\/strong> 之间，<strong>ReLU 等函数就无法发挥作用<\/strong>。\n\n| 问题 | 输出层激活函数 |\n|---|---|\n| <strong>二元分类<\/strong> | <strong>sigmoid<\/strong> |\n| <strong>多元分类<\/strong> | <strong>softmax<\/strong> |\n\n> 📌 必背陷阱：\n> - 「分类的最后一层用 <strong>relu<\/strong>」——<strong>错<\/strong>，二分类用 <strong>sigmoid<\/strong>，多分类用 <strong>softmax<\/strong>。\n> - 「<strong>tanh<\/strong> 的优点是让网络训练更快」——<strong>错<\/strong>，原文说<strong>加速收敛的是 ReLU<\/strong>，tanh 反而容易梯度消失。"]}, {"title": "不平衡数据的评估指标（第 16 讲）", "cards": ["### 为什么不能只看准确率\n\n- 上一讲两个模型准确率都在 <strong>78%<\/strong> 左右。但数据里<strong>留存 73%、流失 27%<\/strong>——全都猜「留存」，准确率就有 <strong>73%<\/strong>，所以 70% 以上「<strong>没有什么难度<\/strong>」。\n- 极端例子：银行欺诈客户「可能<strong>不到万分之一<\/strong>」，全猜「没欺诈」准确率 <strong>99.999%<\/strong>，「然而，这样的模型<strong>没有任何意义<\/strong>」。\n- 结论原话：「评估分类模型要比评估回归模型的难度大很多……对于各类别中样本数量<strong>并不平衡<\/strong>的数据集来说，我们<strong>绝对不能单用准确率<\/strong>这一个方面作为考量的标准。」\n\n### 本讲的「四个重要的分类评估方法」（清单写全）\n\n1. <strong>混淆矩阵<\/strong>\n2. <strong>精确率和召回率<\/strong>\n3. <strong>F1 分数<\/strong>\n4. <strong>ROC 曲线和 AUC<\/strong>\n\n原话：它们适用于几乎所有分类问题，「尤其是对于样本类别不平衡的问题来说，这些方法<strong>比准确率更为客观<\/strong>」。\n\n> 📌 真题第 5 题：不平衡数据该用什么指标？→ <strong>精确率、召回率、ROC/AUC、F1<\/strong>；「<strong>最好的指标是准确率<\/strong>」是错的。", "### 混淆矩阵\n\n原话：「<strong>由预测值和真值共同组成的矩阵<\/strong>」。四个格子（行 = 真值，列 = 预测值）：\n\n| | 预测为负（0） | 预测为正（1） |\n|---|---|---|\n| <strong>真值为负<\/strong> | <strong>真负 TN<\/strong>（左上） | <strong>假正 FP<\/strong>（右上） |\n| <strong>真值为正<\/strong> | <strong>假负 FN<\/strong>（左下） | <strong>真正 TP<\/strong>（右下） |\n\n- <strong>「真」「假」<\/strong> = 预测值和真值<strong>一致与否<\/strong>；<strong>「正」「负」<\/strong> = 预测出来的值是 <strong>1 还是 0<\/strong>。\n- 原话：最看重「<strong>真正<\/strong>」这个象限，它代表模型<strong>找出了多少个即将流失的用户<\/strong>；看混淆矩阵「第一眼要看的是<strong>右下角的『真正』值<\/strong>」。\n- 例：两个模型都预测 77 留存 23 流失，一个 TP=20，一个 TP=5——<strong>预测结果数量相同，混淆矩阵可能完全不同<\/strong>；准确率近似的模型，混淆矩阵也可能很不一样。\n- 工具：sklearn 的 <strong>confusion_matrix<\/strong> 计算；用 seaborn 热力图（<strong>sns.heatmap<\/strong>）显示。\n- 神经网络每次结果可能不同：每次<strong>随机拆分<\/strong>数据集，加上梯度下降的随机性和局部最低点。\n- 混淆矩阵「<strong>不是一个分数性的指标<\/strong>」→ 于是引入精确率和召回率。", "### 精确率、召回率、F1：别名和公式\n\n| 指标 | 别名 | 公式 | 一句话 |\n|---|---|---|---|\n| <strong>精确率<\/strong>（Precision） | <strong>查准率<\/strong> | <strong>TP / (TP + FP)<\/strong> | 被分为正例的里面，实际为正例的比例 |\n| <strong>召回率<\/strong>（Recall） | <strong>查全率<\/strong>；也叫<strong>真正类率 / 真阳性率（TPR）<\/strong> | <strong>TP / (TP + FN)<\/strong> | 「<strong>覆盖面的度量<\/strong>」，和精确率<strong>成对出现<\/strong> |\n| <strong>F1 分数<\/strong> | 精确率和召回率的<strong>调和均值<\/strong> | <strong>2 × 精确率 × 召回率 / (精确率 + 召回率)<\/strong> | 两个都高，F1 才高 |\n\n- 简单代入（课程原数）：归一化 DNN 的 TP=199、FP=149、FN=162 → 精确率 199/(199+149) ≈ <strong>57%<\/strong>，召回率 199/(199+162) ≈ <strong>55%<\/strong>。\n\n### 什么时候看精确率，什么时候看召回率（原话）\n\n| 更担心哪种错 | 看 |\n|---|---|\n| 被预测为正的<strong>负<\/strong>样本（本来是忠诚会员，<strong>误判为流失<\/strong>）= FP | <strong>精确率<\/strong> |\n| 被预测为负的<strong>正<\/strong>样本（本来要流失了，<strong>误判为忠诚会员<\/strong>）= FN | <strong>召回率<\/strong> |\n\n- 作者在本问题里「会更关注<strong>召回率<\/strong>，因为我们就是<strong>害怕会员流失<\/strong>」；但精确率太低，运营会把力气花在本来不会流失的人身上。\n\n### F1（必背原话）\n\n- 「<strong>只有当召回率和精确率都很高时<\/strong>，分类模型才能得到较高的 F1 分数。」\n- 「F1 指标<strong>特别适合于评估各类别样本分布不平衡的问题<\/strong>……当你想用<strong>一个简单的方法来比较多种分类模型<\/strong>的优劣时，你选 F1 分数就对了。」\n- 工具：<strong>classification_report<\/strong>（分类报告），一次显示 <strong>F1、精确率、召回率和准确率<\/strong>。结果：F1 最高的是<strong>归一化后的 DNN<\/strong>。\n\n> 📌 易混：<strong>精确率分母加 FP，召回率分母加 FN<\/strong>。记法：<strong>「准」看预测为正的那一列，「全」看真值为正的那一行。<\/strong>", "### ROC 曲线和 AUC\n\n| 名称 | 全称 / 含义 |\n|---|---|\n| <strong>ROC<\/strong> | <strong>受试者工作特征曲线<\/strong>（receiver operating characteristic curve） |\n| <strong>AUC<\/strong> | ROC <strong>曲线下面积<\/strong>（Area under the Curve） |\n| <strong>TPR<\/strong>（Y 轴） | 真正类率 / <strong>真阳性率<\/strong> = TP/(TP+FN) = <strong>召回率的另一个名称<\/strong> |\n| <strong>FPR<\/strong>（X 轴） | 假正类率 / <strong>伪阳性率<\/strong> = <strong>FP/(FP+TN)<\/strong>，实际为阴性的样本里被错判为阳性的比率 |\n\n- ROC 空间：<strong>X 轴 FPR，Y 轴 TPR<\/strong>。从 (0,0) 到 (1,1) 的<strong>对角线<\/strong>：线以上好，线以下差。\n- 原话：「<strong>越靠近左上的点越好<\/strong>，越靠近右下越劣，而<strong>对角线<\/strong>上的点……相当于<strong>随机猜测<\/strong>的结果」。\n- 原话：「<strong>AUC 的取值范围在 0.5 和 1 之间<\/strong>。AUC <strong>越接近 1.0<\/strong>，说明模型性能越高；<strong>等于 0.5<\/strong> 时，只相当于<strong>随机一猜<\/strong>，说明模型<strong>无应用价值<\/strong>。」\n- 比较多个模型：画在同一个 ROC 空间，比 AUC 大小。结果：<strong>DNN（归一化）AUC = 0.811 ＞ 逻辑回归 0.756<\/strong>。\n\n### sklearn 工具：对号入座\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 计算混淆矩阵 | <strong>confusion_matrix<\/strong> |\n| 一次显示精确率、召回率、F1、准确率 | <strong>classification_report<\/strong> |\n| 画 ROC 曲线、算 AUC | <strong>roc_curve<\/strong> 和 <strong>auc<\/strong> |\n| 不平衡数据做<strong>分层采样<\/strong>（每份子集保持和原数据相同的类别比例） | <strong>StratifiedKFold<\/strong>、<strong>StratifiedShuffleSplit<\/strong>；train_test_split 的 <strong>stratify<\/strong> 参数 |\n\n> 📌 本讲重点三句：① 分类不平衡时<strong>准确率不能判断分类效果<\/strong>，要看<strong>混淆矩阵<\/strong>；② <strong>精确率、召回率、F1<\/strong> 是更优指标；③ 用 <strong>ROC、AUC<\/strong> 显示分类效果。<strong>ROC 越靠左上越好，AUC 越接近 1 越好。<\/strong>"]}], "questions": [{"id": "mlc-p1", "type": "single", "stem": "用 lifelines 显示<strong>整体<\/strong>用户留存曲线、并画出不同群体的留存曲线，用的是？", "options": ["Kaplan-Meier 生存模型", "Cox 危害系数模型", "K-Means", "逻辑回归"], "answer": [0], "why": ["对，看「一群人」的曲线", "Cox 主要预测特定用户、显示各因子系数", "那是聚类算法", "那是分类算法"], "explain": "KM 看一群人，Cox 看某一个人。", "tags": [], "lesson": 0, "m": "ml_churn"}, {"id": "mlc-p2", "type": "single", "stem": "判断：Cox 模型中，某特征的危害系数<strong>小于 0<\/strong>，说明它对留存有正面影响", "options": ["正确", "错误"], "answer": [0], "why": ["对，小于 0 = 正面，值越小影响越大", "原文：大于 0 负面，小于 0 正面"], "explain": "系数 > 0 促流失，< 0 促留存。", "tags": [], "lesson": 0, "m": "ml_churn"}, {"id": "mlc-p3", "type": "single", "stem": "逻辑回归预测某会员的流失概率为 0.7，按课程的规则应判为？", "options": ["1（流失）", "0（留存）", "无法判断", "需要重新训练"], "answer": [0], "why": ["对，P ≥ 0.5 判为 1", "小于 0.5 才判为 0", "有阈值 0.5 可以判断", "不需要"], "explain": "阈值 0.5：大于等于判 1。", "tags": [], "lesson": 1, "m": "ml_churn"}, {"id": "mlc-p4", "type": "single", "stem": "神经网络做<strong>二元分类<\/strong>时，输出层通常用哪个激活函数？", "options": ["sigmoid", "relu", "tanh", "softmax"], "answer": [0], "why": ["对，输出 0~1 的概率", "ReLU 无法给出 0~1 概率", "tanh 值域是 -1 到 1", "softmax 用于多元分类"], "explain": "二分类 sigmoid，多分类 softmax。", "tags": [], "lesson": 1, "m": "ml_churn"}, {"id": "mlc-p5", "type": "single", "stem": "课程说，看混淆矩阵「第一眼」要看哪个格子？", "options": ["右下角的「真正」TP", "左上角的「真负」TN", "右上角的「假正」FP", "左下角的「假负」FN"], "answer": [0], "why": ["对，代表找出了多少即将流失的用户", "那是正确判为留存的", "那是误判为流失的", "那是漏掉的流失用户"], "explain": "第一眼看右下角真正值。", "tags": [], "lesson": 2, "m": "ml_churn"}, {"id": "mlc-p6", "type": "single", "stem": "AUC 的取值范围是？", "options": ["0.5 到 1", "0 到 0.5", "-1 到 1", "0 到 100"], "answer": [0], "why": ["对，越接近 1 越好，0.5 = 随机一猜", "不是", "那是 tanh 的值域", "不是"], "explain": "AUC：0.5 随机猜，1 最好。", "tags": [], "lesson": 2, "m": "ml_churn"}, {"id": "mlc-1", "type": "multi", "stem": "关于 lifelines 工具包，下列说法正确的是", "options": ["lifelines 最早是由精算师和医疗专业人员开发的", "它的优点是简单快捷，还能显示整个数据集中用户随着时间推移的留存情况", "其中的 Kaplan-Meier 生存模型能显示整体的用户留存曲线", "lifelines 仅能用于医疗领域的病人生存分析", "通过绘制不同群体的留存曲线，可以观察各个特征对留存的影响大小"], "answer": [0, 1, 2, 4], "why": ["原文", "原文", "原文", "错，「仅」：换成用户特征也能分析留存", "原文"], "explain": "lifelines：精算 + 医疗出身，KM 画曲线。", "tags": ["basic", "core"], "m": "ml_churn"}, {"id": "mlc-2", "type": "multi", "stem": "关于 Cox 危害系数模型，下列说法正确的是", "options": ["它会分析每一个字段对于生存的影响，预测出某一个人大概在多久之后会「死亡」", "在本讲场景中，「死亡」指的是会员的流失", "它能显示数据集各个特征与留存相关的系数", "它可以直接读取分类编码的字段，不需要做任何转换", "可以用 predict_survival_function 显示某一个用户的留存概率曲线"], "answer": [0, 1, 2, 4], "why": ["原文", "对", "对，用 cph.plot 可视化", "错，它要求虚拟变量编码，要先 get_dummies", "对"], "explain": "Cox：预测某一个人 + 各因子系数，要虚拟变量。", "tags": ["basic"], "m": "ml_churn"}, {"id": "mlc-3", "type": "single", "stem": "Cox 模型中，某特征的危害系数<strong>大于 0<\/strong>，说明？", "options": ["对留存有负面影响，值越大影响越大", "对留存有正面影响，值越大影响越大", "对留存没有影响", "对留存有正面影响，值越小影响越大"], "answer": [0], "why": ["对，原话", "正负说反了", "不是", "那是小于 0 的情况"], "explain": "大于 0 坏，小于 0 好。", "tags": ["basic", "core"], "m": "ml_churn"}, {"id": "mlc-4", "type": "multi", "stem": "第 14 讲留存分析得出的结论，正确的是", "options": ["性别对易速鲜花用户留存的影响并不是十分明显", "选择就餐时付会员费，流失率将大幅上升", "月卡、手工转账支付会员费都是潜在的流失原因", "各种优惠套餐的危害系数都大于 0，参与活动会降低留存率", "营销时应尽量说服会员在办卡时选择自动付费"], "answer": [0, 1, 2, 4], "why": ["两条曲线几乎重合", "原文", "原文", "错，套餐系数都小于 0，对留存是正面作用", "微信自动扣款、花呗最佳"], "explain": "性别无关，手工 / 就餐 / 月卡坏，套餐和自动付费好。", "tags": ["basic"], "m": "ml_churn"}, {"id": "mlc-5", "type": "single", "stem": "第 14 讲「哪些因素影响会员留存」这个问题，课程认为它属于？", "options": ["数据探索类型的问题", "回归问题", "二元分类问题", "聚类问题"], "answer": [0], "why": ["原话：既不是回归，也不是分类", "不是", "那是第 15 讲的流失预测", "不是"], "explain": "留存分析 = 数据探索。", "tags": ["basic"], "m": "ml_churn"}, {"id": "mlc-6", "type": "multi", "stem": "关于虚拟变量和 get_dummies，下列说法正确的是", "options": ["pd.get_dummies 可以把多类别字段分解为多个二元类别字段", "drop_first=True 时，哑变量的个数比总类别数少 1", "为 k 个级别保留 k 个虚拟变量，会存在一个级别的冗余，可能导致多重共线性", "课程在前面特征工程阶段就拆好了虚拟变量，因为画分组留存曲线用不到原字段"], "answer": [0, 1, 2], "why": ["对", "对", "原话", "反了：故意留到后面，因为画分组曲线要保留原分类字段"], "explain": "k 类留 k-1 个，避免冗余和多重共线性。", "tags": ["basic"], "m": "ml_churn"}, {"id": "mlc-7", "type": "single", "stem": "要预测<strong>某一个特定用户<\/strong>在未来的留存概率，应使用 lifelines 中的？", "options": ["Cox 危害系数模型（CoxPHFitter）", "Kaplan-Meier 生存模型（KaplanMeierFitter）", "MinMaxScaler", "confusion_matrix"], "answer": [0], "why": ["对", "KM 展示全部或某一类用户", "那是归一化工具", "那是混淆矩阵工具"], "explain": "某一个人 → Cox。", "tags": ["basic"], "m": "ml_churn"}, {"id": "mlc-8", "type": "single", "stem": "判断：课程说，一般来说我们使用 95% 的置信水平进行区间估计", "options": ["正确", "错误"], "answer": [0], "why": ["对，留存曲线的蓝色阴影就是置信区间", "这是原话"], "explain": "置信区间是一个范围，常用 95%。", "tags": ["basic"], "m": "ml_churn"}, {"id": "mlc-11", "type": "multi", "stem": "关于逻辑回归，下列说法正确的是", "options": ["逻辑回归在线性回归的基础上加了一个 Sigmoid 函数映射，成为分类算法", "逻辑回归的本质仍然是线性回归，所以名字中保留了「回归」二字", "逻辑回归是最为基础的分类算法，常常作为基准算法", "Sigmoid 函数把线性回归的预测值转换成 -1~1 之间的值", "预测概率大于等于 0.5 判为 1，小于 0.5 判为 0"], "answer": [0, 1, 2, 4], "why": ["原文", "原文", "原文", "错，是 0~1 之间（-1~1 是 tanh）", "对"], "explain": "逻辑回归 = 线性回归 + Sigmoid，阈值 0.5。", "tags": ["basic", "core"], "m": "ml_churn"}, {"id": "mlc-12", "type": "multi", "stem": "下列分类算法与描述对应正确的是", "options": ["SVM 分类器：计算出一个分类超平面将数据点分为两类", "最近邻（KNN）：找出训练集中与测试样本最靠近的 k 个样本来预测", "随机森林：用多棵决策树组合而成的集成学习模型", "决策树分类器：主要指 CART 算法，为二叉树结构", "贝叶斯分类器：利用 Boosting 方法基于决策树建立的模型"], "answer": [0, 1, 2, 3], "why": ["原文", "原文", "原文", "原文", "错，贝叶斯用贝叶斯推断；Boosting 是 AdaBoost / XGBoost"], "explain": "超平面 SVM，k 个邻居 KNN，多棵树随机森林。", "tags": ["basic"], "m": "ml_churn"}, {"id": "mlc-13", "type": "multi", "stem": "关于神经网络的激活函数，下列说法正确的是", "options": ["激活函数是用来引入非线性因素的，目的是提升模型的表达能力", "没有激活函数，各层神经元之间只存在线性关系", "ReLU 是目前普通神经网络中最常用的激活函数", "tanh 在输入值较大时梯度接近零，可能出现梯度消失", "ReLU 没有任何缺点，神经元永远不会「死掉」"], "answer": [0, 1, 2, 3], "why": ["原话", "对，网络就是纯线性的", "原话", "对", "错，权重都在负区间时导数可能永远为零，神经元「死掉」"], "explain": "激活 = 引入非线性；ReLU 最常用但会死。", "tags": ["basic"], "m": "ml_churn"}, {"id": "mlc-14", "type": "multi", "stem": "关于神经网络输出层的激活函数，下列说法正确的是", "options": ["二元分类问题，输出层用 sigmoid 函数", "多元分类问题，输出层用 softmax 函数", "分类问题的输出层应该用 relu，因为它输出 0~1 的概率", "输出层激活函数的作用只是确定分类概率"], "answer": [0, 1, 3], "why": ["原文", "原文", "错，ReLU 等函数在输出层无法发挥作用", "原文"], "explain": "输出层：二分类 sigmoid，多分类 softmax。", "tags": ["basic"], "m": "ml_churn"}, {"id": "mlc-15", "type": "multi", "stem": "下列属于 ReLU 变体的有", "options": ["Leaky ReLU", "PReLU（Parametric ReLU）", "eLu", "Randomized ReLU", "softmax"], "answer": [0, 1, 2, 3], "why": ["是", "是", "是", "是", "不是，它是多元分类输出层用的函数"], "explain": "ReLU 变体给负区间一点斜率。", "tags": ["basic"], "m": "ml_churn"}, {"id": "mlc-16", "type": "single", "stem": "课程说，「最基本、最简单的神经网络」就是？", "options": ["逻辑回归模型（一元感知器）", "CNN 卷积网络", "RNN 循环网络", "随机森林"], "answer": [0], "why": ["对，一元感知器和逻辑回归模型完全相同", "它处理图像，更复杂", "它处理时序和文本", "那是集成学习，不是神经网络"], "explain": "感知器 = 单个神经元 = 逻辑回归。", "tags": ["basic"], "m": "ml_churn"}, {"id": "mlc-17", "type": "multi", "stem": "关于第 15 讲用 DNN 预测会员流失，下列说法正确的是", "options": ["Dense 层是最普通的全连接网络层，其中既没有卷积，也没有循环", "DNN 网络非常适合解决分类问题，尤其是特征比较多的情况", "binary_crossentropy 是专门用来二分类问题的损失函数", "本项目数据是结构化特征，所以必须用 CNN 网络", "验证集曲线振荡的原因是缺少归一化，神经网络非常不喜欢未经归一化的数据"], "answer": [0, 1, 2, 4], "why": ["原话", "原话", "原话", "错，CNN 处理图像，本项目用 Dense 层就够", "原文"], "explain": "Dense 搭 DNN，二分类 binary_crossentropy，记得归一化。", "tags": ["basic"], "m": "ml_churn"}, {"id": "mlc-18", "type": "single", "stem": "用 sklearn 逻辑回归时，想输出<strong>分类的概率<\/strong>（而不是 0/1），用哪个方法？", "options": ["predict_proba()", "predict()", "score()", "fit()"], "answer": [0], "why": ["对", "它输出分类的值", "它给出准确率的均值", "它是训练"], "explain": "predict 给类别，predict_proba 给概率。", "tags": ["basic"], "m": "ml_churn"}, {"id": "mlc-19", "type": "single", "stem": "判断：相对于 ReLU 和 sigmoid，tanh 激活函数的优点是能让网络训练更快", "options": ["正确", "错误"], "answer": [1], "why": ["原文不是这样说的", "错，原文说 ReLU 加速梯度下降的收敛；tanh 输入大时梯度接近零，容易梯度消失"], "explain": "加速收敛的是 ReLU，不是 tanh。", "tags": ["basic"], "m": "ml_churn"}, {"id": "mlc-20", "type": "single", "stem": "课程认为，相对于逻辑回归等算法，神经网络更适合哪类分类问题？", "options": ["特征数量比较多、数据集样本数量庞大", "特征很少、样本很少", "只有一个特征", "没有标签的数据"], "answer": [0], "why": ["原话，结构复杂、拟合能力强", "反了", "不是", "没有标签是无监督问题"], "explain": "特征多、样本大 → 神经网络。", "tags": ["basic"], "m": "ml_churn"}, {"id": "mlc-21", "type": "multi", "stem": "第 16 讲介绍的「四个重要的分类评估方法」包括", "options": ["混淆矩阵", "精确率和召回率", "F1 分数", "ROC 曲线和 AUC", "R² 分数"], "answer": [0, 1, 2, 3], "why": ["是", "是", "是", "是", "不是，R² 是回归问题的评估指标"], "explain": "混淆、精召、F1、ROC/AUC。", "tags": ["basic"], "m": "ml_churn"}, {"id": "mlc-22", "type": "multi", "stem": "关于混淆矩阵，下列说法正确的是", "options": ["混淆矩阵是一个由预测值和真值共同组成的矩阵", "「真」「假」代表实际值（真值）和预测值一致与否", "「正」「负」代表预测出来的值是 1 还是 0", "在这个矩阵中最看重的是左上角的「真负」值", "混淆矩阵是一个分数性的指标"], "answer": [0, 1, 2], "why": ["原话", "原话", "原话", "错，最看重右下角「真正」值", "错，原文说它不是分数性指标，所以才引入精确率和召回率"], "explain": "真假看一致，正负看预测；第一眼看右下 TP。", "tags": ["basic"], "m": "ml_churn"}, {"id": "mlc-23", "type": "multi", "stem": "关于精确率和召回率，下列说法正确的是", "options": ["精确率也叫查准率", "召回率也叫查全率", "精确率 = TP / (TP + FP)", "召回率 = TP / (TP + FP)", "真正类率（TPR）其实就是召回率的另一个名称"], "answer": [0, 1, 2, 4], "why": ["对", "对", "对", "错，召回率 = TP / (TP + FN)", "原话"], "explain": "精确率加 FP，召回率加 FN。", "tags": ["basic", "core"], "m": "ml_churn"}, {"id": "mlc-24", "type": "single", "stem": "某模型 TP = 20、FP = 5、FN = 20，它的<strong>精确率<\/strong>是？", "options": ["80%", "50%", "40%", "25%"], "answer": [0], "why": ["20 / (20 + 5) = 80%", "那是召回率 20 / (20 + 20)", "不对", "不对"], "explain": "精确率 = TP / (TP + FP)。", "tags": ["basic", "core"], "m": "ml_churn"}, {"id": "mlc-25", "type": "single", "stem": "如果更担心「本来要流失了，却被误判为忠诚会员」，应该更多看哪个指标？", "options": ["召回率", "精确率", "准确率", "FPR"], "answer": [0], "why": ["对，这是被预测为负的正样本（FN）", "精确率关心的是被误判为流失的忠诚会员（FP）", "不平衡数据不能单看准确率", "FPR 是 ROC 的横轴"], "explain": "怕漏掉 → 召回率；怕误判 → 精确率。", "tags": ["basic"], "m": "ml_churn"}, {"id": "mlc-26", "type": "multi", "stem": "关于 F1 分数，下列说法正确的是", "options": ["F1 分数在数学上定义为精确率和召回率的调和均值", "只有当召回率和精确率都很高时，分类模型才能得到较高的 F1 分数", "F1 指标特别适合于评估各类别样本分布不平衡的问题", "F1 = 精确率 + 召回率", "sklearn 的 classification_report 可以显示 F1 分数，同时显示精确率、召回率和准确率"], "answer": [0, 1, 2, 4], "why": ["原文", "原话", "原话", "错，F1 = 2 × 精确率 × 召回率 / (精确率 + 召回率)", "原文"], "explain": "F1 = 调和均值，两高才高，简单比较选 F1。", "tags": ["basic"], "m": "ml_churn"}, {"id": "mlc-27", "type": "multi", "stem": "关于 ROC 曲线和 AUC，下列说法正确的是", "options": ["ROC 的中文全称是受试者工作特征曲线", "ROC 空间中，X 轴是假正类率（FPR），Y 轴是真正类率（TPR）", "越靠近左上的点越好，对角线上的点相当于随机猜测", "AUC 越接近 1.0，说明模型性能越高", "AUC 等于 0.5 时说明模型性能最优"], "answer": [0, 1, 2, 3], "why": ["对", "对", "原话", "原话", "错，0.5 只相当于随机一猜，无应用价值"], "explain": "ROC 靠左上越好，AUC 越接近 1 越好。", "tags": ["basic", "core"], "m": "ml_churn"}, {"id": "mlc-28", "type": "multi", "stem": "下列 sklearn 工具与用途对应正确的是", "options": ["confusion_matrix：计算混淆矩阵", "classification_report：显示精确率、召回率、F1 分数和准确率", "roc_curve 和 auc：绘制 ROC 曲线、计算 AUC", "StratifiedKFold：分层采样，每份子集保持和原始数据集相同的类别比例", "MinMaxScaler：计算 AUC 面积"], "answer": [0, 1, 2, 3], "why": ["对", "对", "对", "对，适合不平衡数据", "错，它是归一化工具"], "explain": "混淆 confusion_matrix，报告 classification_report，ROC 用 roc_curve + auc。", "tags": ["basic"], "m": "ml_churn"}, {"id": "mlc-29", "type": "single", "stem": "判断：会员数据中留存 73%、流失 27%，因此模型准确率达到 78% 就足以说明模型很好", "options": ["正确", "错误"], "answer": [1], "why": ["不对", "错，全猜留存就有 73%，不平衡数据绝对不能单用准确率衡量"], "explain": "不平衡数据：准确率会骗人，先看混淆矩阵。", "tags": ["basic"], "m": "ml_churn"}, {"id": "mlc-30", "type": "single", "stem": "假正类率（伪阳性率，FPR）的公式是？", "options": ["FP / (FP + TN)", "TP / (TP + FN)", "TP / (TP + FP)", "TN / (TN + FN)"], "answer": [0], "why": ["对，实际为阴性的样本中被错判为阳性的比率", "那是 TPR，也就是召回率", "那是精确率", "那是把留存当正类时的精确率（课程算过 899/(899+162)≈85%），不是 FPR"], "explain": "FPR 分母是全部真负样本 FP + TN。", "tags": ["basic"], "m": "ml_churn"}]}, {"id": "ml_adv", "title": "裂变与收官：集成学习、增长模型、选算法、部署、持续精进", "short": "集成·增长·部署", "group": "机器学习 · 裂变关与持续赋能", "exam": "第 17—21 讲", "refs": [], "lessons": [{"title": "集成学习：Bagging 与 Boosting（第 17 讲）", "cards": ["### 一句话\n\n课程原话：<strong>集成学习（ensemble learning），是通过构建出多个模型（这些模型可以是比较弱的模型），然后将它们组合起来完成任务的机器学习算法。<\/strong>\n\n- 它<strong>并不是一种<\/strong>机器学习算法，而是<strong>一个算法的家族<\/strong>。\n- 几个表现一般的模型集成在一起，就能<strong>大幅提升性能<\/strong>——这是它的天然优势。\n- 能处理<strong>回归和分类<\/strong>问题，对<strong>避免过拟合<\/strong>有天然优势。\n- 本讲案例：预测用户在裂变促销下<strong>是否会转化<\/strong>（二元分类）。10000 个样本，转化率约 20%，是<strong>不平衡<\/strong>数据集。\n\n### 偏差和方差（先认清这对词）\n\n| 词 | 课程说法 |\n|---|---|\n| <strong>方差<\/strong> | 从<strong>统计学<\/strong>引来的概念，表示一组数据<strong>距离其均值的离散程度<\/strong> |\n| <strong>偏差<\/strong> | <strong>机器学习<\/strong>里的概念，用来衡量模型的<strong>准确程度<\/strong> |\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 训练初期，训练集和测试集损失都较大 | <strong>欠拟合 → 高偏差<\/strong> |\n| 完全拟合训练集，数据轻微扰动模型就显著变化 | <strong>过拟合 → 高方差<\/strong> |\n| 拟合刚刚好 | 偏差和方差处于<strong>平衡态<\/strong>，均不太高 |\n| 低偏差与低方差<strong>鱼与熊掌不可兼得<\/strong> | <strong>偏差-方差窘境<\/strong>（bias-variance dilemma） |\n\n- 性能优化的最核心问题：在「欠拟合-过拟合」也就是「偏差-方差」之间找<strong>最佳平衡点<\/strong>（训练集优化和测试集泛化的平衡点）。\n- 一般<strong>先减小偏差，再聚焦于降低方差<\/strong>。\n- 集成学习是<strong>同时减小方差和偏差<\/strong>的大招。\n\n> 📌 <strong>欠拟合 = 高偏差，过拟合 = 高方差。<\/strong>真题爱把这两个词对调。", "### 两大门派（必背对应）\n\n| 门派 | 降低什么 | 原话 |\n|---|---|---|\n| <strong>Boosting<\/strong> | <strong>降低偏差<\/strong> | 把<strong>梯度下降<\/strong>的思想应用在机器学习算法的优化上，让<strong>弱模型对数据的拟合逐渐增强<\/strong> |\n| <strong>Bagging<\/strong> | <strong>降低方差<\/strong> | 从原始数据集中抽取数据，形成 <strong>K 个随机的新训练集<\/strong>，然后训练出 <strong>K 个不同的模型<\/strong> |\n\n> 📌 <strong>Boosting 降偏差，Bagging 降方差。<\/strong>真题第 4 题就是把这两个对调了来考。\n\n### Boosting：一个接一个改错\n\n- 不断用新模型优化同一个<strong>基模型<\/strong>，新模型总<strong>聚焦于之前模型的误差点<\/strong>（预测出错的样本）。\n- 三种很受欢迎的算法，都<strong>既能分类也能回归<\/strong>：\n\n| 算法 | 特点 | sklearn / 库 |\n|---|---|---|\n| <strong>AdaBoost<\/strong> | 对样本<strong>加权<\/strong>，<strong>被分错的样本权重增大<\/strong> | AdaBoostClassifier |\n| <strong>GBDT<\/strong>（梯度提升决策树） | 在 AdaBoost 基础上<strong>定义损失函数<\/strong>，用梯度下降优化，只用<strong>一阶导数<\/strong> | GradientBoostingClassifier |\n| <strong>XGBoost<\/strong>（极端梯度提升，简称 XGB） | 在 GBDT 基础上优化梯度下降：用泰勒展开到<strong>二阶<\/strong>求导，训练集上<strong>收敛更快<\/strong> | xgboost 库的 XGBClassifier |\n\n### Bagging：并排训练再投票\n\n- Bagging = <strong>Bootstrap Aggregating<\/strong>（套袋法、装袋法、自助聚合）。\n- <strong>有放回<\/strong>地抽 K 轮，K 个训练集<strong>彼此独立<\/strong>；这个抽样叫 <strong>bootstrap（自举 / 自助采样）<\/strong>。每个模型叫<strong>基模型 / 基学习器<\/strong>（base estimator）。\n- <strong>分类问题 → K 个模型投票；回归问题 → 取 K 个模型的均值。<\/strong>\n- 三种常见算法：<strong>决策树的 Bagging、随机森林、极端随机森林<\/strong>。\n\n| 算法 | 特点 | sklearn |\n|---|---|---|\n| 决策树的 Bagging | 树的聚合；决策树本身<strong>低偏差、高方差<\/strong>，容易过拟合 | BaggingClassifier |\n| <strong>随机森林<\/strong> | 改进的决策树 Bagging：树分叉时<strong>随机选特征<\/strong>，不总考量全部特征 | RandomForestClassifier |\n| <strong>极端随机森林<\/strong> | 更随机：连分支都随机选，<strong>一点也不「贪心」<\/strong> | ExtraTreesClassifier |\n\n- 集成最关键的一点：<strong>各基模型相关度要小，差异性要大<\/strong>（异质性越强，效果越好）。\n\n### 结论与推荐\n\n- 本案例中 <strong>XGBoost 的 F1 最高<\/strong>（准确率和 GBDT 相同，都是 87.00%），<strong>随机森林准确率最高<\/strong>（87.20%），AdaBoost 最差。\n- <strong>Bagging 里最推荐随机森林，Boosting 里最推荐 XGBoost<\/strong>；随机森林可以当作<strong>基准<\/strong>。\n- 总结原话：集成学习把多种<strong>同质或者异质<\/strong>的模型组合在一起，目标是<strong>减少方差和偏差<\/strong>，找到欠拟合和过拟合之间的最佳平衡点。"]}, {"title": "增长模型：四类用户和增量分数（第 18 讲）", "cards": ["### 一句话\n\n<strong>增长模型（Uplift modelling / incremental modelling，也叫提升建模、增量建模）<\/strong>：多用于<strong>评估营销活动对用户订单增量的影响<\/strong>，Uber 等公司也在用。它是<strong>一种解题思路<\/strong>，<strong>并不是一种具体的机器学习算法<\/strong>。\n\n- 本讲问题：裂变方案的<strong>最佳受众是谁<\/strong>——找出正在犹豫「要不要买」的<strong>摇摆者<\/strong>。\n- 数据来自 <strong>A/B 测试<\/strong>：系统随机给<strong>三分之一<\/strong>用户看「情侣花享」、三分之一看「拼团盛放」、三分之一看<strong>没有促销<\/strong>的页面。共 64000 个样本。\n\n### 四类用户（必背中英文名）\n\n| 类别 | 英文 | 特点 |\n|---|---|---|\n| <strong>完全不睬者<\/strong> | Lost Causes | 怎么优惠都不买，可以忘掉 |\n| <strong>促销响应者<\/strong> | Persuadable | <strong>只有收到促销才买<\/strong>，关注的<strong>重点<\/strong> |\n| <strong>肯定会买者<\/strong> | Sure Things | 忠实用户，没促销也会买 |\n| <strong>别来烦我者<\/strong> | Do-Not-Disturb / Sleeping Dogs | <strong>收到促销反而不买<\/strong>，没促销时反而会买 |\n\n- 原理：尽可能定位出<strong>促销响应者<\/strong>和<strong>别来烦我者<\/strong>；促销 A 好还是 B 好，<strong>由第二和第四类人决定<\/strong>。\n- 实际项目中<strong>无法直接找出这四类人<\/strong>，只能按「有没有收到裂变」×「是否转化」分成四组：\n\n| 数据里的组 | 符号 | 包含哪几类人 |\n|---|---|---|\n| 裂变购买者 | <strong>TR<\/strong> | 肯定会买者 + 促销响应者 |\n| 裂变未购买者 | <strong>TN<\/strong> | 完全不睬者 + 别来烦我者 |\n| 无裂变购买者 | <strong>CR<\/strong> | 肯定会买者 + 别来烦我者 |\n| 无裂变未购买者 | <strong>CN<\/strong> | 完全不睬者 + 促销响应者 |\n\n> 💡 T = 收到促销的人群，C = 没收到促销的人群；R = 买了，N = 没买。\n\n### 增量分数\n\n<strong>增量分数 =（裂变购买者 + 无裂变未购买者）−（裂变未购买者 + 无裂变购买者）<\/strong>\n\n即 (P(TR)+P(CN)) − (P(TN)+P(CR))，也就是「促销响应可能性的提升 + 别来烦我可能性的减少」。前半部分含<strong>促销响应者<\/strong>，后半部分代表<strong>别来烦我者<\/strong>，所以取负值。\n\n### 怎么算\n\n1. 判断用户落入 4 组的概率 → <strong>多类别分类问题<\/strong>（解决它的算法和二分类<strong>完全相同<\/strong>）；\n2. 用 <strong>XGBoost<\/strong> 拟合，用 <strong>predict_proba<\/strong> 求概率（<strong>不用 predict<\/strong>，标签值算不出增量）；\n3. 代入公式算增量。\n\n> 📌 陷阱：「增长模型是一种具体算法」✗；「能直接找出四类人」✗；「无裂变购买者 = 肯定会买 + 促销响应」✗（应是 + 别来烦我）。"]}, {"title": "怎么选算法（第 19 讲）", "cards": ["### 一句话\n\n选算法要看：<strong>问题本身、标签的类型、数据集的大小、特征的数量、计算时间的要求、模型的可解释性<\/strong>。<strong>把问题定义好、明确目标，是选择算法的前提。<\/strong>\n\n### 课程算法地图\n\n| 大类 | 包括 |\n|---|---|\n| 监督学习·分类 | 逻辑回归、决策树分类、SVM 分类、贝叶斯分类、KNN |\n| 监督学习·回归 | 线性回归、决策树回归、SVM 回归、贝叶斯回归 |\n| 集成学习 | 随机森林、XGBoost |\n| 深度学习 | DNN、CNN、RNN |\n| 无监督学习 | 聚类（K-均值）、<strong>降维（PCA）<\/strong> |\n| <strong>生成新数据<\/strong>（不在知识图谱里，是同讲另一段提到的生成式算法） | <strong>GAN<\/strong>（生成式对抗网络）、<strong>DeepDream<\/strong>、<strong>VAE<\/strong>（变分自编码器） |\n\n- 聚类是课程中<strong>唯一一个监督学习之外<\/strong>的算法。\n- 有标签做预测/分类 → 监督学习；无标签挖信息、降维 → 无监督学习。\n- 回归还是分类，看<strong>标签是连续还是离散<\/strong>。\n\n### 选算法三步\n\n1. <strong>监督还是无监督？<\/strong> 2. <strong>回归还是分类？<\/strong> 3. 其他因素：训练数据大小、特征数量、性能还是可解释性、训练速度、数据的线性程度。\n\n### 按数据量选（必背）\n\n| 情况 | 选 | 例子 |\n|---|---|---|\n| <strong>样本少、特征多<\/strong>（如文本） | <strong>高偏差、低方差<\/strong> | 线性回归、朴素贝叶斯、线性 SVM |\n| <strong>数据足够大、特征少<\/strong> | <strong>低偏差、高方差<\/strong> | KNN、决策树、核 SVM |\n| 数据很多 | 神经网络也很好 | |\n| <strong>大特征空间、较少数据量<\/strong> | <strong>SVM<\/strong>（不受特征数量约束） | |\n| 特征数量巨大且结构复杂 | 深度神经网络 | |\n\n### 回归问题对号入座\n\n| 算法 | 课程说法 |\n|---|---|\n| 线性回归 | <strong>可靠的首选基准<\/strong>，大、小数据集都适用，可处理高维特征 |\n| SVM | 特征有限、意义接近的中等数据集；<strong>使用前要特征缩放<\/strong> |\n| 朴素贝叶斯 | 比线性模型<strong>快得多<\/strong>，适合超大数据和高维，但<strong>性能通常低于线性模型<\/strong> |\n| 决策树 | 速度快、<strong>不需要数据缩放<\/strong>、可视化易解释；但易过拟合，通常当<strong>集成学习的基模型<\/strong> |\n| 随机森林 | 几乎总比单棵决策树好，不需缩放；<strong>不适合高维稀疏数据<\/strong> |\n| XGBoost | 性能略高于随机森林；<strong>训练更慢，但预测更快、内存更少<\/strong>；调参更繁琐 |\n| 深度神经网络 | 适合大型数据集；<strong>难于解释<\/strong>，对缩放和参数敏感 |\n\n### 分类问题对号入座（看问题性质）\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 流失、欺诈检测、促销和裂变效果 | <strong>逻辑回归<\/strong>（基准，简单易解释） |\n| 投资决策、银行贷款评估 | <strong>决策树<\/strong>（最直观，接近人类思维） |\n| 类别不平衡（坏件、高风险病患） | <strong>随机森林<\/strong>（XGBoost 略高） |\n| 文本情感、文本分类、推荐、人脸识别 | <strong>朴素贝叶斯<\/strong>（深度学习出现之前的首选） |\n| 疾病诊断、手写数字识别 | <strong>SVM<\/strong> |\n| 语音、视觉、NLP、自动驾驶等非结构化 | <strong>深度学习<\/strong>（数据少、特征结构好时优势不明显） |\n\n### 原则\n\n- <strong>随着灵活性和准确性增加，可解释性会降低<\/strong>。线性回归可解释性高，叫<strong>限制性算法<\/strong>。\n- 朴素贝叶斯、线性回归、逻辑回归<strong>运行迅速<\/strong>；SVM、神经网络、随机森林训练慢。\n- <strong>更好的数据往往胜过更好的算法<\/strong>；<strong>从简单的模型开始构建基准<\/strong>，再尝试复杂方法；别忘了尝试<strong>集成方法<\/strong>。"]}, {"title": "模型部署：Pickle 与 Flask（第 20 讲）", "cards": ["### 部署方式（必背清单）\n\n课程原话：部署机器学习模型有多种方式，比如\n1. 开发人员<strong>重新编写模型<\/strong>（用 Java、C 或 C++ 重写，耗时耗力，不一定总要这样做）；\n2. 通过 <strong>Web 应用<\/strong>把模型部署到 <strong>Web 服务器<\/strong>；\n3. 通过 <strong>Tensorflow Lite<\/strong> 等工具部署到<strong>移动端<\/strong>。\n\n- 机器学习<strong>不局限于离线应用<\/strong>。Tensorflow、PyTorch、Sklearn 都有工具把模型发布为 Web 服务或部署到移动设备。\n- 最简单的方法：用 <strong>Flask<\/strong> 建 Web 应用，导入 <strong>Pickle<\/strong> 存好的模型，接收 HTML <strong>POST 请求<\/strong>传来的特征，预测并返回。\n\n### 本讲例子：预测微信文章浏览量\n\n| 文件 | 干嘛的 |\n|---|---|\n| templates/index.html | 给用户看的网页模板（<strong>前端<\/strong>），输入点赞数、转发数 |\n| <strong>model.py<\/strong> | 创建、拟合模型（线性回归），执行后生成 model.pkl |\n| <strong>model.pkl<\/strong> | 存储模型的二进制文件 |\n| <strong>app.py<\/strong> | Flask Web 应用，负责部署模型 |\n| 易速鲜花微信软文.csv | 训练数据 |\n\n- 请求流程：HTML 页面 → <strong>Nginx<\/strong>（代理）→ <strong>uWSGI<\/strong>（后端服务器）→ <strong>Flask 应用<\/strong>载入模型预测 → 原路返回。\n- 训练<strong>只需完成一次<\/strong>，之后每次载入模型<strong>不需要再训练<\/strong>。\n- 脚本在命令行整体执行；编辑器用 Anaconda 自带的 <strong>Spyder<\/strong>。\n\n### Pickle：序列化工具\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 内存中的模型对象 → 0 和 1 的字节流文件存到磁盘（存盘） | <strong>序列化<\/strong>，<strong>pickle.dump()<\/strong> |\n| 磁盘中的 model.pkl → 内存中的 Python 对象 | <strong>反序列化<\/strong>，<strong>pickle.load()<\/strong> |\n\n- 限制：要求应用程序<strong>也是 Python 开发的<\/strong>，否则读不了。\n\n### 其他导出格式\n\n| 格式 | 认得出 |\n|---|---|\n| <strong>Joblib<\/strong> | 轻量级流水线工具，比 Pickle 强在<strong>并行化、良好的日志、追踪功能、大数据支持<\/strong> |\n| <strong>ONNX<\/strong> | <strong>开放神经网络交换格式<\/strong>，<strong>跨语言<\/strong>存储和移植，多数深度学习库都支持 |\n| <strong>PMML<\/strong> | 另一种交换格式，<strong>1997 年<\/strong>出现，PEGA、SAP 在用；缺点是<strong>仅支持某些类型的模型<\/strong> |\n| <strong>POJO / MOJO<\/strong> | <strong>H2O.ai<\/strong> 的格式，给 Java 应用嵌入，<strong>仅适用于 H2O 平台<\/strong> |\n\n### Flask\n\n- 用 <strong>Python<\/strong> 写的<strong>轻量级 Web 应用框架<\/strong>，内置开发服务器和调试器，支持 <strong>RESTful<\/strong> 请求。\n- <strong>@app.route<\/strong>：装饰器，把下面的方法<strong>映射到 URL<\/strong>（如 / 或 /predict）。\n- <strong>render_template()<\/strong>：找 index.html 模板，<strong>渲染<\/strong>（运行时动态生成）最终的 HTML 页面。\n- 默认地址 http://127.0.0.1:5000/。\n\n> 📌 各环节都可替换：数据可从数据库取，<strong>Joblib 可代替 Pickle<\/strong>，Flask 也可换别的框架。"]}, {"title": "持续精进：迁移学习、AutoML、三大学派、GNN（第 21 讲）", "cards": ["### 一句话\n\n踏进机器学习就是<strong>终身学习<\/strong>。课程讲过监督、无监督、半监督、强化、深度、集成学习，此外还有<strong>迁移学习、自动化机器学习、联邦学习、图神经网络<\/strong>等方向。作者给三条建议：\n\n### 建议一：不要重复造轮子 → 迁移学习\n\n- 原话：<strong>迁移学习（Transfer Learning）是把为任务 A 开发的模型作为初始点，重新使用在为任务 B 开发模型的过程中。<\/strong>\n- 在深度学习的<strong>计算机视觉<\/strong>和<strong>自然语言处理<\/strong>里特别常见。\n- 知名模型：牛津 <strong>VGG<\/strong>、谷歌 <strong>Inception<\/strong>、微软 <strong>ResNet<\/strong>。\n- 示例：微调 <strong>VGG19<\/strong>——<strong>冻结卷积块 1—4，微调第 5 块<\/strong>（block5_conv1），再加全连接分类器，用<strong>小学习速率<\/strong>。\n\n### 建议二：关注自动化机器学习（AutoML）\n\n- 形成从数据预处理、特征工程、算法选择、参数调优<strong>直至部署上线<\/strong>的完整方案；目标是<strong>让非专家也能使用<\/strong>机器学习。\n- <strong>三个方面（必背）<\/strong>：\n\n| 方面 | 工具举例 |\n|---|---|\n| 1. <strong>自动化特征工程<\/strong> | DataRobot、H2O 的 Driverless AI、tsfresh |\n| 2. <strong>自动化模型选择和超参数调整<\/strong> | Auto-sklearn、Driverless AI、Azure Automated ML、Google Cloud AutoML |\n| 3. <strong>自动部署机器学习模型<\/strong> | Microsoft Machine Learning Service、Amazon SageMaker、Google Cloud ML、<strong>TensorFlow Serving<\/strong> |\n\n- 有时<strong>部署上线花的时间比训练调试还多<\/strong>。\n\n> 📌 「用 AutoML 工具自动化部署模型」是<strong>对的<\/strong>，属于第三方面。\n\n### 建议三：关注最新进展 → 图神经网络\n\n<strong>三大学派（必背）<\/strong>：\n\n| 学派 | 特点 | 代表成果 |\n|---|---|---|\n| <strong>符号主义<\/strong> Symbolicism | 知识表达和逻辑推理 | <strong>贝叶斯因果网络<\/strong>（Judea Pearl）、<strong>知识图谱<\/strong> |\n| <strong>连接主义<\/strong> Connectionism | 起源于<strong>仿生学<\/strong>，模仿神经元 | <strong>深度神经网络<\/strong>；三巨头 2018 年获图灵奖；缺陷是<strong>解释性差<\/strong> |\n| <strong>行为主义<\/strong> Actionism | 把<strong>控制论<\/strong>引入机器学习 | <strong>强化学习<\/strong> |\n\n- <strong>深度强化学习<\/strong> = 强化学习 + 深度学习：DeepMind 2013 年论文提出 <strong>DQN<\/strong>，代表作 <strong>AlphaGo<\/strong>，让强化学习真正走向实用。\n- <strong>图神经网络（GNN）<\/strong>：<strong>2021 年学术界的「红星」<\/strong>，最新热门方向。\n  - <strong>欧几里得数据<\/strong>：图像、文本、视频等尺寸确定、有序的数据。\n  - <strong>非欧几里德数据统称为图<\/strong>：社交网络、知识图谱、复杂文件系统。\n  - 现有算法假设<strong>实例彼此独立<\/strong>，这对图数据是<strong>错的<\/strong>。\n  - 应用：社交网络分析、推荐系统、物理建模、NLP、组合优化。\n- 深度强化学习和 GNN 的出现，代表<strong>三大 AI 源流的汇聚<\/strong>。\n\n> 💡 一句话：<strong>迁移学习<\/strong>解决模型间的知识传递；<strong>AutoML<\/strong> 让落地更简单；<strong>GNN<\/strong> 让应用更广。"]}], "questions": [{"id": "mla-p1", "type": "single", "stem": "Bagging 方法主要降低的是模型的？", "options": ["偏差", "方差", "学习速率", "特征数量"], "answer": [1], "why": ["降低偏差的是 Boosting", "Bagging 降方差", "无关", "无关"], "explain": "Boosting 降偏差，Bagging 降方差。", "tags": [], "lesson": 0, "m": "ml_adv"}, {"id": "mla-p2", "type": "single", "stem": "增长模型中，促销活动最应该针对的、作为关注重点的是哪类用户？", "options": ["完全不睬者", "促销响应者", "肯定会买者", "别来烦我者"], "answer": [1], "why": ["怎么都不买，可以忘掉", "只有收到促销才买，是重点", "没促销也会买", "收到促销反而不买，要避开"], "explain": "促销发给「促销响应者」，避开「别来烦我者」。", "tags": [], "lesson": 1, "m": "ml_adv"}, {"id": "mla-p3", "type": "single", "stem": "课程认为选择算法的<strong>前提<\/strong>是？", "options": ["把问题定义好，明确要解决的目标", "先选最复杂的模型", "先买最好的 GPU", "先部署上线"], "answer": [0], "why": ["原话", "应从简单模型开始", "无关", "顺序反了"], "explain": "定义好问题是选算法的前提。", "tags": [], "lesson": 2, "m": "ml_adv"}, {"id": "mla-p4", "type": "single", "stem": "`pickle.dump()` 做的是？", "options": ["序列化", "反序列化", "归一化", "特征缩放"], "answer": [0], "why": ["把模型存成字节流文件", "pickle.load() 才是反序列化", "无关", "无关"], "explain": "dump 存盘 = 序列化；load 读回 = 反序列化。", "tags": [], "lesson": 3, "m": "ml_adv"}, {"id": "mla-p5", "type": "single", "stem": "强化学习是哪个学派最著名的成果？", "options": ["符号主义", "连接主义", "行为主义", "集成主义"], "answer": [2], "why": ["符号主义的成果是因果网络、知识图谱", "连接主义的成果是深度神经网络", "行为主义引入控制论，成果是强化学习", "没有这个学派"], "explain": "符号—知识图谱，连接—神经网络，行为—强化学习。", "tags": [], "lesson": 4, "m": "ml_adv"}, {"id": "mla-1", "type": "multi", "stem": "关于集成学习，下列说法正确的是", "options": ["集成学习是通过构建出多个模型（可以是比较弱的模型），然后将它们组合起来完成任务的机器学习算法", "集成学习是一种单一的、具体的机器学习算法", "集成学习是同时减小方差和偏差的大招", "集成学习能够处理回归和分类问题，对于避免过拟合具有天然的优势", "集成学习中各个基模型越相似，集成效果越好"], "answer": [0, 2, 3], "why": ["课程原话", "它是一个算法家族，不是一种算法", "课程原话", "课程原话", "相反：相关度要小、差异性要大"], "explain": "集成学习 = 算法家族，组合多个（弱）模型，同时降方差和偏差。", "tags": ["basic"], "m": "ml_adv"}, {"id": "mla-2", "type": "multi", "stem": "关于 Boosting 和 Bagging，下列说法正确的是", "options": ["Boosting 降低模型的偏差", "Bagging 降低模型的方差", "Boosting 是把梯度下降的思想应用在算法优化上，让弱模型对数据的拟合逐渐增强，它降低了方差", "Bagging 从原始数据集中抽取数据，形成 K 个随机的新训练集，然后训练出 K 个不同的模型", "Bagging 抽取训练集时是不放回的，每个样本只会被抽中一次"], "answer": [0, 1, 3], "why": ["对", "对", "前半句对，但 Boosting 降的是偏差", "课程原话", "Bagging 是有放回抽取，有的样本会被多次抽中"], "explain": "Boosting 降偏差，Bagging 降方差，别对调。", "tags": ["basic"], "m": "ml_adv"}, {"id": "mla-3", "type": "multi", "stem": "下列属于 <strong>Boosting<\/strong> 类的算法有", "options": ["AdaBoost", "GBDT", "XGBoost", "随机森林", "极端随机森林"], "answer": [0, 1, 2], "why": ["Boosting", "Boosting", "Boosting", "属于 Bagging", "属于 Bagging"], "explain": "Boosting 三兄弟：AdaBoost、GBDT、XGBoost。", "tags": ["basic", "core"], "m": "ml_adv"}, {"id": "mla-4", "type": "multi", "stem": "下列属于 <strong>Bagging<\/strong> 类的算法有", "options": ["决策树的 Bagging", "随机森林", "极端随机森林", "AdaBoost", "XGBoost"], "answer": [0, 1, 2], "why": ["Bagging", "Bagging", "Bagging", "属于 Boosting", "属于 Boosting"], "explain": "Bagging 三兄弟：树的 Bagging、随机森林、极端随机森林。", "tags": ["basic"], "m": "ml_adv"}, {"id": "mla-5", "type": "single", "stem": "模型过拟合时，会出现？", "options": ["高偏差", "高方差", "偏差和方差都为 0", "低方差"], "answer": [1], "why": ["高偏差是欠拟合", "过拟合 = 高方差", "不可能", "过拟合方差高"], "explain": "欠拟合高偏差，过拟合高方差。", "tags": ["basic"], "m": "ml_adv"}, {"id": "mla-6", "type": "multi", "stem": "关于 AdaBoost、GBDT 和 XGBoost，下列说法正确的是", "options": ["AdaBoost 会对样本进行加权，被分错的样本权重在 Boosting 过程中会增大", "GBDT 在 AdaBoost 的基础上还定义了损失函数，通过梯度下降来优化模型", "XGBoost 利用泰勒展开把损失函数展开到二阶后求导，在训练集上收敛更快", "GBDT 用到二阶导数信息，XGBoost 只用到一阶导数", "这三种算法只能用于分类，不能用于回归"], "answer": [0, 1, 2], "why": ["对", "对", "对", "反了：GBDT 一阶，XGBoost 二阶", "三种都既能分类也能回归"], "explain": "AdaBoost 加权 → GBDT 加损失函数（一阶）→ XGBoost 二阶。", "tags": ["basic"], "m": "ml_adv"}, {"id": "mla-7", "type": "multi", "stem": "关于偏差和方差，下列说法正确的是", "options": ["方差是从统计学中引用过来的概念，表示一组数据距离其均值的离散程度", "偏差是机器学习里的概念，用来衡量模型的准确程度", "训练初期模型欠拟合，训练集和测试集的损失都较大", "过拟合时，模型在训练集上的损失很大", "一般先减小偏差，再聚焦于降低方差"], "answer": [0, 1, 2, 4], "why": ["原话", "原话", "对", "过拟合时训练集损失很小，测试集上方差高", "原话"], "explain": "方差 = 离散程度（统计学），偏差 = 准确程度（机器学习）。", "tags": ["basic", "core"], "m": "ml_adv"}, {"id": "mla-8", "type": "single", "stem": "判断：一般来说，低偏差与低方差可以轻松同时达到。", "options": ["正确", "错误"], "answer": [1], "why": ["错", "对，课程说二者鱼与熊掌不可兼得，叫偏差-方差窘境"], "explain": "偏差-方差窘境：要在中间找平衡点。", "tags": ["basic"], "m": "ml_adv"}, {"id": "mla-9", "type": "single", "stem": "随机森林相对于「决策树的 Bagging」的改进是？", "options": ["在树分叉时增加了对特征选择的随机性，不总考量全部特征", "把决策树换成了神经网络", "用二阶导 ，A 任务的模型用到 B。", "tags": ["basic"], "m": "ml_adv"}, {"id": "mla-53", "type": "multi", "stem": "关于三大学派，下列说法正确的是", "options": ["符号主义注重知识表达和逻辑推理，成果有贝叶斯因果网络和知识图谱", "连接主义起源于仿生学，用数学模型模仿神经元，形成深层神经网络", "行为主义把控制论引入机器学习，最著名的成果是强化学习", "深度学习模型最遭人诟病的缺陷是计算速度慢"], "answer": [0, 1, 2], "why": ["对", "对", "对", "原话是解释性差"], "explain": "符号—知识图谱，连接—神经网络，行为—强化学习。", "tags": ["basic"], "m": "ml_adv"}, {"id": "mla-54", "type": "multi", "stem": "关于自动化机器学习，下列说法正确的是", "options": ["AutoML 的目标是让非专家也能使用机器学习模型和技术", "它力图形成从数据预处理、特征工程到算法选择、参数调优直至部署上线的完整解决方案", "可以用 AutoML 工具自动化部署模型", "AutoML 已经完全成熟，可以彻底取代机器学习工程师"], "answer": [0, 1, 2], "why": ["原话", "原话", "对，自动部署是三方面之一", "原话说这些工具也许还处于初级阶段"], "explain": "AutoML 覆盖全流程，包括部署。", "tags": ["basic"], "m": "ml_adv"}, {"id": "mla-55", "type": "multi", "stem": "【进阶，可跳过】下列属于<strong>自动部署<\/strong>机器学习模型的工具的是", "options": ["TensorFlow Serving", "Amazon SageMaker", "Microsoft Machine Learning Service", "tsfresh", "Auto-sklearn"], "answer": [0, 1, 2], "why": ["对", "对", "对", "那是自动化特征工程", "那是自动化模型选择和调参"], "explain": "部署：TF Serving、SageMaker、MS ML Service。", "tags": ["进阶"], "m": "ml_adv"}, {"id": "mla-56", "type": "multi", "stem": "关于图神经网络（GNN），下列说法正确的是", "options": ["图神经网络是 2021 年机器学习学术界的「红星」", "社交网络、知识图谱等非欧几里德数据统称为图", "图像、文本、视频是尺寸维度确定并且有序排列的欧几里得数据", "现有算法假设实例彼此独立，这一点对图数据完全成立"], "answer": [0, 1, 2], "why": ["原话", "原话", "原话", "原话说这对图数据是错误的"], "explain": "图 = 非欧几里德数据；GNN 是最新热门方向。", "tags": ["basic"], "m": "ml_adv"}, {"id": "mla-57", "type": "single", "stem": "判断：在深度学习的计算机视觉任务和自然语言处理任务里，迁移学习特别常见。", "options": ["正确", "错误"], "answer": [0], "why": ["对，原话", "错"], "explain": "大模型训练贵，所以拿开源模型微调。", "tags": ["basic"], "m": "ml_adv"}, {"id": "mla-58", "type": "multi", "stem": "课程提到，除已讲内容外，机器学习还有哪些学习类型和研究方向？", "options": ["迁移学习", "自动化机器学习", "联邦学习", "图神经网络", "区块链学习"], "answer": [0, 1, 2, 3], "why": ["对", "对", "对", "对", "课程没提"], "explain": "迁移、AutoML、联邦、GNN。", "tags": ["basic"], "m": "ml_adv"}, {"id": "mla-59", "type": "single", "stem": "深度强化学习的代表作是？", "options": ["AlphaGo", "VGG19", "PMML", "Flask"], "answer": [0], "why": ["对，DeepMind 出品", "图像分类网络", "模型交换格式", "Web 框架"], "explain": "深度强化学习：DQN 开山，AlphaGo 代表。", "tags": ["basic"], "m": "ml_adv"}]}, {"id": "ml_quiz", "title": "结课测试真题（20 题）", "short": "真题·机器学习", "group": "机器学习 · 结课测试", "exam": "结课测试原题", "quiz": true, "refs": [], "lessons": [{"title": "怎么用这 20 道真题", "cards": ["### 这是什么\n\n这 20 道题是极客时间这门课<strong>结课测试的原题<\/strong>（你截图、我转成文字）。公司考试很可能就是这个风格，甚至直接从里面出。\n\n- <strong>17 道多选 + 3 道单选<\/strong>：多选要把每个选项都判断一遍，少选、多选都算错。\n- 截图里<strong>没有给答案<\/strong>。网站上的答案是我对照课程原文逐项判断的，每个选项都写了理由和出处讲次。\n- 有 3 处我拿不准（课程原文没讲，或者两种理解都说得通），解析里标了 <strong>⚠️ 有争议<\/strong>，并写了为什么这样判。\n\n### 怎么刷\n\n1. 先去「刷题」，把模块筛选为「真题·机器学习」，做一遍。\n2. 错的题看解析，再回到对应讲次的模块看讲解。\n3. 考前再刷一遍，争取全对。\n\n> 📌 真题的错误选项套路：<strong>换一个词<\/strong>（方差↔偏差、R↔F、m↔m−1）、<strong>加绝对化的词<\/strong>（仅、必须、完全相同）、<strong>把别的概念的定义安上来<\/strong>。"]}], "questions": [{"id": "mlq-1", "type": "multi", "stem": "下列关于机器学习类别的说法哪些是正确的？", "options": ["训练数据集没有标签的机器学习问题叫做无监督学习，其中聚类、降维等算法常用于解决无监督问题。", "训练数据集全部有标签的机器学习问题叫监督学习（supervised learning），监督学习包含回归问题和分类问题。", "半监督学习中，有标签的数据和无标签的数据的比例为 50%、50%。", "强化学习研究的目标是智能体（agent）如何基于环境而做出行动反应，以取得最大化的累积奖励。"], "answer": [0, 1, 3], "why": ["对（第 01 讲：无监督学习目前大多用在聚类、降维等场景）", "对（第 01 讲原话）", "错：课程说半监督是「<strong>大量<\/strong>无标签数据和<strong>一部分<\/strong>有标签数据」，没有固定 50/50 的比例", "对（第 01 讲原话）"], "explain": "四大类：监督（全有标签：回归+分类）、无监督（没标签：聚类、降维）、半监督（大量无标签+少量有标签）、强化（从奖惩中学，累积奖励最大）。", "tags": ["basic", "core", "真题"], "m": "ml_quiz"}, {"id": "mlq-2", "type": "multi", "stem": "下列关于 Jupyter Notebook 的说法哪些是正确的？", "options": ["Jupyter Notebook 是一种基于 Web 的交互式环境，它将代码、富文本、图像、视频、动画、数学方程、绘图、地图、交互式图形和小部件、以及图形用户界面结合到一个文档中。", "Jupyter 为用 Python 包装的内核语言提供了一个轻量级的接口，可以实现代码完成和代码检查。", "Jupyter 的架构和语言无关。客户端和内核之间的解耦使得 Jupyter 可以用任何语言编写内核。", "Jupyter Notebook 不仅是科学研究和数据分析的工具，也是教学的绝佳工具。不过它仅支持 Python 语言。"], "answer": [0, 1, 2], "why": ["对：第 02 讲说它像「网页式的多媒体文档」，能在浏览器里运行代码、显示图文", "对（课程没细讲，这是 Jupyter 官方介绍里的说法，没有错误点）", "对：和 D 相反，正因为和语言无关，所以支持多种语言", "错：第 02 讲原话「Jupyter Notebook <strong>可以支持多种语言<\/strong>，其中就包括 Python」，「仅支持 Python」是陷阱"], "explain": "记住 D 的陷阱：Jupyter <strong>支持多种语言<\/strong>。⚠️ 有争议：B 课程没讲，它是 Jupyter 官方介绍里的话，选项里找不到错误点，所以判为正确。", "tags": ["basic", "core", "真题"], "m": "ml_quiz"}, {"id": "mlq-3", "type": "multi", "stem": "机器学习上线部署的方式包括", "options": ["用 Java、C 或者 C++ 等语言在生产系统中重写模型，部署上线。", "通过 Tensorflow Lite 等工具将模型部署到移动端。", "用序列化工具把训练好的模型存盘，通过 Web 应用把模型部署到 Web 服务器，在 Web 应用中调用模型。", "用 AutoML 工具自动化部署模型。"], "answer": [0, 1, 2, 3], "why": ["对（第 20 讲列举的方式之一）", "对（第 20 讲列举的方式之一）", "对（第 20 讲的实战：Pickle 序列化 + Flask Web 应用）", "对：第 21 讲说 AutoML 包括三个方面，第三个就是「<strong>自动部署<\/strong>机器学习模型」"], "explain": "第 20 讲：重写模型、Web 应用部署到服务器、Tensorflow Lite 部署到移动端；第 21 讲：AutoML 也能自动部署。⚠️ 有争议：D 不在第 20 讲的列举里，但第 21 讲明确说了 AutoML 可以自动部署，选项本身没有错误点，所以判为正确。", "tags": ["basic", "core", "真题"], "m": "ml_quiz"}, {"id": "mlq-4", "type": "multi", "stem": "关于集成学习，下列说法正确的是", "options": ["集成学习 (ensemble learning) 是通过构建出多个模型（这些模型可以是比较弱的模型），然后将它们组合起来完成任务的机器学习算法。", "集成学习起作用的原理是降低了模型的方差和偏差，从而提升了模型的性能。", "Boosting 方法是把梯度下降的思想应用在机器学习算法的优化上，让弱模型对数据的拟合逐渐增强。它降低了方差。", "Bagging 算法的基本思想是，从原始的数据集中抽取数据，形成 K 个随机的新训练集，然后训练出 K 个不同的模型。它降低了偏差。"], "answer": [0, 1], "why": ["对（第 17 讲原话）", "对：第 17 讲说集成学习能「同时减小方差和偏差」", "错在最后一句：Boosting <strong>降低偏差<\/strong>", "错在最后一句：Bagging <strong>降低方差<\/strong>"], "explain": "口诀：<strong>Boosting 降偏差，Bagging 降方差<\/strong>。C、D 前半句都是原话，只把最后的「偏差/方差」对调了。", "tags": ["basic", "core", "真题"], "m": "ml_quiz"}, {"id": "mlq-5", "type": "multi", "stem": "对于样本类别不平衡数据集，我们应该使用何种评估指标？", "options": ["最好的指标是准确率", "精确率、召回率", "ROC 曲线和 AUC 面积", "F1 分数"], "answer": [1, 2, 3], "why": ["错：不平衡时准确率会误导（全猜多数类也能拿高分）", "对", "对", "对：F1 特别适合不平衡问题"], "explain": "第 16 讲：不平衡数据<strong>不能只看准确率<\/strong>，要看精确率、召回率、F1、ROC/AUC。", "tags": ["basic", "core", "真题"], "m": "ml_quiz"}, {"id": "mlq-6", "type": "multi", "stem": "关于神经网络的损失函数，下列说法正确的是", "options": ["对于二分类问题，你可以使用二元交叉熵（binary crossentropy）损失函数。", "对于标签为 One-hot 编码的多分类问题，可以用稀疏分类交叉熵（sparse_categorical_crossentropy）损失函数。", "对于回归问题，可以用均方误差（mean-squared error）损失函数。", "对于标签为整数的多分类问题，我们应该使用分类交叉熵（categorical_crossentropy）损失函数。"], "answer": [0, 2], "why": ["对（第 13 讲原话：二元分类一般用 binary_crossentropy）", "错：One-hot 标签用 <strong>categorical<\/strong>_crossentropy", "对（第 13 讲：回归问题可以选 mse）", "错：整数标签用 <strong>sparse<\/strong>_categorical_crossentropy"], "explain": "二分类 binary，多分类 categorical，回归 mse；多分类时：标签是 One-hot 用 categorical，标签是整数用 sparse_categorical。B、D 是把两者对调了。⚠️ 课程只讲了「多分类用 categorical」，sparse 和 categorical 的区别是 Keras 的通用知识。", "tags": ["basic", "core", "真题"], "m": "ml_quiz"}, {"id": "mlq-7", "type": "multi", "stem": "关于神经网络的激活函数，下列说法正确的是", "options": ["relu 是深度学习中最常用的激活函数，但还有许多其他函数可选，比如 prelu、elu 等。", "如果没有激活函数，网络将是纯线性的。", "神经网络的最后一层如果用于分类，需要用 relu 激活函数，网络只能学会预测 0~1 范围内的值。", "相对于 relu 和 sigmiod，tanh 激活函数的优点是可以使网络训练更快。"], "answer": [0, 1], "why": ["对：第 15 讲说 ReLU 是「目前普通神经网络中最常用的激活函数」，还有 Leaky ReLU、eLu、PreLu 等变体", "对：第 15 讲说激活函数用来引入非线性，没有它各层之间只有线性关系", "错：分类输出层用 <strong>sigmoid<\/strong>（二分类）或 <strong>softmax<\/strong>（多分类），能把输出压到 0~1 的是 sigmoid，不是 relu", "错：第 15 讲说 <strong>ReLU<\/strong> 加速收敛；tanh 输入大时梯度接近零，会梯度消失"], "explain": "第 15 讲：隐藏层用 ReLU（最常用、收敛快）；输出层二分类用 sigmoid，多分类用 softmax；没有激活函数网络就是纯线性的。", "tags": ["basic", "core", "真题"], "m": "ml_quiz"}, {"id": "mlq-8", "type": "multi", "stem": "关于虚拟变量，下列说法正确的是", "options": ["虚拟变量编码方案和 One-hot 编码是完全相同的。", "虚拟变量编码方案和 One-hot 编码类似，但是有不同之处。", "在虚拟编码方案中，当特征具有 m 个不同类别标签时，我们将得到 m-1 个二进制特征，作为基准的特征被完全忽略；而在 One-hot 编码方案中，我们将得到 m 个二进制特征。", "One-hot 编码有冗余，虚拟变量没有冗余，而 One-hot 的这种冗余可能导致回归模型的多重共线性问题。"], "answer": [1, 2, 3], "why": ["错：「完全相同」是陷阱", "对", "对（第 08 讲原话）", "对（第 08 讲：独热编码有冗余，会导致共线性问题）"], "explain": "<strong>虚拟变量 m−1 列，独热编码 m 列<\/strong>；独热有冗余 → 可能共线性。", "tags": ["basic", "core", "真题"], "m": "ml_quiz"}, {"id": "mlq-9", "type": "multi", "stem": "提升神经网络性能的方法包括", "options": ["数据增广 (data augmentation)，也叫数据增强，它能通过已有的图片增加数据量，从而提高卷积网络图像处理问题的性能，增强模型的泛化能力。", "把 Dropout 层添加到神经网络中，将该层的一部分神经元的输出特征随机丢掉（设为 0），相当于随机消灭一部分神经元。", "选择更好的优化器来提升神经网络性能。", "在选择优化器的同时，可以设定并找到合适的学习速率。"], "answer": [0, 1, 2, 3], "why": ["对（第 13 讲第 1 招）", "对（第 13 讲第 2 招，原话）", "对（第 13 讲第 3 招）", "对：第 13 讲「更新优化器并设置学习速率」"], "explain": "第 13 讲三招：<strong>数据增广、Dropout、换优化器（并设学习速率）<\/strong>。四个都对。", "tags": ["basic", "core", "真题"], "m": "ml_quiz"}, {"id": "mlq-10", "type": "multi", "stem": "关于 RNN 网络，下列说法正确的是", "options": ["要让神经网络实现类似于人脑的语义判别能力，有一个很重要的前提是，必须从所有过去的句子中保留一些信息，以便能理解整个故事的上下文。", "在 Kares 中，用于构建循环网络的层是 Simple RNN、LSTM 和 GRU。", "Simple RNN、LSTM 和 GRU 这三种层中神经元结构从简单到复杂，次序是：Simple RNN、LSTM、GRU。", "循环神经网络适合解决时间序列、自然语言处理、周期相关性的问题。"], "answer": [0, 1, 3], "why": ["对（第 12 讲）", "对（第 12 讲原话，Kares 是题目原文的错字，应为 Keras）", "错：第 12 讲说 GRU「复杂性介于 Simple RNN 和 LSTM 之间」，正确次序是 <strong>Simple RNN < GRU < LSTM<\/strong>", "对（第 12 讲）"], "explain": "从简单到复杂：<strong>SimpleRNN → GRU → LSTM<\/strong>（GRU 是速度和性能的折衷）。", "tags": ["basic", "core", "真题"], "m": "ml_quiz"}, {"id": "mlq-11", "type": "single", "stem": "关于 CNN 网络，下列说法<strong>错误<\/strong>的是", "options": ["通常，在卷积过程中，图片特征的尺寸通常会逐渐减小，而深度将逐渐加深。", "在 CNN 网络中，我们通常需要把“卷积 + 池化”的组合重复搭建几次，形成深度卷积网络。", "卷积神经网络的结构比全连接网络复杂，因此神经元的可调节参数也比较多。", "在 Kares 中，用于构建图像分类网络的卷积层是 Conv2D。"], "answer": [2], "why": ["这句是对的（第 11 讲原话）", "这句是对的（第 11 讲原话）", "这句是错的，所以选它：第 11 讲说卷积层的参数<strong>远少于<\/strong>全连接层（局部连接，不是全部连接）", "这句是对的"], "explain": "注意题目问「错误的」。CNN 参数<strong>比全连接少<\/strong>；尺寸变小、深度加深；卷积+池化重复几次；图像用 Conv2D。", "tags": ["basic", "core", "真题"], "m": "ml_quiz"}, {"id": "mlq-12", "type": "multi", "stem": "请你选出机器学习模型优化的可行策略", "options": ["通过特征工程提高数据特征与模型的匹配度来提高性能。", "通过防止过拟合，让模型在拟合和泛化之间保持一个平衡。", "交叉验证所得到的多次评估结果，能够避免某一次数据集划分不合理所带来的偏差。", "每一种算法都有属于自己的一系列可调超参数，GridSearchCV 工具可以帮助我们找到对于当前数据集而言最好的一套参数。"], "answer": [0, 1, 2, 3], "why": ["对（第 08 讲）", "对（第 09 讲）", "对（第 10 讲原话）", "对（第 10 讲：网格搜索）"], "explain": "第 08—10 讲「模型优化」三件事：特征工程、防止过拟合、交叉验证 + 网格搜索调参。四个都对（你的截图里四个选项旁也都是绿色对勾）。", "tags": ["basic", "core", "真题"], "m": "ml_quiz"}, {"id": "mlq-13", "type": "multi", "stem": "机器学习中防止过拟合的方法包括", "options": ["较深的决策树模型出现过拟合的风险较低，因此可以通过加深树的深度避免过拟合。", "通常来说，模型经过充分训练之后，就能够减少过拟合。", "在损失函数当中加入的正则项也叫惩罚项，能够减少模型的过拟合。", "选择较简单、较粗糙的模型反而不容易过拟合，这是机器学习中的奥卡姆剃刀定理。"], "answer": [2, 3], "why": ["错：树越深越容易过拟合，要<strong>限制深度<\/strong>（剪枝）", "错：第 09 讲说「模型经过充分训练后，就会完全拟合训练集数据」，这正是<strong>过拟合<\/strong>", "对（第 09 讲原话）", "对（第 09 讲：奥卡姆剃刀）"], "explain": "防过拟合：加数据、做好特征工程、模型简单一点（奥卡姆剃刀）、正则化（惩罚项）、决策树剪枝（限制 max_depth）。", "tags": ["basic", "core", "真题"], "m": "ml_quiz"}, {"id": "mlq-14", "type": "multi", "stem": "下列关于特征工程的说法，正确的是", "options": ["在一个数据集中，每个特征在标签预测或分类过程中，发挥的作用其实都不同。对于那些没作用和作用小的数据，我们就可以删掉，来降低数据的维度，节省模型拟合时的计算空间。这就是特征选择。", "不同的特征类型，有不同的特征变换方式。对连续特征来说，我们最常见的特征变换就是特征缩放（feature scaling），也就是改变特征的分布或者压缩特征的区间。", "独热编码与虚拟变量非常相似，它们的不同之处在于：在独热编码中，当特征具有 m 个不同类别标签时，我们将得到 m-1 个二进制特征，作为基准的特征被完全忽略；而在独热编码方案中，我们将得到 m 个二进制特征。", "特征构建是整个特征工程领域最具创造力的部分，你可以凭借你的经验、领域知识和创造力，基于原始数据集构建出新的特征。"], "answer": [0, 1, 3], "why": ["对（第 08 讲原话）", "对（第 08 讲原话）", "错：m−1 个的是<strong>虚拟变量<\/strong>，题目把它安到了独热编码头上（而且前后两次都写「独热编码」，自相矛盾）", "对（第 08 讲原话）"], "explain": "特征工程三件事：选择（删没用的）、变换（缩放、编码、分桶）、构建（造新特征，最有创造力）。", "tags": ["basic", "core", "真题"], "m": "ml_quiz"}, {"id": "mlq-15", "type": "multi", "stem": "常用的回归算法包括", "options": ["线性回归", "逻辑回归", "贝叶斯回归", "决策树回归", "SVM 回归", "神经网络"], "answer": [0, 2, 3, 4, 5], "why": ["对", "错：逻辑回归名字里有「回归」，但它是<strong>分类<\/strong>算法", "对", "对", "对", "对"], "explain": "第 07 讲的常用回归算法清单：线性回归、贝叶斯回归、SVM 回归、决策树、随机森林、AdaBoost/XGBoost、神经网络。<strong>逻辑回归是分类<\/strong>，是必考陷阱。", "tags": ["basic", "core", "真题"], "m": "ml_quiz"}, {"id": "mlq-16", "type": "single", "stem": "关于聚类，下列说法<strong>错误<\/strong>的是", "options": ["聚类问题是一种无监督算法，常用的聚类算法是 K-Means 算法。", "聚类算法可以让机器把数据集中的样本按照特征的性质分组，它把数据特征彼此邻近的值聚成一组（这里的“组”称为聚类的簇）。", "我们并不需要机器聚类的结果，人为地给各组贴标签，因为聚类在分组的同时能够把数值的组做“概念化”，也就是生成标签。", "在事先并不是很确定分成多少组比较合适的情况下，“手肘法”（elbow method）可以帮我们决定，在某一批数据点中，数据分为多少组比较合适。"], "answer": [2], "why": ["这句是对的", "这句是对的（第 06 讲）", "这句是错的，所以选它：第 06 讲说聚类<strong>不能<\/strong>自己给组起名字，要靠人「聚类后概念化」", "这句是对的（第 06 讲）"], "explain": "注意题目问「错误的」。聚类只分组，组的 0、1、2 只是编号，<strong>要人来贴标签<\/strong>。", "tags": ["basic", "core", "真题"], "m": "ml_quiz"}, {"id": "mlq-17", "type": "multi", "stem": "关于 R、F、M 值，哪些说法是正确的？", "options": ["F 是新进度，代表自用户上次消费以来的天数。这个指标其实也就是用户的热乎度。", "R 是消费频率，代表用户是否频繁使用服务。这也是用户黏性的风向标。", "M 是消费金额，代表用户在一段时间内消费的总金额。", "R、F、M 结合起来，能够展示出用户的基本情况，如价值、黏性等。"], "answer": [2, 3], "why": ["错：「新进度、热乎度」说的是 <strong>R<\/strong>", "错：「消费频率、黏性」说的是 <strong>F<\/strong>", "对（第 05 讲原话）", "对"], "explain": "<strong>R = 新进度（距上次消费的天数，热乎度）；F = 频率（黏性）；M = 金额。<\/strong> A、B 把 R 和 F 的定义对调了。", "tags": ["basic", "core", "真题"], "m": "ml_quiz"}, {"id": "mlq-18", "type": "multi", "stem": "关于模型的评估和优化，下列说法正确的有？", "options": ["一般来说，我们在训练集上训练模型，在验证集上做验证，最后在测试集上测试模型的效果", "归一化必须在拆分训练集和验证集之前进行，这样能够保证全部数据的信息都进入归一化的 fit 过程。", "对于小型的实验项目，也可以只把数据集拆分为训练集和测试集，忽略掉中间的验证环节。", "模型的评估和优化过程是一个不断反复的过程。"], "answer": [0, 2, 3], "why": ["对", "错：第 03、08 讲说特征缩放（归一化）<strong>必须在拆分数据之后<\/strong>做；只在训练集上 fit，否则是数据泄露", "对：第 03 讲说学习型项目常省略验证环节", "对：实战 5 步是循环迭代的"], "explain": "归一化在拆分<strong>之后<\/strong>：训练集 fit_transform，验证/测试集只 transform。", "tags": ["basic", "core", "真题"], "m": "ml_quiz"}, {"id": "mlq-19", "type": "multi", "stem": "数据清洗的主要任务包括？", "options": ["处理缺失的数据，可以用其他数据记录的平均值、随机值或者 0 值来补值。", "处理重复的数据，如果是完全相同的重复数据，可以用 DataFrame.drop_duplicates 删掉。", "处理错误的数据，比如商品的销售量、销售金额出现负值，这时候就需要删除或者转成有意义的正值。", "处理不可用的数据，比如把“是”“否”转换成“1”“0”值再输入机器学习模型。"], "answer": [0, 1, 2, 3], "why": ["对（第 03 讲原话）", "对（第 03、05 讲）", "对（第 03 讲原话）", "对（第 03 讲原话）"], "explain": "第 03 讲数据清洗 4 种情况：<strong>缺失、重复、错误、不可用<\/strong>。四个都对。", "tags": ["basic", "core", "真题"], "m": "ml_quiz"}, {"id": "mlq-20", "type": "single", "stem": "如何判断一个机器学习是回归问题还是分类问题？", "options": ["根据特征的类型", "根据特征数量的多少", "根据标签的类型", "根据标签数量的多少"], "answer": [2], "why": ["不是看特征", "不是看特征", "对：标签是连续数值 → 回归；标签是离散类别 → 分类", "不是看数量"], "explain": "第 01 讲：回归问题的标签是<strong>连续数值<\/strong>，分类问题的标签是<strong>离散数值<\/strong>。看<strong>标签的类型<\/strong>。", "tags": ["basic", "core", "真题"], "m": "ml_quiz"}]}, {"id": "lc_must", "title": "必背清单：一页过完 LangChain 考点", "short": "必背·LangChain", "group": "LangChain · 先看这一页", "exam": "全课考点浓缩", "quiz": true, "refs": [], "lessons": [{"title": "LangChain 必背清单", "cards": ["### 怎么用这一页\n\n平时<strong>主要看这一页<\/strong>，再刷「必刷」题；做错了再点进对应章节看详细讲解。标 📌 的是结课测试真题考过的。这门课用的是 <strong>2023 年的旧版 LangChain<\/strong>，以课程写法为准。\n\n### 1. 入门（开篇、第 01—02 讲）\n\n- LangChain <strong>不是大模型<\/strong>，是把模型、提示、数据、工具组织起来的<strong>框架<\/strong>（有 Python 和 JS 版）。\n- 📌 <strong>六大组件<\/strong>：<strong>模型（Model I/O）、数据检索、链、记忆、代理、回调<\/strong>。数据库不是组件。\n- 📌 <strong>Text 模型<\/strong>：一段字符串进出（类 `OpenAI`）；<strong>Chat 模型<\/strong>：<strong>带角色的消息列表<\/strong>进（类 `ChatOpenAI`）。角色：<strong>system → SystemMessage，user → HumanMessage，assistant → AIMessage<\/strong>。\n- `temperature` 控制随机性，越大越发散。\n- 📌 <strong>本地文档问答 5 步<\/strong>：<strong>Loading 加载 → Splitting 切分 → Storage 嵌入后存向量库 → Retrieval 检索 → 生成答案（Output / Synthesis）<\/strong>。加载器 PyPDFLoader、Docx2txtLoader、TextLoader；嵌入 OpenAIEmbeddings；向量库 Qdrant。\n\n### 2. 模型 I/O 与提示（第 03—05 讲）\n\n- 📌 <strong>Model I/O 三环节<\/strong>：<strong>提示（输入）→ 模型（调用）→ 输出解析（输出）<\/strong>。检索文档不属于它。\n- 三类模型：<strong>LLM（文本）、Chat Model（聊天）、Embedding Model（嵌入，输出向量不是答案）<\/strong>。\n- 提示模板：<strong>PromptTemplate<\/strong>（字符串）、<strong>ChatPromptTemplate<\/strong>（带角色消息）、📌 <strong>FewShotPromptTemplate<\/strong>（少样本）、<strong>PipelinePromptTemplate<\/strong>（组合多个模板）。\n- <strong>Zero-shot<\/strong> 不给示例，<strong>One-shot<\/strong> 给一个，<strong>Few-shot<\/strong> 给几个；示例只放在提示里，<strong>不改模型参数<\/strong>。<strong>ExampleSelector<\/strong> 挑示例（SemanticSimilarityExampleSelector 按语义相似挑）。\n- 📌 <strong>CoT（思维链）模板<\/strong> = <strong>AI 的角色和目标 + 思考链条说明 + 按链条推理的示例<\/strong>；Zero-shot CoT 就是加一句「一步步思考」。\n- 📌 <strong>ToT（思维树）<\/strong>：多条思路分支，<strong>评估、筛选、回溯、搜索<\/strong>——「多条路径」是 ToT 不是 CoT。\n\n### 3. 调用模型与输出解析（第 06—07 讲）\n\n- <strong>预训练<\/strong>学通用规律，<strong>微调<\/strong>在已有模型上继续训练（改参数），<strong>量化<\/strong>用低精度（8 位、4 位）减小体积。<strong>RAG 不改模型，微调改模型。<\/strong>\n- 📌 <strong>调用开源模型<\/strong>：<strong>HuggingFace Hub<\/strong>（远程）、<strong>HuggingFace Pipeline<\/strong>（本地建 pipeline 再包装）、<strong>继承 LLM 基类自定义模型<\/strong>（实现 `_call`）。\n- 📌 <strong>要 JSON / 结构化 → PydanticOutputParser 或 StructuredOutputParser<\/strong>；列表 → CommaSeparatedList；日期 → Datetime；枚举 → Enum；XML → XML。\n- 解析器两个基本方法：<strong>get_format_instructions<\/strong>（生成格式说明放进提示）、<strong>parse<\/strong>（把输出解析成结构）。<strong>OutputFixingParser 修格式错误；RetryWithErrorParser 带原始提示重试<\/strong>（缺内容时用）。\n\n### 4. 链与记忆（第 08—10 讲）\n\n- <strong>链<\/strong>把多个步骤组织成一个可调用单元；<strong>LLMChain<\/strong> = 提示模板 + 模型。\n- 📌 <strong>链的 5 种调用方式<\/strong>：<strong>直接调用、run、predict、apply、generate<\/strong>。\n- <strong>SequentialChain<\/strong> 顺序执行多个链（前一步的 output_key 要对上后一步的变量）；课程例子：植物学家 → 鲜花评论者 → 社交媒体运营。\n- 📌 <strong>路由链<\/strong>：<strong>目标链<\/strong>（每类问题一个）+ <strong>路由链<\/strong>（LLMRouterChain 选目的地，RouterOutputParser 解析）+ <strong>默认链<\/strong> → 组合成 <strong>MultiPromptChain<\/strong>。顺序链按固定次序；路由链按输入选路径。\n- 📌 <strong>四种记忆<\/strong>：<strong>ConversationBufferMemory 全留原文；BufferWindowMemory 只留最近 K 轮；SummaryMemory 只留摘要；SummaryBufferMemory 早的做摘要、近的留原文（混合）<\/strong>。ConversationChain 的提示里有 <strong>history<\/strong> 和 <strong>input<\/strong> 两个变量。\n- 记忆 = 对话历史；检索 = 外部资料。两者不同，可以一起用。\n\n### 5. 代理与工具（第 11—14 讲）\n\n- 📌 <strong>ReAct = 推理（Reasoning）+ 行动（Acting）<\/strong>，循环「思考 → 行动 → 观察」，直到给出最终答案；不是前端框架 React。课程例子用 <strong>serpapi（搜索）+ llm-math（计算）<\/strong> 查玫瑰均价再加价 15%。\n- 代理类型名：<strong>ZERO_SHOT_REACT_DESCRIPTION<\/strong>（零样本 + ReAct + 看工具描述选工具）、<strong>STRUCTURED_CHAT_ZERO_SHOT_REACT_DESCRIPTION<\/strong>（结构化工具）、<strong>SELF_ASK_WITH_SEARCH<\/strong>、CONVERSATIONAL（带记忆对话）。\n- 📌 <strong>分工<\/strong>：<strong>代理（Agent）调模型、决定下一步；AgentExecutor 跑循环、调工具、把观察结果交回代理<\/strong>。模型输出解析后是 <strong>AgentAction（要调工具）<\/strong> 或 <strong>AgentFinish（结束）<\/strong>。\n- 📌 <strong>结构化工具对话代理<\/strong>：ReAct 逻辑、工具可以有<strong>多个输入字段<\/strong>、能用<strong>多个工具<\/strong>（如 Playwright 浏览器工具箱）。\n- <strong>Self-Ask with Search<\/strong>：把问题拆成子问题逐个搜索；<strong>Plan and Execute<\/strong>：先规划再逐步执行。\n- <strong>Tool<\/strong> = 名称 + 描述 + 输入 + 执行函数；<strong>Toolkit<\/strong> = 一组相关工具（如 Gmail、Playwright、SQLDatabaseToolkit）。load_tools 加载工具。\n\n### 6. RAG、数据库、回调（第 15—17 讲）\n\n- 📌 <strong>RAG 三步：检索 → 上下文编码 → 生成<\/strong>。没有「检查」这一步。\n- 切分三个关键：<strong>分割依据、块大小 chunk_size、块重叠 chunk_overlap<\/strong>。<strong>embed_documents<\/strong> 嵌入多个文档、<strong>embed_query<\/strong> 嵌入一条查询；<strong>CacheBackedEmbeddings<\/strong> 缓存嵌入省钱。\n- 📌 <strong>SQLDatabaseChain<\/strong>：连接数据库（SQLDatabase）→ 和 LLM 一起建链 → run(问题)，<strong>SQL 由模型生成<\/strong>。<strong>SQL Agent<\/strong>（create_sql_agent + SQLDatabaseToolkit）工具：<strong>列出表、查表结构、检查查询、执行查询<\/strong>。\n- 📌 <strong>回调覆盖 LLM、Tool、Chain 的开始和结束<\/strong>（on_llm_start / on_llm_end、on_tool_start…、on_llm_new_token 用于流式输出）。配置位置：<strong>构造时<\/strong>（对这个组件所有调用生效）、<strong>请求时<\/strong>（只对这一次生效）。<strong>get_openai_callback<\/strong> 统计 token 用量。<strong>回调不等于异步。<\/strong>\n\n### 7. 多代理与实战（第 18—23 讲、加餐）\n\n- 📌 <strong>模拟代理 = CAMEL<\/strong>（角色扮演：AI 用户提指令、AI 助手给方案、任务指定代理把想法变具体；初始提示叫 inception prompting）。\n- 📌 <strong>自治代理 = AutoGPT、BabyAGI、HuggingGPT<\/strong>：AutoGPT 自动串联多个任务；<strong>BabyAGI = 执行代理 + 任务创建代理 + 优先级代理<\/strong>；<strong>HuggingGPT 四阶段：任务规划 → 模型选择（从 Hugging Face 挑专家模型）→ 任务执行 → 生成回答<\/strong>（整合多模态的是它，不是 BabyAGI）。\n- 客服机器人 = 聊天模型 + <strong>记忆<\/strong> + <strong>检索<\/strong>；界面用 <strong>Streamlit<\/strong> 或 <strong>Gradio<\/strong>（Flask 更通用）。\n- 加餐：<strong>LCEL<\/strong> 用管道符 `|` 把提示、模型、解析器串起来（Runnable 的 invoke / batch / stream）；<strong>LangSmith<\/strong> 做追踪、调试、评估；<strong>LangGraph<\/strong> 用状态、节点、边组织工作流。"]}], "questions": []}, {"id": "lc_base", "title": "入门：LangChain 是什么、安装调用、第一个知识库问答", "short": "入门与知识库问答", "group": "LangChain · 入门", "exam": "开篇词、第 01—02 讲", "refs": [], "lessons": [{"title": "LangChain 是什么与核心组件（开篇词）", "cards": ["### 一句话：LangChain 是什么\n\n<strong>LangChain<\/strong> 是一个<strong>开发大模型应用的框架<\/strong>（2022 年 10 月由 Harrison Chase 推出，有 Python 和 JavaScript 两个版本）。它<strong>本身不是大模型<\/strong>，而是用统一的接口和组件，把<strong>模型、提示、外部数据、工具<\/strong>组织起来。\n\n课程用一家虚构的鲜花电商「<strong>易速鲜花<\/strong>」串起所有例子：写文案 → 读内部手册 → 查数据库 → 调工具 → 做聊天客服。\n\n开篇词的示例：给一张鲜花图片写推广文案——先让<strong>图像描述工具<\/strong>（HuggingFace 上的看图说话模型）把图片变成文字，再让语言模型写文案，由 LangChain 的<strong>代理<\/strong>负责组织调用。\n\n> 💡 记法：模型只会「说」，LangChain 让它能「接资料、用工具、记得住、按步骤做」。", "### LangChain 的六大核心组件（必背清单）\n\n| 组件 | 英文 | 一句话 |\n|---|---|---|\n| <strong>模型<\/strong> | Models（Model I/O） | 调用各种语言模型，含输入提示、调用、输出解析 |\n| <strong>提示模板<\/strong> | Prompts | 把提示写成可复用的模板 |\n| <strong>数据检索<\/strong> | Indexes / Retrieval | 加载、切分、嵌入、检索外部文档 |\n| <strong>记忆<\/strong> | Memory | 让模型记住之前的对话 |\n| <strong>链<\/strong> | Chains | 把多个组件按步骤串起来 |\n| <strong>代理<\/strong> | Agents | 让模型自己决定调用哪个工具、下一步做什么 |\n\n课程四个部分：<strong>启程篇<\/strong>（第 01—02 讲，安装、快速入门）→ <strong>基础篇<\/strong>（逐个讲六大组件）→ <strong>应用篇<\/strong>（CAMEL、BabyAGI 等）→ <strong>实战篇<\/strong>（部署、人脉工具、聊天客服）。\n\n> 📌 必背陷阱：真题「核心组件包括」——<strong>模型、链、记忆、代理<\/strong>都是；<strong>数据库不是<\/strong>组件（数据库是第 16 讲连接的外部数据源）。"]}, {"title": "安装、Text 模型与 Chat 模型（第 01 讲）", "cards": ["### 安装与调用 OpenAI\n\n- 安装：`pip install langchain`，再按需装 `openai`、各种文档解析器、向量库等依赖；也可用 `pip install langchain[llms]` 一次装常用的模型依赖。\n- 调用前要准备 <strong>OpenAI API Key<\/strong>（放进环境变量 `OPENAI_API_KEY`），不要写死在代码里。\n\n常用参数对号入座：\n\n| 参数 | 干什么 |\n|---|---|\n| <strong>model<\/strong> | 用哪个模型 |\n| <strong>prompt / messages<\/strong> | 输入内容（Text 用 prompt，Chat 用 messages） |\n| <strong>temperature<\/strong> | <strong>随机性<\/strong>：越高越有创意，越低越稳定 |\n| <strong>max_tokens<\/strong> | 生成内容的<strong>最大长度<\/strong>（token 数） |\n| n | 生成几个候选 |", "### Text 模型 vs Chat 模型（必考）\n\n| | <strong>Text 模型<\/strong> | <strong>Chat 模型<\/strong> |\n|---|---|---|\n| 课程例子 | text-davinci-003 | <strong>gpt-3.5-turbo<\/strong>、gpt-4 |\n| 输入 | <strong>一段字符串<\/strong>（prompt） | <strong>消息列表<\/strong>（messages），每条消息有<strong>角色<\/strong> |\n| 返回取值 | `choices[0].text` | `choices[0].message.content` |\n| LangChain 类 | `OpenAI`（langchain.llms） | `ChatOpenAI`（langchain.chat_models） |\n\nChat 消息的三种<strong>角色<\/strong>：\n\n| 角色 | 作用 | LangChain 里的类 |\n|---|---|---|\n| <strong>system<\/strong> | 设定 AI 的身份和行为（「你是一个花店顾问」） | SystemMessage |\n| <strong>user<\/strong> | 用户说的话 | HumanMessage |\n| <strong>assistant<\/strong> | AI 之前的回复（用来带上对话历史） | AIMessage |\n\n> 📌 必背陷阱：真题问「两者的区别主要在于」——<strong>Chat 模型的消息里可以有角色<\/strong>。「Chat 较新」不是本质区别；「Text 模型一次能传多条消息」说反了，传消息列表的是 Chat。\n> 模型不会自动记得上一轮，要把历史消息一起传进去。"]}, {"title": "本地文档问答的 5 步（第 02 讲）", "cards": ["### 一句话：知识库问答（RAG）\n\n易速鲜花的员工手册分散在 <strong>PDF、Word、TXT<\/strong> 里，通用大模型不知道这些内部资料。做法是：<strong>先从资料里检索相关内容，再连同问题交给模型回答<\/strong>——这就是 <strong>RAG（检索增强生成）<\/strong>。\n\n整体框架分三部分：<strong>数据源<\/strong>（PDF、Word 等）→ <strong>大模型应用<\/strong>（LangChain 处理）→ <strong>用例<\/strong>（问答系统）。\n\n### 5 个步骤（真题原句，按顺序背英文名）\n\n| 步 | 英文 | 原话 |\n|---|---|---|\n| 1 | <strong>Loading<\/strong> | <strong>文档加载器<\/strong>把 Documents 加载为 LangChain 能够读取的形式 |\n| 2 | <strong>Splitting<\/strong> | <strong>文本分割器<\/strong>把 Documents 切分为指定大小的分割，称为「<strong>文档块<\/strong>」或「<strong>文档片<\/strong>」 |\n| 3 | <strong>Storage<\/strong> | 把文档块以「<strong>嵌入<\/strong>」（Embedding）的形式存到<strong>向量数据库<\/strong>，形成「<strong>嵌入片<\/strong>」 |\n| 4 | <strong>Retrieval<\/strong> | 从存储中<strong>检索<\/strong>分割后的文档（比如比较<strong>余弦相似度<\/strong>，找到和问题相似的嵌入片） |\n| 5 | <strong>Output<\/strong> | 把<strong>问题和相似的嵌入片<\/strong>传给语言模型，<strong>生成答案<\/strong> |\n\n> 📌 口诀：<strong>加载 → 切分 → 存储（嵌入）→ 检索 → 输出<\/strong>。看到「把问题和相似嵌入片交给模型生成答案」，就是第 5 步。", "### 每一步用到的东西：对号入座\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 读 PDF / Word / TXT | <strong>PyPDFLoader / Docx2txtLoader / TextLoader<\/strong>（文档加载器） |\n| 切成块，课程设置<strong>块大小 200、重叠 10<\/strong> | <strong>RecursiveCharacterTextSplitter<\/strong>（chunk_size、chunk_overlap） |\n| 把文本变成向量 | <strong>OpenAIEmbeddings<\/strong>（嵌入模型） |\n| 存向量的数据库，课程用<strong>内存模式<\/strong> `:memory:` | <strong>Qdrant<\/strong>（向量数据库） |\n| 让模型把一个问题改写成多个查询再检索 | <strong>MultiQueryRetriever<\/strong> |\n| 把检索结果和问题交给模型回答 | <strong>RetrievalQA<\/strong> 链 |\n| 网页界面 | <strong>Flask<\/strong> |\n\n- <strong>嵌入<\/strong> = 把文字变成一串数字（向量），意思相近的文字向量也相近。\n- <strong>余弦相似度<\/strong>看向量的<strong>方向<\/strong>，<strong>欧氏距离<\/strong>看向量间的<strong>绝对距离<\/strong>；文本语义检索通常用<strong>余弦相似度<\/strong>。\n\n> 📌 两条线别混：<strong>建库<\/strong> = 加载→切分→嵌入→存储；<strong>问答<\/strong> = 提问→检索→带资料生成。"]}], "questions": [{"id": "lcb-p1", "type": "single", "stem": "下列哪一项<strong>不是<\/strong> LangChain 的核心组件？", "options": ["模型", "记忆", "代理", "数据库"], "answer": [3], "why": ["是组件", "是组件", "是组件", "数据库是外部数据源，不是组件"], "explain": "六大组件：模型、提示、检索、记忆、链、代理。", "tags": [], "lesson": 0, "m": "lc_base"}, {"id": "lcb-p2", "type": "single", "stem": "Chat 模型和 Text 模型的主要区别是？", "options": ["Chat 模型的消息中可以有角色（system、user、assistant）", "Chat 模型更新", "Text 模型一次可以传多条消息", "Text 模型不能设置 temperature"], "answer": [0], "why": ["对", "不是本质区别", "反了，传消息列表的是 Chat", "Text 模型也能设"], "explain": "Chat = 带角色的消息列表。", "tags": [], "lesson": 1, "m": "lc_base"}, {"id": "lcb-p3", "type": "single", "stem": "本地文档问答中，把文档切成「文档块」的步骤叫？", "options": ["Loading", "Splitting", "Storage", "Retrieval"], "answer": [1], "why": ["加载", "对，文本分割器切分", "存成嵌入", "检索"], "explain": "Loading → Splitting → Storage → Retrieval → Output。", "tags": [], "lesson": 2, "m": "lc_base"}, {"id": "lcb-1", "type": "multi", "stem": "LangChain 的核心组件包括", "options": ["模型（Model I/O）", "链（Chains）", "记忆（Memory）", "代理（Agents）", "数据库"], "answer": [0, 1, 2, 3], "why": ["是", "是", "是", "是", "不是组件，是外部数据源"], "explain": "模型、提示、检索、记忆、链、代理；没有数据库。", "tags": ["basic"], "m": "lc_base"}, {"id": "lcb-2", "type": "multi", "stem": "关于 LangChain，下列说法正确的是", "options": ["LangChain 是开发大模型应用的框架", "LangChain 本身就是一个大语言模型", "LangChain 能把模型、外部数据和工具组织在一起", "课程用虚构的「易速鲜花」电商串起各讲例子"], "answer": [0, 2, 3], "why": ["对", "错，它是框架，不是模型", "对", "对"], "explain": "LangChain 是框架不是模型。", "tags": ["basic", "core"], "m": "lc_base"}, {"id": "lcb-3", "type": "multi", "stem": "关于 Chat 模型的消息角色，下列对应正确的是", "options": ["system：设定 AI 的身份和行为", "user：用户输入的内容", "assistant：AI 之前的回复，可用来带上对话历史", "assistant：用来存放 API Key"], "answer": [0, 1, 2], "why": ["对", "对", "对", "错，API Key 放环境变量"], "explain": "system 定身份，user 用户，assistant AI 回复。", "tags": ["basic", "core"], "m": "lc_base"}, {"id": "lcb-4", "type": "single", "stem": "调用 OpenAI 模型时，控制生成内容<strong>随机性<\/strong>的参数是？", "options": ["temperature", "max_tokens", "model", "n"], "answer": [0], "why": ["对，越高越有创意", "控制最大长度", "选模型", "生成几个候选"], "explain": "temperature 管随机，max_tokens 管长度。", "tags": ["basic"], "m": "lc_base"}, {"id": "lcb-5", "type": "single", "stem": "判断：在 LangChain 中，`ChatOpenAI` 用于调用 Chat 模型，`OpenAI` 用于调用 Text 模型", "options": ["正确", "错误"], "answer": [0], "why": ["对", "这就是课程里的两个类"], "explain": "ChatOpenAI = Chat，OpenAI = Text。", "tags": ["basic", "core"], "m": "lc_base"}, {"id": "lcb-6", "type": "multi", "stem": "一个本地文档问答系统的构造包含下面哪些步骤", "options": ["Loading：文档加载器把 Documents 加载为 LangChain 能读取的形式", "Splitting：文本分割器把 Documents 切分为指定大小的「文档块」", "Storage：把文档块以「嵌入」的形式存到向量数据库，形成「嵌入片」", "Retrieval：从存储中检索分割后的文档", "Training：用内部手册重新训练大模型"], "answer": [0, 1, 2, 3], "why": ["对", "对", "对", "对", "错，RAG 不需要重新训练模型"], "explain": "五步：加载、切分、存储、检索、输出；不训练模型。", "tags": ["basic"], "m": "lc_base"}, {"id": "lcb-7", "type": "multi", "stem": "第 02 讲知识库问答中，下列组件与用途对应正确的是", "options": ["PyPDFLoader、Docx2txtLoader、TextLoader：加载不同格式的文档", "RecursiveCharacterTextSplitter：切分文档", "Qdrant：向量数据库，存储嵌入", "MultiQueryRetriever：把文档翻译成多种语言", "RetrievalQA：把检索结果和问题交给模型生成答案"], "answer": [0, 1, 2, 4], "why": ["对", "对", "对", "错，它是让模型生成多个查询来检索", "对"], "explain": "加载器 → 分割器 → 嵌入+Qdrant → MultiQueryRetriever → RetrievalQA。", "tags": ["basic", "core"], "m": "lc_base"}, {"id": "lcb-8", "type": "single", "stem": "判断：检索相似文档块时，余弦相似度衡量的是向量的方向，常用于文本语义检索", "options": ["正确", "错误"], "answer": [0], "why": ["对", "余弦看方向，欧氏距离看绝对距离"], "explain": "余弦看方向，欧氏看距离。", "tags": ["basic"], "m": "lc_base"}]}, {"id": "lc_prompt", "title": "模型 I/O 与提示工程", "short": "模型I/O·提示", "group": "LangChain · 模型 I/O", "exam": "第 03—05 讲", "refs": [], "lessons": [{"title": "Model I/O 三环节与三类模型（第 03 讲）", "cards": ["### Model I/O 的三个环节（必背）\n\n<strong>Model I/O<\/strong> = 和模型打交道的一整套流程。真题问「包含哪些组件」，答这三个：\n\n| 环节 | 英文 | 真题原句 |\n|---|---|---|\n| <strong>提示<\/strong>（输入提示） | <strong>Format<\/strong> | 通过<strong>提示模板和提示工程<\/strong>，把提示信息传入模型 |\n| <strong>模型<\/strong>（调用模型） | <strong>Predict<\/strong> | Model I/O 的<strong>核心是对模型的调用<\/strong> |\n| <strong>输出解析<\/strong> | <strong>Parse<\/strong> | 把模型返回的响应内容<strong>解析为正确的格式<\/strong> |\n\n> 📌 必背陷阱：「<strong>生成<\/strong>，通过检索本地文档生成回答」——<strong>错<\/strong>，那是第 02 讲的<strong>检索（RAG）<\/strong>，不属于 Model I/O。\n\n课程例子：模板「您是一位专业的鲜花店文案撰写员。对于售价为 {price} 元的 {flower_name}，您能提供一个吸引人的简短描述吗？」，用 `PromptTemplate.from_template` 创建，它会<strong>自动识别 {} 里的变量<\/strong>；循环填入玫瑰、百合、康乃馨。", "### LangChain 支持的三类模型\n\n| 模型 | 输入 → 输出 | 看到题目说…… |\n|---|---|---|\n| <strong>大语言模型（LLM）<\/strong> | 文本 → 文本 | Text 模型 |\n| <strong>聊天模型（Chat Model）<\/strong> | 带角色的消息 → 消息 | 对话 |\n| <strong>文本嵌入模型（Embedding Model）<\/strong> | 文本 → <strong>向量（浮点数列表）<\/strong> | 相似度检索，不输出自然语言 |\n\n### 为什么用 LangChain 而不直接调 API（课程列举）\n\n- <strong>模板管理<\/strong>：提示多了统一管理；\n- <strong>变量提取和检查<\/strong>：自动找出模板里的变量；\n- <strong>模型切换<\/strong>：换模型（如从 OpenAI 换成 HuggingFace 的 flan-t5）只改一行；\n- <strong>输出解析<\/strong>：把文字变成结构化数据。\n\n本讲的输出解析示例：用 <strong>StructuredOutputParser<\/strong> + <strong>ResponseSchema<\/strong> 定义 `description`（文案）和 `reason`（理由）两个字段，`get_format_instructions()` 生成格式说明放进提示，`parse()` 解析返回值，最后放进 pandas <strong>DataFrame<\/strong>、保存为 <strong>CSV<\/strong>。"]}, {"title": "提示模板与少样本提示（第 04 讲）", "cards": ["### 一条好提示的结构 & 提示的原则\n\n课程把提示拆成四部分：<strong>指令<\/strong>（Instruction，告诉模型做什么）、<strong>上下文<\/strong>（Context，额外知识，如检索到的资料）、<strong>提示输入<\/strong>（Prompt Input，具体问题）、<strong>输出指示器<\/strong>（Output Indicator，标记要开始生成了）。\n\nOpenAI 官方给的<strong>提示原则<\/strong>（课程引用）：写清晰的指示；给模型提供参考（示例）；把复杂任务拆成子任务；给模型时间思考；使用外部工具；反复迭代问题。\n\n### 提示模板的种类（必背清单）\n\n| 模板 | 用途 |\n|---|---|\n| <strong>PromptTemplate<\/strong> | <strong>基础<\/strong>字符串模板 |\n| <strong>ChatPromptTemplate<\/strong> | 聊天模板，组合各种<strong>角色<\/strong>的消息模板 |\n| <strong>FewShotPromptTemplate<\/strong> | <strong>少样本<\/strong>提示模板（放示例） |\n| <strong>PipelinePromptTemplate<\/strong> | 把<strong>几个提示组合<\/strong>在一起用 |\n| 自定义模板 | 基于其他模板类定制自己的模板 |\n\nChatPromptTemplate 的零件：<strong>SystemMessagePromptTemplate、HumanMessagePromptTemplate、AIMessagePromptTemplate、ChatMessagePromptTemplate<\/strong>。\n\n> 📌 真题：「希望实现少样本提示，选哪种模板」→ <strong>FewShotPromptTemplate<\/strong>。", "### Zero-shot / One-shot / Few-shot\n\n| 叫法 | 意思 |\n|---|---|\n| <strong>Zero-shot<\/strong>（零样本） | 只给任务说明，<strong>不给示例<\/strong> |\n| <strong>One-shot<\/strong>（单样本） | 给 <strong>1 个<\/strong>示例 |\n| <strong>Few-shot<\/strong>（少样本） | 给<strong>少量<\/strong>示例 |\n\n示例只是放进提示里给模型参考，<strong>不是训练、不改模型参数<\/strong>。\n\n### FewShotPromptTemplate 的用法（课程四步）\n\n1. <strong>创建示例样本<\/strong>：列表，每条是字典（flower_type、occasion、ad_copy）；\n2. <strong>创建示例的提示模板<\/strong>（PromptTemplate）；\n3. <strong>创建 FewShotPromptTemplate<\/strong>：传入 examples、example_prompt、<strong>suffix<\/strong>（最后的新问题）、input_variables；\n4. <strong>调用模型<\/strong>生成文案。\n\n### ExampleSelector（示例选择器）\n\n示例太多会浪费 token，用<strong>示例选择器<\/strong>只挑一部分放进提示。课程用 <strong>SemanticSimilarityExampleSelector<\/strong>：用<strong>嵌入<\/strong>（OpenAIEmbeddings）+ 向量库（Qdrant）挑出与当前输入<strong>语义最相似<\/strong>的 k 个示例；这时 FewShotPromptTemplate 传 <strong>example_selector<\/strong> 而不是 examples。"]}, {"title": "思维链 CoT 与思维树 ToT（第 05 讲）", "cards": ["### 思维链（Chain of Thought，CoT）\n\n<strong>CoT<\/strong> = 让模型<strong>一步一步写出中间推理过程<\/strong>，再给结论（Google 的 Jason Wei 等人 2022 年提出）。\n\n| 类型 | 做法 |\n|---|---|\n| <strong>Few-Shot CoT<\/strong> | 在示例里不只给答案，还给出<strong>推理过程<\/strong> |\n| <strong>Zero-Shot CoT<\/strong> | 不给示例，只加一句「<strong>让我们一步步地思考<\/strong>」（Let's think step by step） |\n\n### 课程 CoT 提示模板的三部分（真题必考）\n\n1. <strong>AI 的角色和目标描述<\/strong>（「你是一个为花店电商公司工作的 AI 助手，目标是帮助客户做出明智的决定」）；\n2. <strong>思考链条的说明<\/strong>（先理解客户需求 → 考虑各种鲜花的含义 → 给出推荐并解释原因）；\n3. <strong>遵循思考链条的示例<\/strong>（如：客户想要象征爱情的花 → 红玫瑰）。\n\n> 📌 必背陷阱：「<strong>多条思维路径的集束搜索<\/strong>」不是 CoT 模板的内容，那是<strong>思维树 ToT<\/strong> 的特点。", "### 思维树（Tree of Thoughts，ToT）\n\n<strong>ToT<\/strong> = CoT 的升级：不是只走一条推理路线，而是<strong>同时生成多个候选思路（分支）<\/strong>，对每个中间步骤<strong>评估<\/strong>（如：确定 / 可能 / 不可能），筛掉差的、保留好的，必要时<strong>回溯<\/strong>，用<strong>搜索算法<\/strong>（广度优先、深度优先）往下走。\n\n课程例子：客户想给妻子买花，她喜欢<strong>淡雅的颜色和花香<\/strong>。先列出候选（百合、淡色玫瑰、紫罗兰……），逐个按颜色、香味评估，最后推荐。\n\n| 对比 | CoT 思维链 | ToT 思维树 |\n|---|---|---|\n| 推理路线 | <strong>一条<\/strong>链 | <strong>多条<\/strong>分支 |\n| 关键词 | 一步步思考、示例里带推理过程 | 多个候选、评估、搜索、回溯 |\n| 代价 | 较低 | 更多模型调用 |\n\n> 💡 CoT 和 ToT 都只能<strong>改善<\/strong>推理，不保证答对。"]}], "questions": [{"id": "lcp-p1", "type": "single", "stem": "下列哪一项<strong>不属于<\/strong> Model I/O 的组件？", "options": ["提示", "模型", "输出解析", "通过检索本地文档生成回答"], "answer": [3], "why": ["属于", "属于，是核心", "属于", "那是 RAG 检索，不属于 Model I/O"], "explain": "Model I/O = 提示 + 模型 + 输出解析。", "tags": [], "lesson": 0, "m": "lc_prompt"}, {"id": "lcp-p2", "type": "single", "stem": "希望实现少样本提示，应该选择哪种提示模板？", "options": ["PromptTemplate", "ChatPromptTemplate", "FewShotPromptTemplate", "PipelinePromptTemplate"], "answer": [2], "why": ["基础模板", "聊天角色模板", "对，少样本模板", "组合多个提示"], "explain": "Few-shot → FewShotPromptTemplate。", "tags": [], "lesson": 1, "m": "lc_prompt"}, {"id": "lcp-p3", "type": "single", "stem": "Zero-Shot CoT 的典型做法是？", "options": ["在提示里加一句「让我们一步步地思考」", "给出多个带推理过程的示例", "同时搜索多条思维路径", "微调模型"], "answer": [0], "why": ["对", "那是 Few-Shot CoT", "那是 ToT", "与 CoT 无关"], "explain": "Zero-Shot CoT = 一句「一步步思考」。", "tags": [], "lesson": 2, "m": "lc_prompt"}, {"id": "lcp-1", "type": "multi", "stem": "在 LangChain 的 Model I/O 模块中，包含哪些组件", "options": ["模型：Model I/O 的核心是对模型的调用", "提示：通过提示模板和提示工程，把提示信息传入模型", "生成：通过检索本地文档生成回答", "输出解析：把模型返回的响应内容解析为正确的格式"], "answer": [0, 1, 3], "why": ["对", "对", "错，那是检索（RAG）", "对"], "explain": "提示（Format）→ 模型（Predict）→ 解析（Parse）。", "tags": ["basic"], "m": "lc_prompt"}, {"id": "lcp-2", "type": "multi", "stem": "LangChain 支持的三类模型是", "options": ["大语言模型（LLM）", "聊天模型（Chat Model）", "文本嵌入模型（Embedding Model）", "数据库模型（Database Model）"], "answer": [0, 1, 2], "why": ["是", "是", "是，输出向量", "没有这一类"], "explain": "LLM、Chat、Embedding 三类。", "tags": ["basic", "core"], "m": "lc_prompt"}, {"id": "lcp-3", "type": "single", "stem": "判断：文本嵌入模型的输出是给用户看的自然语言答案", "options": ["正确", "错误"], "answer": [1], "why": ["说反了", "嵌入模型输出的是向量（一串浮点数），用于相似度检索"], "explain": "Embedding → 向量。", "tags": ["basic"], "m": "lc_prompt"}, {"id": "lcp-4", "type": "multi", "stem": "下列提示模板与用途对应正确的是", "options": ["PromptTemplate：基础字符串模板", "ChatPromptTemplate：组合各种角色的消息模板", "FewShotPromptTemplate：少样本提示模板", "PipelinePromptTemplate：把几个提示组合在一起使用", "PipelinePromptTemplate：专门用来解析模型输出"], "answer": [0, 1, 2, 3], "why": ["对", "对", "对", "对", "错，解析输出靠输出解析器"], "explain": "基础 / 聊天 / 少样本 / 组合。", "tags": ["basic", "core"], "m": "lc_prompt"}, {"id": "lcp-5", "type": "multi", "stem": "关于 Zero-shot、One-shot、Few-shot，下列说法正确的是", "options": ["Zero-shot 只给任务说明，不给示例", "One-shot 给一个示例", "Few-shot 给少量示例", "Few-shot 会改变模型的参数，相当于微调"], "answer": [0, 1, 2], "why": ["对", "对", "对", "错，示例只是放在提示里，不训练模型"], "explain": "示例放提示里，不改参数。", "tags": ["basic", "core"], "m": "lc_prompt"}, {"id": "lcp-6", "type": "single", "stem": "课程中用来挑选与当前输入语义最相似示例的是？", "options": ["SemanticSimilarityExampleSelector", "OutputFixingParser", "RecursiveCharacterTextSplitter", "LLMRouterChain"], "answer": [0], "why": ["对，用嵌入挑相似示例", "输出修复解析器", "文本分割器", "路由链"], "explain": "ExampleSelector 只挑部分示例，省 token。", "tags": ["basic", "core"], "m": "lc_prompt"}, {"id": "lcp-7", "type": "multi", "stem": "CoT 提示模板中的具体内容应包括", "options": ["AI 的角色和目标描述", "思考链条的说明", "遵循思考链条的一些示例", "多条思维路径的集束搜索"], "answer": [0, 1, 2], "why": ["对", "对", "对", "错，多路径搜索是 ToT"], "explain": "角色目标 + 思考链说明 + 示例。", "tags": ["basic"], "m": "lc_prompt"}, {"id": "lcp-8", "type": "multi", "stem": "关于思维树（ToT），下列说法正确的是", "options": ["ToT 同时生成多个候选思路，形成分支", "ToT 对中间步骤进行评估，筛掉不好的分支，必要时回溯", "ToT 会用广度优先、深度优先等搜索算法", "ToT 只沿一条推理路线走到底"], "answer": [0, 1, 2], "why": ["对", "对", "对", "错，那是普通 CoT"], "explain": "CoT 一条链，ToT 多分支 + 评估 + 搜索。", "tags": ["basic", "core"], "m": "lc_prompt"}]}, {"id": "lc_model", "title": "调用模型与输出解析", "short": "调模型·输出解析", "group": "LangChain · 模型 I/O", "exam": "第 06—07 讲", "refs": [], "lessons": [{"title": "预训练、微调与调用开源模型（第 06 讲）", "cards": ["### 预训练、微调、量化：一句话分清\n\n
