？", "options": ["损失是对糟糕预测的惩罚，也是对模型好坏的度量", "损失也就是模型的误差，也称为成本或代价", "预测完全准确时，损失为 0", "判断模型好坏只需看单个样本的损失"], "answer": [0, 1, 2], "why": ["对", "对", "对", "错，要看所有样本的平均损失"], "explain": "损失 = 误差 = 成本 = 代价，越小越好。", "tags": ["basic"], "m": "ml_basic"}, {"id": "mlb-32", "type": "multi", "stem": "sklearn 中模型方法和作用的对应，正确的是？", "options": ["fit：训练模型", "predict：用模型进行预测", "score：评估模型（LinearRegression 用 R² 分数）", "predict 只能用于测试集，不能用于训练集"], "answer": [0, 1, 2], "why": ["对", "对", "对", "错，predict 也可以应用于训练集本身"], "explain": "fit 训练，predict 预测，score 评分。", "tags": ["basic", "core"], "m": "ml_basic"}, {"id": "mlb-33", "type": "multi", "stem": "常用于评估<strong>回归<\/strong>模型的指标有？", "options": ["R² 分数", "MSE（均方误差）", "漏斗图", "箱线图"], "answer": [0, 1], "why": ["对", "对", "它是展示用户流失的图", "它是看分布和离群点的图"], "explain": "回归评估：R² 和 MSE。", "tags": ["basic"], "m": "ml_basic"}, {"id": "mlb-34", "type": "single", "stem": "关于 R² 分数，正确的是？", "options": ["一般在 0 到 1 之间，越大说明回归模型越优", "越小说明回归模型越优", "是线性回归模型唯一的评估标准", "只要低于 0.9 模型就不能用"], "answer": [0], "why": ["对", "反了", "错，原文说不是唯一标准", "原文没有这种标准，0.708 也要和其他模型比较才知道"], "explain": "R² 越大越好，但不是唯一标准。", "tags": ["basic", "core"], "m": "ml_basic"}, {"id": "mlb-35", "type": "single", "stem": "sklearn 中 LinearRegression 的外部参数 fit_intercept 和 normalize 的默认值分别是？", "options": ["True、False", "False、True", "True、True", "False、False"], "answer": [0], "why": ["对：默认计算截距、默认不规范化", "反了", "normalize 默认 False", "fit_intercept 默认 True"], "explain": "默认算截距，不规范化。", "tags": ["basic"], "m": "ml_basic"}, {"id": "mlb-36", "type": "multi", "stem": "模型评估结果不理想时，课程建议的做法有？", "options": ["回到第 3 步，调整模型的外部参数，重新训练", "考虑选择其他算法，创建全新的模型", "回到第 2 步，看看是不是数据出了问题", "直接上线，在生产中慢慢调"], "answer": [0, 1, 2], "why": ["对，第一步先调超参数", "对", "对", "错，不好就要回头迭代"], "explain": "调参 → 换算法 → 查数据，循环迭代。", "tags": ["basic"], "m": "ml_basic"}, {"id": "mlb-37", "type": "single", "stem": "用梯度下降逐步减小训练集上的损失，调整的是？", "options": ["模型的内部参数", "模型的超参数", "训练集的大小", "标签的类型"], "answer": [0], "why": ["对，原话：训练时调整内部参数", "超参数是在验证集/测试集评估时优化的", "无关", "无关"], "explain": "梯度下降调内部参数，评估阶段调超参数。", "tags": ["basic"], "m": "ml_basic"}, {"id": "mlb-38", "type": "single", "stem": "4 个特征的线性回归 y = w1x1 + w2x2 + w3x3 + w4x4 + b，有几个内部参数？", "options": ["4 个", "5 个", "8 个", "1 个"], "answer": [1], "why": ["漏了偏置 b", "4 个权重 + 1 个偏置", "不对", "不对"], "explain": "特征数 + 1（偏置）。", "tags": ["basic"], "m": "ml_basic"}, {"id": "mlb-39", "type": "multi", "stem": "下列说法正确的是？", "options": ["实战 5 步中没有模型上线和部署，因为通常机器学习工程师不负责这一块", "实战 5 步中没有单独的「预测」环节，因为它包含在第 5 步里", "机器学习项目是一个循环迭代的过程，优秀的模型都是一次次迭代的产物", "scikit-learn 是使用最广泛的开源 Python 机器学习库"], "answer": [0, 1, 2, 3], "why": ["对", "对，而且是第 5 步首先要做的", "对，原话", "对"], "explain": "5 步不含部署；预测藏在第 5 步；循环迭代。", "tags": ["basic"], "m": "ml_basic"}, {"id": "mlb-40", "type": "single", "stem": "判断：线性回归中，斜率 a 叫做偏置（bias），截距 b 叫做权重（weight）", "options": ["正确", "错误"], "answer": [1], "why": ["反了", "错，斜率叫权重 w，截距叫偏置 b"], "explain": "斜率 = 权重 w，截距 = 偏置 b。", "tags": ["basic"], "m": "ml_basic"}]}, {"id": "ml_user", "title": "获客与变现：RFM、K-Means 聚类、LTV 回归", "short": "RFM·聚类·回归", "group": "机器学习 · 获客关 / 变现关", "exam": "第 05—07 讲", "refs": [], "lessons": [{"title": "RFM 与数据探索（第 05 讲）", "cards": ["### 课程的五个关卡（第 05、07 讲）\n\n「业务场景闯关篇」围绕电商（「易速鲜花」）的运营环节，一共 <strong>5 关<\/strong>：\n\n| 关卡 | 学什么 | 本模块 |\n|---|---|---|\n| <strong>获客关<\/strong> | <strong>数据探索、聚类分析<\/strong> | 第 05、06 讲 |\n| <strong>变现关<\/strong> | <strong>回归分析<\/strong>、特征工程、防止过拟合、交叉验证 | 第 07 讲起 |\n| 激活关 | CNN、RNN、准确率调优 | — |\n| 留存关 | 生存分析、二元分类、性能评估 | — |\n| 裂变关 | 集成学习、XGBoost | — |\n\n> 📌 顺序口诀：<strong>获客 → 变现 → 激活 → 留存 → 裂变<\/strong>。获客关是<strong>无监督<\/strong>（聚类），变现关是<strong>监督学习解决回归问题<\/strong>。", "### 一句话：RFM 是什么\n\n<strong>RFM（Recency、Frequency、Monetary）<\/strong>是<strong>用户画像的衍生品<\/strong>，也是目前很多互联网厂商<strong>普遍采用的分析方式<\/strong>。它把用户的消费行为变成三个数字：\n\n| 字母 | 中文 | 原话（真题就拿这几句出题） |\n|---|---|---|\n| <strong>R<\/strong> | <strong>新近度<\/strong> | 代表<strong>自用户上次消费以来的天数<\/strong>，也就是用户的<strong>热乎度<\/strong> |\n| <strong>F<\/strong> | <strong>消费频率<\/strong> | 代表用户<strong>是否频繁使用服务<\/strong>，是<strong>用户黏性的风向标<\/strong> |\n| <strong>M<\/strong> | <strong>消费金额<\/strong> | 代表用户<strong>在一段时间内消费的总金额<\/strong> |\n\n- R：上次用 App 是一个月前，R 就是 30；今天又用了一次，R 立刻变成 1。<strong>R 值越大，越处于休眠状态<\/strong>，可能已经<strong>流失<\/strong>。\n- 三个指标合起来，能把用户<strong>划分为不同的类别或集群<\/strong>，直观描述用户的<strong>价值、黏性<\/strong>等。\n- RFM 被广泛用在<strong>获客、促销、客户关系管理<\/strong>等营销、推广环节。\n\n> 📌 必背陷阱：真题把 <strong>R 和 F 的定义互换<\/strong>（「F 是新进度」「R 是消费频率」）——<strong>错<\/strong>。记法：<strong>R = Recency = 最近（天数），F = Frequency = 频率（次数），M = Money = 钱（总额）。<\/strong>", "### 怎么求出 RFM\n\n项目分<strong>两个阶段<\/strong>：① <strong>求出 RFM 值<\/strong>（第 05 讲）；② 用 RFM 值<strong>给用户分组画像<\/strong>，画出高、中、低价值用户分布（第 06 讲）。\n\n| 值 | 怎么求 | 看到题目说…… |\n|---|---|---|\n| <strong>R<\/strong> | 用表里<strong>最新订单的日期<\/strong>减去该用户<strong>上一次消费的日期<\/strong> | 「最近一次消费距今天数」 |\n| <strong>F<\/strong> | 给消费日期做 <strong>count() 计数<\/strong>，即该用户<strong>所有订单次数之和<\/strong> | 「订单次数」 |\n| <strong>M<\/strong> | 先加一列 <strong>总价 = 单价 × 数量<\/strong>，再对总价做 <strong>sum()<\/strong> | 「订单总价加起来」 |\n\n- 原始数据是<strong>订单记录<\/strong>，不是以用户为主键的表，所以要先<strong>构建一个用户层级表<\/strong>（以<strong>用户码<\/strong>为关键字段，df_user），再把 R、F、M 逐个合并进去。\n- 求 RFM 这一步属于<strong>特征工程<\/strong>：对原始信息进行<strong>选择、提取、合并、加工、转换<\/strong>，甚至<strong>构建出新的特征<\/strong>。求出 RFM <strong>只是完成了特征工程环节<\/strong>，分组要靠下一讲的<strong>聚类<\/strong>。\n- 数据集是一整年的订单，所以 M 实际是<strong>每个用户一整年的总消费额<\/strong>。最后一个月（2021 年 6 月）数据不全，但<strong>不影响<\/strong> RFM 分析。\n\n> 💡 原话：求 RFM「就好像给用户<strong>贴上了一堆数字化的标签<\/strong>」；「用户行为的量化，也可以视作是……<strong>特征工程<\/strong>」。", "### 数据清洗与 Pandas 常用操作：对号入座\n\n<strong>DataFrame<\/strong> = 整张表；<strong>Series<\/strong> = 单独一行或一列。\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 把 CSV 文件读进 DataFrame | <strong>read_csv<\/strong> |\n| 把消费日期转换成能处理的日期格式 | <strong>to_datetime<\/strong> |\n| 按月汇总订单数 | <strong>resample('M')<\/strong> |\n| 删除<strong>完全相同<\/strong>的重复行 | <strong>drop_duplicates<\/strong> |\n| 统计缺失值（NaN）个数 | <strong>isna().sum()<\/strong> |\n| 查看 count、mean、std、min、max 等统计信息，找脏数据 | <strong>describe<\/strong> |\n| 通过<strong>行、列的名称<\/strong>访问数据 | <strong>loc<\/strong> |\n| 通过<strong>行、列的位置（序号）<\/strong>访问数据 | <strong>iloc<\/strong> |\n| 取出不重复的用户码，建用户层级表 | <strong>unique()<\/strong> |\n| 排序 | <strong>sort_values<\/strong> |\n| 重置索引、不保留原来的索引 | <strong>reset_index(drop=True)<\/strong> |\n| 按用户分组再求最大值 / 计数 / 求和 | <strong>groupby<\/strong> |\n| 按用户码把两张表合并 | <strong>pd.merge<\/strong> |\n\n- 脏数据例子：<strong>数量的最小值是负数<\/strong>（-9360），不合逻辑 → 用 <strong>loc 只保留「数量」大于 0 的行<\/strong>。\n- 本数据集<strong>没有 NaN<\/strong>；平均采购数量 10，平均单价约 3.575 元；最终 <strong>980 个用户<\/strong>。\n\n> 📌 易混一对：<strong>loc 用名称，iloc 用位置（序号）<\/strong>。行名往往也是数字，所以两者容易弄混。"]}, {"title": "聚类与 K-Means（第 06 讲）", "cards": ["### 为什么用机器学习来分组\n\n分组要回答两个问题：<strong>分成多少组？每组从哪个值到哪个值？<\/strong>\n\n凭经验人为分组（比如 R 值 0–50 天、50–150 天、150 天以上）有两个弊端：\n1. 分组的准确性<strong>完全取决于人的经验<\/strong>；\n2. 人为分组是<strong>静态的<\/strong>，用户情况变了还用同样区间就不合适。\n\n> 原话：「<strong>怎么分组，我们说了不算，要数据说了算<\/strong>」，要让算法<strong>动态地确定分组<\/strong>。\n\n- 给用户分组画像是<strong>无监督学习问题<\/strong>：数据里没有字段标明用户价值高还是低（<strong>没有标签<\/strong>）。\n- <strong>无监督学习中，聚类和降维是两种最常见的算法<\/strong>：\n  - <strong>聚类<\/strong>主要用来<strong>做分组<\/strong>；\n  - <strong>降维<\/strong>通过数学变换，把<strong>高维<\/strong>属性空间变成<strong>低维「子空间」<\/strong>，用最主要的几个特征维度描述数据。", "### 聚类与 K-Means：一句话\n\n<strong>聚类算法是把空间位置相近的特征数据归为同一组<\/strong>，分出来的组叫<strong>簇<\/strong>。「特征彼此邻近」= 在坐标系里<strong>向量空间距离更短<\/strong>。\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 最常用、<strong>简洁、效率高<\/strong>的聚类算法 | <strong>K-Means（K-均值）<\/strong> |\n| K 是什么 | <strong>簇（组）的个数<\/strong>，<strong>需要人工指定<\/strong> |\n| 每个簇的中心点 | <strong>质心（centroid）<\/strong> |\n| 常用的距离 | <strong>欧式距离<\/strong> |\n| 不确定分几组时，帮你决定 K | <strong>手肘法（elbow method）<\/strong> |\n| 分完组后<strong>人为<\/strong>给各组贴「高 / 中 / 低价值」标签 | <strong>聚类后概念化<\/strong> |\n\n<strong>K-Means 过程<\/strong>：① <strong>随机<\/strong>挑 K 个点当质心 → ② 遍历每个点，<strong>离哪个质心近就归哪类<\/strong> → ③ 重新选更靠中心的质心（原来的不合适就「下岗」）→ ④ 重复 ②③，<strong>直到质心移动很小或固定不变<\/strong>，算法停止。\n\n- 应用场景：<strong>文档归类、欺诈行为检测、用户分组<\/strong>；还有<strong>图像颜色簇量化分组、文本分组<\/strong>、按考试成绩给学生分组。\n\n> 📌 必背陷阱：<strong>聚类算法本身并不知道哪一组是高价值<\/strong>，它<strong>不会<\/strong>自动生成标签；「聚类能把组概念化、不需要人贴标签」——<strong>错<\/strong>。概念化是<strong>人<\/strong>做的。", "### 手肘法和 sklearn 里的名字\n\n<strong>手肘法<\/strong>：通过聚类的<strong>损失值曲线<\/strong>直观确定簇的数量。损失 = 各数据点<strong>距离质心的平均距离<\/strong>。\n- K 越大，损失<strong>越小<\/strong>；曲线在收敛前会出现一个<strong>拐点<\/strong>，这个点像<strong>手肘<\/strong>（曲线像手臂），在拐点或附近选 K。\n- 本例 R、F、M 的拐点<strong>大概都在 2 到 4 之间<\/strong>；R 值分 <strong>3<\/strong> 个簇，F 值分 <strong>4<\/strong> 个簇。分组<strong>并不一定都是 3 组<\/strong>。\n\n| 名字 | 认得出 |\n|---|---|\n| <strong>KMeans<\/strong>（sklearn.cluster） | K-Means 聚类模型 |\n| <strong>n_clusters<\/strong> | 簇的个数（即 K） |\n| <strong>inertia_<\/strong> | 拟合后的<strong>损失值<\/strong>，画手肘图用 |\n| <strong>fit<\/strong> | <strong>拟合模型<\/strong>，基本所有模型都用 fit 训练 |\n| <strong>predict<\/strong> | 在这里就是<strong>用模型进行聚类<\/strong>，<strong>不需要进一步的评估过程<\/strong>（这是监督与无监督不一样的地方） |\n\n> 💡 用 K-Means 就三步：<strong>创建模型、拟合模型、用模型进行聚类<\/strong>。", "### 簇编号没有顺序 → 排序 → 打总分\n\n- 聚类<strong>不知道顺序的重要性<\/strong>，簇编号 0、1、2 只是<strong>随机分配的编号<\/strong>，<strong>并不表示 0 比 1 价值低<\/strong>。所以要<strong>人为排序<\/strong>（自定义 order_cluster 函数）。\n- 排序方向：<strong>R 用降序<\/strong>（间隔天数越少，价值越高）；<strong>F、M 用升序<\/strong>（次数、金额越多，价值越高）。排序<strong>没有改变用户的分组<\/strong>，只是改了<strong>簇的编号<\/strong>。\n\n<strong>整体价值<\/strong>：把 R、F、M 三个层级<strong>简单叠加<\/strong>成「总分」（看重某个指标也可以<strong>加权<\/strong>后再加）。\n\n| 项目 | 数字 |\n|---|---|\n| 层级 | R 有 3 级（0–2），F 有 4 级（0–3），M 有 4 级（0–3） |\n| 总分范围 | <strong>0 到 8<\/strong>，共 <strong>9 个层次<\/strong> |\n| <strong>低价值<\/strong> | <strong>0–2 分<\/strong> |\n| <strong>中价值<\/strong> | <strong>3–4 分<\/strong> |\n| <strong>高价值<\/strong> | <strong>5–8 分<\/strong> |\n\n- 散点图结论：<strong>高价值用户覆盖在消费频率较高的区域，和 F 值相关度高<\/strong>。\n\n<strong>本讲 6 步<\/strong>：① 选 R、F、M 作独立特征 → ② <strong>手肘法<\/strong>定层级个数 → ③④⑤ 分别以 R、F、M 为特征聚类定层级 → ⑥ 把各层级<strong>统合<\/strong>，确定用户最终价值。"]}, {"title": "LTV 预测与常用回归算法（第 07 讲）", "cards": ["### 一句话：LTV 是什么\n\n<strong>LTV（Lifetime Value，用户生命周期价值）<\/strong>，有时也叫 <strong>CLV（Customer Lifetime Value）<\/strong>：用户在使用产品的整个期间<strong>消费所产生的总收益<\/strong>。\n\n- <strong>LTV 越高，ROI（投资回报率）越高<\/strong>。预测 LTV 是为了<strong>指导获客成本<\/strong>，避免超出回报的盲目投入（本例拉新一个用户成本接近 500 元）。\n- LTV 是<strong>连续性数值<\/strong> → 预测它属于<strong>回归问题<\/strong>，是<strong>监督学习<\/strong>。\n- 原话：「<strong>监督学习，主要应用于回归和分类两大场景<\/strong>，分别可以用来<strong>预测数值<\/strong>和<strong>进行分类判断<\/strong>」。回归问题用回归算法，是<strong>基于问题本身的性质而确定的<\/strong>。\n\n> 📌 目标原话：「<strong>用短期数据，来预测用户的长期价值<\/strong>」。", "### 特征和标签怎么定\n\n| 项目 | 内容 |\n|---|---|\n| <strong>特征（自变量）<\/strong> | <strong>头 3 个月<\/strong>的 <strong>R、F、M<\/strong> 三个值 |\n| <strong>标签（因变量）<\/strong> | <strong>一年（12 个月）的总消费额<\/strong>，就当作 LTV |\n| 为什么不用全年消费额当特征 | 避免<strong>「用自己去预测自己」<\/strong> |\n| 为什么用 RFM 而不是只用金额 | 避免<strong>单一维度建模的局限性<\/strong> |\n\n- 3 个月、12 个月<strong>只是思路上的示意<\/strong>，时间区间<strong>可以视情况而定<\/strong>。\n- <strong>删掉不相关字段<\/strong>：订单号、用户码、产品说明。<strong>用户码<\/strong>也是数字，留着<strong>会干扰模型<\/strong>（机器会以为 15291 比 15100 大）。\n- <strong>「城市」<\/strong>是文本，<strong>不能直接输入回归模型<\/strong>，要转成 0/1 的<strong>哑变量<\/strong>（「是否北京」「是否上海」……，工具 <strong>get_dummies<\/strong>）；本项目因为城市影响不大，<strong>没有用<\/strong>。\n- 用户从 981 个减到 <strong>361<\/strong> 个（头三个月有消费的只有这些）。\n- 惯例：<strong>特征集 X 大写，标签 y 小写<\/strong>。\n- 拆分：用 <strong>train_test_split<\/strong> 做<strong>两重拆分<\/strong>：先 <strong>70%<\/strong> 训练集，剩下的再<strong>对半<\/strong>分成<strong>验证集<\/strong>和<strong>测试集<\/strong>。\n- 「<strong>标签，就是我们需要去预测或者判断的东西<\/strong>」；机器学习就是<strong>通过已知来预测未知<\/strong>。", "### 常用回归算法清单（原文表格，真题考「包括哪些」）\n\n| 算法 | 一句话（原话） |\n|---|---|\n| <strong>线性回归<\/strong> | 用<strong>最小二乘函数<\/strong>对自变量和因变量的关系建模 |\n| <strong>贝叶斯回归<\/strong> | 用<strong>贝叶斯推断<\/strong>求解的线性回归模型 |\n| <strong>SVM 回归（SVR）<\/strong> | 找一个<strong>回归平面<\/strong>，让所有数据到该平面<strong>距离最近<\/strong> |\n| <strong>决策树<\/strong> | 主要指 <strong>CART<\/strong> 算法，<strong>二叉树<\/strong>结构，取值「是」和「否」 |\n| <strong>随机森林<\/strong> | <strong>多棵决策树<\/strong>组合成的<strong>集成学习<\/strong>模型 |\n| <strong>AdaBoost、XGBoost 等梯度提升<\/strong> | 用 <strong>Boosting<\/strong> 方法基于树模型建立的集成学习模型 |\n| <strong>神经网络<\/strong> | 由相互连接的<strong>神经元<\/strong>构建的<strong>深度学习<\/strong>模型 |\n\n> 📌 必背陷阱：<strong>逻辑回归不在这张表里<\/strong>——它名字带「回归」，其实是做<strong>分类<\/strong>的。题目问「常用回归算法包括」，<strong>逻辑回归不选<\/strong>。\n\n- 一般做法：<strong>选多种算法建模，相互比较后再确定<\/strong>。本讲比较 3 种：<strong>线性回归、决策树、随机森林<\/strong>。", "### 三个模型：对号入座\n\n| 看到题目说…… | 就选 |\n|---|---|\n| <strong>基准模型<\/strong>；通过<strong>梯度下降<\/strong>找最优权重和偏置的<strong>最基本<\/strong>的回归算法 | <strong>线性回归<\/strong>（LinearRegression） |\n| 学习简单的 <strong>IF ELSE 规则<\/strong>；核心是<strong>划分点的选择和输出值的确定<\/strong> | <strong>决策树<\/strong>（DecisionTreeRegressor） |\n| 多棵决策树的<strong>集成学习<\/strong>；<strong>既能分类也能回归<\/strong>；<strong>纠正了决策树过拟合<\/strong>的问题 | <strong>随机森林<\/strong>（RandomForestRegressor） |\n\n- 随机森林：<strong>分类<\/strong>取各树结果的<strong>众数<\/strong>，<strong>回归<\/strong>取各树结果的<strong>平均<\/strong>；fit 时生成多棵树，用 <strong>Bagging<\/strong> 得到最终模型。\n- 类名后缀：<strong>Regressor = 回归<\/strong>，<strong>Classifier = 分类<\/strong>（决策树、随机森林两种都有）。\n- <strong>过拟合<\/strong> = 模型对训练集<strong>模拟过头了<\/strong>，反而不适合验证集和测试集。\n- 「<strong>fit 语句，这是模型进行自我学习的关键过程<\/strong>」。\n\n### 评估\n\n- 「<strong>一个数据点接近真值完全不能说明问题<\/strong>」，要用 <strong>R²、MSE<\/strong> 等指标在<strong>验证集<\/strong>上整体评估（函数 <strong>r2_score<\/strong>、<strong>median_absolute_error<\/strong>、<strong>mean_squared_error<\/strong>）。\n- <strong>R² 越大越好，其它指标（均方误差、中值绝对误差）越小越好<\/strong>。\n- 验证集 R²：线性回归 0.4333、决策树 0.3093、<strong>随机森林 0.4677（最好）<\/strong>。\n\n> 📌 必背陷阱：这里的「更优」<strong>仅针对当前场景<\/strong>，<strong>并不是说随机森林一定优于线性回归<\/strong>。原话：「<strong>如果……你能找到比随机森林还好的算法，那么就可以说是相当成功了<\/strong>」。"]}], "questions": [{"id": "mlu-p1", "type": "single", "stem": "RFM 中的 <strong>F<\/strong> 代表什么？", "options": ["自用户上次消费以来的天数", "消费频率", "一段时间内的消费总金额", "用户所在城市"], "answer": [1], "why": ["那是 R（新近度）", "F = Frequency = 频率，黏性的风向标", "那是 M（消费金额）", "不是 RFM 指标"], "explain": "R 天数，F 次数，M 金额。", "tags": [], "lesson": 0, "m": "ml_user"}, {"id": "mlu-p2", "type": "single", "stem": "在 DataFrame 中，通过行、列的<strong>位置（序号）<\/strong>访问数据的属性是？", "options": ["loc", "iloc", "describe", "unique"], "answer": [1], "why": ["loc 用名称", "iloc 用位置", "describe 看统计信息", "unique 取不重复值"], "explain": "loc 名称，iloc 位置。", "tags": [], "lesson": 0, "m": "ml_user"}, {"id": "mlu-p3", "type": "single", "stem": "K-Means 中的 <strong>K<\/strong> 指的是？", "options": ["簇（组）的个数，需要人工指定", "迭代的次数", "特征的个数", "标签的个数"], "answer": [0], "why": ["对", "迭代次数是 max_iter", "不是", "聚类没有标签"], "explain": "K = 簇数，人工指定。", "tags": [], "lesson": 1, "m": "ml_user"}, {"id": "mlu-p4", "type": "single", "stem": "判断：聚类分完组后，需要人为地给各组贴上「高价值」「低价值」等标签，这个过程叫「聚类后概念化」", "options": ["正确", "错误"], "answer": [0], "why": ["对，聚类本身不知道每组的含义", "这正是原文的说法"], "explain": "贴标签靠人 = 聚类后概念化。", "tags": [], "lesson": 1, "m": "ml_user"}, {"id": "mlu-p5", "type": "single", "stem": "LTV 预测项目中，特征和标签分别是？", "options": ["特征：头 3 个月的 R、F、M；标签：一年的总消费额", "特征：一年的总消费额；标签：头 3 个月的 R、F、M", "特征：用户码；标签：城市", "特征：城市；标签：用户码"], "answer": [0], "why": ["对", "反了", "用户码对模型毫无意义", "城市本项目没用"], "explain": "短期 RFM → 预测长期 LTV。", "tags": [], "lesson": 2, "m": "ml_user"}, {"id": "mlu-p6", "type": "single", "stem": "下列哪个<strong>不在<\/strong>课程的「常用回归算法」清单里？", "options": ["线性回归", "逻辑回归", "随机森林", "SVM 回归"], "answer": [1], "why": ["在清单里", "逻辑回归做分类，不在清单里", "在清单里", "在清单里"], "explain": "逻辑回归名字带回归，其实做分类。", "tags": [], "lesson": 2, "m": "ml_user"}, {"id": "mlu-1", "type": "multi", "stem": "关于 R、F、M 值，下列说法正确的是", "options": ["R 是新近度，代表自用户上次消费以来的天数，也就是用户的热乎度", "F 是消费频率，代表用户是否频繁使用服务，是用户黏性的风向标", "M 是消费金额，代表用户在一段时间内消费的总金额", "R 值越小，说明用户越处于休眠状态", "RFM 是用户画像的衍生品，也是很多互联网厂商普遍采用的分析方式"], "answer": [0, 1, 2, 4], "why": ["原话", "原话", "原话", "反了：R 值越大（越久没买）越休眠", "原话"], "explain": "R 天数（越大越冷），F 次数（黏性），M 总额。", "tags": ["basic"], "m": "ml_user"}, {"id": "mlu-2", "type": "multi", "stem": "求 RFM 值时，下列做法正确的是", "options": ["R 值：用表中最新订单的日期减去该用户上一次消费的日期", "F 值：给消费日期做 count() 计数，求出每个用户的消费次数", "M 值：先增加「总价 = 单价 × 数量」列，再对每个用户的总价做 sum()", "M 值：直接取每个用户单价的最大值", "计算前要先构建以用户码为关键字段的用户层级表"], "answer": [0, 1, 2, 4], "why": ["对", "对", "对" ": ["对", "对", "对", "错，K 需要人工指定", "原话"], "explain": "随机选质心 → 就近归类 → 质心不动就停。", "tags": ["basic", "core"], "m": "ml_user"}, {"id": "mlu-9", "type": "single", "stem": "事先不确定分成多少组合适时，可以用什么方法确定 K 值？", "options": ["手肘法（elbow method）", "交叉验证", "独热编码", "梯度下降"], "answer": [0], "why": ["对，看损失曲线的拐点", "那是第 10 讲的模型优化方法", "那是特征处理", "那是模型优化方法"], "explain": "定 K 用手肘。", "tags": ["basic"], "m": "ml_user"}, {"id": "mlu-10", "type": "multi", "stem": "关于手肘法，下列说法正确的是", "options": ["它通过聚类算法的损失值曲线直观确定簇的数量", "随着 K 值增大，损失逐渐减小，曲线收敛前的拐点就是「手肘」", "在 sklearn 中可以用 KMeans 的 inertia_ 得到损失值", "R、F、M 必须都分成 3 组", "可以在拐点或拐点附近选择 K 值"], "answer": [0, 1, 2, 4], "why": ["对", "对", "对", "错，原文强调「并不一定都是 3 组」", "对"], "explain": "损失曲线的拐点 = 手肘 = 好的 K。", "tags": ["basic", "core"], "m": "ml_user"}, {"id": "mlu-11", "type": "single", "stem": "R、F、M 三个层级相加得到总分（0—8 分），课程中「高价值用户」对应的总分是？", "options": ["0—2 分", "3—4 分", "5—8 分", "只有 8 分"], "answer": [2], "why": ["那是低价值", "那是中价值", "对", "范围太窄"], "explain": "低 0—2，中 3—4，高 5—8。", "tags": ["basic", "core"], "m": "ml_user"}, {"id": "mlu-12", "type": "single", "stem": "给簇排序时，R 值用降序、F 和 M 值用升序，原因是？", "options": ["R 值（间隔天数）越小价值越高；F、M 越大价值越高", "R 值越大价值越高", "排序会改变用户的分组", "降序计算更快"], "answer": [0], "why": ["对", "反了", "排序只改簇的编号，不改分组", "无关"], "explain": "R 越近越好，F、M 越多越好。", "tags": ["basic"], "m": "ml_user"}, {"id": "mlu-13", "type": "single", "stem": "判断：在 K-Means 聚类中，predict 就是用模型进行聚类，不需要进一步的评估过程，这是监督学习和无监督学习不一样的地方", "options": ["正确", "错误"], "answer": [0], "why": ["对，原文说法", "这正是原文的说法"], "explain": "无监督 predict = 聚类，不用评估。", "tags": ["basic"], "m": "ml_user"}, {"id": "mlu-14", "type": "multi", "stem": "课程中常用的回归算法包括", "options": ["贝叶斯回归", "SVM 回归（SVR）", "随机森林", "AdaBoost、XGBoost 等梯度提升算法", "逻辑回归"], "answer": [0, 1, 2, 3], "why": ["在清单里", "在清单里", "在清单里", "在清单里", "不在，逻辑回归用于分类"], "explain": "清单：线性、贝叶斯、SVR、决策树、随机森林、梯度提升、神经网络。", "tags": ["basic"], "m": "ml_user"}, {"id": "mlu-15", "type": "multi", "stem": "关于 LTV，下列说法正确的是", "options": ["LTV 是 Lifetime Value，即用户生命周期价值，有时也叫 CLV", "用户的 LTV 越高，ROI 越高", "LTV 是连续性数值，预测它属于回归问题", "预测 LTV 属于无监督学习", "预测 LTV 可以用来指导获客成本"], "answer": [0, 1, 2, 4], "why": ["原话", "原话", "对", "错，有标签（一年消费额），是监督学习", "对"], "explain": "LTV 连续值 → 回归 → 监督学习。", "tags": ["basic", "core"], "m": "ml_user"}, {"id": "mlu-16", "type": "multi", "stem": "关于 LTV 项目的数据预处理，下列说法正确的是", "options": ["用头 3 个月的消费数据构建特征，是为了避免「用自己去预测自己」", "用户码对模型毫无意义，而且是数字，会干扰模型，要从特征集中移除", "「城市」字段是文本，可以直接输入回归模型", "惯例上特征集 X 大写，标签集 y 小写", "用 train_test_split 把数据拆成训练集、验证集和测试集"], "answer": [0, 1, 3, 4], "why": ["原话", "对", "错，文本要先转成 0/1 哑变量", "对", "对，做了两重拆分"], "explain": "文本先转哑变量，用户码要删。", "tags": ["basic"], "m": "ml_user"}, {"id": "mlu-17", "type": "multi", "stem": "下列算法与描述对应正确的是", "options": ["线性回归：本讲中的基准模型", "决策树：通过学习简单的 IF ELSE 规则来预测目标变量的值", "随机森林：由多棵决策树构成的集成学习算法，既能分类也能回归", "随机森林会加重决策树的过拟合问题", "随机森林做回归时，对多棵树的预测结果取平均"], "answer": [0, 1, 2, 4], "why": ["对", "原话", "原话", "反了：随机森林纠正了决策树的过拟合", "对，分类则取众数"], "explain": "线性回归当基准，随机森林治决策树过拟合。", "tags": ["basic"], "m": "ml_user"}, {"id": "mlu-18", "type": "single", "stem": "在 sklearn 中，用于<strong>回归<\/strong>问题的随机森林类是？", "options": ["RandomForestRegressor", "RandomForestClassifier", "DecisionTreeRegressor", "KMeans"], "answer": [0], "why": ["Regressor = 回归", "Classifier 是分类", "那是决策树", "那是聚类"], "explain": "Regressor 回归，Classifier 分类。", "tags": ["basic"], "m": "ml_user"}, {"id": "mlu-19", "type": "single", "stem": "判断：本讲中随机森林在验证集上的 R² 分数最高，说明随机森林一定优于线性回归", "options": ["正确", "错误"], "answer": [1], "why": ["后半句错", "原文强调「更优」仅针对当前场景，并不是说随机森林一定优于线性回归"], "explain": "更优只限当前场景。", "tags": ["basic"], "m": "ml_user"}, {"id": "mlu-20", "type": "single", "stem": "评估回归模型时，下列指标中<strong>越大越好<\/strong>的是？", "options": ["R²", "均方误差（MSE）", "中值绝对误差", "以上都是越小越好"], "answer": [0], "why": ["对，除 R² 外其它都越小越好", "越小越好", "越小越好", "R² 是越大越好"], "explain": "R² 越大越好，误差越小越好。", "tags": ["basic"], "m": "ml_user"}]}, {"id": "ml_opt", "title": "模型优化：特征工程、防止过拟合、交叉验证与调参", "short": "模型优化", "group": "机器学习 · 变现关（模型优化）", "exam": "第 08—10 讲", "refs": [], "lessons": [{"title": "特征工程：选择、变换、构建", "cards": ["### 一句话\n\n<strong>特征工程 = 「优化数据集的特征，使机器学习算法更起作用的过程」。<\/strong>（特征 = 数据表里用来做预测的那些列）\n\n原文名言：<strong>「数据和特征决定了机器学习的上限，而模型和算法只是无限逼近这个上限而已」。<\/strong>\n\n几乎所有特征工程都逃不开<strong>三个基本思路<\/strong>：\n\n| 思路 | 一句话 | 特征数量 |\n|---|---|---|\n| <strong>特征选择<\/strong> | 删掉<strong>没作用和作用小<\/strong>的特征，降低维度，节省计算空间 | <strong>减少<\/strong> |\n| <strong>特征变换<\/strong> | 在原有特征基础上<strong>加工<\/strong>，让特征变得模型<strong>可用、更好用<\/strong> | <strong>不减少<\/strong>（改变旧特征；独热编码还会增加列数） |\n| <strong>特征构建<\/strong> | 凭<strong>经验、领域知识和创造力<\/strong>造出新特征 | <strong>增加<\/strong>（创造新特征） |\n\n> 📌 原文：<strong>特征构建是整个特征工程领域「最具创造力」的部分<\/strong>，「完全没有一定之规」。", "### 特征选择：工具对号入座\n\n目标：<strong>尽量保持对模型训练有效的信息，同时减少特征数量。<\/strong>\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 用颜色方格看各字段之间相关性（`corr()` + seaborn 的 `heatmap`） | <strong>相关性热力图<\/strong> |\n| 方格里的数字，越接近 1 相关性越大；有正负（正 = 正相关，负 = 负相关） | <strong>皮尔逊相关系数<\/strong> |\n| 自动特征选择工具所在模块 | sklearn 的 <strong>feature_selection<\/strong> |\n| 对每个特征和标签做统计检验，选出最好的 <strong>K<\/strong> 个特征 | <strong>SelectKBest<\/strong>（单变量特征选择） |\n| 给<strong>连续型<\/strong>标签的特征打分 / 给<strong>离散型<\/strong>（分类）标签打分 | <strong>mutual_info_regression<\/strong> / <strong>mutual_info_classif<\/strong> |\n| 每次训练后去掉一个<strong>最不重要<\/strong>的特征，直到剩下想要的数量 | <strong>RFE<\/strong>（递归特征消除） |\n| 基于<strong>重要性权重的阈值<\/strong>选特征 | <strong>SelectFromModel<\/strong> |\n| 每次<strong>增加或减掉一个<\/strong>特征，分<strong>正向选择<\/strong>和<strong>反向选择<\/strong> | <strong>SequentialFeatureSelector<\/strong>（顺序特征选择） |\n\n- <strong>单变量<\/strong>特征选择：<strong>直接、速度快、独立于模型<\/strong>；缺点是可能误删「单看不相关、组合起来才有用」的特征。\n- <strong>多变量组合型<\/strong>特征选择：<strong>必须结合具体的模型<\/strong>。\n- <strong>数据降维<\/strong>也可归入特征选择：把多维特征压缩成低维。常见两种：<strong>PCA（主成分分析，无监督）<\/strong>、<strong>LDA（线性判别分析，有监督）<\/strong>。\n- 深度学习（如卷积网络）能<strong>自动学习特征<\/strong>，在计算机视觉领域很普遍，但「就像一个黑箱」。\n\n> 📌 易混：<strong>PCA 无监督，LDA 有监督。<\/strong>", "### 特征变换①：特征缩放（连续特征）\n\n特征分两类：<strong>连续特征<\/strong>（分数、点击量）和<strong>离散特征<\/strong>（也叫<strong>类别特征<\/strong>，如男/女、北京/上海）。\n\n<strong>对连续特征，最常见的特征变换就是特征缩放（feature scaling）：改变特征的分布，或者压缩特征的区间。<\/strong> 梯度下降类模型缩放后<strong>收敛更快<\/strong>；<strong>SVM、KNN、神经网络<\/strong>等模型<strong>要求<\/strong>对特征缩放。\n\n| 工具 | 看到题目说…… |\n|---|---|\n| <strong>StandardScaler<\/strong>（标准化） | 让数据符合正态分布，<strong>均值为 0，方差为 1<\/strong> |\n| <strong>MinMaxScaler<\/strong>（<strong>归一化<\/strong>） | 压缩到给定最小、最大值之间，通常 <strong>0～1<\/strong>，有负值则 <strong>-1～1<\/strong>；<strong>不改变数据的分布状态<\/strong>；神经网络很喜欢 |\n| <strong>RobustScaler<\/strong> | 基于<strong>百分位数<\/strong>，能<strong>消除离群值的影响<\/strong>（范围会变大，常再配合归一化） |\n| <strong>Normalizer<\/strong>（规范化） | 把样本缩放为<strong>单位范数<\/strong>，应用场景较少 |\n\n### 必背：缩放时机与数据泄露\n\n- **训练集用 `fit_transform`<strong>（先 fit 找参数，再 transform 缩放）；<\/strong>验证集、测试集只用 `transform`<strong>，用训练集得到的参数，<\/strong>没有 fit 过程**。\n- 原因：验证集、测试集是「新的看不见的数据」，<strong>使用来自验证集和测试集的任何信息都属于数据泄露<\/strong>，会导致评估偏差。\n- 原话：<strong>「特征缩放必须在拆分完训练集和测试集后进行，因为它的参数只能来自训练集的数据」。<\/strong>\n\n> 📌 陷阱：「归一化必须在拆分数据集<strong>之前<\/strong>进行，让全部数据进入 fit」——<strong>错<\/strong>！是拆分<strong>之后<\/strong>，参数只来自训练集。", "### 特征变换②：虚拟变量 vs 独热编码（类别特征）\n\n- 类别特征最常见的变换：用<strong>虚拟变量<\/strong>（也叫<strong>哑编码、哑变量<\/strong>）把文本类别变成 0、1 值。只有两类（男/女）可以直接用 `replace` 换成 0、1。\n- 两类以上用 pandas 的 **`get_dummies`**：每个可能的取值扩展成一个新特征，只有 0、1 两种取值。\n- 参数 **`drop_first`<strong>：<\/strong>True → 虚拟变量；False → 独热编码（One-Hot）<strong>。sklearn 里类似的工具是 <\/strong>OneHotEncoder**。\n\n| 对比 | 虚拟变量（Dummy） | 独热编码（One-Hot） |\n|---|---|---|\n| m 个类别得到几个 0/1 特征 | <strong>m-1 个<\/strong>（作为基准的那个被完全忽略） | <strong>m 个<\/strong> |\n| 冗余 | <strong>没有冗余<\/strong> | <strong>有冗余<\/strong> → 可能导致<strong>共线性<\/strong>（自变量之间高度相关，参数估计不准） |\n| 直观 | 要推理，不直观 | 直接从「1」看出类别，<strong>直观<\/strong> |\n| 什么时候用 | 线性模型<strong>有截距项<\/strong>（且不用正则化） | 线性模型<strong>无截距项<\/strong>；或有截距项但<strong>使用正则化<\/strong> |\n\n> 📌 两者<strong>相似但不完全相同<\/strong>。陷阱：把 m 和 m-1 互换——<strong>虚拟 m-1，独热 m<\/strong>。", "### 特征变换③：分桶（分箱）\n\n- <strong>分桶也叫分箱：把连续型特征离散化为一系列离散值<\/strong>（如 0、1、2）。\n- 为什么：特征数量级跨度太大、和标签关系又非线性时，模型会<strong>向大特征值一侧倾斜<\/strong>，速度也受影响。分桶能<strong>减弱异常数据的权重<\/strong>，还能<strong>提高运算速度<\/strong>。\n- 先确定两点：<strong>桶的数量、桶的宽度<\/strong>。\n\n| 分桶方式 | 一句话 |\n|---|---|\n| <strong>等距分桶<\/strong> | 每个桶<strong>宽度固定<\/strong>，适合分布均匀的样本 |\n| <strong>等频分桶<\/strong> | 每个桶<strong>样本数一样多<\/strong>，但数值相差大的可能进同一桶 |\n| <strong>模型分桶<\/strong> | 用模型找最佳分桶，如<strong>决策树<\/strong>的分割点、<strong>聚类<\/strong>（对 R、F、M 聚类就是一种模型分桶） |\n\n### 特征构建：例子\n\n- 从订单数据算出原本不存在的 <strong>R、F、M 值<\/strong>——<strong>典型的特征构建<\/strong>（靠运营领域知识）。\n- 航班客流例子：根据日期加一列「在公休假日之前 / 之中 / 之后」，把<strong>先验知识<\/strong>编码进特征。新特征<strong>不一定会被算法用到<\/strong>。\n- X 和 Y 是二次关系时，造一个新特征 <strong>X 的平方<\/strong>，同样的线性回归就能拟合得更好。"]}, {"title": "过拟合与正则化", "cards": ["### 一句话\n\n<strong>过拟合 = 模型过度地适应了训练集，在其它类似的数据集上反而表现不好。<\/strong> 典型表现：决策树在训练集上 R² 满分 <strong>1.0<\/strong>，验证集却很低。\n\n- 原话：「<strong>我们用机器学习建模的过程，就是和过拟合现象持续作斗争的过程<\/strong>」。\n- 只要模型足够复杂，训练集精度想多高就多高；决策树对回归和分类都能在训练集上达到 <strong>100%<\/strong>。\n- 目标不是训练集上完全精准，而是<strong>构建一个泛化能力尽可能高的模型<\/strong>（泛化 = 对没见过的相似数据也能预测准）。\n\n### 过拟合形成的三个阶段\n\n| 阶段 | 一句话 |\n|---|---|\n| <strong>欠拟合<\/strong> | 训练初期，拟合<strong>能力不够强、偏差比较大<\/strong>，还要继续训练 |\n| <strong>平衡点<\/strong> | 欠拟合和过拟合之间的平衡，「差不多可以用了」 |\n| <strong>过拟合<\/strong> | 模型<strong>经过充分训练后<\/strong>完全拟合训练集，用到测试集容易出现很高误差 |\n\n> 📌 陷阱：「模型经过充分训练就能减少过拟合」——<strong>错<\/strong>，充分训练恰恰会导致过拟合。\n> 过拟合的讨论<strong>多限于监督学习<\/strong>（回归、分类），无监督学习中的过拟合讨论不多。", "### 解决过拟合的三个思路\n\n| 思路 | 原文要点 |\n|---|---|\n| <strong>增加数据量<\/strong> | 数据点少，模型很容易完全描绘出映射；增加数据可以在一定程度上防止过拟合 |\n| <strong>做好特征工程<\/strong> | 筛除无用特征，去芜存菁、去伪存真 |\n| <strong>选择更简单的模型<\/strong> | 数据集小、问题简单时尽量选简单模型——<strong>奥卡姆剃刀定理<\/strong>（凡事选择简单的解决方案） |\n\n- 数据难收集、特征工程考验水平，所以<strong>防止过拟合的最佳策略：在模型的简单和复杂之间找平衡点<\/strong>，也就是<strong>通过正则化，让模型变得尽量简单<\/strong>。\n- 第 7 讲三个模型里，<strong>决策树和线性回归<\/strong>比较容易过拟合；<strong>随机森林本身就能<\/strong>基于决策树的过拟合问题实现优化。\n\n### 办法一：决策树剪枝\n\n- 决策树 = 一大堆 <strong>if...else<\/strong> 连起来。生成决策树<strong>两个阶段：构造和剪枝<\/strong>。\n- 三种节点：<strong>根节点<\/strong>（最顶端）、<strong>内部节点<\/strong>（中间）、<strong>叶节点<\/strong>（最底部，即决策结果）。\n- 构造时根据<strong>信息增益<\/strong>选节点；<strong>熵<\/strong>是对不确定性的度量，熵越大越不确定，应选熵比较小的特征作根节点。\n- <strong>剪枝<\/strong>：让树不要太深。最常见的剪枝策略是超参数 <strong>max_depth<\/strong>（限制树的最大深度，超过的树枝全剪掉）。其它剪枝参数：<strong>min_samples_leaf<\/strong>（每个子结点至少 N 个样本）、<strong>min_samples_split<\/strong>（结点至少 N 个样本才能分支）。\n- 实验：不限深度 训练 1.0 / 验证 0.29；`max_depth=3` 训练 0.80 / 验证 0.49。<strong>训练分降了，验证分大幅升高。<\/strong>\n\n> 📌 陷阱：「加深树的深度可以避免过拟合」——<strong>错<\/strong>，树越深越容易过拟合。", "### 办法二：线性回归的正则化\n\n- <strong>正则化<\/strong>：在一定程度上<strong>减小<\/strong>特征权重参数的值，得到更平衡的模型。\n- 原话：<strong>「在损失函数当中加入的正则项也叫惩罚项」<\/strong>，给函数加上规矩、限制，「让它们不要自我膨胀」。\n\n| 正则项 | 效果 | 回归名字 |\n|---|---|---|\n| <strong>L1<\/strong> | 一些权重变小，绝对值小的系数<strong>直接变为 0<\/strong>（相当于<strong>抛弃了一些特征<\/strong>） | <strong>Lasso 回归<\/strong> |\n| <strong>L2<\/strong> | <strong>不抛弃任何特征<\/strong>，只是<strong>缩小<\/strong>回归系数，模型更稳定 | <strong>Ridge（岭）回归<\/strong> |\n\n- sklearn 里在 `linear_model` 中，类名就叫 <strong>Lasso<\/strong>、<strong>Ridge<\/strong>。\n- 结果：训练集分数 线性回归 → Lasso → Ridge <strong>下降<\/strong>，验证集分数<strong>略微升高<\/strong>——惩罚项发挥了作用。\n- 正则化用途很广：<strong>逻辑回归的 C 值<\/strong>也是正则化相关参数；<strong>决策树剪枝也算一种正则化<\/strong>；多棵剪枝树组成的<strong>随机森林也是一种正则化了的模型<\/strong>。\n\n> 📌 易混：<strong>L1 = Lasso = 会变 0（丢特征）；L2 = Ridge = 只缩小不丢。<\/strong>"]}, {"title": "交叉验证与网格搜索", "cards": ["### 先回顾：三个数据集\n\n样本充足时随机分成三份：<strong>训练集训练模型，验证集模型调优，测试集评估模型性能。<\/strong> 有标签的数据很难获得；<strong>数据集越大，越不容易过拟合<\/strong>。小数据集怎么办？→ <strong>交叉验证<\/strong>（「小数据集的资源复用」）。\n\n### 交叉验证（k 折）\n\n- 基本思想：<strong>把训练集分为 k 等份，k-1 份做训练，剩下 1 份做验证，重复 k 次<\/strong>，叫 <strong>k 折<\/strong>。\n- <strong>每个样本都有 1 次机会进入验证集，并用于训练模型 k-1 次<\/strong>；每个数据既做了训练又做了测试。\n- k 一般取 3、5、10，<strong>实操中以 10 折居多<\/strong>。k 次分数<strong>取平均<\/strong>，就是交叉验证的最终结果，比只拆一次<strong>更稳定<\/strong>。\n- 叫「交叉」：某次训练集里的样本，下次可能成了验证集里的样本。\n\n<strong>四个步骤<\/strong>：① 先把<strong>测试集预留<\/strong>出来放一边 → ② 训练集分 k 组轮流验证、分数取平均 → ③ 对多个算法都做交叉验证，<strong>挑最好的算法<\/strong> → ④ 用<strong>测试集<\/strong>评估最终模型。\n\n> 📌 原话：交叉验证「<strong>并不是在试图训练出新的模型，它只是我们对模型的一种评估方式而已<\/strong>」。", "### 交叉验证工具对号入座\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 手动把训练集拆成 k 折（在 `sklearn.model_selection` 中） | <strong>KFold<\/strong> |\n| 一个函数直接完成 K 折拆分、训练和验证，一次性得到结果 | <strong>cross_val_score<\/strong> |\n| 能<strong>指定多个评估指标<\/strong>、返回拟合时间等<strong>更丰富信息<\/strong> | <strong>cross_validate<\/strong> |\n| KFold 的变体 | <strong>RepeatedKFold<\/strong>（重复 K 折）、<strong>LeaveOneOut<\/strong>（留一法）、<strong>LeavePOut<\/strong>（留多法） |\n\n<strong>KFold 参数默认值（必背）<\/strong>\n\n| 参数 | 含义 | 默认 |\n|---|---|---|\n| <strong>n_splits<\/strong> | 折叠次数，<strong>至少为 2<\/strong> | <strong>5<\/strong> |\n| <strong>shuffle<\/strong> | 拆分前是否打乱 | <strong>False<\/strong> |\n| <strong>random_state<\/strong> | 随机种子 | <strong>None<\/strong> |\n\n- `scoring='neg_mean_absolute_error'`：平均绝对误差（预测值和真值的平均差异），<strong>误差绝对值越大效果越不好<\/strong>。", "### 网格搜索 GridSearchCV：自动调参\n\n- <strong>超参数<\/strong>：模型的「外部参数」，要人来定；模型性能很大程度上取决于它，<strong>基本没有规律可循<\/strong>。\n- 原话：<strong>GridSearchCV 中文叫网格搜索，「堪称是辅助我们自动调参的神器」<\/strong>。本质是一种<strong>穷举法<\/strong>：把各组参数挨个试，挑<strong>验证集上误差最小<\/strong>的作为最优超参数。\n- 名称里的 <strong>CV = cross validation（交叉验证）<\/strong>：它用交叉验证评估每组超参数，后台开一大堆<strong>并行进程<\/strong>。\n\n<strong>使用三步<\/strong>：① 明确模型有哪些可调参数（看文档）→ ② 把各超参数取值的<strong>排列组合尽可能多地列出来<\/strong>（用一个字典）→ ③ 调用 GridSearchCV，把组合都传进去。\n\n| GridSearchCV 参数 | 含义 |\n|---|---|\n| <strong>estimator<\/strong> | 要调参的模型 |\n| <strong>param_grid<\/strong> | 要尝试的超参数字典 |\n| <strong>scoring<\/strong> | 评估指标 |\n| <strong>cv<\/strong> | 交叉验证几折 |\n| <strong>verbose<\/strong> | 设为 1 输出详细信息 |\n| <strong>n_jobs<\/strong> | 并行进程数，<strong>-1 = 用所有处理器（谨慎使用）<\/strong> |\n\n- 调完用 <strong>best_params_<\/strong> 查看最优参数组合。\n- 随机森林调参后：训练集 0.89 → 0.77（<strong>降<\/strong>），验证集 0.52 → 0.65（<strong>升<\/strong>）。这组参数<strong>对其他数据集未必适用<\/strong>。\n\n| 随机森林超参数 | 含义 / 默认 |\n|---|---|\n| <strong>n_estimators<\/strong> | 树的数量，默认 <strong>100<\/strong> |\n| <strong>max_depth<\/strong> | 最大深度，默认 <strong>None<\/strong> |\n| <strong>min_samples_split<\/strong> | 分裂内部节点所需最小样本数，默认 <strong>2<\/strong> |\n| <strong>min_samples_leaf<\/strong> | 叶节点最小样本数，默认 <strong>1<\/strong> |\n| <strong>max_features<\/strong> | 找最佳分割时考虑的特征数（auto / sqrt / log2 等） |\n\n### 网格搜索 vs 随机搜索\n\n| | <strong>GridSearchCV（网格搜索）<\/strong> | <strong>RandomizedSearchCV（随机搜索）<\/strong> |\n|---|---|---|\n| 怎么试 | 穷举所有组合 | <strong>随机<\/strong>参数组合（参数 n_iter） |\n| 时间 | 长 | <strong>大大降低<\/strong> |\n| 效果 | 更优 | 可能<strong>稍差<\/strong>——时间和最优性能的权衡 |", "### 总结：模型优化四个法宝（第 10 讲原话，真题考过）\n\n| 法宝 | 原话要点 |\n|---|---|\n| <strong>特征工程<\/strong> | 目标是<strong>提高数据特征与模型的匹配度<\/strong>（选择、变换、构建） |\n| <strong>防过拟合<\/strong> | 模型要<strong>在拟合和泛化之间保持一个平衡<\/strong> |\n| <strong>交叉验证<\/strong> | 利用好有限的数据集；<strong>交叉验证所得到的多次评估结果，能够避免某一次数据集划分不合理所带来的偏差<\/strong>（小数据集上尤其明显） |\n| <strong>参数调优<\/strong> | 每种算法都有自己的一系列可调超参数（外部参数），要找<strong>对于当前数据集而言最好的一套参数<\/strong> |\n\n- 分工：<strong>特征工程从数据预处理角度<\/strong>给出更高质量的数据；<strong>防止过拟合在模型训练过程中<\/strong>控制复杂度；交叉验证和调参从<strong>验证和评估环节<\/strong>入手。\n- 学完这四个，「正式闯过<strong>变现关<\/strong>」。\n\n> 📌 真题「模型优化的可行策略」四个选项<strong>全对<\/strong>：特征工程、防过拟合、交叉验证、GridSearchCV。"]}], "questions": [{"id": "mlo-p1", "type": "single", "stem": "特征工程的三个基本思路是？", "options": ["特征选择、特征变换、特征构建", "数据清洗、数据可视化、数据上线", "训练、验证、测试", "聚类、回归、分类"], "answer": [0], "why": ["对，选择减、变换改、构建增", "那是数据处理流程的环节", "那是数据集的三份", "那是问题类型"], "explain": "选择（减少）、变换（改变）、构建（新增）。", "tags": [], "lesson": 0, "m": "ml_opt"}, {"id": "mlo-p2", "type": "single", "stem": "用 pandas 的 get_dummies 时，`drop_first=True` 返回的是？", "options": ["虚拟变量", "独热编码", "归一化后的数据", "标准化后的数据"], "answer": [0], "why": ["对，丢掉第一个类别，m 个类别得 m-1 列", "False 才是独热编码", "无关", "无关"], "explain": "drop_first=True → 虚拟变量（m-1）。", "tags": [], "lesson": 0, "m": "ml_opt"}, {"id": "mlo-p3", "type": "single", "stem": "判断：特征缩放应该在拆分完训练集和测试集之后进行，参数只能来自训练集", "options": ["正确", "错误"], "answer": [0], "why": ["对，这是原文结论，否则就是数据泄露", "错误，原文就是这么说的"], "explain": "先拆分，再缩放；验证集测试集只 transform。", "tags": [], "lesson": 0, "m": "ml_opt"}, {"id": "mlo-p4", "type": "single", "stem": "在线性回归损失函数里加入 L1 正则项，这种回归叫？", "options": ["Lasso er：基于百分位数缩放，能消除离群值的影响", "MinMaxScaler 归一化会改变数据的分布状态", "Normalizer：将样本缩放为具有单位范数，应用场景较少"], "answer": [0, 1, 2, 4], "why": ["对", "对，通常 0～1，有负值是 -1～1", "对", "错，原文说归一化不会改变数据的分布状态", "对"], "explain": "Standard 均值0方差1；MinMax 归一化不改分布；Robust 抗离群；Normalizer 单位范数。", "tags": ["basic", "core"], "m": "ml_opt"}, {"id": "mlo-4", "type": "multi", "stem": "关于特征缩放与数据泄露，下列说法正确的是？", "options": ["训练集用 fit_transform，验证集和测试集只用 transform", "归一化必须在拆分数据集之前进行，保证全部数据的信息都进入 fit 过程", "使用来自验证集和测试集的任何信息都属于数据泄露", "验证集和测试集要重新 fit 计算自己的缩放参数"], "answer": [0, 2], "why": ["对", "错，必须在拆分之后，参数只能来自训练集", "对，会导致评估性能的潜在偏差", "错，要用从训练集得到的参数"], "explain": "先拆分再缩放，fit 只碰训练集。", "tags": ["basic"], "m": "ml_opt"}, {"id": "mlo-5", "type": "multi", "stem": "下列属于<strong>多变量组合型<\/strong>（需要结合具体模型）特征选择工具的是？", "options": ["RFE（递归特征消除）", "SelectFromModel", "SequentialFeatureSelector", "SelectKBest"], "answer": [0, 1, 2], "why": ["对，每次去掉一个最不重要的特征", "对，基于重要性权重阈值", "对，顺序特征选择，有正向和反向", "错，它是单变量特征选择，独立于模型"], "explain": "SelectKBest 单变量；RFE / SelectFromModel / Sequential 结合模型。", "tags": ["basic"], "m": "ml_opt"}, {"id": "mlo-6", "type": "single", "stem": "常见的两种降维算法中，属于<strong>有监督<\/strong>降维的是？", "options": ["LDA（线性判别分析）", "PCA（主成分分析）", "K-Means", "SelectKBest"], "answer": [0], "why": ["对", "错，PCA 是无监督降维", "那是聚类算法", "那是单变量特征选择"], "explain": "PCA 无监督，LDA 有监督。", "tags": ["basic"], "m": "ml_opt"}, {"id": "mlo-7", "type": "multi", "stem": "关于分桶（分箱），下列说法正确的是？", "options": ["分桶是将连续型特征离散化为一系列的离散值", "分桶能减弱异常数据的权重，还能提高模型的运算速度", "等频分桶是指每个桶的宽度固定", "对 R、F、M 值进行聚类，就是一种模型分桶操作"], "answer": [0, 1, 3], "why": ["原文定义", "对", "错，宽度固定是等距分桶；等频是每桶样本数一样", "对，原文原话"], "explain": "等距宽度固定，等频样本一样多，模型分桶靠决策树或聚类。", "tags": ["basic"], "m": "ml_opt"}, {"id": "mlo-8", "type": "single", "stem": "判断：从原始订单数据中求出 R、F、M 值，是一个典型的特征构建", "options": ["正确", "错误"], "answer": [0], "why": ["对，原始数据集中完全不存在这三个值，是靠领域知识造出来的", "错误，原文明确说这是典型的特征构建"], "explain": "造出原来没有的新特征 = 特征构建。", "tags": ["basic"], "m": "ml_opt"}, {"id": "mlo-9", "type": "multi", "stem": "机器学习中防止过拟合的方法包括？", "options": ["增加数据集中数据的数量", "进行优质的特征工程，筛除无用的特征", "数据集较小或问题简单时，选择更简单的模型（奥卡姆剃刀定理）", "加深决策树的深度", "在损失函数中加入正则项（惩罚项）"], "answer": [0, 1, 2, 4], "why": ["对，一定程度上能防止过拟合", "对", "对", "错，树越深越容易过拟合，应该剪枝", "对"], "explain": "加数据、做特征、选简单、加正则；别把树加深。", "tags": ["basic"], "m": "ml_opt"}, {"id": "mlo-10", "type": "multi", "stem": "关于 L1 和 L2 正则项，下列说法正确的是？", "options": ["添加 L1 正则项后，一些绝对值较小的系数会直接变为 0，相当于抛弃了一些特征", "添加 L1 正则项的回归叫 Lasso 回归", "添加 L2 正则项后，模型在不抛弃任何特征的情况下缩小回归系数", "添加 L2 正则项的回归叫 Lasso 回归", "正则项也叫惩罚项"], "answer": [0, 1, 2, 4], "why": ["对", "对", "对", "错，L2 是 Ridge（岭）回归", "对"], "explain": "L1 Lasso 变 0，L2 Ridge 只缩小不丢。", "tags": ["basic", "core"], "m": "ml_opt"}, {"id": "mlo-11", "type": "single", "stem": "过拟合的形成过程一般经历哪三个阶段？", "options": ["欠拟合、平衡点、过拟合", "训练、验证、测试", "构造、剪枝、预测", "选择、变换、构建"], "answer": [0], "why": ["对", "那是数据集三份", "那是决策树的阶段（只有构造和剪枝两个）", "那是特征工程三思路"], "explain": "欠拟合 → 平衡点 → 过拟合。", "tags": ["basic"], "m": "ml_opt"}, {"id": "mlo-12", "type": "multi", "stem": "关于过拟合，下列说法正确的是？", "options": ["过拟合就是指模型过度地适应了训练集，在其它类似的数据集上反而表现不好", "模型经过充分训练之后，就能够减少过拟合", "只要树的深度足够，决策树在训练集上肯定能够达到 100% 的准确率", "我们用机器学习建模的过程，就是和过拟合现象持续作斗争的过程"], "answer": [0, 2, 3], "why": ["原文定义", "错，充分训练后会完全拟合训练集，恰恰导致过拟合", "对，if...else 可以无限制地写下去", "原文原句"], "explain": "训练集满分不等于好模型，要的是泛化能力。", "tags": ["basic"], "m": "ml_opt"}, {"id": "mlo-13", "type": "multi", "stem": "关于决策树，下列说法正确的是？", "options": ["生成一个决策树有两个阶段：构造和剪枝", "树最底部的节点叫叶节点，也就是决策结果", "应该选择熵比较大的特征作为根节点", "对决策树进行剪枝也可以称得上是一种正则化"], "answer": [0, 1, 3], "why": ["对", "对", "错，熵越大越不确定，应选熵比较小的特征作根节点", "对，剪枝也是对模型进行约束"], "explain": "构造 + 剪枝；根节点选熵小的；剪枝也是正则化。", "tags": ["basic"], "m": "ml_opt"}, {"id": "mlo-14", "type": "single", "stem": "判断：第 7 讲的三个模型中，随机森林本身就可以基于决策树的过拟合问题实现优化", "options": ["正确", "错误"], "answer": [0], "why": ["对，所以示范时简化的是决策树和线性回归", "错误，原文说的就是随机森林本身能优化过拟合"], "explain": "决策树、线性回归易过拟合；随机森林本身是正则化了的模型。", "tags": ["basic"], "m": "ml_opt"}, {"id": "mlo-15", "type": "single", "stem": "逻辑回归中与正则化相关的参数是？", "options": ["C 值", "max_depth", "n_splits", "drop_first"], "answer": [0], "why": ["对，原文原话", "那是决策树深度", "那是 KFold 折数", "那是 get_dummies 的参数"], "explain": "逻辑回归的 C 值 = 正则化参数。", "tags": ["basic"], "m": "ml_opt"}, {"id": "mlo-16", "type": "multi", "stem": "请选出机器学习模型优化的可行策略？", "options": ["通过特征工程提高数据特征与模型的匹配度来提高性能", "通过防止过拟合，让模型在拟合和泛化之间保持一个平衡", "交叉验证所得到的多次评估结果，能够避免某一次数据集划分不合理所带来的偏差", "每种算法都有自己的一系列可调超参数，GridSearchCV 可以帮我们找到对当前数据集最好的一套参数"], "answer": [0, 1, 2, 3], "why": ["对，法宝一", "对，法宝二", "对，法宝三", "对，法宝四"], "explain": "四个法宝全对：特征工程、防过拟合、交叉验证、调参。", "tags": ["basic"], "m": "ml_opt"}, {"id": "mlo-17", "type": "multi", "stem": "关于交叉验证，下列说法正确的是？", "options": ["将训练集分为 k 等份，k-1 份做训练、1 份做验证，重复 k 次", "每个数据样本都有 1 次机会进入验证集，并用于训练模型 k-1 次", "交叉验证的目的是训练出一个新的、更好的模型", "k 值一般取 3、5、10，实操中以 10 折居多", "把 k 次评估分数取平均，得到交叉验证的最终结果"], "answer": [0, 1, 3, 4], "why": ["对", "对", "错，原文强调它只是一种评估方式，并不是在试图训练新模型", "对", "对"], "explain": "交叉验证 = 评估方式，不是训练新模型。", "tags": ["basic", "core"], "m": "ml_opt"}, {"id": "mlo-18", "type": "multi", "stem": "关于 KFold 的参数，下列说法正确的是？", "options": ["n_splits 默认值为 5，必须至少为 2", "shuffle 默认值为 True，拆分前一定会打乱数据", "random_state 默认值为 None", "KFold 在 sklearn.model_selection 中"], "answer": [0, 2, 3], "why": ["对", "错，shuffle 默认是 False", "对", "对"], "explain": "n_splits=5，shuffle=False，random_state=None。", "tags": ["basic"], "m": "ml_opt"}, {"id": "mlo-19", "type": "single", "stem": "不用手动 KFold 拆分，一个函数就能完成 K 折拆分、训练和验证，一次性得到交叉验证结果的是？", "options": ["cross_val_score", "train_test_split", "GridSearchCV", "get_dummies"], "answer": [0], "why": ["对", "那只拆一次训练集 / 测试集", "那是网格搜索调参", "那是生成虚拟变量"], "explain": "一步交叉验证 → cross_val_score。", "tags": ["basic"], "m": "ml_opt"}, {"id": "mlo-20", "type": "multi", "stem": "关于网格搜索 GridSearchCV，下列说法正确的是？", "options": ["名称中的 CV 指 cross validation（交叉验证）", "它在本质上是一种穷举法", "n_jobs 设为 -1 表示使用所有可用的处理器", "它找到的最优参数对所有数据集都适用", "可以通过 best_params_ 属性查看最优超参数组合"], "answer": [0, 1, 2, 4], "why": ["对", "对，挨个尝试超参数组合", "对，要谨慎使用", "错，原文说对其他数据集未必适用", "对"], "explain": "网格搜索 = 穷举 + 交叉验证；最优只针对当前数据集。", "tags": ["basic", "core"], "m": "ml_opt"}, {"id": "mlo-21", "type": "multi", "stem": "和 GridSearchCV 相比，RandomizedSearchCV（随机搜索）的特点是？", "options": ["对于相同参数空间，运行时间大大降低", "采用随机参数组合", "返回的模型性能可能会稍差", "一定能找到比网格搜索更好的参数"], "answer": [0, 1, 2], "why": ["对", "对", "对，这是时间和最优性能的权衡", "错，绝对化；它可能稍差"], "explain": "随机搜索：快，但可能稍差。", "tags": ["basic"], "m": "ml_opt"}, {"id": "mlo-22", "type": "multi", "stem": "关于数据集划分，下列说法正确的是？", "options": ["训练集用来训练模型，验证集用来模型调优，测试集用来评估模型性能", "数据集越大，就越不容易出现过拟合的现象", "交叉验证的流程中，要先把测试集预留出来放在一边", "交叉验证会让测试集也参与每一轮训练"], "answer": [0, 1, 2], "why": ["原文原句", "原文原句", "对，第一步就是预留测试集", "错，测试集最后才用来评估最终模型"], "explain": "训练、验证调优、测试评估；测试集留到最后。", "tags": ["basic"], "m": "ml_opt"}, {"id": "mlo-23", "type": "single", "stem": "判断：经过网格搜索调参后，随机森林在训练集上的分数降低了，但在验证集上的分数提升了", "options": ["正确", "错误"], "answer": [0], "why": ["对，0.89→0.77，0.52→0.65", "错误，原文结果正是训练分降、验证分升"], "explain": "训练分降、验证分升 = 泛化变好。", "tags": ["basic"], "m": "ml_opt"}, {"id": "mlo-24", "type": "single", "stem": "随机森林的超参数 n_estimators 代表什么？", "options": ["森林中树木的数量", "树的最大深度", "叶节点最少样本数", "交叉验证折数"], "answer": [0], "why": ["对，默认 100", "那是 max_depth", "那是 min_samples_leaf", "那是 cv"], "explain": "n_estimators = 树的棵数（默认 100）。", "tags": ["basic"], "m": "ml_opt"}]}, {"id": "ml_dl", "title": "激活关：深度学习（CNN、RNN、提升神经网络效果）", "short": "深度学习", "group": "机器学习 · 激活关", "exam": "第 11—13 讲", "refs": [], "lessons": [{"title": "深度学习基础：为什么用、用什么、张量", "cards": ["### 一句话\n\n<strong>深层神经网络 = 由大量人工神经元相互联结而成的模型。<\/strong>原文：这些神经元都具有<strong>可以调整的参数<\/strong>，而<strong>训练机器、建立模型的过程，也就是确定网络参数的过程。一旦参数确定，模型也就确定下来了。<\/strong>\n\n结构：<strong>输入层<\/strong>（特征）→ <strong>网络隐层<\/strong>（神经元，也叫中间层）→ <strong>输出层<\/strong>（分类概率）。\n\n### 深度学习 vs 传统机器学习\n\n| | 传统机器学习 | 深度学习 |\n|---|---|---|\n| 特征工程 | 要先做各种特征工程，让数据「计算机友好」 | <strong>自动进行特征提取<\/strong>，省略手工特征工程 |\n| 擅长 | 结构化表格数据 | <strong>特别擅长处理非结构化的数据<\/strong>（图像、文本） |\n| 代表工具 | <strong>sklearn<\/strong> 一枝独秀 | <strong>TensorFlow<\/strong> 和 <strong>PyTorch<\/strong> 两强争霸 |\n\n- 原话：深层神经网络的厉害之处在于「它能对<strong>非结构的数据集<\/strong>进行<strong>自动的复杂特征提取<\/strong>，完全不需要人工干预」。\n- 图片、视频、文本的特征维度巨大（一张 150×150 的 RGB 图就有 150×150×3 个特征），「<strong>除了深层神经网络之外，传统机器学习方法根本解决不了<\/strong>」。\n- 图像分类识别问题，「深度学习中的<strong>卷积神经网络 CNN 是不二之选<\/strong>」。\n\n> 📌 看到「自动提取特征」「非结构化数据」→ 深度学习。说深度学习「需要大量人工特征工程」→ 错。", "### 深度学习框架：对号入座\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 来自 <strong>Google<\/strong>，可直接部署模型，保持<strong>工业界霸主<\/strong>地位 | <strong>TensorFlow<\/strong> |\n| 来自 <strong>Facebook<\/strong>，开发环境更有亲和力、支持动态训练，受<strong>学术界<\/strong>欢迎 | <strong>PyTorch<\/strong> |\n| TensorFlow 内置的<strong>高级 API<\/strong>，「<strong>初学者进入深度学习领域的最佳入门选择<\/strong>」 | <strong>Keras<\/strong> |\n\n- TensorFlow 和 PyTorch <strong>都是开源项目<\/strong>。Keras 把 TensorFlow 的底层功能做了良好封装。\n\n### 在哪跑：Kaggle（了解即可）\n\n- Kaggle「是一个<strong>在线 Jupyter Notebook 平台<\/strong>」，有数据集、源代码、课程资料；Kaggle Notebook「其实就是<strong>网页版的 Jupyter Notebook<\/strong>」。\n- 可以用 <strong>GPU、TPU<\/strong> 等加速器（跑深度学习时打开 GPU，跑完记得关）；要 `pip install` 新包得打开 <strong>Internet<\/strong> 选项。\n- TensorFlow 和 Keras 已集成在 Kaggle Notebook 里，不用安装。\n\n> 📌 记法：<strong>TensorFlow = Google + 工业界；PyTorch = Facebook + 学术界；Keras = 新手入口。<\/strong>", "### 张量：神经网络吃的数据格式\n\n<strong>张量 = NumPy 数组。<\/strong>原文：特征集 X 不再是 DataFrame，而是 NumPy 数组，「在机器学习里，我们把它称为‘<strong>张量<\/strong>’」；NumPy 的 <strong>shape<\/strong> 属性就是张量的形状。\n\n| 东西 | 几阶张量 |\n|---|---|\n| 标量（一个数） | <strong>0D<\/strong> |\n| 向量（一串数） | <strong>1D<\/strong> |\n| 矩阵 / DataFrame 二维表格 | <strong>2D<\/strong>（2 阶） |\n| <strong>文本<\/strong>数据集 | <strong>3 阶<\/strong>：（样本，序号，字编码） |\n| <strong>图片<\/strong>数据集 | <strong>4 阶<\/strong>：（图片数量，宽，高，颜色通道） |\n| <strong>视频<\/strong>数据集 | <strong>5 阶<\/strong>：（样本，帧，高度，宽度，颜色深度） |\n\n- 花朵项目 `X.shape` = <strong>(3265, 150, 150, 3)<\/strong>：3265 张图、150×150 像素、RGB <strong>3<\/strong> 个颜色通道，是 <strong>4 阶张量<\/strong>。四个维度<strong>缺一个都无法精准描述<\/strong>这个图片数据集。\n- <strong>「阶」和「维度」的区别<\/strong>：说张量时说「几<strong>阶<\/strong>」；每一阶上特征的个数叫「特征的<strong>维度<\/strong>」。例：宽度这一阶有 150 个维度。\n\n### 数据准备里的几个考点\n\n| 步骤 | 做法 |\n|---|---|\n| 读图片 | <strong>OpenCV<\/strong>（跨平台开源计算机视觉库）的 imread、resize，裁成 150×150 |\n| 标签编码 | <strong>LabelEncoder<\/strong> 编码，再用 <strong>to_categorical<\/strong> 转成 <strong>One-hot 编码<\/strong> |\n| 特征工程 | <strong>不用做复杂特征工程<\/strong>（网络能自动提取） |\n| 归一化 | <strong>X = X/255<\/strong>，把 0—255 的像素值压到 <strong>0—1<\/strong>。原话：「<strong>神经网络特别喜欢小范围的数值<\/strong>」「这个步骤<strong>非常重要<\/strong>，不然神经网络会<strong>跑不起来<\/strong>」 |\n| 拆分 | train_test_split，test_size=0.2 |\n\n- 4 种花：daisy 雏菊、rose 玫瑰、sunflower 向日葵、tulip 郁金香。One-hot 标签 [1,0,0,0] = 雏菊，以此类推。\n\n> 📌 必背：<strong>图片 4 阶、视频 5 阶、文本 3 阶、表格 2 阶。<\/strong>"]}, {"title": "卷积神经网络 CNN 与 Keras 搭网络", "cards": ["### CNN 的结构（从左到右）\n\n<strong>输入层 → 卷积层 → 最大池化层 → 卷积层 → 最大池化层<\/strong>（这一段叫「特征学习」）<strong>→ 展平层 → 全连接层 → 全连接层 + Softmax（输出层）<\/strong>（这一段叫「分类输出」）\n\n原文总结：「<strong>卷积神经网络由输入层、一个或多个卷积层和输出层的全连接层组成。<\/strong>」\n\n| 层 | 干什么 |\n|---|---|\n| <strong>输入层<\/strong> | 初始处理（标准化、图片压缩、降维），变成（样本，高，宽，颜色深度）的形状 |\n| <strong>卷积层<\/strong> | <strong>抽取图片特征<\/strong>；其中的<strong>卷积核「也叫滤波器，能够自动进行图像特征的提取」<\/strong> |\n| <strong>池化层<\/strong> | 接在卷积层后，<strong>降低特征空间的维度<\/strong>；分<strong>最大池化<\/strong>（取窗口内最大值）和<strong>平均池化<\/strong>（取平均值） |\n| <strong>展平层<\/strong> | 把网络<strong>展平<\/strong> |\n| <strong>全连接层<\/strong> | 展平后接一个普通全连接层 |\n| <strong>输出层<\/strong> | 也是全连接层，用 <strong>Softmax<\/strong> 激活做分类输出。原话：「<strong>所有神经网络都是用 Softmax 做多分类的激活函数<\/strong>」 |\n\n### 三句必背原话\n\n1. 通常「<strong>卷积 + 池化<\/strong>」的组合要<strong>重复搭建几次<\/strong>，形成<strong>深度卷积网络<\/strong>；\n2. 这个过程中，图片特征张量的<strong>尺寸逐渐减小<\/strong>，而<strong>深度逐渐加深<\/strong>（从扁扁的纸片变成胖胖的矩形）；\n3. 卷积层中的<strong>参数远少于全连接层<\/strong>——因为神经元之间不是全部连接，而是以卷积方式<strong>有选择性地局部连接<\/strong>。这样既大大<strong>减少参数数量<\/strong>，又<strong>有利于提取图像特征<\/strong>。\n\n> 📌 陷阱：说「CNN 比全连接网络复杂，所以参数更多」→ <strong>错<\/strong>，卷积层参数<strong>更少<\/strong>。说「尺寸逐渐变大、深度变浅」→ <strong>错<\/strong>。", "### Keras 搭网络：层名对号入座\n\n原话：「神经网络中最主要的结构是‘<strong>层<\/strong>’，各种各样不同的层像<strong>拼积木<\/strong>一样组合起来，就形成了各种各样的神经网络。」\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 创建一个模型，<strong>像盖楼一样一层一层往上堆<\/strong> | <strong>models.Sequential()<\/strong>（<strong>序贯模型<\/strong>，最简单；另一种「函数式模型」较高级、少见） |\n| <strong>卷积层<\/strong>，CNN 的<strong>关键层<\/strong>，决定了它是卷积神经网络 | <strong>Conv2D<\/strong> |\n| 最大池化层 | <strong>MaxPooling2D<\/strong> |\n| 展平层 | <strong>Flatten<\/strong> |\n| 全连接层 | <strong>Dense<\/strong> |\n| 往模型里加层 | <strong>add<\/strong> |\n| 指定输入数据的形状（不对就报错） | <strong>input_shape<\/strong>，如 (150, 150, 3) |\n\n- `Conv2D(64, (3, 3), activation='relu')`：<strong>64 = 输出滤波器的数量<\/strong>（输出空间的维度），<strong>(3, 3) = 卷积窗口的高和宽<\/strong>。\n- 「<strong>relu 是一个常用的激活函数<\/strong>」；输出层 `Dense(4, activation='softmax')`，<strong>softmax 用于多分类输出<\/strong>（4 种花就 4 个输出）。\n- 中间层（隐层）「少可以两三层，多可以几万层」，加多少「<strong>并无一定之规<\/strong>」。层组合有误或 input_shape 与 X 形状不匹配，<strong>编译时就会报错<\/strong>。\n\n### 怎么区分 DNN、CNN、RNN\n\n<strong>关键看输入层和中间层主要是什么层：<\/strong>\n\n| 网络 | 主要的层 |\n|---|---|\n| 普通神经网络 <strong>DNN<\/strong> | <strong>Dense<\/strong> |\n| 卷积神经网络 <strong>CNN<\/strong> | <strong>Conv1D、Conv2D、Conv3D<\/strong> |\n| 循环神经网络 <strong>RNN<\/strong> | <strong>SimpleRNN、GRU、LSTM<\/strong> |", "### 编译、训练、评估、预测\n\n| 步骤 | 语句 / 参数 | 含义 |\n|---|---|---|\n| 编译 | `compile(loss=..., optimizer=..., metrics=...)` | <strong>损失函数、优化器、评估指标<\/strong>（CNN 用 categorical_crossentropy、RMSprop、acc） |\n| 训练 | `fit(...)`，结果存进 <strong>history<\/strong> 对象 | |\n| | <strong>epochs<\/strong>=10 | <strong>训练轮次<\/strong>（梯度下降的次数） |\n| | <strong>validation_split<\/strong>=0.2 | 训练的同时<strong>自动从训练集拆一部分出来做验证<\/strong> |\n| | <strong>batch_size<\/strong> | <strong>批量大小<\/strong>（第 13 讲出现） |\n| 评估 | <strong>evaluate<\/strong>(X_test, y_test) | 测试集准确率 |\n| 预测 | <strong>predict<\/strong> | 输出<strong>每类的概率<\/strong>；再用 <strong>np.argmax<\/strong> 取最大概率那一类 |\n\n- 原话：「每一个轮次，其实就是神经网络对其中的每一个神经元<strong>自动调参、通过梯度下降进行最优化<\/strong>的过程。」\n- 损失曲线：训练集损失下降，测试集损失<strong>跳跃<\/strong>→ 性能不稳定，<strong>似乎有过拟合<\/strong>。\n- 结果：花朵 CNN 测试准确率 <strong>0.69 以上<\/strong>。\n\n### 本讲重点（原文）\n\n1. CNN 能够通过<strong>卷积核（也叫滤波器）<\/strong>，<strong>自动进行图像特征的提取<\/strong>。\n2. 用 <strong>Keras<\/strong> 的高级 API 可以轻松搭建给图片分类的 CNN，其中的<strong>关键神经层就是 Conv2D<\/strong>。", "### 补充：激活函数和损失函数（真题考过）\n\n> 💡 激活函数在<strong>第 15 讲<\/strong>有专门讲解（见「留存·分类·评估」模块），这里先汇总一下真题考到的说法。标「补充」的只有 sparse 那一行，是 Keras 通行说法，原文没讲。\n\n<strong>激活函数<\/strong>：给神经元的输出加一道「变形」。\n\n| 说法 | 对错 |\n|---|---|\n| <strong>relu 是常用的激活函数<\/strong>（原文） | 对 |\n| relu 最常用，但还有 prelu、elu 等可选（第 15 讲） | 对 |\n| 没有激活函数，网络就是<strong>纯线性<\/strong>的（第 15 讲：激活函数用来引入非线性） | 对 |\n| <strong>多分类输出层用 softmax<\/strong>（原文） | 对 |\n| 分类的最后一层要用 relu | <strong>错<\/strong>，二分类输出层常用 sigmoid（0—1 的概率），多分类用 softmax |\n| tanh 比 relu 训练更快 | <strong>错<\/strong>，第 15 讲说 ReLU 加速收敛，tanh 输入大时会梯度消失 |\n\n<strong>损失函数<\/strong>（原文第 13 讲，加补充一行）：\n\n| 问题 | 损失函数 |\n|---|---|\n| <strong>多元分类<\/strong>（标签是 <strong>One-hot<\/strong>） | <strong>categorical_crossentropy<\/strong>（分类交叉熵） |\n| <strong>二元分类<\/strong> | <strong>binary_crossentropy<\/strong>（二元交叉熵） |\n| <strong>回归<\/strong> | <strong>mse<\/strong>（mean_squared_error，均方误差） |\n| 多分类、标签是<strong>整数<\/strong>（补充） | sparse_categorical_crossentropy（稀疏分类交叉熵） |\n\n> 📌 陷阱：<strong>One-hot ↔ categorical；整数 ↔ sparse<\/strong>。题目把两者对调就是错的。"]}, {"title": "循环神经网络 RNN：LSTM、GRU 与时间序列", "cards": ["### 一句话\n\n<strong>RNN（Recurrent Neural Network，循环神经网络）= 有「记忆」的神经网络。<\/strong>\n\n原文：和其它神经网络相比，「<strong>最大的不同是它建立了自身的记忆机制<\/strong>，增加了<strong>时间相关的状态信息<\/strong>在各层神经元间的<strong>循环传递机制<\/strong>」。\n\n- 当前输出和前面神经元的输出<strong>有关<\/strong>；<strong>隐藏层之间不再是不相连的，而是有连接的<\/strong>；\n- 能更自由、动态地获取输入信息，<strong>不受定长输入空间的限制<\/strong>；\n- 对照：<strong>前馈神经网络<\/strong>（Feed-Forward）没有这种循环。\n- 为什么需要记忆：「给老王买个___」应填「玩具」。原话：要实现类似人脑的语义判别能力，「<strong>必须从所有过去的句子中保留一些信息，以便能理解整个故事的上下文<\/strong>」。\n\n### 适合什么数据\n\n<strong>「新内容依赖于上下文或者历史信息」的数据<\/strong>：\n\n| 场景 | 例子 |\n|---|---|\n| <strong>自然语言处理<\/strong> / 文本 | 给老王买礼物 |\n| <strong>视频处理<\/strong> | 当前帧取决于之前几帧 |\n| <strong>时间序列分析<\/strong> | 根据前 60 天激活数预测未来 |\n\n> 📌 共同点：「要预测的内容，<strong>和之前一段时间的特征值密切相关<\/strong>」→ 选 RNN。", "### Keras 里的三种循环层\n\n原文：「在 Kares 中，主要有<strong>三种<\/strong>循环神经网络层……分别是 <strong>Simple RNN、LSTM 和 GRU<\/strong>。」\n\n| 层 | 一句话 | 看到题目说…… |\n|---|---|---|\n| <strong>SimpleRNN<\/strong> | <strong>最简单<\/strong>的循环结构，只在输入 X 上加了时间状态 h_t（记忆） | 缺陷：<strong>短期记忆问题<\/strong>，早期输入影响小 |\n| <strong>LSTM<\/strong>（长短期记忆网络） | 神经元由<strong>一个遗忘门、一个输入门、一个输出门和一个记忆细胞<\/strong>组成 | 解决<strong>梯度消失<\/strong>、能记住长期信息、「<strong>穿越时空的旅程<\/strong>」、<strong>性能最理想<\/strong> / 最强大 |\n| <strong>GRU<\/strong> | 复杂性<strong>介于 SimpleRNN 和 LSTM 之间<\/strong>，比 LSTM 简单 | 「<strong>速度和性能的折衷选择<\/strong>」 |\n\n- <strong>复杂度从简单到复杂：SimpleRNN → GRU → LSTM。<\/strong>\n- SimpleRNN 为什么短期记忆：梯度从后往前反向传播时<strong>呈指数缩小<\/strong>，小梯度几乎不更新权重，所以<strong>较早期的信息对预测影响小<\/strong>。\n- LSTM 里：<strong>记忆细胞<\/strong>负责记住时间相关信息，<strong>三个门<\/strong>负责调节进出神经元的信息流。\n- 激活数项目「如果仅从性能角度考虑，那 <strong>LSTM 是最理想的<\/strong>」，所以本讲主要用 LSTM 层。\n\n> 📌 陷阱：说顺序是「SimpleRNN、LSTM、GRU」→ <strong>错<\/strong>，GRU 在中间。", "### 时间序列项目：预测 App 日激活数\n\n| 考点 | 原文 |\n|---|---|\n| 问题类型 | 有标签（激活数）→ <strong>监督学习<\/strong>；标签是连续数值 → <strong>回归问题<\/strong> |\n| 时间序列定义 | 「和日期、时间相关的，并且<strong>以连续性数值为特征<\/strong>的数据集，就叫做<strong>时间序列数据<\/strong>，简称<strong>时序数据<\/strong>」 |\n| 典型时序数据 | <strong>股票价格、点击数、产品销售数量<\/strong> |\n| 「日期」能直接当特征吗 | <strong>不能<\/strong>，日期和激活数之间<strong>不存在相关性<\/strong>；但日期仍是重要信息（过去的状态和日期关联） |\n| 特征怎么构造 | 把<strong>之前 30 天或 60 天<\/strong>的数据作为特征；本项目用 <strong>60 个时间步长<\/strong>（步长 = 时间相关的历史特征数据点） |\n| 拆分 | 以 <strong>2020 年 10 月 1 日<\/strong>为界，之前训练、之后测试（时序数据<strong>按时间切<\/strong>） |\n| 归一化 | 「神经网络<strong>非常不喜欢数值跨度大<\/strong>的数据」→ <strong>MinMaxScaler<\/strong> 压到 0—1 |\n| 输入形状 | X_train 是 <strong>(579, 60, 1)<\/strong> 的<strong>三阶张量<\/strong>；「输入的张量形状非常重要……<strong>绝不能错<\/strong>」，用 <strong>reshape<\/strong> 调形状 |\n| 预测后 | 用 <strong>inverse_transform 反归一化<\/strong>，否则激活数是 0—1 之间的值 |\n| 编译 | loss='<strong>mean_squared_error<\/strong>'、optimizer='rmsprop'、metrics=['<strong>mae<\/strong>'] |\n| 训练 | epochs=<strong>50<\/strong>，validation_split=0.2 |\n| 损失曲线 | 回归问题<strong>没有分类准确率，只有损失值<\/strong>；测试集损失<strong>振荡上升<\/strong>——「<strong>过拟合的一个标志<\/strong>」 |\n\n### 可选的时序预测算法\n\n- 普通的回归算法；\n- 专门处理时序的 <strong>AR（自回归）、MA（滑动平均）、ARMA、ARIMA<\/strong>；\n- Facebook 发布的 <strong>Prophet<\/strong> 算法；\n- 「<strong>最为高效、最常用<\/strong>的时序预测模型，仍然莫过于深度学习中的 <strong>RNN<\/strong> 了。」\n\n### 本讲重点（原文）\n\n1. 循环神经网络的神经元间存在<strong>循环传递机制<\/strong>，使它有<strong>记忆功能<\/strong>，适合处理<strong>自然语言、视频和时间序列<\/strong>。\n2. Keras 提供三种循环层：<strong>SimpleRNN、GRU 和 LSTM<\/strong>。\n\n> 总结里的提醒：预测未来很难，<strong>不能单纯依赖模型<\/strong>结果，还要结合产品、运营等更多信息。"]}, {"title": "3 招提升神经网络效果", "cards": ["### 总览\n\n深度学习调优和普通机器学习类似，从<strong>三个方面<\/strong>考虑：<strong>数据处理、网络模型本身、参数调优<\/strong>。\n\n| 阶段 | 招数 | 解决什么 |\n|---|---|---|\n| 数据 | <strong>① 数据增广<\/strong> | 带标签的图片太少 → 一张变多张 |\n| 训练 | <strong>② 添加 Dropout 层<\/strong> | 防止<strong>过拟合<\/strong> |\n| 调参 | <strong>③ 更新优化器并设置学习速率<\/strong> | 防止卡在<strong>局部最低点<\/strong> |\n\n- 原文本讲重点：1. 通过<strong>数据增广<\/strong>创建更多训练图片；2. <strong>添加 Dropout 层<\/strong>是防止神经网络过拟合的好方法；3. 可以在<strong>编译时选择不同的网络优化器<\/strong>。\n- 数据「质」= 特征工程，但「<strong>神经网络对特征工程的要求是比较低的<\/strong>，因为神经网络本身就可以完成特征提取」；所以重点在提升「<strong>量<\/strong>」。", "### ① 数据增广（data augmentation，也叫数据增强）\n\n原话：数据增广是「大杀器」，「<strong>它能通过已有的图片，增加数据量，从而提高卷积网络图像处理问题的性能，增强模型的泛化能力<\/strong>」。\n\n<strong>常用图像增广方式（清单）<\/strong>：<strong>水平翻转<\/strong>、一定程度的<strong>位移<\/strong>、<strong>颠倒<\/strong>、<strong>倾斜<\/strong>、<strong>裁剪<\/strong>、<strong>颜色抖动<\/strong>（color jittering）、<strong>平移<\/strong>、<strong>虚化<\/strong>或者<strong>增加噪声<\/strong>；还能组合（比如同时旋转和随机尺度变换、调 HSV 饱和度和明度）。\n\n| 看到题目说…… | 就选 |\n|---|---|\n| Keras 里定义数据增广器的工具 | <strong>ImageDataGenerator<\/strong> |\n| 训练时动态生成增强后的训练集 | <strong>augs_gen.flow<\/strong> |\n| 增广后训练速度 | <strong>变慢<\/strong>了很多（增广需要时间） |\n| 效果 | 测试准确率 <strong>60.03% → 78.56%<\/strong> |\n\n- 「<strong>数据的量越大，模型出现过拟合的风险就越小<\/strong>」；数据多多益善不只对 CNN，对其他模型也一样。\n- 参数举例：rotation_range（旋转）、zoom_range（缩放）、width/height_shift_range（平移）、horizontal_flip（水平翻转）。", "### ② Dropout 层：防止过拟合\n\n- 是谁：深度学习三巨头之一 <strong>杰弗里·欣顿（Geoffrey Hinton）<\/strong>和学生发现的。\n- 做什么：「把一种叫做 <strong>Dropout<\/strong> 的层添加到了神经网络中，将该层的<strong>一部分神经元的输出特征随机丢掉（设为 0）<\/strong>，相当于<strong>随机消灭一部分神经元<\/strong>。」\n- 为什么有效：「这就是神经网络中<strong>最常用的正则化机制<\/strong>」，正则化 = 让模型<strong>粗糙一点儿<\/strong>，不过分追求完美。灵感来自<strong>银行柜员轮岗防欺诈<\/strong>——打破神经元之间的「固定套路」。\n- 原文总结：Dropout「通过<strong>阻止各个神经元之间的共同作用<\/strong>，阻止它们形成<strong>固定的特征提取模式<\/strong>来提高神经网络的<strong>泛化能力<\/strong>」。\n\n| 必背 | |\n|---|---|\n| `Dropout(0.2)` 的 0.2 | 被随机丢弃的神经元<strong>比例<\/strong>，<strong>通常设为 0.2 ~ 0.5<\/strong> |\n| 什么时候起作用 | 「Dropout <strong>只是对训练集起作用<\/strong>，<strong>在测试时没有神经元被丢掉<\/strong>」 |\n| 地位 | 「对于<strong>大型的深层神经网络<\/strong>来说，添加 Dropout 层已经是一个<strong>标准配置<\/strong>了」 |\n| 效果 | RNN 的均方误差 <strong>0.0614 → 0.0350<\/strong> |\n\n### 为什么神经网络容易过拟合\n\n- 神经网络层次深、神经元多、<strong>参数多<\/strong>；「<strong>对于小数据而言<\/strong>，深度神经网络由于参数数量太多，<strong>容易出现过拟合的风险<\/strong>」。\n- 示意图：左边「<strong>欠拟合—高偏差<\/strong>」，中间「刚刚好」，右边「<strong>过拟合—高方差<\/strong>」。\n- 除了 Dropout，还能增减层数、换层类型（用 GRU 或 SimpleRNN 替换 LSTM），「<strong>没有固定原则，只能反复去尝试<\/strong>」。\n\n> 📌 陷阱：说「Dropout 在测试时也会丢弃神经元」→ <strong>错<\/strong>。", "### ③ 优化器和学习速率：越过局部最低点\n\n<strong>问题<\/strong>：线性回归只有<strong>一个全局最低点<\/strong>；神经网络函数复杂，有<strong>很多局部最低点<\/strong>，那里<strong>导数为 0<\/strong>，梯度下降失去方向感，所以<strong>不能总是得到最佳结果<\/strong>。优化器在<strong>编译时作为参数传入<\/strong>，解决局部最低点问题。\n\n| 优化器 | 一句话 |\n|---|---|\n| <strong>SGD<\/strong> | 利用<strong>动量<\/strong>原理，借助<strong>惯性越过<\/strong>局部最低点（小球滑下山坡） |\n| <strong>Adagrad<\/strong> | <strong>自适应梯度<\/strong>，「<strong>不同的参数可以拥有不同的学习速率<\/strong>」；对<strong>稀疏特征用较大<\/strong>学习速率、非稀疏用较小的；适合<strong>文本词向量<\/strong>这类稀疏数据 |\n| <strong>RMSprop<\/strong> | 解决 Adagrad <strong>学习速率有时急剧下降<\/strong>的问题（窗口滑动加权平均算二阶动量） |\n| <strong>Adam<\/strong> | 基于一阶和二阶矩的自适应估计；计算效率高、内存需求小，「<strong>前面各种优化器的集大成者<\/strong>」，适合数据和参数都大的问题 |\n\n- <strong>学习速率<\/strong>：可理解为「<strong>加速度<\/strong>」。<strong>太小<\/strong>→ 小球<strong>冲不出<\/strong>局部最低点；<strong>大<\/strong>一些→ 可能越过去找到更优参数。\n- 「很多时候，神经网络<strong>完全没有训练起来<\/strong>，就是<strong>优化器以及优化器的学习速率设定的不好<\/strong>。」\n- 常用：<strong>RMSprop 和 Adam<\/strong>；「<strong>Adam<\/strong> 更是多种优化思路的集大成者，<strong>一般情况下是优化器的首选项<\/strong>」。但哪个好要试——深度学习「近似于‘玄学’，<strong>可解释性相对较差<\/strong>」。\n- 示例：`optimizer=Adam(lr=1e-4)`；fit 里 epochs=10、<strong>batch_size=256（批量大小）<\/strong>、validation_data 指定验证集。MSE 进一步降到 <strong>0.0065<\/strong>。\n\n### compile 的 3 个参数\n\n| 参数 | 作用 | 怎么选 |\n|---|---|---|\n| <strong>loss<\/strong> | 损失函数 | <strong>多元分类 categorical_crossentropy；二元分类 binary_crossentropy；回归 mse（均方误差）<\/strong> |\n| <strong>optimizer<\/strong> | 优化器 | <strong>和性能优化最相关<\/strong> |\n| <strong>metrics<\/strong> | 评估指标 | <strong>分类用 acc（准确率）；回归用 mae（平均绝对误差）<\/strong> |\n\n> 📌 epochs、batch_size、validation_split 是 <strong>fit<\/strong> 的参数，不是 compile 的。"]}], "questions": [{"id": "mld-p1", "type": "single", "stem": "深度学习相比传统机器学习，最突出的优势是？", "options": ["能自动进行特征提取，擅长处理非结构化数据", "完全不需要数据", "一定比任何传统模型都快", "只能处理表格数据"], "answer": [0], "why": ["对，原文原话", "数据越多越好", "神经网络训练往往很慢", "恰恰相反，擅长图像、文本"], "explain": "深度学习 = 自动提取特征 + 非结构化数据。", "tags": [], "lesson": 0, "m": "ml_dl"}, {"id": "mld-p2", "type": "single", "stem": "花朵图片数据集 X.shape = (3265, 150, 150, 3)，它是几阶张量？", "options": ["2 阶", "3 阶", "4 阶", "5 阶"], "answer": [2], "why": ["那是表格", "那是文本", "图片数量、宽、高、颜色通道，共 4 阶", "那是视频"], "explain": "图 4 视 5 文 3 表 2。", "tags": [], "lesson": 0, "m": "ml_dl"}, {"id": "mld-p3", "type": "single", "stem": "在 Keras 中，决定一个网络是卷积神经网络的关键层是？", "options": ["Dense", "Conv2D", "LSTM", "Flatten"], "answer": [1], "why": ["全连接层，DNN 的主要层", "卷积层，CNN 的关键层", "循环层，RNN 用", "只是展平层"], "explain": "CNN 的关键神经层 = Conv2D。", "tags": [], "lesson": 1, "m": "ml_dl"}, {"id": "mld-p4", "type": "single", "stem": "CNN 中一般接在卷积层后面、用来降低特征空间维度的是？", "options": ["池化层", "展平层", "输出层", "Dropout 层"], "answer": [0], "why": ["对，分最大池化和平均池化", "它负责把网络展平", "它负责分类输出", "它是防过拟合用的"], "explain": "卷积 + 池化，重复几次。", "tags": [], "lesson": 1, "m": "ml_dl"}, {"id": "mld-p5", "type": "single", "stem": "循环神经网络 RNN 和其它神经网络最大的不同是？", "options": ["建立了自身的记忆机制", "没有隐藏层", "只能处理图片", "不需要训练"], "answer": [0], "why": ["对，时间状态信
