 "响应式、AOP 与 Spring MVC", "short": "响应式·AOP·MVC", "group": "Spring · 第 3 章", "exam": "第 31—45、49—52 讲", "refs": [], "lessons": [{"title": "Reactor 响应式（第 31—35 讲）", "cards": ["### 一句话\n\n<strong>响应式编程 = 把数据看成一条「流」，数据来了就处理，不傻等。<\/strong>Spring 用的响应式库叫 <strong>Project Reactor<\/strong>，它实现了 <strong>Reactive Streams<\/strong> 规范。\n\n### 两个核心类型（必背）\n\n| 类型 | 表示 | 记法 |\n|---|---|---|\n| <strong>Mono<\/strong> | <strong>0 个或 1 个<\/strong>结果 | Mono = 单（mono 是「单一」） |\n| <strong>Flux<\/strong> | <strong>0 个到多个<\/strong>结果 | Flux = 流 |\n\n例子：按 id 查一杯咖啡 → Mono；查所有咖啡 → Flux。\n\n### Reactive Streams 的四个角色（认名字）\n\n<strong>Publisher<\/strong>（发布者，发数据）、<strong>Subscriber<\/strong>（订阅者，收数据）、<strong>Subscription<\/strong>（订阅关系）、<strong>Processor<\/strong>（既发又收）。", "### 三个重要概念\n\n| 概念 | 一句话 |\n|---|---|\n| <strong>订阅才执行<\/strong> | 写好的流水线，<strong>不调用 subscribe() 就什么都不会发生<\/strong> |\n| <strong>背压（backpressure）<\/strong> | <strong>下游告诉上游自己一次能处理多少<\/strong>，防止被数据淹没（通过 request(n)） |\n| <strong>线程调度<\/strong> | 用 <strong>Schedulers<\/strong> 指定在哪种线程上运行；<strong>publishOn<\/strong> 影响它后面的操作，<strong>subscribeOn<\/strong> 影响数据源头 |\n\n### 常用操作符（认名字）\n\n| 操作符 | 作用 |\n|---|---|\n| <strong>map<\/strong> | 把每个元素变成另一个（一对一） |\n| <strong>flatMap<\/strong> | 把每个元素变成<strong>一个新的流<\/strong>再合并 |\n| <strong>filter<\/strong> | 过滤 |\n| <strong>onErrorResume / onErrorReturn<\/strong> | 出错时换一个流 / 返回一个默认值 |\n| <strong>doOnNext<\/strong> | 每来一个元素时顺便做点事（如打日志） |\n\n> 📌 必背：<strong>Mono 0..1，Flux 0..N；不订阅不执行；背压 = 下游控制速度。<\/strong>", "### 对号入座（第 33—35 讲）\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 响应式操作 Redis 的模板 | <strong>ReactiveRedisTemplate<\/strong>（字符串版 ReactiveStringRedisTemplate） |\n| 响应式访问 Redis 需要的客户端 | <strong>Lettuce<\/strong>（Jedis <strong>不支持<\/strong>响应式） |\n| 响应式操作 MongoDB 的模板 | <strong>ReactiveMongoTemplate<\/strong> |\n| 响应式访问<strong>关系型数据库<\/strong>的规范 | <strong>R2DBC<\/strong> |\n| R2DBC 中的连接工厂 / 操作数据库的客户端 | <strong>ConnectionFactory / DatabaseClient<\/strong> |\n\n- 记法：普通版前面加 <strong>Reactive<\/strong> 就是响应式版。\n- <strong>R2DBC<\/strong> = Reactive Relational Database Connectivity（响应式关系数据库连接）。课程录制时它还在<strong>孵化阶段<\/strong>，支持的数据库驱动不多。\n- 传统 JDBC 是<strong>阻塞<\/strong>的，所以响应式访问关系数据库需要 R2DBC。"]}, {"title": "AOP（第 36—38 讲）", "cards": ["### 一句话\n\n<strong>AOP（面向切面编程）= 不改原来的代码，在方法执行的前后自动加一段逻辑。<\/strong>\n\n典型用途：打日志、统计耗时、<strong>事务<\/strong>（事务模块讲过，@Transactional 就是靠 AOP 实现的）。这些逻辑到处都要用，叫「<strong>横切逻辑<\/strong>」。\n\n### 术语对号入座（必背）\n\n| 看到题目说…… | 就选 | 记法 |\n|---|---|---|\n| 要加的那段逻辑 + 加在哪，打包在一起 | <strong>切面（Aspect）<\/strong> | 一整块 |\n| 要加的那段逻辑本身（什么时候做、做什么） | <strong>通知（Advice）<\/strong> | 做什么 |\n| 规定<strong>加在哪些方法上<\/strong>的规则 | <strong>切点（Pointcut）<\/strong> | 在哪 |\n| 程序执行中可以加逻辑的点（Spring 里就是方法执行） | <strong>连接点（Join Point）<\/strong> | 可选的点 |\n| 被加了逻辑的原始对象 | <strong>目标对象（Target）<\/strong> | |\n| 把切面加到目标对象上的过程 | <strong>织入（Weaving）<\/strong> | |\n| Spring 生成的、带着额外逻辑的对象 | <strong>AOP 代理（Proxy）<\/strong> | |\n\n> 📌 最常考的三个：<strong>切面 = 通知 + 切点；通知 = 做什么；切点 = 在哪做。<\/strong>", "### 五种通知（必背）\n\n| 注解 | 什么时候执行 |\n|---|---|\n| <strong>@Before<\/strong> | 方法执行<strong>之前<\/strong> |\n| <strong>@AfterReturning<\/strong> | 方法<strong>正常返回<\/strong>之后 |\n| <strong>@AfterThrowing<\/strong> | 方法<strong>抛出异常<\/strong>之后 |\n| <strong>@After<\/strong> | 方法结束后，<strong>不管成功还是出错都执行<\/strong>（像 finally） |\n| <strong>@Around<\/strong> | <strong>包住<\/strong>整个方法，前后都能做事，甚至决定方法执不执行 |\n\n- @Around 里要调用 <strong>ProceedingJoinPoint.proceed()<\/strong> 才会真正执行原方法；\n- 统计方法耗时，最适合用 <strong>@Around<\/strong>（前面记开始时间，后面算差值）。", "### 怎么写一个切面\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 标记一个类是切面 | <strong>@Aspect<\/strong>（还要加 @Component 交给 Spring 管理） |\n| 打开 @Aspect 注解支持 | <strong>@EnableAspectJAutoProxy<\/strong>（Boot 自动打开） |\n| 多个切面谁先执行 | <strong>@Order<\/strong>，<strong>数字越小越先执行<\/strong> |\n\n<strong>切点表达式<\/strong>（写「加在哪些方法上」）常见几种：\n- `execution(...)`：按方法签名匹配，<strong>最常用<\/strong>；\n- `within(...)`：某个包或类里的所有方法；\n- `@annotation(...)`：贴了某个注解的方法；\n- `bean(...)`：某个名字的 Bean。\n\n### 代理的两种方式（认关键词）\n\n| 方式 | 适用 |\n|---|---|\n| <strong>JDK 动态代理<\/strong> | 目标类<strong>实现了接口<\/strong> |\n| <strong>CGLIB<\/strong> | 没有接口，直接给<strong>类<\/strong>生成子类代理 |\n\n课程案例：用 AOP 给所有 Repository 方法打印<strong>执行耗时<\/strong>（第 37 讲）。"]}, {"title": "Spring MVC（第 39—45、49—52 讲）", "cards": ["### 一句话\n\n<strong>Spring MVC 是 Spring 处理网页请求的框架。所有请求先到一个总入口 DispatcherServlet，再由它分派给对应的 Controller。<\/strong>\n\nDispatcherServlet 就像前台：自己不干活，负责把请求转给合适的人。\n\n### 前台身边的几个帮手（认名字）\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 根据网址找到该由哪个方法处理 | <strong>HandlerMapping<\/strong>（映射） |\n| 真正去调用那个处理方法 | <strong>HandlerAdapter<\/strong>（适配器） |\n| 处理过程中出了异常，负责处理异常 | <strong>HandlerExceptionResolver<\/strong> |\n| 把视图名字解析成真正的页面 | <strong>ViewResolver<\/strong>（视图解析器） |\n| 处理文件上传 | <strong>MultipartResolver<\/strong> |\n| 处理语言、地区 | LocaleResolver |", "### Controller 常用注解（必背）\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 处理请求的类 | <strong>@Controller<\/strong> |\n| 处理请求并<strong>直接返回数据<\/strong>（如 JSON） | <strong>@RestController<\/strong> = @Controller + @ResponseBody |\n| 把网址映射到方法 | <strong>@RequestMapping<\/strong> |\n| 只处理 GET / POST / PUT / DELETE 请求 | <strong>@GetMapping / @PostMapping / @PutMapping / @DeleteMapping<\/strong> |\n| 方法返回值直接当响应内容 | <strong>@ResponseBody<\/strong> |\n| 把请求体（如 JSON）转成对象 | <strong>@RequestBody<\/strong> |\n| 取网址路径里的变量，如 /coffee/<strong>{id}<\/strong> | <strong>@PathVariable<\/strong> |\n| 取网址问号后的参数，如 ?name=latte | <strong>@RequestParam<\/strong> |\n| 取请求头 | <strong>@RequestHeader<\/strong> |\n| 指定返回的 HTTP 状态码 | <strong>@ResponseStatus<\/strong> |\n\n@RequestMapping 还可以按 <strong>请求方法、参数、请求头、consumes（接收什么格式）、produces（返回什么格式）<\/strong> 来限定。", "### 父子上下文（第 40 讲）\n\nWeb 程序里可能有两层「容器」：\n\n- <strong>父上下文（根上下文）<\/strong>：放 Service、Repository 等；\n- <strong>子上下文（DispatcherServlet 的）<\/strong>：放 Controller 等 Web 相关的。\n\n规则：<strong>子能看到父里的 Bean，父看不到子的。<\/strong>\n\n> ⚠️ 切面（AOP）只对<strong>同一个上下文<\/strong>里的 Bean 生效。切面放错了上下文，就会「不起作用」。\n\n### 一个请求的处理顺序（第 41 讲）\n\n1. 请求到达 <strong>DispatcherServlet<\/strong>；\n2. 通过 <strong>HandlerMapping<\/strong> 找到处理方法（连同拦截器）；\n3. 找到能调用它的 <strong>HandlerAdapter<\/strong>；\n4. 执行拦截器的 <strong>preHandle<\/strong>；\n5. 调用 Controller 方法；\n6. 执行拦截器的 <strong>postHandle<\/strong>；\n7. 处理返回值：解析视图并渲染，或者处理异常；\n8. 执行拦截器的 <strong>afterCompletion<\/strong>。\n\n> 📌 记顺序：<strong>前台 → 找人（Mapping）→ 找调用方式（Adapter）→ 干活 → 出结果（视图 / 异常）。<\/strong>", "### 参数处理（第 43 讲）\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 把字符串参数转换成别的类型 | <strong>Converter<\/strong>（转换器）/ <strong>Formatter<\/strong>（格式化器） |\n| 校验参数（如不能为空） | <strong>@Valid<\/strong> + 校验注解（@NotNull、@NotEmpty、@Min……） |\n| 拿到校验结果（哪里不合格） | <strong>BindingResult<\/strong> |\n| 接收上传的文件 | <strong>MultipartFile<\/strong> |\n\nSpring Boot 会<strong>自动注册<\/strong>你写好的 Converter、Formatter Bean。\n\n### 视图与返回值（第 44、45 讲）\n\n- 返回<strong>页面<\/strong>：返回一个视图名，<strong>ViewResolver<\/strong> 把名字解析成 <strong>View<\/strong>，再渲染出页面；\n- 返回<strong>数据<\/strong>（@ResponseBody）：由 <strong>HttpMessageConverter<\/strong>（消息转换器）把对象转成 JSON / XML；\n- 根据请求想要的格式选择返回格式，叫<strong>内容协商<\/strong>；\n- 视图名前加 <strong>redirect:<\/strong> 是重定向，加 <strong>forward:<\/strong> 是转发。\n\n> 📌 认准：<strong>返回页面靠 ViewResolver；返回 JSON 靠 HttpMessageConverter。<\/strong>", "### 异常处理（第 49 讲）\n\nDispatcherServlet 把异常交给 <strong>HandlerExceptionResolver<\/strong> 处理。写法：\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 在 Controller 里写一个处理异常的方法 | <strong>@ExceptionHandler<\/strong> |\n| <strong>集中<\/strong>处理所有 Controller 的异常 | <strong>@ControllerAdvice<\/strong>（返回数据用 <strong>@RestControllerAdvice<\/strong>） |\n\n### 拦截器（第 50 讲）\n\n<strong>HandlerInterceptor<\/strong> 在请求处理的三个时机插入逻辑：\n\n| 方法 | 时机 |\n|---|---|\n| <strong>preHandle<\/strong> | 处理<strong>之前<\/strong>（返回 false 就不往下走了） |\n| <strong>postHandle<\/strong> | 处理<strong>之后<\/strong>、渲染视图之前 |\n| <strong>afterCompletion<\/strong> | <strong>整个请求完成<\/strong>之后（包括渲染完） |\n\n注册拦截器：实现 <strong>WebMvcConfigurer<\/strong> 的 <strong>addInterceptors<\/strong> 方法。异步请求用 AsyncHandlerInterceptor。\n\n### 课程答疑（第 52 讲）\n\n从 H2 内存数据库换到 MySQL：改依赖和连接配置；<strong>生产环境慎用自动建表<\/strong>（ddl-auto）。"]}], "questions" e 时，请求不再继续往下处理", "options": ["正确", "错误"], "answer": [0], "why": ["对", "错"], "explain": "preHandle 返回 false 就拦下。", "tags": ["basic"], "m": "sp3"}, {"id": "mvc-13", "type": "single", "stem": "注册拦截器，要实现 WebMvcConfigurer 的哪个方法？", "options": ["addInterceptors", "addFormatters", "addResourceHandlers", "configureViewResolvers"], "answer": [0], "why": ["Interceptor = 拦截器", "注册格式化器", "静态资源", "视图解析器"], "explain": "addInterceptors。", "tags": ["basic"], "m": "sp3"}, {"id": "mvc-14", "type": "single", "stem": "参数校验时，拿到「哪里校验没通过」的结果用？", "options": ["BindingResult", "MultipartFile", "Converter", "ModelAndView"], "answer": [0], "why": ["对", "上传文件", "类型转换", "模型和视图"], "explain": "@Valid + BindingResult。", "tags": ["basic"], "m": "sp3"}, {"id": "mvc-15", "type": "single", "stem": "触发参数校验的注解是？", "options": ["@Valid", "@RequestBody", "@ResponseStatus", "@ExceptionHandler"], "answer": [0], "why": ["对", "请求体", "状态码", "异常"], "explain": "@Valid。", "tags": ["basic"], "m": "sp3"}, {"id": "mvc-16", "type": "single", "stem": "接收上传文件的参数类型是？", "options": ["MultipartFile", "BindingResult", "String", "Converter"], "answer": [0], "why": ["对", "校验结果", "不对", "转换器"], "explain": "MultipartFile。", "tags": ["basic"], "m": "sp3"}, {"id": "mvc-17", "type": "single", "stem": "把逻辑视图名解析成真正的视图的是？", "options": ["ViewResolver", "HttpMessageConverter", "HandlerAdapter", "Converter"], "answer": [0], "why": ["视图解析器", "它负责把对象转成 JSON 等", "调用方法", "参数转换"], "explain": "页面 ViewResolver，数据 HttpMessageConverter。", "tags": ["basic"], "m": "sp3"}, {"id": "mvc-18", "type": "single", "stem": "@ResponseBody 方法返回的对象被转换成 JSON，靠的是？", "options": ["HttpMessageConverter", "ViewResolver", "Formatter", "LocaleResolver"], "answer": [0], "why": ["消息转换器", "视图", "格式化参数", "语言"], "explain": "HttpMessageConverter。", "tags": ["basic"], "m": "sp3"}, {"id": "mvc-19", "type": "single", "stem": "Controller 返回 `\"redirect:/coffee\"` 的效果是？", "options": ["重定向到 /coffee", "转发到 /coffee", "返回字符串 redirect:/coffee", "报错"], "answer": [0], "why": ["redirect = 重定向", "转发是 forward:", "前缀会被识别", "不报错"], "explain": "redirect: 重定向，forward: 转发。", "tags": ["basic"], "m": "sp3"}, {"id": "mvc-20", "type": "single", "stem": "在 Controller 内部写一个专门处理某种异常的方法，贴？", "options": ["@ExceptionHandler", "@ControllerAdvice", "@Valid", "@ResponseBody"], "answer": [0], "why": ["对", "集中处理（类上）", "校验", "响应体"], "explain": "@ExceptionHandler。", "tags": ["basic"], "m": "sp3"}, {"id": "mvc-21", "type": "single", "stem": "【进阶，可跳过】下面的请求处理步骤，正确顺序是？\n\n① HandlerAdapter 调用方法 ② HandlerMapping 找处理方法 ③ 请求到达 DispatcherServlet ④ 处理视图或异常", "options": ["③②①④", "②③①④", "③①②④", "①②③④"], "answer": [0], "why": ["对", "先到前台", "先找方法再调用", "不对"], "explain": "前台 → Mapping → Adapter → 结果。", "tags": ["进阶"], "m": "sp3"}, {"id": "mvc-22", "type": "multi", "stem": "把字符串参数转换成其他类型，可以自定义？", "options": ["Converter", "Formatter", "TypeHandler", "RowMapper"], "answer": [0, 1], "why": ["可以", "可以", "MyBatis 的", "JDBC 的"], "explain": "Boot 会自动注册 Converter / Formatter Bean。", "tags": ["basic"], "m": "sp3"}, {"id": "mvc-23", "type": "single", "stem": "判断：生产环境中建议放心使用 JPA 自动建表", "options": ["正确", "错误"], "answer": [1], "why": ["错", "对：生产环境慎用自动建表"], "explain": "第 52 讲。", "tags": ["basic"], "m": "sp3"}]}, {"id": "sp4", "title": "视图、HTTP 客户端与 REST", "short": "视图·客户端·REST", "group": "Spring · 第 4 章", "exam": "第 46—48、53—66 讲", "refs": [], "lessons": [{"title": "视图与静态资源（第 46—48 讲）", "cards": ["### 返回 JSON / XML（第 46 讲）\n\n- Spring Boot 默认用 <strong>Jackson<\/strong> 库把对象转成 JSON（自动配置好了）；\n- 想返回 <strong>XML<\/strong>：加 <strong>jackson-dataformat-xml<\/strong> 依赖；\n- 自定义某个类型怎么转成 JSON：用 <strong>@JsonComponent<\/strong> 写自己的序列化器。\n\n### Thymeleaf：服务端模板（第 47 讲）\n\n<strong>Thymeleaf 是一种「页面模板」，在服务器上把数据填进 HTML 再发给浏览器。<\/strong>\n\n| 看到题目说…… | 就选 |\n|---|---|\n| Thymeleaf 的起步依赖 | <strong>spring-boot-starter-thymeleaf<\/strong> |\n| 模板文件默认放在 | <strong>classpath:/templates/<\/strong> |\n| 模板文件默认后缀 | <strong>.html<\/strong> |\n| 开发时改了模板马上看到效果，关闭 | <strong>模板缓存<\/strong>（spring.thymeleaf.cache=false） |\n\nController 返回模板的<strong>名字<\/strong>，Thymeleaf 找到对应的 HTML 文件，填入数据后返回。", "### 静态资源（第 48 讲）\n\n图片、CSS、JS 这类不变的文件叫<strong>静态资源<\/strong>。\n\nSpring Boot 默认从这几个目录找静态资源：\n<strong>classpath:/static/、/public/、/resources/、/META-INF/resources/<\/strong>\n\n| 配置 | 作用 |\n|---|---|\n| spring.mvc.static-path-pattern | 静态资源的访问路径（默认 `/**`） |\n| spring.resources.static-locations | 静态资源放在哪些目录 |\n| spring.resources.cache.cachecontrol.max-age | 让浏览器缓存多久 |\n\n### HTTP 缓存\n\n通过响应头 <strong>Cache-Control<\/strong> 告诉浏览器缓存多久，下次不用重新下载。\n\n### 课程建议\n\n实际部署时，静态资源最好交给<strong>专门的设施<\/strong>，比如 <strong>CDN<\/strong> 或 <strong>Nginx<\/strong>，不要都让 Java 程序来提供。"]}, {"title": "HTTP 客户端（第 53—57 讲）", "cards": ["### 一句话\n\n<strong>RestTemplate = 在 Java 程序里调用别人的网络接口（HTTP）的工具。<\/strong>它是<strong>同步、阻塞<\/strong>的：发出请求后一直等到结果回来。\n\n> ⚠️ Spring Boot <strong>不会自动创建<\/strong> RestTemplate，但会提供 <strong>RestTemplateBuilder<\/strong>，用它来创建。\n\n### 方法对号入座\n\n| 看到题目说…… | 就选 |\n|---|---|\n| GET 请求，直接拿到对象 | <strong>getForObject()<\/strong> |\n| GET 请求，拿到带状态码、响应头的完整响应 | <strong>getForEntity()<\/strong> |\n| POST 请求 | <strong>postForObject() / postForEntity()<\/strong> |\n| PUT / DELETE | <strong>put() / delete()<\/strong> |\n| 最灵活，可以自定义请求方法和请求头 | <strong>exchange()<\/strong> |\n\n> 💡 记法：<strong>ForObject 只要内容；ForEntity 要完整响应（ResponseEntity）。<\/strong>", "### 高级用法（第 54 讲）\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 构造一个带请求头的完整请求 | <strong>RequestEntity<\/strong> |\n| 完整的响应（状态码 + 响应头 + 内容） | <strong>ResponseEntity<\/strong> |\n| 拼接网址 | <strong>UriComponentsBuilder<\/strong> |\n| 返回值是 `List<Coffee>` 这种<strong>泛型<\/strong>类型 | <strong>ParameterizedTypeReference<\/strong> |\n\n### 定制 RestTemplate（第 55 讲）\n\nRestTemplate 底层真正发请求的 HTTP 库可以换：\n\n| 底层 | 对应的工厂类 |\n|---|---|\n| JDK 自带（默认） | SimpleClientHttpRequestFactory |\n| <strong>Apache HttpClient<\/strong> | <strong>HttpComponentsClientHttpRequestFactory<\/strong> |\n| OkHttp | OkHttp3ClientHttpRequestFactory |\n\n换底层后可以配置<strong>连接池<\/strong>、<strong>连接超时<\/strong>、<strong>读取超时<\/strong>。\n\n> ⚠️ 一定要设超时：下游服务很慢时，不设超时会把自己的线程全部卡住。", "### 一句话\n\n<strong>WebClient = 非阻塞、响应式的 HTTP 客户端<\/strong>（Spring 5 新增），返回 <strong>Mono / Flux<\/strong>（Reactor 模块讲过）。\n\n| | RestTemplate | WebClient |\n|---|---|---|\n| 方式 | 同步、阻塞 | <strong>异步、非阻塞<\/strong> |\n| 返回 | 普通对象 | <strong>Mono / Flux<\/strong> |\n| 底层（默认） | JDK HttpURLConnection | <strong>Reactor Netty<\/strong> |\n\n写法认关键词：`WebClient.create()` 或 `WebClient.builder()` 创建 → `.get().uri(...)` → **`.retrieve()`<strong> 取响应 → <\/strong>`bodyToMono()` / `bodyToFlux()`** 转成结果。\n\n### SpringBucks 进度（第 57 讲）\n\n新增 <strong>Customer Service（顾客服务）<\/strong>，用 HTTP 客户端去调用 Waiter Service：<strong>获取菜单、创建订单<\/strong>。\n\n> 📌 认准：<strong>RestTemplate 同步阻塞；WebClient 非阻塞、返回 Mono / Flux。<\/strong>"]}, {"title": "REST 与 WebFlux（第 58—66 讲）", "cards": ["### 一句话\n\n<strong>REST 是一种设计网络接口的风格：把东西看成「资源」，用网址表示资源，用 HTTP 方法表示操作。<\/strong>\n\n### Richardson 成熟度模型：四个等级（必背）\n\n| 等级 | 名字 | 一句话 |\n|---|---|---|\n| Level 0 | POX（普通 XML / RPC） | 一个网址干所有事 |\n| Level 1 | <strong>资源<\/strong> | 不同资源用不同网址 |\n| Level 2 | <strong>HTTP 方法<\/strong> | 用 GET / POST / PUT / DELETE 表示不同操作 |\n| Level 3 | <strong>超媒体控制（HATEOAS）<\/strong> | 响应里带上「接下来能做什么」的链接 |\n\n### 网址设计\n\n- 用<strong>名词<\/strong>表示资源，不用动词：`/coffee` 而不是 `/getCoffee`；\n- 资源一般用<strong>复数<\/strong>，有层级：`/customers/1/orders`。", "### HTTP 方法：安全和幂等（必背）\n\n- <strong>安全<\/strong>：不会修改数据（只读）；\n- <strong>幂等<\/strong>：做一次和做多次，<strong>结果一样<\/strong>。\n\n| 方法 | 用途 | 安全 | 幂等 |\n|---|---|---|---|\n| <strong>GET<\/strong> | 查询 | 是 | 是 |\n| <strong>POST<\/strong> | 新建 | 否 | <strong>否<\/strong> |\n| <strong>PUT<\/strong> | 整体更新（替换） | 否 | 是 |\n| <strong>DELETE<\/strong> | 删除 | 否 | 是 |\n| PATCH | 部分更新 | 否 | 否 |\n| HEAD / OPTIONS | 只要响应头 / 问支持哪些方法 | 是 | 是 |\n\n> 📌 记法：<strong>只有 GET（和 HEAD、OPTIONS）是安全的；POST 和 PATCH 不幂等，其他都幂等。<\/strong>\n\n### 常用状态码\n\n| 状态码 | 意思 |\n|---|---|\n| <strong>200<\/strong> OK | 成功 |\n| <strong>201<\/strong> Created | 新建成功 |\n| 204 No Content | 成功，但没有返回内容 |\n| 304 Not Modified | 内容没变，用缓存 |\n| <strong>400<\/strong> Bad Request | 请求有错 |\n| <strong>401<\/strong> Unauthorized | <strong>没登录<\/strong>（没认证） |\n| <strong>403<\/strong> Forbidden | 登录了但<strong>没权限<\/strong> |\n| <strong>404<\/strong> Not Found | 找不到 |\n| 405 Method Not Allowed | 不支持这个请求方法 |\n| <strong>500<\/strong> Internal Server Error | 服务器内部出错 |\n\n> 💡 2 开头成功，3 开头重定向/缓存，<strong>4 开头是客户端的错，5 开头是服务器的错<\/strong>。", "### HATEOAS（第 60 讲）\n\n<strong>HATEOAS = 服务端在返回的数据里附上链接，告诉客户端「接下来可以做什么」<\/strong>，客户端顺着链接走就行，不用提前写死网址。它是成熟度模型的<strong>最高级（Level 3）<\/strong>。\n\n### HAL：表示链接的一种格式\n\nHAL（Hypertext Application Language）用两个特殊字段：\n- <strong>_links<\/strong>：链接；\n- <strong>_embedded<\/strong>：嵌入的其他资源。\n\n### Spring Data REST（第 61、62 讲）\n\n<strong>把 Repository 直接暴露成 REST 接口，不用自己写 Controller。<\/strong>\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 起步依赖 | <strong>spring-boot-starter-data-rest<\/strong> |\n| 自定义暴露的路径 | <strong>@RepositoryRestResource<\/strong> |\n| 返回格式 | 默认 <strong>HAL<\/strong> |\n| 自定义查询方法会出现在 | <strong>/search<\/strong> 路径下 |\n\n客户端（第 62 讲）配置好 HAL 解析，就可以读取响应里的链接，顺着链接访问、修改资源。", "### 分布式环境的 Session 问题（第 63 讲）\n\nSession 用来记住「用户是谁」（如登录状态）。程序部署在<strong>多台机器<\/strong>上时，用户这次访问 A、下次访问 B，B 不认识他。三种解决办法：\n\n| 方案 | 一句话 |\n|---|---|\n| <strong>粘性会话<\/strong>（Sticky Session） | 让同一个用户<strong>总是访问同一台<\/strong>机器 |\n| <strong>会话复制<\/strong>（Session Replication） | 各台机器之间<strong>互相复制<\/strong> Session |\n| <strong>集中存储<\/strong>（Session 集中化） | Session 统一存到 <strong>Redis<\/strong> 等外部存储，大家都去那里读 |\n\n<strong>Spring Session<\/strong> 就是用来做集中存储的：支持 <strong>Redis<\/strong>、JDBC、Hazelcast 等；用 Redis 时开启注解 <strong>@EnableRedisHttpSession<\/strong>。\n\n### WebFlux：用响应式代替 Spring MVC（第 64—66 讲）\n\n| | Spring MVC | <strong>WebFlux<\/strong> |\n|---|---|---|\n| 模型 | 阻塞，一个请求占一个线程 | <strong>非阻塞<\/strong>，基于 Reactor（Mono / Flux） |\n| 默认服务器 | Tomcat | <strong>Netty<\/strong> |\n| 优点 | 简单、生态成熟 | <strong>用很少的线程扛更多并发<\/strong> |\n\n- WebFlux <strong>不一定让单个请求更快<\/strong>，好处是同样资源下能处理更多请求；\n- 整条链路都要是非阻塞的才有意义（数据库要用 R2DBC 等）；\n- 写法可以和 MVC 一样用 @RestController 注解，也可以用<strong>函数式<\/strong>的 RouterFunction。"]}], "questions": [{"id": "view-p1", "type": "single", "stem": "Spring Boot 默认用哪个库处理 JSON？", "options": ["Jackson", "Gson", "Thymeleaf", "Lombok"], "answer": [0], "why": ["对", "另一个 JSON 库，不是默认", "模板引擎", "少写代码的工具"], "explain": "Jackson。", "tags": [], "lesson": 0, "m": "sp4"}, {"id": "view-p2", "type": "multi", "stem": "Spring Boot 默认的静态资源目录包括？", "options": ["classpath:/static/", "classpath:/public/", "classpath:/templates/", "classpath:/resources/"], "answer": [0, 1, 3], "why": ["是", "是", "那是 Thymeleaf 模板目录", "是"], "explain": "templates 放模板，不放静态资源。", "tags": [], "lesson": 0, "m": "sp4"}, {"id": "view-1", "type": "single", "stem": "让 Spring MVC 返回 XML，需要加的依赖是？", "options": ["jackson-dataformat-xml", "spring-boot-starter-thymeleaf", "lombok", "druid"], "answer": [0], "why": ["对", "模板", "无关", "连接池"], "explain": "jackson-dataformat-xml。", "tags": ["basic"], "m": "sp4"}, {"id": "view-2", "type": "single", "stem": "自定义某个类型的 JSON 序列化方式，可以用？", "options": ["@JsonComponent", "@Component", "@RestController", "@Entity"], "answer": [0], "why": ["对", "通用的", "Web", "JPA"], "explain": "@JsonComponent。", "tags": ["basic"], "m": "sp4"}, {"id": "view-3", "type": "single", "stem": "Thymeleaf 是什么？", "options": ["服务端页面模板引擎", "JSON 库", "连接池", "数据库"], "answer": [0], "why": ["对", "不是", "不是", "不是"], "explain": "把数据填进 HTML。", "tags": ["basic", "core"], "m": "sp4"}, {"id": "view-4", "type": "single", "stem": "Thymeleaf 模板文件默认放在？", "options": ["classpath:/templates/", "classpath:/static/", "classpath:/public/", "WEB-INF/"], "answer": [0], "why": ["对", "静态资源", "静态资源", "不是默认"], "explain": "templates。", "tags": ["basic"], "m": "sp4"}, {"id": "view-5", "type": "single", "stem": "开发时修改 Thymeleaf 模板后想立即生效，应该？", "options": ["关闭模板缓存", "打开模板缓存", "重装 JDK", "删除静态资源"], "answer": [0], "why": ["spring.thymeleaf.cache=false", "反了", "无关", "无关"], "explain": "开发时关缓存。", "tags": ["basic"], "m": "sp4"}, {"id": "view-6", "type": "single", "stem": "告诉 ingle", "stem": "新建资源成功，通常返回状态码？", "options": ["201", "200", "204", "404"], "answer": [0], "why": ["Created", "一般成功", "无内容", "找不到"], "explain": "201 Created。", "tags": ["basic", "core"], "m": "sp4"}, {"id": "rest-6", "type": "single", "stem": "用户<strong>没有登录<\/strong>（未认证），返回状态码？", "options": ["401", "403", "404", "500"], "answer": [0], "why": ["Unauthorized", "登录了但没权限", "找不到", "服务器错误"], "explain": "401 没登录，403 没权限。", "tags": ["basic"], "m": "sp4"}, {"id": "rest-7", "type": "single", "stem": "用户登录了，但<strong>没有权限<\/strong>访问，返回状态码？", "options": ["403", "401", "400", "405"], "answer": [0], "why": ["Forbidden", "没登录", "请求有错", "方法不支持"], "explain": "403。", "tags": ["basic"], "m": "sp4"}, {"id": "rest-8", "type": "single", "stem": "服务器内部出错，返回状态码？", "options": ["500", "400", "404", "304"], "answer": [0], "why": ["5 开头是服务器错", "4 开头是客户端错", "找不到", "没变化"], "explain": "500。", "tags": ["basic"], "m": "sp4"}, {"id": "rest-9", "type": "single", "stem": "状态码 4 开头表示？", "options": ["客户端的错误", "服务器的错误", "成功", "重定向"], "answer": [0], "why": ["对", "那是 5 开头", "那是 2 开头", "那是 3 开头"], "explain": "4 客户端，5 服务器。", "tags": ["basic"], "m": "sp4"}, {"id": "rest-10", "type": "single", "stem": "HATEOAS 的核心思想是？", "options": ["响应里带上链接，告诉客户端接下来能做什么", "所有接口只用 POST", "把数据都缓存起来", "用 XML 代替 JSON"], "answer": [0], "why": ["对", "不是", "不是", "不是"], "explain": "超媒体驱动。", "tags": ["basic"], "m": "sp4"}, {"id": "rest-11", "type": "single", "stem": "HAL 格式中，表示链接的字段是？", "options": ["_links", "_embedded", "href", "data"], "answer": [0], "why": ["对", "嵌入的资源", "链接里的地址字段，不是 HAL 的顶层字段", "不是"], "explain": "_links 链接，_embedded 嵌入。", "tags": ["basic"], "m": "sp4"}, {"id": "rest-12", "type": "single", "stem": "Spring Data REST 中自定义 Repository 暴露路径的注解是？", "options": ["@RepositoryRestResource", "@RestController", "@RequestMapping", "@Repository"], "answer": [0], "why": ["对", "自己写 Controller 时用", "自己写 Controller 时用", "数据层标记"], "explain": "@RepositoryRestResource。", "tags": ["basic"], "m": "sp4"}, {"id": "rest-13", "type": "single", "stem": "Spring Data REST 中，Repository 的自定义查询方法出现在哪个路径下？", "options": ["/search", "/query", "/find", "/api"], "answer": [0], "why": ["对", "不是", "不是", "不是"], "explain": "/search。", "tags": ["basic"], "m": "sp4"}, {"id": "rest-14", "type": "single", "stem": "让同一个用户总是访问同一台机器的 Session 方案是？", "options": ["粘性会话", "会话复制", "集中存储", "HATEOAS"], "answer": [0], "why": ["Sticky = 粘", "互相复制", "存到 Redis", "无关"], "explain": "粘性会话。", "tags": ["basic"], "m": "sp4"}, {"id": "rest-15", "type": "multi", "stem": "分布式环境中解决 Session 问题的方案有？", "options": ["粘性会话", "会话复制", "集中存储（如 Redis）", "把 Session 存在浏览器地址栏"], "answer": [0, 1, 2], "why": ["是", "是", "是", "不是"], "explain": "三种方案。", "tags": ["basic", "core"], "m": "sp4"}, {"id": "rest-16", "type": "single", "stem": "Spring Session 使用 Redis 时开启的注解是？", "options": ["@EnableRedisHttpSession", "@EnableCaching", "@EnableRedisRepositories", "@EnableWebFlux"], "answer": [0], "why": ["对", "缓存", "Redis Repository", "WebFlux"], "explain": "@EnableRedisHttpSession。", "tags": ["basic"], "m": "sp4"}, {"id": "rest-17", "type": "single", "stem": "WebFlux 默认使用的服务器是？", "options": ["Netty", "Tomcat", "Jetty", "Nginx"], "answer": [0], "why": ["对", "MVC 默认", "另一种容器", "反向代理"], "explain": "WebFlux → Netty。", "tags": ["basic"], "m": "sp4"}, {"id": "rest-18", "type": "single", "stem": "关于 WebFlux，下列说法正确的是？", "options": ["基于非阻塞和响应式流", "一定让每个请求都更快", "必须配合阻塞的 JDBC 使用", "不能使用 @RestController"], "answer": [0], "why": ["对", "不一定，好处是并发", "应该全链路非阻塞", "可以使用"], "explain": "WebFlux：非阻塞、少线程扛高并发。", "tags": ["basic"], "m": "sp4"}, {"id": "rest-19", "type": "single", "stem": "WebFlux 除了注解方式，还支持哪种写法？", "options": ["函数式路由（RouterFunction）", "XML 配置路由", "SQL 路由", "只支持注解"], "answer": [0], "why": ["对", "不是", "不是", "不是"], "explain": "RouterFunction。", "tags": ["basic"], "m": "sp4"}, {"id": "rest-20", "type": "single", "stem": "判断：使用 WebFlux 后，单个请求的处理速度一定比 Spring MVC 快", "options": ["正确", "错误"], "answer": [1], "why": ["错", "对：不一定，优势在于用更少线程处理更多并发"], "explain": "第 64 讲。", "tags": ["basic"], "m": "sp4"}]}, {"id": "sp5", "title": "Spring Boot：自动配置、起步依赖、配置与运维", "short": "Spring Boot", "group": "Spring · 第 5 章", "exam": "第 67—85 讲", "refs": [], "lessons": [{"title": "Boot 原理（第 67—74 讲）", "cards": ["### 一句话\n\n<strong>Spring Boot 帮你快速做出一个能独立运行的 Spring 程序。<\/strong>\n\n### 四个组成部分（必背，第 67 讲）\n\n| 组成 | 一句话 |\n|---|---|\n| <strong>自动配置<\/strong>（Auto Configuration） | 根据你引入了什么，<strong>自动<\/strong>帮你配好 Bean |\n| <strong>起步依赖<\/strong>（Starter） | 把一个功能需要的依赖<strong>打包成一个<\/strong>，引一个就够 |\n| <strong>命令行工具<\/strong>（CLI） | 在命令行里快速运行 Groovy 脚本（了解） |\n| <strong>Actuator<\/strong> | 监控和管理运行中的程序 |\n\n### Spring Boot <strong>不是<\/strong>什么（常考判断）\n\n- 不是应用服务器（它内嵌了服务器，但本身不是）；\n- 不是 Java EE 规范的实现；\n- 不是代码生成器；\n- 不是 Spring Framework 的替代品（它建立在 Spring Framework 之上）。", "### 自动配置怎么找到要配什么（第 68 讲，认关键词）\n\n1. <strong>@EnableAutoConfiguration<\/strong>（包含在 @SpringBootApplication 里）开启自动配置；\n2. 它通过 <strong>AutoConfigurationImportSelector<\/strong>（导入选择器）去读取\n3. 各个 jar 包里的 <strong>META-INF/spring.factories<\/strong> 文件，找到所有候选的自动配置类；\n4. 每个配置类上有<strong>条件注解<\/strong>，条件满足才生效。\n\n> 📌 一句话：<strong>@EnableAutoConfiguration → 读 spring.factories → 按条件注解决定生不生效。<\/strong>\n\n### 条件注解：对号入座（必背）\n\n| 注解 | 什么时候生效 |\n|---|---|\n| <strong>@ConditionalOnClass<\/strong> | 类路径里<strong>有<\/strong>某个类 |\n| @ConditionalOnMissingClass | 类路径里<strong>没有<\/strong>某个类 |\n| @ConditionalOnBean | 容器里<strong>有<\/strong>某个 Bean |\n| <strong>@ConditionalOnMissingBean<\/strong> | 容器里<strong>没有<\/strong>某个 Bean（<strong>你自己配了，就用你的<\/strong>） |\n| <strong>@ConditionalOnProperty<\/strong> | 配置文件里有某个配置 / 等于某个值 |\n| @ConditionalOnWebApplication | 是 Web 程序 |\n| @ConditionalOnResource | 有某个资源文件 |", "### 自己写自动配置（第 69、70 讲）\n\n1. 写一个配置类，里面用 @Bean 造 Bean；\n2. 加上<strong>条件注解<\/strong>控制何时生效；\n3. 在 <strong>spring.factories<\/strong> 里登记它。\n\n- 控制顺序：<strong>@AutoConfigureBefore / @AutoConfigureAfter / @AutoConfigureOrder<\/strong>；\n- 允许用户覆盖：用 <strong>@ConditionalOnMissingBean<\/strong>，用户自己配了就不再配；\n- 查看哪些自动配置生效了：启动时加 <strong>--debug<\/strong>，会打印「条件评估报告」；\n- 不要某个自动配置：<strong>exclude<\/strong>。\n\n<strong>低版本 Spring（没有条件注解）怎么做<\/strong>：用 <strong>BeanFactoryPostProcessor<\/strong> 等扩展点，在启动时检查并注册 Bean（第 70 讲）。", "### 起步依赖（第 71、72 讲）\n\n<strong>Starter 把一个功能需要的依赖打包好<\/strong>，版本由 <strong>BOM<\/strong>（spring-boot-dependencies）统一管理。\n\n<strong>命名规则（常考）：<\/strong>\n\n| 谁做的 | 命名 | 例子 |\n|---|---|---|\n| <strong>官方<\/strong> | <strong>spring-boot-starter-xxx<\/strong> | spring-boot-starter-web |\n| <strong>第三方 / 自己<\/strong> | <strong>xxx-spring-boot-starter<\/strong> | mybatis-spring-boot-starter |\n\n自己做 Starter 时：\n- 通常拆成两个模块：<strong>autoconfigure 模块<\/strong>（放自动配置代码）+ <strong>starter 模块<\/strong>（只负责引入依赖）；\n- 配置前缀不要用 spring 开头，和官方区分开。\n\n依赖冲突时：用 <strong>mvn dependency:tree<\/strong> 看依赖树，用 <strong>exclusion<\/strong> 排除。", "### 配置加载的优先级（第 73 讲，记大方向）\n\n同一个配置在多个地方都写了，<strong>优先级高的覆盖低的<\/strong>。从高到低大致是：\n\n1. <strong>命令行参数<\/strong>（如 `--server.port=8081`）\n2. Java 系统属性（-D）\n3. <strong>操作系统环境变量<\/strong>\n4. jar 包<strong>外面<\/strong>的 application-{profile} 配置文件\n5. jar 包<strong>里面<\/strong>的 application-{profile} 配置文件\n6. jar 包<strong>外面<\/strong>的 application 配置文件\n7. jar 包<strong>里面<\/strong>的 application 配置文件\n8. @PropertySource 指定的文件\n9. 默认属性\n\n> 📌 记三条：<strong>命令行最高；带 profile 的高于不带的；jar 外高于 jar 内。<\/strong>\n\n- <strong>Profile<\/strong>：区分环境（如 dev、prod），用 <strong>spring.profiles.active<\/strong> 指定；\n- <strong>宽松绑定<\/strong>：`spring.jpa.database-platform`、`spring.jpa.databasePlatform`、环境变量 `SPRING_JPA_DATABASEPLATFORM` 都能对上，推荐用<strong>中划线<\/strong>写法。", "### PropertySource 抽象（第 74 讲）\n\n- 所有配置来源都被统一抽象成 <strong>PropertySource<\/strong>，汇总在 <strong>Environment<\/strong>（环境）里；\n- 把一组配置绑定到一个 Java 对象：<strong>@ConfigurationProperties(prefix = \"...\")<\/strong>；\n- 读取单个配置值：<strong>@Value(\"${...}\")<\/strong>；\n- 加一个自定义的配置来源：实现 <strong>EnvironmentPostProcessor<\/strong>，并在 spring.factories 里登记。\n\n> 📌 认准：<strong>一组配置 → @ConfigurationProperties；单个值 → @Value。<\/strong>"]}, {"title": "Boot 运维（第 75—85 讲）", "cards": ["### 一句话\n\n<strong>Actuator = 给程序装上「仪表盘」，通过一些网址查看程序的运行状态。<\/strong>这些网址叫<strong>端点<\/strong>（Endpoint），默认都在 <strong>/actuator<\/strong> 下面。\n\n### 常用端点：对号入座\n\n| 端点 | 看什么 |\n|---|---|\n| <strong>health<\/strong> | 健康状态 |\n| info | 程序信息 |\n| <strong>beans<\/strong> | 容器里所有的 Bean |\n| <strong>conditions<\/strong> | 自动配置的条件评估结果 |\n| configprops | 所有 @ConfigurationProperties 配置 |\n| <strong>env<\/strong> | 环境变量和配置 |\n| <strong>mappings<\/strong> | 所有请求映射（网址 → 方法） |\n| <strong>metrics<\/strong> | 各种指标 |\n| loggers | 日志级别（还能在线修改） |\n| threaddump / heapdump | 线程信息 / 内存快照 |\n| <strong>shutdown<\/strong> | 关闭程序（<strong>默认关闭<\/strong>） |\n\n> ⚠️ Spring Boot 2 通过 HTTP <strong>默认只开放 health 和 info<\/strong>。想全开：`management.endpoints.web.exposure.include=*`。也可以通过 JMX 访问。生产环境要注意<strong>访问控制<\/strong>。", "### 健康检查（第 76 讲）\n\n- 自定义健康检查：实现 <strong>HealthIndicator<\/strong> 接口，返回 <strong>Health.up()<\/strong> 或 <strong>Health.down()<\/strong>；\n- 状态有四种：<strong>UP<\/strong>（正常）、<strong>DOWN<\/strong>（挂了）、<strong>OUT_OF_SERVICE<\/strong>（暂停服务）、<strong>UNKNOWN<\/strong>（未知）；\n- 内置的健康检查：数据库（DataSourceHealthIndicator）、磁盘空间（DiskSpaceHealthIndicator）、Redis 等；\n- 整体状态由所有检查<strong>聚合<\/strong>而来：只要有一个 DOWN，整体就是 DOWN；\n- 显示详细信息：`management.endpoint.health.show-details`，可选 <strong>never（默认）/ when-authorized / always<\/strong>。", "### Micrometer：指标采集（第 77 讲）\n\n<strong>Micrometer 是指标采集的「统一接口」，号称「监控界的 SLF4J」<\/strong>：写一套代码，就能把指标发到 Prometheus、Graphite、InfluxDB 等不同的监控系统。\n\n| 指标类型 | 一句话 |\n|---|---|\n| <strong>Counter<\/strong> | 计数器，只增不减（如订单总数） |\n| <strong>Timer<\/strong> | 计时器（如方法耗时） |\n| <strong>Gauge<\/strong> | 当前值，可增可减（如在线人数） |\n| DistributionSummary | 分布统计（如订单金额分布） |\n\n- 用<strong>标签（Tag）<\/strong>区分维度；\n- 自定义指标的入口：<strong>MeterRegistry<\/strong>；也可以实现 MeterBinder。\n\n### Spring Boot Admin（第 78 讲）\n\n<strong>一个可视化的管理界面，把多个程序的 Actuator 信息集中展示。<\/strong>（codecentric 公司开发，不是 Spring 官方的）\n\n- 服务端：<strong>@EnableAdminServer<\/strong>；\n- 客户端：配置 <strong>spring.boot.admin.client.url<\/strong> 指向服务端（或通过服务发现）；\n- 需要开放 Actuator 端点，并注意加上访问认证。", "### 定制 Web 容器（第 79 讲）\n\n| 配置 | 作用 |\n|---|---|\n| <strong>server.port<\/strong> | 端口 |\n| server.compression.enabled | 开启压缩 |\n| server.tomcat.max-threads | Tomcat 最大线程数 |\n| server.tomcat.max-connections | 最大连接数 |\n| server.error.include-stacktrace | 错误页是否显示堆栈（生产环境别显示） |\n| server.use-forward-headers | 在反向代理后面时，读取代理传来的头 |\n\n用代码定制：实现 <strong>WebServerFactoryCustomizer<\/strong>。\n\n### HTTPS 和 HTTP/2（第 80、81 讲）\n\n- 生成证书：JDK 自带的 <strong>keytool<\/strong>；\n- 配置 HTTPS：<strong>server.ssl.key-store<\/strong>（密钥库）、key-store-password、key-store-type（<strong>PKCS12<\/strong> 或 JKS）；\n- 开启 HTTP/2：<strong>server.http2.enabled=true<\/strong>；浏览器上的 HTTP/2 <strong>需要 HTTPS<\/strong>；支持与否和 JDK、容器版本有关；\n- 客户端可以用 <strong>OkHttp<\/strong> 访问 HTTP/2。", "### 命令行程序（第 82 讲）\n\n不需要网页服务器时：`spring.main.web-application-type=none`（可选 <strong>NONE / SERVLET / REACTIVE<\/strong>）。\n\n启动后执行一段任务：\n\n| 接口 | 参数 |\n|---|---|\n| <strong>CommandLineRunner<\/strong> | 原始的字符串数组参数 |\n| <strong>ApplicationRunner<\/strong> | 包装好的 <strong>ApplicationArguments<\/strong> |\n\n- 多个 Runner 的顺序：<strong>@Order<\/strong>；\n- 自定义退出码：<strong>ExitCodeGenerator<\/strong>。\n\n### 可执行 jar 的秘密（第 83 讲）\n\n<strong>spring-boot-maven-plugin<\/strong> 的 <strong>repackage<\/strong> 把程序重新打包成可执行 jar：\n\n| jar 里的东西 | 作用 |\n|---|---|\n| <strong>META-INF/MANIFEST.MF<\/strong> | 清单：<strong>Main-Class<\/strong> 是启动器 <strong>JarLauncher<\/strong>，<strong>Start-Class<\/strong> 是你自己的 main 类 |\n| org/springframework/boot/loader | 启动器代码 |\n| <strong>BOOT-INF/classes<\/strong> | 你自己的代码 |\n| <strong>BOOT-INF/lib<\/strong> | 依赖的 jar（嵌套在里面） |\n\n> 📌 认准：<strong>Main-Class = JarLauncher（启动器）；Start-Class = 你的程序入口。<\/strong>运行仍需要 Java 环境；配置 executable 后还能在 Linux 上直接 `./xxx.jar` 运行。\n\n### 打包成 Docker 镜像（第 84 讲）\n\n写 <strong>Dockerfile<\/strong>：<strong>FROM<\/strong>（基础镜像，如 openjdk）→ <strong>ADD / COPY<\/strong>（把 jar 放进去）→ <strong>ENTRYPOINT<\/strong>（启动命令 `java -jar`）。课程还演示了 ong>只增不减<\/strong>的计数指标是？", "options": ["Counter", "Gauge", "Timer", "DistributionSummary"], "answer": [0], "why": ["计数器", "当前值，可增可减", "计时", "分布"], "explain": "Counter。", "tags": ["basic"], "m": "sp5"}, {"id": "ops-11", "type": "single", "stem": "Micrometer 中表示<strong>当前值、可增可减<\/strong>（如在线人数）的指标是？", "options": ["Gauge", "Counter", "Timer", "Tag"], "answer": [0], "why": ["仪表", "只增", "计时", "标签"], "explain": "Gauge。", "tags": ["basic"], "m": "sp5"}, {"id": "ops-12", "type": "single", "stem": "Micrometer 中自定义指标的核心入口是？", "options": ["MeterRegistry", "HealthIndicator", "DataSource", "Environment"], "answer": [0], "why": ["对", "健康", "数据源", "配置"], "explain": "MeterRegistry。", "tags": ["basic"], "m": "sp5"}, {"id": "ops-13", "type": "single", "stem": "Spring Boot Admin 服务端开启的注解是？", "options": ["@EnableAdminServer", "@EnableEurekaServer", "@EnableConfigServer", "@EnableCaching"], "answer": [0], "why": ["对", "注册中心", "配置中心", "缓存"], "explain": "@EnableAdminServer。", "tags": ["basic"], "m": "sp5"}, {"id": "ops-14", "type": "single", "stem": "判断：Spring Boot Admin 是 Spring 官方开发的项目", "options": ["正确", "错误"], "answer": [1], "why": ["错", "对：由 codecentric 开发"], "explain": "第三方。", "tags": ["basic"], "m": "sp5"}, {"id": "ops-15", "type": "single", "stem": "修改内嵌服务器端口的配置是？", "options": ["server.port", "spring.port", "management.port", "tomcat.port"], "answer": [0], "why": ["对", "不存在", "那是管理端口相关", "不存在"], "explain": "server.port。", "tags": ["basic"], "m": "sp5"}, {"id": "ops-16", "type": "single", "stem": "用代码定制内嵌 Web 容器，实现？", "options": ["WebServerFactoryCustomizer", "WebMvcConfigurer", "HealthIndicator", "ApplicationRunner"], "answer": [0], "why": ["对", "MVC 配置", "健康", "启动任务"], "explain": "WebServerFactoryCustomizer。", "tags": ["basic"], "m": "sp5"}, {"id": "ops-17", "type": "single", "stem": "开启 HTTP/2 的配置是？", "options": ["server.http2.enabled=true", "server.ssl.enabled=true", "spring.http2=true", "server.compression.enabled=true"], "answer": [0], "why": ["对", "HTTPS", "不存在", "压缩"], "explain": "server.http2.enabled。", "tags": ["basic"], "m": "sp5"}, {"id": "ops-18", "type": "single", "stem": "JDK 自带的、用来生成证书和密钥库的工具是？", "options": ["keytool", "javac", "jar", "jps"], "answer": [0], "why": ["对", "编译", "打包", "看进程"], "explain": "keytool。", "tags": ["basic"], "m": "sp5"}, {"id": "ops-19", "type": "single", "stem": "让 Spring Boot 程序<strong>不启动<\/strong> Web 服务器的配置是？", "options": ["spring.main.web-application-type=none", "server.port=0", "server.enabled=false", "spring.web=false"], "answer": [0], "why": ["对", "0 是随机端口", "不存在", "不存在"], "explain": "NONE / SERVLET / REACTIVE。", "tags": ["basic"], "m": "sp5"}, {"id": "ops-20", "type": "single", "stem": "程序启动后执行任务，参数是包装好的 ApplicationArguments 的接口是？", "options": ["ApplicationRunner", "CommandLineRunner", "HealthIndicator", "ExitCodeGenerator"], "answer": [0], "why": ["对", "参数是原始字符串数组", "健康", "退出码"], "explain": "ApplicationRunner 包装参数，CommandLineRunner 原始参数。", "tags": ["basic"], "m": "sp5"}, {"id": "ops-21", "type": "single", "stem": "自定义程序退出码，用？", "options": ["ExitCodeGenerator", "CommandLineRunner", "@Order", "HealthIndicator"], "answer": [0], "why": ["对", "启动任务", "顺序", "健康"], "explain": "ExitCodeGenerator。", "tags": ["basic"], "m": "sp5"}, {"id": "ops-22", "type": "single", "stem": "可执行 jar 中，你自己写的代码放在？", "options": ["BOOT-INF/classes", "BOOT-INF/lib", "META-INF", "org/springframework/boot/loader"], "answer": [0], "why": ["对", "依赖 jar", "清单", "启动器"], "explain": "classes 自己的，lib 依赖。", "tags": ["basic"], "m": "sp5"}, {"id": "ops-23", "type": "single", "stem": "把程序重新打包成可执行 jar 的是 spring-boot-maven-plugin 的哪个目标？", "options": ["repackage", "clean", "compile", "install"], "answer": [0], "why": ["重新打包", "清理", "编译", "安装"], "explain": "repackage。", "tags": ["basic"], "m": "sp5"}, {"id": "ops-24", "type": "single", "stem": "判断：可执行 jar 已经包含了 Java 运行环境，不需要安装 Java", "options": ["正确", "错误"], "answer": [1], "why": ["错", "对：运行仍需要 Java"], "explain": "第 83 讲。", "tags": ["basic"], "m": "sp5"}, {"id": "ops-25", "type": "single", "stem": "Dockerfile 中指定基础镜像的指令是？", "options": ["FROM", "ENTRYPOINT", "COPY", "RUN"], "answer": [0], "why": ["对", "启动命令", "复制文件", "构建时执行命令"], "explain": "FROM → COPY/ADD → ENTRYPOINT。", "tags": ["basic"], "m": "sp5"}]}, {"id": "sp6", "title": "Spring Cloud：注册发现、熔断限流、配置中心、消息与追踪", "short": "Spring Cloud", "group": "Spring · 第 6 章", "exam": "第 86—122 讲", "refs": [], "lessons": [{"title": "微服务与云原生（第 86—90 讲）", "cards": ["### 微服务（第 86 讲）\n\n<strong>微服务 = 把一个大程序拆成很多个小服务，每个服务独立开发、独立部署。<\/strong>\n\n| 好处 | 代价 |\n|---|---|\n| 可以<strong>单独部署<\/strong>、单独扩容 | 服务间要<strong>网络调用<\/strong>，会失败、会慢 |\n| 每个服务可以选不同技术 | <strong>数据一致性<\/strong>更难 |\n| 一个服务出问题不一定拖垮全部 | <strong>测试、运维<\/strong>更复杂 |\n\n> ⚠️ 拆分要服从实际业务，不是越细越好。\n\n### 云原生（第 87 讲）\n\n课程从<strong>四个方面<\/strong>解释云原生（必背）：\n\n1. <strong>DevOps<\/strong>（开发和运维一体化）\n2. <strong>持续交付<\/strong>（随时能可靠地发布）\n3. <strong>微服务<\/strong>\n4. <strong>容器<\/strong>（如 Docker）", "### 12-Factor（第 88、89 讲）\n\n一套构建云上应用的 12 条原则。<strong>认得出每条在说什么就行：<\/strong>\n\n| # | 原则 | 一句话 |\n|---|---|---|\n| 1 | <strong>基准代码<\/strong> | 一份代码库，多处部署 |\n| 2 | <strong>依赖<\/strong> | 显式声明依赖，不依赖系统里碰巧装了的东西 |\n| 3 | <strong>配置<\/strong> | 配置放在<strong>环境<\/strong>里，不写死在代码里 |\n| 4 | <strong>后端服务<\/strong> | 数据库、缓存等当作可替换的附加资源 |\n| 5 | <strong>构建、发布、运行<\/strong> | 三个阶段严格分开 |\n| 6 | <strong>进程<\/strong> | 进程<strong>无状态<\/strong>，状态存到外部（如数据库、Redis） |\n| 7 | <strong>端口绑定<\/strong> | 通过端口对外提供服务（自带服务器） |\n| 8 | <strong>并发<\/strong> | 通过<strong>增加进程<\/strong>来扩展 |\n| 9 | <strong>易处理<\/strong> | <strong>快速启动、优雅停止<\/strong> |\n| 10 | <strong>开发与生产环境等价<\/strong> | 开发、测试、生产尽量一致 |\n| 11 | <strong>日志<\/strong> | 把日志当作<strong>事件流<\/strong>输出 |\n| 12 | <strong>管理进程<\/strong> | 后台管理任务当作一次性进程运行 |\n\n> 💡 考题常给一句描述问是哪条：看到「无状态」→ 进程；看到「配置放环境变量」→ 配置；看到「快速启动、优雅停机」→ 易处理。", "### 一句话\n\n<strong>Spring Cloud 给微服务常见问题提供统一的编程方式，底下的具体实现可以替换。<\/strong>（第 90 讲）\n\n| 问题 | Spring Cloud 提供 | 常见实现（后面模块讲） |\n|---|---|---|\n| 服务在哪 | <strong>服务注册与发现<\/strong> | Eureka、ZooKeeper、Consul、Nacos |\n| 调哪台机器 | <strong>客户端负载均衡<\/strong> | Ribbon、Spring Cloud LoadBalancer |\n| 配置统一管 | <strong>配置中心<\/strong> | Config Server、ZooKeeper、Consul、Nacos |\n| 下游挂了怎么办 | <strong>熔断、限流<\/strong> | Hystrix、Resilience4j |\n| 服务间发消息 | <strong>消息<\/strong> | Spring Cloud Stream |\n| 请求经过了哪些服务 | <strong>链路追踪<\/strong> | Sleuth + Zipkin |\n| 统一入口 | 服务网关 | Zuul、Gateway |\n\n### 版本\n\nSpring Cloud 的版本用<strong>伦敦地铁站名<\/strong>命名，按<strong>字母顺序<\/strong>：Angel、Brixton、Camden、Dalston、Edgware、<strong>Finchley<\/strong>、<strong>Greenwich<\/strong>、Hoxton……\n\n- 各组件版本要<strong>互相匹配<\/strong>，用 <strong>spring-cloud-dependencies<\/strong>（BOM）统一管理；\n- Finchley 对应 Spring Boot 2.0，Greenwich 对应 Spring Boot 2.1。"]}, {"title": "注册与发现（第 91—99 讲）", "cards": ["### 一句话\n\n服务多了以后，调用方需要知道「某个服务现在有哪些机器、地址是什么」。\n\n- <strong>服务注册<\/strong>：服务启动时把自己的地址<strong>登记<\/strong>到注册中心；\n- <strong>服务发现<\/strong>：调用方去注册中心<strong>查<\/strong>某个服务有哪些实例。\n\n<strong>DiscoveryClient<\/strong> 是 Spring Cloud 定义的「服务发现」接口：按服务名拿到实例列表（getServices()、getInstances(服务名)）。\n\n### Eureka（第 91、94 讲）\n\n<strong>Netflix 开源的注册中心。<\/strong>\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 开启 Eureka 服务端 | <strong>@EnableEurekaServer<\/strong> |\n| 开启服务发现客户端（通用） | <strong>@EnableDiscoveryClient<\/strong> |\n| 客户端配置注册中心地址 | <strong>eureka.client.service-url.defaultZone<\/strong> |\n| 单机的注册中心自己不要注册自己 | register-with-eureka=false、fetch-registry=false |\n\n- 客户端定时发<strong>心跳<\/strong>续约（默认 30 秒），太久没心跳（默认 90 秒）会被剔除；\n- Eureka 2.x 的开发已经<strong>停止<\/strong>。", "### 客户端负载均衡（第 92 讲）\n\n一个服务有好几台机器，调用方<strong>自己<\/strong>决定这次调用哪一台，叫<strong>客户端负载均衡<\/strong>。\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 课程中用的客户端负载均衡组件（Netflix） | <strong>Ribbon<\/strong> |\n| Ribbon 进入维护后，Spring 官方的替代品 | <strong>Spring Cloud LoadBalancer<\/strong> |\n| 让 RestTemplate 能用<strong>服务名<\/strong>代替真实地址 | 在 RestTemplate 上贴 <strong>@LoadBalanced<\/strong> |\n\n例子：网址写 `http://waiter-service/coffee`，加了 @LoadBalanced 后，会自动把 waiter-service 换成某台机器的真实地址。\n\n### Feign：声明式的服务调用（第 93 讲）\n\n<strong>Feign = 只写一个接口，贴上注解，就能调用远程服务<\/strong>，不用自己拼网址、发请求。\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 起步依赖 | <strong>spring-cloud-starter-openfeign<\/strong> |\n| 开启 Feign | <strong>@EnableFeignClients<\/strong> |\n| 声明一个远程服务的客户端接口 | <strong>@FeignClient(name = \"服务名\")<\/strong> |\n| 超时设置 | feign.client.config.default.connect-timeout / read-timeout |\n\n底层的 HTTP 库可以换成 Apache HttpClient 或 OkHttp。\n\n> 📌 认准：<strong>@LoadBalanced 让 RestTemplate 认服务名；@FeignClient 只写接口就能调。<\/strong>", "### 四个注册中心对比（第 95—99 讲，常考）\n\n| 注册中心 | 出身 | 特点（认关键词） |\n|---|---|---|\n| <strong>Eureka<\/strong> | Netflix | <strong>AP<\/strong>（优先保证可用）；2.x 已停止开发 |\n| <strong>ZooKeeper<\/strong> | Apache | <strong>CP<\/strong>（优先保证一致）；用<strong>临时节点<\/strong>登记服务；网络有问题时可能不可用，课程认为<strong>不太适合做注册中心<\/strong> |\n| <strong>Consul<\/strong> | HashiCorp | 自带<strong>健康检查<\/strong>、<strong>DNS 接口<\/strong>、KV 存储、多数据中心 |\n| <strong>Nacos<\/strong> | <strong>阿里巴巴<\/strong> | <strong>服务发现 + 配置管理<\/strong>二合一；有控制台（默认端口 8848） |\n\n- CAP 里：C = 一致性，A = 可用性，P = 分区容错。（补充）\n- 起步依赖都长一个样：spring-cloud-starter-<strong>zookeeper<\/strong>-discovery、spring-cloud-starter-<strong>consul<\/strong>-discovery、spring-cloud-starter-<strong>alibaba-nacos<\/strong>-discovery。\n- Nacos 地址配置：<strong>spring.cloud.nacos.discovery.server-addr<\/strong>。\n\n### 自己实现 DiscoveryClient（第 98 讲）\n\n实现 DiscoveryClient 接口的方法（getServices、getInstances 等），比如从固定配置里读出服务列表；再适配给 Ribbon（实现 ServerList）。"]}, {"title": "熔断与限流（第 100—106 讲）", "cards": ["### 一句话\n\n下游服务挂了，如果还一直去调它，调用方的线程会被卡住，最后<strong>一个挂掉拖垮一片<\/strong>（雪崩）。<strong>断路器就像家里的保险丝：失败太多就先「断开」，不再调用，直接返回一个备用结果。<\/strong>\n\n### 断路器的三种状态（必背）\n\n| 状态 | 意思 |\n|---|---|\n| <strong>关闭（Closed）<\/strong> | 正常调用，同时统计失败情况 |\n| <strong>打开（Open）<\/strong> | 失败太多，<strong>直接拒绝调用<\/strong>，返回备用结果（降级） |\n| <strong>半开（Half-Open）<\/strong> | 过一段时间后，<strong>放少量请求试探<\/strong>：成功就关闭，失败就重新打开 |\n\n> 📌 记法：<strong>电路「关闭」时电流通过 = 正常调用；「打开」= 断了。<\/strong>这和平时说的「开 / 关」正好相反，最容易记错。\n\n- <strong>降级（fallback）<\/strong>：调用失败或被拒绝时，返回一个备用结果（如默认值、缓存的数据）。", "### Hystrix（第 101 讲）\n\n<strong>Netflix 开源的断路器<\/strong>，课程用它做演示。<strong>现在已进入维护状态，不再开发新功能。<\/strong>\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 开启断路器 | <strong>@EnableCircuitBreaker<\/strong>（或 @EnableHystrix） |\n| 给一个方法加上熔断保护 | <strong>@HystrixCommand<\/strong> |\n| 指定失败时的备用方法 | <strong>@HystrixCommand(fallbackMethod = \"...\")<\/strong> |\n| 两种隔离方式 | <strong>线程池隔离<\/strong>（THREAD）和<strong>信号量隔离<\/strong>（SEMAPHORE） |\n| 和 Feign 一起用 | <strong>feign.hystrix.enabled=true<\/strong>，在 @FeignClient 里指定 <strong>fallback<\/strong> |\n\n### 观察熔断（第 102 讲）\n\n| 看到题目说…… | 就选 |\n|---|---|\n| Hystrix 的可视化仪表盘 | <strong>Hystrix Dashboard<\/strong>（@EnableHystrixDashboard） |\n| 仪表盘的数据来源端点 | <strong>/actuator/hystrix.stream<\/strong> |\n| <strong>聚合<\/strong>多个实例的熔断数据 | <strong>Turbine<\/strong> |", "### Resilience4j（第 103 讲）\n\n<strong>一个轻量级的容错库，受 Hystrix 启发，基于 Java 8 函数式编程。<\/strong>按模块引入，用哪个引哪个：\n\n| 模块 | 作用 |\n|---|---|\n| <strong>CircuitBreaker<\/strong> | 断路器 |\n| <strong>Bulkhead<\/strong> | 限制<strong>同时<\/strong>进行的调用数量 |\n| <strong>RateLimiter<\/strong> | 限制<strong>一段时间内<\/strong>的调用次数 |\n| Retry | 重试 |\n| TimeLimiter | 超时控制 |\n| Cache | 缓存 |\n\n断路器常用配置：<strong>failureRateThreshold<\/strong>（失败率阈值，默认 50%）、<strong>waitDurationInOpenState<\/strong>（打开状态保持多久后转半开）、统计窗口大小。\n\n可以用注解（如 <strong>@CircuitBreaker(name = \"...\")<\/strong>）或编程方式接入，还能导出指标给 Micrometer。", "### 三种保护手段：最容易混（必背，第 104—106 讲）\n\n| 手段 | 管什么 | 打个比方 |\n|---|---|---|\n| <strong>断路器 CircuitBreaker<\/strong> | 根据<strong>失败率<\/strong>，暂停调用并试探恢复 | 保险丝 |\n| <strong>Bulkhead（舱壁 / 并发隔离）<\/strong> | 限制<strong>同时<\/strong>在执行的调用数 | 船的隔水舱，一个舱进水不沉全船 |\n| <strong>RateLimiter（限流）<\/strong> | 限制<strong>单位时间内<\/strong>的调用次数 | 每分钟只放 100 人进门 |\n\n- Bulkhead 配置：<strong>maxConcurrentCalls<\/strong>（最大并发数）、maxWaitTime（排队最多等多久）；满了抛 BulkheadFullException；\n- RateLimiter 配置：<strong>limitForPeriod<\/strong>（每个周期允许几次）、<strong>limitRefreshPeriod<\/strong>（周期多长）、timeoutDuration（等许可最多多久）；超了抛 RequestNotPermitted。\n\n> 📌 认准：<strong>看失败率 → 断路器；看同时有几个 → Bulkhead；看每秒（每段时间）几次 → RateLimiter。<\/strong>三者可以一起用。"]}, {"title": "配置中心（第 107—113 讲）", "cards": ["### 一句话\n\n服务多了，每个服务的配置文件分散在各处，改一次很麻烦。<strong>配置中心 = 把所有服务的配置集中管理，服务启动时去配置中心拿配置。<\/strong>\n\n> 💡 和注册中心区分：<strong>注册中心管「服务在哪」，配置中心管「用什么配置」。<\/strong>\n\n### Config Server（第 107 讲）\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 开启配置中心服务端 | <strong>@EnableConfigServer<\/strong> |\n| 默认的配置存储后端 | <strong>Git<\/strong>（也支持 SVN、本地文件、Vault、JDBC 等） |\n| 常用端口 | 8888 |\n\n<strong>三个词确定要读哪份配置（必背）：<\/strong>\n\n| 词 | 意思 |\n|---|---|\n| <strong>application<\/strong> | 应用名（spring.application.name） |\n| <strong>profile<\/strong> | 环境（如 dev、prod） |\n| <strong>label<\/strong> | 版本，对 Git 来说就是<strong>分支<\/strong>（默认 master） |\n\n访问路径举例：`/{application}/{profile}/{label}`，如 `/waiter-service/dev/master`。", "### 客户端和刷新（第 108 讲）\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 客户端的起步依赖 | <strong>spring-cloud-starter-config<\/strong> |\n| 配置中心地址写在哪个文件里 | <strong>bootstrap.yml / bootstrap.properties<\/strong>（比 application 更早加载） |\n| 配置中心地址 | <strong>spring.cloud.config.uri<\/strong> |\n| 连不上配置中心就<strong>立刻启动失败<\/strong> | <strong>spring.cloud.config.fail-fast=true<\/strong> |\n| 连不上时<strong>重试<\/strong> | 引入 spring-retry，配置重试 |\n| 通过<strong>服务发现<\/strong>找配置中心 | spring.cloud.config.discovery.enabled=true |\n\n<strong>配置改了，怎么让程序用上新值：<\/strong>\n1. 在 Bean 上贴 <strong>@RefreshScope<\/strong>（标记它可以被刷新）；\n2. 调用 <strong>/actuator/refresh<\/strong> 端点（POST 请求）。\n\n> 📌 必背：<strong>@RefreshScope + /actuator/refresh。<\/strong>", "### 配置抽象和三种刷新方式（第 110 讲）\n\n- 远程配置通过 <strong>PropertySourceLocator<\/strong> 接入 Spring 的 Environment（Boot 原理模块讲过 PropertySource）；\n- 远程配置默认<strong>优先于<\/strong>本地配置。\n\n| 刷新方式 | 一句话 |\n|---|---|\n| <strong>单个实例刷新<\/strong> | 逐个调用每个实例的 /actuator/refresh |\n| <strong>消息总线广播<\/strong> | <strong>Spring Cloud Bus<\/strong> 通过 RabbitMQ / Kafka 通知<strong>所有实例<\/strong>一起刷新（/actuator/bus-refresh） |\n| <strong>监听变化自动刷新<\/strong> | ZooKeeper、Consul、Nacos 能<strong>监听<\/strong>配置变化，自动推送 |\n\n### 其他配置中心（第 109—113 讲）\n\n| 配置中心 | 认关键词 |\n|---|---|\n| <strong>ZooKeeper<\/strong> | 配置存在<strong>节点<\/strong>里（如 /config/应用名），<strong>节点监听<\/strong>触发刷新 |\n| <strong>Consul<\/strong> | 配置存在 <strong>KV<\/strong> 存储里，<strong>Watch<\/strong> 检测变化后发布刷新事件 |\n| <strong>Nacos<\/strong> | 阿里巴巴，发布配置后客户端<strong>自动收到<\/strong>；用 <strong>Data ID<\/strong> 和 Group 定位配置 |\n| <strong>Apollo<\/strong> | <strong>携程<\/strong>开源；功能最全：<strong>灰度发布、权限管理、审计、多环境多集群<\/strong> |\n\n> 💡 Nacos 的 Data ID 默认长这样：`应用名-环境.后缀`，如 `waiter-service-dev.yaml`。"]}, {"title": "消息与追踪（第 114—122 讲）", "cards": ["### 一句话\n\n服务之间除了直接调用，还可以<strong>发消息<\/strong>：A 把消息放进消息中间件（如 RabbitMQ、Kafka），B 自己去取。好处是<strong>解耦<\/strong>，A 不用等 B。\n\n<strong>Spring Cloud Stream 让你用同一套写法收发消息，底下换 RabbitMQ 还是 Kafka 都不用改业务代码。<\/strong>\n\n### 两个核心概念（必背）\n\n| 概念 | 一句话 |\n|---|---|\n| <strong>Binder<\/strong> | 连接<strong>具体消息中间件<\/strong>的「适配器」（有 RabbitMQ Binder、Kafka Binder） |\n| <strong>Binding<\/strong> | 把程序里的<strong>输入 / 输出通道<\/strong>和中间件里的<strong>目的地<\/strong>绑在一起 |\n\n> 📌 认准：<strong>Binder 对接中间件；Binding 绑通道和目的地。<\/strong>\n\n### 课程用的早期注解写法（认名字）\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 开启绑定 | <strong>@EnableBinding<\/strong> |\n| 监听消息 | <strong>@StreamListener<\/strong> |\n| 定义输入 / 输出通道 | <strong>@Input / @Output<\/strong> |\n| 内置的只发 / 只收 / 又收又发接口 | <strong>Source / Sink / Processor<\/strong> |\n| 处理完把结果发到另一个通道 | <strong>@SendTo<\/strong> |", "### 消费组（必背）\n\n`spring.cloud.stream.bindings.<通道名>.group` 指定消费组：\n\n- <strong>不同的组<\/strong>：每个组都会收到<strong>一份<\/strong>消息；\n- <strong>同一个组里<\/strong>：一条消息<strong>只会被其中一个实例<\/strong>处理（大家分摊）。\n\n例子：咖啡师服务部署了 3 台，放在同一个组里，一个订单只会被一台机器做，不会做三杯。\n\n### RabbitMQ 和 Kafka（第 115、116 讲）\n\n| 中间件 | 认关键词 |\n|---|---|\n| <strong>RabbitMQ<\/strong> | <strong>交换机（Exchange）<\/strong>、队列、<strong>路由键（routing key）<\/strong>、绑定 |\n| <strong>Kafka<\/strong> | <strong>主题（Topic）<\/strong>、<strong>broker<\/strong>（服务节点）、消费组；当时版本需要 ZooKeeper |\n\n### SpringBucks 进度（第 115—117 讲）\n\n- Waiter（服务员）发「新订单」消息 → Barista（咖啡师）收到后做咖啡 → 做好后再发消息通知；\n- 用消息<strong>通知<\/strong>代替<strong>轮询<\/strong>（不用一遍遍去问「好了没」）；\n- 用 RabbitMQ 的<strong>路由键<\/strong>把订单完成消息发给对应的顾客实例；\n- 第 116 讲还用到了<strong>定时任务<\/strong>（@Scheduled）和 <strong>Spring 事件<\/strong>（ApplicationEvent / @EventListener）来解耦业务。", "### 一句话\n\n一个请求可能经过好几个服务，出了问题很难知道卡在哪。<strong>链路追踪 = 给每个请求编号，记录它经过了哪些服务、每一步花了多久。<\/strong>\n\n### 两个核心概念（来自 Google 的 Dapper 论文，必背）\n\n| 概念 | 一句话 | 编号 |\n|---|---|---|\n| <strong>Trace<\/strong> | <strong>一次完整的请求<\/strong>（从头到尾） | <strong>Trace ID<\/strong>，整条链路共用一个 |\n| <strong>Span<\/strong> | 链路中的<strong>一个工作单元<\/strong>（如一次服务调用） | <strong>Span ID<\/strong>，每一步一个 |\n\n- 一个 Trace 由多个 Span 组成，Span 之间有父子关系；\n- <strong>采样<\/strong>：不是每个请求都记录，只记录一部分，减少开销。\n\n### 四个时间点（了解）\n\n<strong>cs<\/strong>（客户端发出）→ <strong>sr<\/strong>（服务端收到）→ <strong>ss<\/strong>（服务端发出）→ <strong>cr<\/strong>（客户端收到）。", "### Sleuth + Zipkin（第 119、120 讲）\n\n| 看到题目说…… | 就选 |\n|---|---|\n| Spring Cloud 的链路追踪组件 | <strong>Spring Cloud Sleuth<\/strong> |\n| Sleuth 底层使用的追踪库 | <strong>Brave<\/strong> |\n| 收集并<strong>可视化展示<\/strong>调用链的系统 | <strong>Zipkin<\/strong>（默认端口 9411） |\n| Zipkin 地址配置 | <strong>spring.zipkin.base-url<\/strong> |\n| 采样比例配置 | <strong>spring.sleuth.sampler.probability<\/strong>（默认 0.1，即 10%） |\n\n- 加了 Sleuth 后，<strong>日志里会自动带上 Trace ID 和 Span ID<\/strong>，格式类似 `[应用名,TraceID,SpanID,是否上报]`，方便按编号搜索跨服务的日志；\n- 追踪数据可以通过 <strong>HTTP<\/strong> 直接发给 Zipkin，也可以通过 <strong>RabbitMQ / Kafka<\/strong> 消息发送（spring.zipkin.sender.type）；\n- 消息收发（如 RabbitMQ）的链路也能追踪，追踪信息随消息一起传递。\n\n### 除了链路还要治理什么（第 121、122 讲）\n\n容量规划、依赖关系、配置变更、发布审计、代码质量、监控告警……<strong>链路追踪只是观察系统的一部分<\/strong>。生产环境的采样比例要在开销和排查需要之间权衡。第 122 讲用 <strong>Docker Compose<\/strong> 把所有服务一起编排启动。\n\n> 📌 必背：<strong>Trace = 整个请求，Span = 其中一步；Sleuth 采集，Zipkin 展示；日志带 TraceID。<\/strong>"]}], "questions": [{"id": "cloud-p1", "type": "multi", "stem": "课程中解释云原生的四个方面是？", "options": ["DevOps", "持续交付", "微服务", "容器"], "answer": [0, 1, 2, 3], "why": ["是", "是", "是", "是"], "explain": "四个全是。", "tags": [], "lesson": 0, "m": "sp6"}, {"id": "cloud-p2", "type": "single", "st
